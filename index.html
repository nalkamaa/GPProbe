<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Gpath Lite</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-alt: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green: #22c55e;
      --red: #ef4444;
      --amber: #f59e0b;
      --border: #334155;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px));
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 14px;
      padding-top: max(12px, env(safe-area-inset-top, 12px));
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
      width: 100%;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      min-width: 0;
      flex: 1;
    }
    #statusText {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .dot.ready { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .dot.busy { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
    .top-actions { display: flex; gap: 6px; flex-shrink: 0; }
    button {
      font: inherit;
      font-size: 14px;
      color: var(--text);
      background: var(--card-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 11px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:active { transform: scale(0.97); }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
    }
    button.success {
      background: var(--green);
      border-color: var(--green);
      color: #052e16;
    }
    button.danger {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--red);
      color: #fca5a5;
    }
    button:disabled {
      opacity: 0.45;
      pointer-events: none;
    }
    main {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }
    .setup-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
      width: 100%;
    }
    .row-wrap {
      flex-wrap: wrap;
    }
    label.small {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    input, select {
      font: inherit;
      font-size: 16px; /* Prevents iOS WebKit auto-zoom on focus */
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 8px;
      max-width: 100%;
      min-width: 0;
    }
    select {
      flex: 1;
      min-width: 0;
      text-overflow: ellipsis;
    }
    input[type="number"] {
      width: 68px;
      text-align: center;
      font-weight: 700;
      padding: 7px 4px;
    }
    .stepper {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .stepper button {
      padding: 8px 10px;
      min-width: 48px;
      min-height: 48px;
      font-size: 14px;
    }
    .stepper-full {
      width: 100%;
      justify-content: space-between;
    }
    .stepper-full button {
      flex: 1;
      min-width: 48px;
      min-height: 48px;
    }
    .stepper-full input[type="number"] {
      flex: 1.2;
      min-width: 64px;
      min-height: 48px;
    }
    .set-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(59, 130, 246, 0.18);
      border: 1px solid var(--accent);
      color: #93c5fd;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }
    .set-badge.saved {
      background: rgba(34, 197, 94, 0.18);
      border-color: var(--green);
      color: #86efac;
    }
    .card.hero.active-glow {
      border-color: var(--green);
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.22);
    }
    .hero {
      text-align: center;
      padding: 16px 12px;
    }
    .hero-vel {
      font-size: 64px;
      font-weight: 800;
      line-height: 1.02;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      transition: color 0.15s ease;
    }
    .hero-unit {
      font-size: 15px;
      font-weight: 700;
      color: var(--muted);
      margin-top: 2px;
      letter-spacing: 0.04em;
    }
    .hero-subline {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
      font-variant-numeric: tabular-nums;
    }
    .live-kpi-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    .live-kpi-box {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .live-kpi-label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .live-kpi-val {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
    }
    .live-kpi-sub {
      font-size: 11px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .mini-bars-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }
    .mini-bars-wrap {
      position: relative;
      flex: 1;
      display: flex;
      align-items: flex-end;
      gap: 5px;
      height: 76px;
      padding: 14px 8px 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow-x: auto;
      min-width: 0;
    }
    .mini-bar-col {
      flex: 1;
      min-width: 14px;
      max-width: 34px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      gap: 2px;
      z-index: 2;
    }
    .mini-bar-val {
      font-size: 10px;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .mini-bar-fill {
      width: 100%;
      border-radius: 4px 4px 2px 2px;
      background: var(--accent);
      min-height: 6px;
      transition: height 0.18s ease;
    }
    .mini-bar-fill.good { background: var(--green); }
    .mini-bar-fill.warn { background: var(--amber); }
    .mini-bar-fill.bad { background: var(--red); }
    .mini-bar-fill.suspect { background: #64748b; }
    .mini-bar-fill.ghost {
      background: rgba(148, 163, 184, 0.12);
      border: 1px dashed rgba(148, 163, 184, 0.28);
    }
    .mini-cutoff-line {
      position: absolute;
      left: 6px;
      right: 6px;
      border-top: 1.5px dashed rgba(245, 158, 11, 0.75);
      pointer-events: none;
      z-index: 1;
    }
    .mini-rep-count {
      font-size: 22px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      flex-shrink: 0;
      min-width: 56px;
      text-align: center;
    }
    .main-action-btn {
      width: 100%;
      min-height: 62px;
      padding: 14px 16px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 14px;
      letter-spacing: 0.01em;
    }
    /* Lift tab state machine visibility */
    #tabLift .only-active,
    #tabLift .only-rest,
    #tabLift .only-done { display: none; }
    #tabLift[data-state="active"] .only-active { display: flex; }
    #tabLift[data-state="active"] .hide-active { display: none !important; }
    #tabLift[data-state="rest"] .only-rest { display: flex; }
    #tabLift[data-state="done"] .only-done { display: flex; }
    #tabLift[data-state="done"] .hide-done { display: none !important; }
    /* Context row & settings trigger */
    .context-pill-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      text-align: left;
    }
    .context-pill-btn.date-warn {
      border-color: var(--amber);
      background: rgba(245, 158, 11, 0.14);
      color: #fde68a;
    }
    .cycle-pill {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #93c5fd;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .plan-summary-line {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
      color: var(--text);
    }
    .details-toggle {
      margin-top: 8px;
      font-size: 12px;
    }
    .details-toggle > summary {
      cursor: pointer;
      color: var(--muted);
      font-weight: 700;
      padding: 6px 2px;
      user-select: none;
      list-style: none;
    }
    .details-toggle > summary::-webkit-details-marker { display: none; }
    .details-toggle[open] > summary { color: #93c5fd; }
    /* Bottom sheet */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 60;
      padding: 12px 0 0;
    }
    .sheet-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 18px 18px 0 0;
      width: 100%;
      max-width: 540px;
      max-height: 86vh;
      overflow-y: auto;
      padding: 14px 14px max(20px, env(safe-area-inset-bottom, 20px));
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
    }
    .sheet-item-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      font-size: 15px;
      min-height: 48px;
      background: var(--bg);
    }
    /* Undo toast */
    .undo-toast {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(74px + env(safe-area-inset-bottom, 0px));
      width: calc(100% - 24px);
      max-width: 516px;
      background: #0b1220;
      border: 1px solid var(--accent);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 70;
      font-size: 13px;
      font-weight: 600;
    }
    .undo-toast button {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      padding: 7px 14px;
      font-size: 13px;
      min-height: 36px;
      flex-shrink: 0;
    }
    /* Analysis sub-tabs */
    .sub-tabs {
      display: flex;
      gap: 4px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      width: 100%;
    }
    .sub-tabs button {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 8px 4px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 8px;
      white-space: nowrap;
      min-width: 0;
    }
    .sub-tabs button[data-ana-sub="asetukset"] {
      flex: 0 0 42px;
      font-size: 14px;
    }
    .sub-tabs button.active {
      background: var(--card-alt);
      color: var(--text);
    }
    .ana-set-row {
      cursor: pointer;
    }
    .ana-set-row:hover td {
      background: rgba(59, 130, 246, 0.14);
    }
    .today-set-compact {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-top: 6px;
    }
    .today-set-compact-main {
      min-width: 0;
      flex: 1;
      cursor: pointer;
    }
    .today-set-compact-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .today-set-compact-actions button {
      min-height: 36px;
      padding: 6px 10px;
      font-size: 12px;
    }
    .green { color: var(--green); }
    .amber { color: var(--amber); }
    .red { color: var(--red); }
    .progress-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .progress-bar {
      height: 10px;
      background: var(--bg);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.2s ease, background 0.2s ease;
    }
    .progress-fill.done { background: var(--green); }
    .drop-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
    .vel-chart {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 118px;
      padding: 18px 8px 6px;
      background: var(--bg);
      border-radius: 10px;
      overflow-x: auto;
    }
    .vel-col {
      flex: 1;
      min-width: 28px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      gap: 4px;
    }
    .vel-col-val {
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }
    .vel-col-bar {
      width: 100%;
      max-width: 32px;
      border-radius: 6px 6px 3px 3px;
      background: var(--accent);
      transition: height 0.2s ease;
      min-height: 6px;
    }
    .vel-col-bar.good { background: var(--green); }
    .vel-col-bar.warn { background: var(--amber); }
    .vel-col-bar.high-drop { background: var(--red); }
    .vel-col-bar.vbt-max, .rep-bar-fill.vbt-max { background: #ef4444 !important; }
    .vel-col-bar.vbt-acc, .rep-bar-fill.vbt-acc { background: #22c55e !important; }
    .vel-col-bar.vbt-str-spd, .rep-bar-fill.vbt-str-spd { background: #3b82f6 !important; }
    .vel-col-bar.vbt-spd-str, .rep-bar-fill.vbt-spd-str { background: #eab308 !important; }
    .vel-col-lbl {
      font-size: 10px;
      color: var(--muted);
      font-weight: 600;
    }
    .rep-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 240px;
      overflow-y: auto;
    }
    .rep-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 8px 10px;
      background: var(--bg);
      border-radius: 10px;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }
    .rep-item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .rep-bar-track {
      height: 6px;
      background: rgba(148, 163, 184, 0.15);
      border-radius: 999px;
      overflow: hidden;
    }
    .rep-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--accent);
      transition: width 0.2s ease;
    }
    .rep-bar-fill.good { background: var(--green); }
    .rep-bar-fill.warn { background: var(--amber); }
    .rep-bar-fill.high-drop { background: var(--red); }
    .rep-num {
      font-weight: 700;
      color: var(--muted);
      width: 32px;
    }
    .action-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .action-bar button {
      padding: 13px 10px;
      font-size: 16px;
    }
    .finish-workout-btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
    }
    /* Bottom navigation */
    nav.tabs {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 4px;
      padding: 6px 8px 14px;
      z-index: 30;
    }
    nav.tabs button {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 8px;
      font-size: 14px;
      border-radius: 10px;
    }
    nav.tabs button.active {
      color: var(--text);
      background: var(--card);
    }
    .hidden { display: none !important; }
    /* Calendar grid */
    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-weight: 700;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      font-size: 13px;
    }
    .cal-dow {
      color: var(--muted);
      font-size: 11px;
      padding: 4px 0;
    }
    .cal-day {
      padding: 8px 0;
      border-radius: 8px;
      cursor: pointer;
      position: relative;
      user-select: none;
    }
    .cal-day.selected {
      background: var(--accent);
      font-weight: 700;
    }
    .cal-day.has-workout::after {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--green);
      position: absolute;
      bottom: 3px;
      left: calc(50% - 2.5px);
    }
    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: max(28px, env(safe-area-inset-top, 28px)) 12px 16px;
      z-index: 50;
      overflow-y: auto;
    }
    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 10px;
    }
    .ex-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      -webkit-overflow-scrolling: touch;
    }
    .ex-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      padding: 9px 10px;
      border-radius: 10px;
    }
    .ex-row.selected-ex {
      border: 1px solid var(--accent);
      background: rgba(59, 130, 246, 0.12);
    }
    .history-set {
      background: var(--bg);
      border-radius: 10px;
      padding: 10px;
      margin-top: 8px;
    }
    .today-set-item {
      background: var(--bg);
      border-radius: 10px;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
      user-select: none;
    }
    .today-set-item:hover {
      background: rgba(51, 65, 85, 0.45);
      border-color: rgba(59, 130, 246, 0.45);
    }
    .today-set-item.expanded {
      border-color: var(--accent);
      background: rgba(30, 41, 59, 0.75);
    }
    .today-set-header {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .today-set-chevron {
      display: inline-block;
      font-size: 10px;
      color: var(--muted);
      width: 14px;
      text-align: center;
      transition: transform 0.2s ease, color 0.15s ease;
    }
    .today-set-item.expanded .today-set-chevron {
      color: var(--accent);
    }
    .analysis-card {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      margin-top: 6px;
    }
    .stat-pill-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 8px;
    }
    .stat-pill {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-pill-label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .stat-pill-val {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    /* VBT Velocity Zones (Squat, Bench Press, Military Bench, Deadlift) */
    .vbt-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .vbt-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }
    .vbt-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 5px;
    }
    .vbt-zone-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 9px;
      border-radius: 9px;
      background: var(--bg);
      border: 1px solid var(--border);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .vbt-zone-row.target-selected {
      border-color: var(--accent);
      background: rgba(59, 130, 246, 0.16);
    }
    .vbt-zone-row.active-hit {
      border-color: var(--green);
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.28);
    }
    .vbt-zone-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: var(--bg);
    }
    .vbt-zone-badge.zone-max {
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.55);
      background: rgba(239, 68, 68, 0.16);
    }
    .vbt-zone-badge.zone-acc {
      color: #86efac;
      border-color: rgba(34, 197, 94, 0.55);
      background: rgba(34, 197, 94, 0.16);
    }
    .vbt-zone-badge.zone-str-spd {
      color: #93c5fd;
      border-color: rgba(59, 130, 246, 0.6);
      background: rgba(59, 130, 246, 0.18);
    }
    .vbt-zone-badge.zone-spd-str {
      color: #fef08a;
      border-color: rgba(234, 179, 8, 0.55);
      background: rgba(234, 179, 8, 0.16);
    }
    /* --- Syvä VBT-analyysi --- */
    .vbt-kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 8px 0 6px; }
    .vbt-kpi { background: rgba(15,23,42,0.6); border: 1px solid rgba(51,65,85,0.6); border-radius: 10px; padding: 7px 8px; display: flex; flex-direction: column; min-width: 0; }
    .vbt-kpi-l { font-size: 10px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vbt-kpi-v { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.25; }
    .vbt-kpi-s { font-size: 10px; color: var(--muted); line-height: 1.3; }
    @media (max-width: 380px) { .vbt-kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .vbt-verdict { font-size: 12px; line-height: 1.45; color: var(--text); margin: 6px 0 2px; }
    .vbt-alert { font-size: 13px; font-weight: 700; padding: 8px 10px; border-radius: 10px; margin-top: 6px; }
    .vbt-alert.amber { background: rgba(245,158,11,0.16); border: 1px solid rgba(245,158,11,0.55); color: #fcd34d; }
    .vbt-alert.red { background: rgba(239,68,68,0.16); border: 1px solid rgba(239,68,68,0.6); color: #fca5a5; }
    .q-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 2.4px solid; margin-right: 4px; vertical-align: -1px; }
    .score-break { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
    .score-row { display: grid; grid-template-columns: 1.5fr 1fr auto; gap: 8px; align-items: center; font-size: 11px; color: var(--muted); }
    .score-row strong { color: var(--text); font-variant-numeric: tabular-nums; min-width: 38px; text-align: right; }
    .score-track { height: 6px; background: rgba(51,65,85,0.7); border-radius: 4px; overflow: hidden; }
    .score-fill { height: 100%; background: var(--accent); border-radius: 4px; }
    .ana-table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
    .ana-table th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11px; padding: 4px 5px; border-bottom: 1px solid var(--border); }
    .ana-table td { padding: 5px; border-bottom: 1px solid rgba(51,65,85,0.45); }
    #vbtLiveCard { margin-top: 4px; }
    .mode-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
    .mode-switch button { background: transparent; border: none; color: var(--muted); padding: 7px 6px; font-size: 13px; border-radius: 8px; }
    .mode-switch button.active { background: var(--card-alt); color: var(--text); font-weight: 700; }
    body.free-mode .guided-only { display: none !important; }
    body:not(.free-mode) .free-only { display: none !important; }
    .setup-vbt { font-size: 12px; line-height: 1.45; }
  </style>
</head>

    const BLE_DIAG_MAX = 50;
    const bleDiagLog = [];
    function logBleDiag(kind, msg) {
      bleDiagLog.push({ ts: new Date().toTimeString().slice(0, 8), kind: String(kind || 'info'), msg: String(msg || '') });
      if (bleDiagLog.length > BLE_DIAG_MAX) bleDiagLog.shift();
      if (typeof refreshBleDiagUI === 'function') refreshBleDiagUI();
    }
    function showRezeroStatus(msg, autoHideMs = 3500) {
      const el = document.getElementById('rezeroStatusText');
      if (!el) return;
      if (rezeroNoticeTimer) { clearTimeout(rezeroNoticeTimer); rezeroNoticeTimer = null; }
      if (!msg) { el.classList.add('hidden'); el.textContent = ''; return; }
      el.textContent = msg;
      el.classList.remove('hidden');
      if (autoHideMs > 0) {
        rezeroNoticeTimer = setTimeout(() => {
          el.classList.add('hidden');
          el.textContent = '';
          rezeroNoticeTimer = null;
        }, autoHideMs);
      }
    }

    const memoryStore = {};
    let exercises = loadJSON(KEY_EXERCISES, [...DEFAULT_EXERCISES]);
    if (!Array.isArray(exercises) || exercises.length === 0) {
      exercises = [...DEFAULT_EXERCISES];
    } else {
      const topDefaults = ['Jalkakyykky', 'Penkkipunnerrus', 'Sotilaspenkkipunnerrus', 'Maastaveto'];
      const missingTop = topDefaults.filter((ex) => !exercises.includes(ex));
      if (missingTop.length > 0) {
        exercises = [...missingTop, ...exercises];
        saveJSON(KEY_EXERCISES, exercises);
      }
    }
    let workouts = loadJSON(KEY_WORKOUTS, []); // [{ date: 'YYYY-MM-DD', sets: [...] }]
    if (!Array.isArray(workouts)) {
      workouts = [];
    }

    let calYear = new Date().getFullYear();
    let calMonth = new Date().getMonth();
    let selectedHistoryDate = todayISO();

    function todayISO() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function readWindowNameStore() {
      try {
        if (window.name && window.name.startsWith('{')) {
          return JSON.parse(window.name);
        }
      } catch {}
      return {};
    }

    function loadJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (raw) return JSON.parse(raw);
      } catch {}
      try {
        const wn = readWindowNameStore();
        if (wn && wn[key] !== undefined) return wn[key];
      } catch {}
      return memoryStore[key] !== undefined ? memoryStore[key] : fallback;
    }

    function saveJSON(key, val) {
      memoryStore[key] = val;
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (e) {
        console.warn('localStorage write fallback:', e);
      }
      try {
        const wn = readWindowNameStore();
        wn[key] = val;
        window.name = JSON.stringify(wn);
      } catch {}
    }

        }
      };

      extraVoiceSafetyTimer = setTimeout(finishCue, 4500);

      prepareExtraRepVoiceAudio();
      if (!extraVoiceAudio) {
        fallbackSpeakExtraRep(finishCue);
        return;
      }
      try {
        extraVoiceAudio.onended = null;
        extraVoiceAudio.onerror = null;
        extraVoiceAudio.pause();
        extraVoiceAudio.currentTime = 0;
        let fallbackTriggered = false;
        const onFail = () => {
          if (finished || fallbackTriggered) return;
          fallbackTriggered = true;
          fallbackSpeakExtraRep(finishCue);
        };
        extraVoiceAudio.onended = finishCue;
        extraVoiceAudio.onerror = onFail;
        const p = extraVoiceAudio.play();
        if (p && typeof p.catch === 'function') {
          p.catch(onFail);
        }
      } catch {
        fallbackSpeakExtraRep(finishCue);
      }
    }

    function formatMMSS(sec) {
      const s = Math.max(0, Math.floor(sec));
      const m = Math.floor(s / 60);
      const rem = String(s % 60).padStart(2, '0');
      return `${m}:${rem}`;
    }

    function getLiftUiState() {
      if (setActive || (zeroing && autoStartAfterZero)) return 'active';
      if (currentReps.length > 0 && (currentSetSaved || !setActive)) return 'rest';
      if (workoutDoneState) return 'done';
      if (dataChar && !zeroing) return 'ready';
      return 'idle';
    }

    // --- BLE Communication, Screen Wake Lock & Keep-Alive ---
    function setStatus(text, mode) {
      const st = document.getElementById('statusText');
      const dot = document.getElementById('statusDot');
      if (st) st.textContent = text;
      if (dot) dot.className = 'dot' + (mode ? ' ' + mode : '');
    }

    function updateHeaderStatus() {
      if (bleConnecting) return;
      if (!dataChar) {
        setStatus('Ei yhdistetty', '');
        return;
      }
      if (zeroing) {
        setStatus(`Kalibroidaan… ${zeroCountdownSec} s`, 'busy');
        return;
      }
      const state = getLiftUiState();
      const displaySetNum = getActiveSetDisplayNumber();
      const nextNum = getCompletedSetsForCurrentDate().length + 1;
      if (state === 'active') {
        const w = (activeSetMeta && activeSetMeta.weightKg !== undefined)
          ? activeSetMeta.weightKg
          : (parseFloat(document.getElementById('weightInput').value) || 0);
        setStatus(`● Sarja #${displaySetNum} · ${w} kg`, 'ready');
      } else if (state === 'rest' && currentSetSaved && lastSetStoppedAt > 0) {
        const elapsed = Math.floor((Date.now() - lastSetStoppedAt) / 1000);
        setStatus(`✓ Sarja #${displaySetNum} tallennettu · lepo ${formatMMSS(elapsed)}`, 'ready');
      } else {
        setStatus(`Valmis · Sarja #${nextNum}`, 'ready');
      }
    }

    function updateRestTimerDisplay() {
      const state = getLiftUiState();
      if (state !== 'rest' || !lastSetStoppedAt) return;
      const elapsed = Math.floor((Date.now() - lastSetStoppedAt) / 1000);
      const target = Math.max(30, parseInt((vbtSettings && vbtSettings.restTargetSec) || 180, 10) || 180);
      const badge = document.getElementById('restTimerBadge');
      if (badge) {
        badge.textContent = `⏱ Lepo ${formatMMSS(elapsed)}`;
        badge.className = elapsed >= target ? 'set-badge saved' : 'set-badge';
      }
      updateHeaderStatus();
      if (vbtSettings && vbtSettings.restTimerSound && !restGoalAlerted && elapsed >= target) {
        restGoalAlerted = true;
        soundRestComplete();
      }
    }

    function startRestTimer() {
      stopRestTimer();
      restGoalAlerted = false;
      updateRestTimerDisplay();
      restTimerInterval = setInterval(() => {
        if (getLiftUiState() !== 'rest') {
          stopRestTimer();
          return;
        }
        updateRestTimerDisplay();
      }, 1000);
    }

    function stopRestTimer() {
      if (restTimerInterval) {
        clearInterval(restTimerInterval);
        restTimerInterval = null;
      }
    }

    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    let writeChain = Promise.resolve();
    let pinStarted = false;
    let zeroTimer = null;
    let bleKeepAliveTimer = null;
    let lastBleActivityAt = 0;
    const BLE_KEEPALIVE_INTERVAL_MS = 15000;

    // --- Screen Wake Lock (Standard W3C Wake Lock API Only – Never Hijacks Bluetooth Media) ---
    let keepAwakeWanted = false;
    let wakeLockSentinel = null;

    async function requestScreenWakeLock() {
      keepAwakeWanted = true;
      if ('wakeLock' in navigator && navigator.wakeLock && navigator.wakeLock.request) {
        try {
          if (!wakeLockSentinel || wakeLockSentinel.released) {
            wakeLockSentinel = await navigator.wakeLock.request('screen');
            wakeLockSentinel.addEventListener('release', () => {
              if (keepAwakeWanted && document.visibilityState === 'visible') {
                navigator.wakeLock.request('screen').then((s) => {
                  wakeLockSentinel = s;
                }).catch(() => {});
              }
            });
          }
        } catch (err) {
          console.debug('WakeLock API unavailable:', err);
        }
      }
    }

    async function releaseScreenWakeLock() {
      keepAwakeWanted = false;
      try {
        if (wakeLockSentinel) {
          await wakeLockSentinel.release();
          wakeLockSentinel = null;
        }
      } catch {}
    }

    function startBleKeepAlive() {
      stopBleKeepAlive();
      lastBleActivityAt = Date.now();
      bleKeepAliveTimer = setInterval(() => {
        if (!dataChar || !bleDevice || !bleDevice.gatt || !bleDevice.gatt.connected) {
          return;
        }
        // Keep AudioContext & WakeLock alive during multi-minute sets
        if (keepAwakeWanted) {
          requestScreenWakeLock();
          if (audioCtx && (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted')) {
            audioCtx.resume().catch(() => {});
          }
        }
        // Do not interrupt the 3-second initial sensor calibration (0x03)
        if (zeroing) return;
        writeByte(CMD_HELLO);
      }, BLE_KEEPALIVE_INTERVAL_MS);
    }

    function stopBleKeepAlive() {
      if (bleKeepAliveTimer) {
        clearInterval(bleKeepAliveTimer);
        bleKeepAliveTimer = null;
      }
    }

    // Re-acquire Wake Lock and verify BLE connection if user switches back to the browser
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        configureAmbientAudioSession();
        if (keepAwakeWanted) {
          requestScreenWakeLock();
        }
        if (audioCtx && (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted')) {
          audioCtx.resume().catch(() => {});
        }
        if (dataChar && bleDevice && bleDevice.gatt && bleDevice.gatt.connected) {
          if (!zeroing) writeByte(CMD_HELLO);
        } else if (bleDevice && !manualDisconnect) {
          openGattSession().catch(() => {});
        }
      }
    });

    // Refresh Wake Lock on touch while connected
    ['touchstart', 'pointerdown', 'click'].forEach((evtName) => {
      document.addEventListener(evtName, () => {
        if (keepAwakeWanted) {
          requestScreenWakeLock();
        }
      }, { passive: true });
    });

    function writeByte(byte) {
      writeChain = writeChain.then(async () => {
        if (!dataChar) return;
        const arr = new Uint8Array([byte]);
        try {
          const op = dataChar.writeValue
            ? dataChar.writeValue(arr)
            : dataChar.writeValueWithResponse(arr);
          await Promise.race([op, sleep(450)]);
        } catch (e) {
          console.warn('BLE write warning:', e);
        }
      });
      return writeChain;
    }

    let zeroInterval = null;
    let zeroCountdownSec = 0;
    let autoStartAfterZero = false;

    function clearZeroTimer() {
      if (zeroTimer) {
        clearTimeout(zeroTimer);
        zeroTimer = null;
      }
      if (zeroInterval) {
        clearInterval(zeroInterval);
        zeroInterval = null;
      }
    }

    function getCompletedSetsForCurrentDate() {
      const dateEl = document.getElementById('workoutDate');
      const dateStr = (dateEl && dateEl.value) ? dateEl.value : todayISO();
      const workout = workouts.find((w) => w.date === dateStr);
      return workout ? workout.sets : [];
    }

    function getActiveSetDisplayNumber() {
      const completedCount = getCompletedSetsForCurrentDate().length;
      if (currentSetSaved && currentReps.length > 0) {
        return Math.max(1, completedCount);
      }
      return completedCount + 1;
    }

    function snapshotCurrentSetMeta() {
      const selVal = document.getElementById('exerciseSelect').value;
      const exercise = (selVal && selVal !== ADD_NEW_EX_VALUE) ? selVal : (exercises[0] || DEFAULT_EXERCISES[0]);
      const weightKg = parseFloat(document.getElementById('weightInput').value) || 0;
      const targetReps = parseInt(document.getElementById('targetRepsInput').value, 10) || 5;
      const tngToggleEl = document.getElementById('tngToggle');
      return {
        exercise,
        weightKg,
        targetReps,
        touchAndGo: !!(getLiftKey(exercise) === 'deadlift' && tngToggleEl && tngToggleEl.checked),
        time: new Date().toTimeString().slice(0, 8)
      };
    }

    function finishCalibrationAndActivate(expectedToken) {
      if (expectedToken !== undefined && expectedToken !== activeSetToken) return;
      clearZeroTimer();
      if (!zeroing) return;
      pinStarted = true;
      zeroing = false;
      pendingRep = { propVel: null, propAcc: null, romCm: null, phaseStartedAt: 0 };

      if (autoStartAfterZero) {
        autoStartAfterZero = false;
        setActive = true;
        setStartedAt = Date.now();
        if (!activeSetMeta || currentReps.length === 0) {
          activeSetMeta = snapshotCurrentSetMeta();
        }
        startAudioKeepWarm();
        stopRestTimer();
        soundReady();
      } else {
        soundReady();
        const rzEl = document.getElementById('rezeroStatusText');
        if (rzEl && !rzEl.classList.contains('hidden')) {
          showRezeroStatus('✓ Anturi nollattu ja valmis', 2500);
        }
      }
      updateHeaderStatus();
      renderLiveSet();
      updateSetButton();
    }

    async function disconnectPin() {
      manualDisconnect = true;
      bleConnecting = false;
      resumeSetAfterReconnect = false;
      resumeSetDisconnectedAt = 0;
      activeSetToken++;
      clearZeroTimer();
      stopBleKeepAlive();
      stopAudioKeepWarm();
      releaseScreenWakeLock();
      autoStartAfterZero = false;
      setActive = false;
      zeroing = false;
      pinStarted = false;
      try {
        if (dataChar) {
          await writeByte(CMD_STOP);
          await sleep(50);
          await writeByte(CMD_END);
        }
      } catch {}
      try {
        if (bleDevice && bleDevice.gatt && bleDevice.gatt.connected) {
          bleDevice.gatt.disconnect();
        }
      } catch {}
      dataChar = null;
      document.getElementById('connectBtn').textContent = 'Yhdistä Pin';
      updateHeaderStatus();
      renderLiveSet();
      updateSetButton();
    }

    async function releaseStaleConnections() {
      try {
        if (bleDevice && bleDevice.gatt && bleDevice.gatt.connected) {
          bleDevice.gatt.disconnect();
          await sleep(300);
        }
        if (navigator.bluetooth && navigator.bluetooth.getDevices) {
          const devs = await navigator.bluetooth.getDevices();
          for (const d of devs) {
            if (d.gatt && d.gatt.connected) {
              d.gatt.disconnect();
            }
          }
        }
      } catch {}
    }

    async function connectPin() {
      ensureAudio();
      requestScreenWakeLock();
      if (!navigator.bluetooth) {
        alert('Selaimesi ei tue Web Bluetoothia. Avaa tämä sivu iPhonessa ilmaisella Bluefy-selaimella (App Store) tai Android/Windows Chrome-selaimella.');
        return;
      }

      if (bleDevice && bleDevice.gatt && bleDevice.gatt.connected && dataChar) {
        await disconnectPin();
        return;
      }

      workoutDoneState = false;
      manualDisconnect = false;
      bleConnecting = true;
      updateSetButton();
      try {
        if (bleDevice) {
          try {
            await openGattSession();
            return;
          } catch {
            await releaseStaleConnections();
          }
        } else {
          await releaseStaleConnections();
        }

        setStatus('Etsitään Piniä…', 'busy');
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [
            { namePrefix: 'GPATH' },
            { namePrefix: 'Gpath' },
            { services: [ADV_UUID] },
            { services: [SERVICE_UUID] }
          ],
          optionalServices: [SERVICE_UUID, ADV_UUID]
        });
        bleDevice.removeEventListener('gattserverdisconnected', onDisconnected);
        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
        await openGattSession();
      } catch (err) {
        bleConnecting = false;
        releaseScreenWakeLock();
        updateHeaderStatus();
        updateSetButton();
        console.error(err);
      }
    }

    function updateSetButton() {
      const mainBtn = document.getElementById('mainSetActionBtn');
      const finishBtn = document.getElementById('finishWorkoutBtn');
      const completedCount = getCompletedSetsForCurrentDate().length;
      const nextSetNum = completedCount + 1;

      if (mainBtn) {
        if (!dataChar) {
          mainBtn.disabled = bleConnecting;
          mainBtn.className = 'primary main-action-btn';
          mainBtn.textContent = bleConnecting ? '⏳ Yhdistetään Pin…' : '🔌 Yhdistä Pin aloittaaksesi';
        } else if (zeroing && !autoStartAfterZero) {
          mainBtn.disabled = true;
          mainBtn.className = 'primary main-action-btn';
          mainBtn.textContent = `⏳ Kalibroidaan (${zeroCountdownSec} s) – pidä paikallaan…`;
        } else if (setActive || (zeroing && autoStartAfterZero)) {
          mainBtn.disabled = false;
          mainBtn.className = 'danger main-action-btn';
          mainBtn.textContent = (zeroing && autoStartAfterZero)
            ? `⏹ PERUUTA (${zeroCountdownSec} s)`
            : '⏹ LOPETA SARJA';
        } else {
          mainBtn.disabled = false;
          mainBtn.className = 'primary main-action-btn';
          mainBtn.textContent = `▶ ALOITA SARJA #${nextSetNum}`;
        }
      }

      if (finishBtn) {
        const showFinish = Boolean(dataChar || completedCount > 0 || currentReps.length > 0);
        finishBtn.classList.toggle('hidden', !showFinish);
        finishBtn.disabled = false;
        finishBtn.textContent = '🏁 Lopeta treeni';
      }

      const rezeroBtn = document.getElementById('rezeroBtn');
      if (rezeroBtn) {
        rezeroBtn.classList.toggle('hidden', !(dataChar && !setActive && !zeroing && !bleConnecting));
      }
    }

    function beginZeroCountdown(token, autoStart) {
      clearZeroTimer();
      zeroing = true;
      autoStartAfterZero = Boolean(autoStart);
      zeroCountdownSec = 3;
      updateHeaderStatus();
      renderLiveSet();
      updateSetButton();

      zeroInterval = setInterval(() => {
        if (!zeroing || token !== activeSetToken) {
          clearZeroTimer();
          return;
        }
        zeroCountdownSec = Math.max(1, zeroCountdownSec - 1);
        updateHeaderStatus();
        renderLiveSet();
        updateSetButton();
      }, 1000);

      zeroTimer = setTimeout(() => finishCalibrationAndActivate(token), 3000);
    }

    async function openGattSession() {
      if (!bleDevice) return;
      bleConnecting = true;
      setStatus('Yhdistetään…', 'busy');
      const server = await bleDevice.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);
      dataChar = await service.getCharacteristic(CHAR_UUID);

      // Keep screen awake and start periodic BLE 0x06 keep-alive for multi-minute sets
      requestScreenWakeLock();
      startBleKeepAlive();

      // Mandatory 0x06 handshake before and after enabling notifications + calibrate (0x03) on connect
      await writeByte(CMD_HELLO);
      await dataChar.startNotifications();
      dataChar.removeEventListener('characteristicvaluechanged', onNotification);
      dataChar.addEventListener('characteristicvaluechanged', onNotification);
      await sleep(50);
      await writeByte(CMD_HELLO);
      await sleep(50);
      await writeByte(CMD_BATTERY);

      bleConnecting = false;
      pinStarted = false;
      setActive = false;
      workoutDoneState = false;
      const shouldResume = resumeSetAfterReconnect && (Date.now() - resumeSetDisconnectedAt) < 90000;
      resumeSetAfterReconnect = false;
      resumeSetDisconnectedAt = 0;
      if (shouldResume) {
        logBleDiag('reconnect-resumed', `Sarja jatkettu automaattisesti uudelleenyhdistämisen jälkeen (${currentReps.length} toistoa)`);
      }
      const token = ++activeSetToken;
      document.getElementById('connectBtn').textContent = 'Katkaise';
      beginZeroCountdown(token, shouldResume);
      await sleep(50);
      await writeByte(CMD_START);
    }

    async function rezeroPin() {
      if (!dataChar || setActive || zeroing || bleConnecting) return;
      pinStarted = false;
      logBleDiag('rezero', 'Anturin manuaalinen nollaus käynnistetty (0x04 -> 0x03)');
      showRezeroStatus('Nollataan anturia (pidä paikallaan ~3 s)…', 0);
      const token = ++activeSetToken;
      beginZeroCountdown(token, false);
      await writeByte(CMD_STOP);
      await sleep(60);
      if (token !== activeSetToken || !dataChar) return;
      await writeByte(CMD_START);
    }

    function recalculateRepsPower(reps, weightKg) {
      const w = Number(weightKg) || 0;
      reps.forEach((r) => {
        const a = Number(r.propulsiveAcceleration) || 0;
        const v = Number(r.meanVelocity) || 0;
        r.power = w * (9.80665 + 0.58 * a) * v;
      });
    }

    function commitCurrentSetToWorkouts(metaOverride = null) {
      if (currentReps.length === 0 || currentSetSaved) return false;
      const dateStr = document.getElementById('workoutDate').value || todayISO();
      const selVal = document.getElementById('exerciseSelect').value;
      const currentExercise = (selVal && selVal !== ADD_NEW_EX_VALUE) ? selVal : (exercises[0] || DEFAULT_EXERCISES[0]);
      const currentWeightKg = parseFloat(document.getElementById('weightInput').value) || 0;
      const currentTargetReps = parseInt(document.getElementById('targetRepsInput').value, 10) || 5;
      const tngToggleEl = document.getElementById('tngToggle');

      const meta = metaOverride || activeSetMeta || {
        exercise: currentExercise,
        weightKg: currentWeightKg,
        targetReps: currentTargetReps,
        touchAndGo: !!(getLiftKey(currentExercise) === 'deadlift' && tngToggleEl && tngToggleEl.checked),
        time: new Date().toTimeString().slice(0, 8)
      };

      // Ensure every rep's Watts matches the saved set weightKg
      recalculateRepsPower(currentReps, meta.weightKg);

      let workout = workouts.find((w) => w.date === dateStr);
      if (!workout) {
        workout = { date: dateStr, sets: [] };
        workouts.push(workout);
      }
      const setCopy = {
        time: meta.time || new Date().toTimeString().slice(0, 8),
        exercise: meta.exercise,
        weightKg: meta.weightKg,
        targetReps: isFreeMode() ? currentReps.length : meta.targetReps,
        reps: currentReps.map((r) => ({ ...r })),
        goal: getGoal().key
      };
      if (meta.touchAndGo && getLiftKey(meta.exercise) === 'deadlift') setCopy.touchAndGo = true;
      if (isFreeMode()) setCopy.free = true;
      { const cst = getCycleState(dateStr); if (cst && !cst.finished && !cst.notStarted) setCopy.cycle = { phase: cst.phase.key, week: cst.weekIdx + 1, wave: cst.wave }; }
      if (pendingTraceMeta) { setCopy.traceMeta = pendingTraceMeta; pendingTraceMeta = null; }
      workout.sets.push(setCopy);
      lastSavedSetRef = setCopy;
      currentSetSaved = true;

      saveJSON(KEY_WORKOUTS, workouts);
      selectedHistoryDate = dateStr;
      renderCalendar();
      renderHistoryList();
      return true;
    }

    async function startSetOnPin() {
      if (!dataChar) return;
      ensureAudio();
      prepareExtraRepVoiceAudio();
      startAudioKeepWarm();
      requestScreenWakeLock();
      stopRestTimer();
      workoutDoneState = false;

      // If previous set had reps, ensure it is saved before starting the new set, then clear currentReps!
      if (currentReps.length > 0) {
        if (!currentSetSaved) {
          commitCurrentSetToWorkouts(activeSetMeta);
        }
        currentReps = [];
        currentSetSaved = false;
        lastSavedSetRef = null;
      }

      pendingRep = { propVel: null, propAcc: null, romCm: null, phaseStartedAt: 0 };
      lastBottomAt = 0;
      lastEccEndAt = 0;
      resumeSetAfterReconnect = false;
      resumeSetDisconnectedAt = 0;
      activeSetMeta = snapshotCurrentSetMeta();
      vbtCutoffAlerted = false;
      vbtFailureAlerted = false;
      lastTraceStatus = '';
      lastTraceFailed = false;
      setStartedAt = Date.now();
      lastRepAt = 0;

      // If initial 3s calibration on connect is still running, queue auto-start as soon as it finishes
      if (zeroing) {
        autoStartAfterZero = true;
        updateHeaderStatus();
        renderLiveSet();
        updateSetButton();
        return;
      }

      if (!pinStarted) {
        const token = ++activeSetToken;
        setActive = false;
        beginZeroCountdown(token, true);
        await writeByte(CMD_HELLO);
        await sleep(50);
        await writeByte(CMD_BATTERY);
        await sleep(50);
        await writeByte(CMD_START);
      } else {
        // Pin is already calibrated and running in 0x03 mode -> start set IMMEDIATELY with zero delay!
        clearZeroTimer();
        zeroing = false;
        setActive = true;
        setStartedAt = Date.now();
        soundReady();
        updateHeaderStatus();
        renderLiveSet();
        updateSetButton();
        writeByte(CMD_HELLO);
      }
    }

    async function stopSetOnPin(autoSave = true) {
      activeSetToken++;
      clearZeroTimer();
      stopAudioKeepWarm();
      autoStartAfterZero = false;
      resumeSetAfterReconnect = false;
      resumeSetDisconnectedAt = 0;
      setActive = false;
      zeroing = false;
      lastSetStoppedAt = Date.now();
      pendingRep = { propVel: null, propAcc: null, romCm: null, phaseStartedAt: 0 };

      // Automatically save completed set when user ends the set so next set starts fresh
      if (autoSave && currentReps.length > 0 && !currentSetSaved) {
        commitCurrentSetToWorkouts(activeSetMeta);
      }

      renderLiveSet();
      updateSetButton();
      if (currentSetSaved && currentReps.length > 0) {
        startRestTimer();
      } else {
        stopRestTimer();
      }
      updateHeaderStatus();
    }

    async function toggleSetOnPin() {
      if (!dataChar) return;
      if (setActive || (zeroing && autoStartAfterZero)) {
        await stopSetOnPin(true);
      } else {
        await startSetOnPin();
      }
    }

    function onDisconnected() {
      const wasActiveOrStarting = setActive || (zeroing && autoStartAfterZero);
      if (wasActiveOrStarting && !manualDisconnect) {
        resumeSetAfterReconnect = true;
        resumeSetDisconnectedAt = Date.now();
        logBleDiag('disconnect', `BLE-yhteys katkesi kesken sarjan (${currentReps.length} toistoa)`);
      } else if (!manualDisconnect) {
        logBleDiag('disconnect', 'BLE-yhteys katkesi');
      } else {
        resumeSetAfterReconnect = false;
        resumeSetDisconnectedAt = 0;
      }
      activeSetToken++;
      bleConnecting = false;
      clearZeroTimer();
      stopBleKeepAlive();
      stopAudioKeepWarm();
      autoStartAfterZero = false;
      dataChar = null;
      pinStarted = false;
      setActive = false;
      zeroing = false;
      renderLiveSet();
      updateSetButton();
      document.getElementById('connectBtn').textContent = 'Yhdistä Pin';
      if (manualDisconnect) {
        releaseScreenWakeLock();
        updateHeaderStatus();
        return;
      }
      bleConnecting = true;
      setStatus('Yhteys katkesi – yhdistetään…', 'busy');
      setTimeout(async () => {
        if (bleDevice && !manualDisconnect) {
          try { await openGattSession(); } catch { bleConnecting = false; updateHeaderStatus(); updateSetButton(); }
        } else {
          bleConnecting = false;
          updateHeaderStatus();
          updateSetButton();
        }
      }, 1200);
    }

    window.addEventListener('pagehide', () => {
      try {
        if (bleDevice && bleDevice.gatt && bleDevice.gatt.connected) {
          bleDevice.gatt.disconnect();
        }
      } catch {}
    });
    window.addEventListener('beforeunload', () => {
      try {
        if (bleDevice && bleDevice.gatt && bleDevice.gatt.connected) {
          bleDevice.gatt.disconnect();
        }
      } catch {}
    });

    // Minimum thresholds to filter out Pin handling, cable slack pull, and bar unrack/rack noise
    const MIN_VALID_VEL_M_S = 0.12;
    let lastBottomAt = 0;
    let lastEccEndAt = 0;
    const MIN_VALID_ROM_CM  = 12.0;

    function onNotification(event) {
      const dv = event.target.value;
      if (!dv || dv.byteLength === 0) return;
      lastBleActivityAt = Date.now();
      const type = dv.getUint8(0);

      // Raw 80 Hz set trace dump & markers (0xA4 / 0xB0–0xB4)
      if (type === 0xa4 || (type >= 0xb0 && type <= 0xb4)) {
        handleTraceNotification(dv);
        return;
      }

      if (dv.byteLength === 1 && type >= 0x81 && type <= 0x86) {
        if (type === 0x83 && zeroing) {
          finishCalibrationAndActivate(activeSetToken);
        }
        return;
      }

      // Movement phase state machine (0x01 0x01 = concentric start, 0x01 0x02 = lowering, 0x01 0x03 = rest)
      if (dv.byteLength === 2 && type === 0x01) {
        const phase = dv.getUint8(1);
        if (phase === 0x01) {
          // Fresh upward movement started: clear any leftover partial packets from prior movements
          pendingRep = { propVel: null, propAcc: null, romCm: null, phaseStartedAt: Date.now() };
        } else if (phase === 0x03) {
          const prevT = currentReps.length > 0 ? (currentReps[currentReps.length - 1].t || 0) : 0;
          if (lastEccEndAt > prevT && lastBottomAt <= lastEccEndAt) {
            lastBottomAt = Date.now(); // bottom / rest reached once per rep (ignore floor jitter)
          }
        }
        return;
      }

      if (dv.byteLength !== 5) return;
      const val = dv.getFloat32(1, true); // little-endian Float32

      if (type === 0x81) {
        document.getElementById('batteryText').textContent = `• ${Math.round(val)}%`;
        return;
      }

      // Allow final rep's eccentric lowering packet (0x06) within 4s of stopping the set (auto or manual)
      if (!setActive) {
        if (type === 0x06 && currentReps.length > 0 && (Date.now() - lastSetStoppedAt) < 4000) {
          const eccVel = val / 1000.0;
          const last = currentReps[currentReps.length - 1];
          if (last.loweringVelocity === null && eccVel >= 0.08 && eccVel <= 3.5) {
            last.loweringVelocity = eccVel;
            if (lastSavedSetRef && lastSavedSetRef.reps && lastSavedSetRef.reps.length > 0) {

              saveJSON(KEY_WORKOUTS, workouts);

            if (eccVel > 0.60) soundLoweringWarn();
            renderLiveSet();
          }

        return;
      }

      if (type === 0x03) {
        pendingRep.propVel = val / 1000.0;
      } else if (type === 0x05) {
        pendingRep.romCm = val / 10.0;
      } else if (type === 0x04) {
        pendingRep.propAcc = val / 1000.0;
      } else if (type === 0x02) {

        const rawPropVel = pendingRep.propVel;
        const rawPropAcc = pendingRep.propAcc;
        const rawRomCm = pendingRep.romCm;
        const hasFullBurst = rawPropVel !== null && rawRomCm !== null && rawPropAcc !== null;
        const propVel = rawPropVel ?? meanVel;
        const propAcc = rawPropAcc ?? 0;
        const romCm   = rawRomCm ?? 0;
        const liftStartAt = pendingRep.phaseStartedAt || 0;
        pendingRep = { propVel: null, propAcc: null, romCm: null, phaseStartedAt: 0 };

        // 1. Enforce strict full-burst only on Rep 1 during the initial 1500 ms after set start
        const isInitialWindow = currentReps.length === 0 && (Date.now() - setStartedAt) < 1500;
        if (!hasFullBurst && isInitialWindow) {
          console.debug('Ignored incomplete rep burst on 0x02:', { meanVel, propVel, propAcc, romCm });
          logBleDiag('ghost-filtered', `Puuttuva pakettiryhmä sarjan alussa (mv=${Number.isFinite(meanVel) ? meanVel.toFixed(2) : '?'} m/s)`);
          return;
        }

        // 2. Reject non-lift ghost movements (cable slack pull, pin adjustment, <0.12 m/s or <12 cm ROM when present)
        if (
          !Number.isFinite(meanVel) ||
          meanVel < MIN_VALID_VEL_M_S ||
          (rawRomCm !== null && rawRomCm < MIN_VALID_ROM_CM) ||
          (rawPropAcc !== null && rawPropAcc < 0)
        ) {
          console.debug('Filtered ghost movement:', { meanVel, romCm: rawRomCm, propAcc: rawPropAcc });
          logBleDiag('ghost-filtered', `Haamuliike suodatettu (mv=${Number.isFinite(meanVel) ? meanVel.toFixed(2) : '?'} m/s, rom=${rawRomCm !== null ? rawRomCm.toFixed(1) : 'null'} cm)`);
          return;
        }

        if (currentReps.length >= 2) {
          const prevRep = currentReps[currentReps.length - 1];

          currentReps.length === 1 &&
          currentReps[0].meanVelocity < 0.22 &&
          currentReps[0].loweringVelocity === null &&
          meanVel > currentReps[0].meanVelocity * 2.2

        if (currentReps.length > 0 && liftStartAt > 0) {

      const pad = Math.min(40, x.length - 1);
      const ext = [];
      for (let i = pad; i > 0; i--) ext.push(2 * x[0] - x[i]);
      ext.push(...x);
      for (let i = 1; i <= pad; i++) ext.push(2 * x[x.length - 1] - x[x.length - 1 - i]);
      let y = biquad(biquad(ext, 0.5412), 1.3066);
      y.reverse();
      y = biquad(biquad(y, 0.5412), 1.3066);
      y.reverse();
      return y.slice(pad, pad + x.length);
    }
    const v3 = {
      dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
      cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
      norm: (a) => Math.hypot(a[0], a[1], a[2]),
      unit: (a) => { const n = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / n, a[1] / n, a[2] / n]; }
    };
    // quaternion [w,x,y,z], body -> world
    function qMul(a, b) {
      return [a[0] * b[0] - a[1] * b[1] - a[2] * b[2] - a[3] * b[3],
        a[0] * b[1] + a[1] * b[0] + a[2] * b[3] - a[3] * b[2],
        a[0] * b[2] - a[1] * b[3] + a[2] * b[0] + a[3] * b[1],
        a[0] * b[3] + a[1] * b[2] - a[2] * b[1] + a[3] * b[0]];
    }
    function qRot(q, v) {
      const p = qMul(qMul(q, [0, v[0], v[1], v[2]]), [q[0], -q[1], -q[2], -q[3]]);
      return [p[1], p[2], p[3]];
    }
    function qNorm(q) { const n = Math.hypot(q[0], q[1], q[2], q[3]) || 1; return [q[0] / n, q[1] / n, q[2] / n, q[3] / n]; }
    function qFromTwoVectors(from, to) {
      const f = v3.unit(from), t = v3.unit(to);
      const d = v3.dot(f, t);
      if (d < -0.9999) return [0, 1, 0, 0];
      const c = v3.cross(f, t);
      return qNorm([1 + d, c[0], c[1], c[2]]);
    }

    // ---------- trace analysis ----------
    function analyzeTrace(rows, exercise) {
      const n = rows.length, dt = 1 / TRACE_FS;
      const acc = rows.map((r) => [r[1], r[2], r[6]].map((x) => x / TRACE_ACC_LSB_PER_G * G0));
      const gyr = rows.map((r) => [r[3], r[4], r[5]].map((x) => x / TRACE_GYRO_LSB_PER_DPS * Math.PI / 180));
      const vFw = rows.map((r) => r[8] / 1000);
      const v = butterLowpass4(vFw, 8, TRACE_FS); // Butterworth 4. aste 8 Hz -> whip & vibration out

      // quiet windows (bar at rest): low rotation and |acc| ≈ g
      const quiet = rows.map((r, i) => v3.norm(gyr[i]) < 0.12 && Math.abs(v3.norm(acc[i]) - G0) < 0.35 && Math.abs(vFw[i]) < 0.02);
      // gyro bias & initial attitude from the longest quiet window
      let qs = 0, ql = 0;
      for (let i = 0, s = -1; i <= n; i++) {
        if (i < n && quiet[i]) { if (s < 0) s = i; }
        else if (s >= 0) { if (i - s > ql) { ql = i - s; qs = s; } s = -1; }
      }
      const win = ql >= 20 ? [qs, qs + ql] : [0, Math.min(n, 40)];
      const mean3 = (arr, a, b) => { const m = [0, 0, 0]; for (let i = a; i < b; i++) { m[0] += arr[i][0]; m[1] += arr[i][1]; m[2] += arr[i][2]; } return m.map((x) => x / Math.max(1, b - a)); };
      const bias = mean3(gyr, win[0], win[1]);
      const g0 = mean3(acc, win[0], win[1]);

      // bar axis in the sensor frame: the sensor axis that stays ⟂ to gravity in every quiet window
      let barAxis = null, barAxisConf = 0;
      const ovr = vbtSettings.barAxis;
      if (ovr === 'x' || ovr === 'y' || ovr === 'z') {
        barAxis = ovr === 'x' ? [1, 0, 0] : ovr === 'y' ? [0, 1, 0] : [0, 0, 1];
        barAxisConf = 1;
      } else {
        const maxComp = [0, 0, 0];
        let qn = 0;
        for (let i = 0; i < n; i++) {
          if (!quiet[i]) continue;
          qn++;
          const u = v3.unit(acc[i]);
          for (let k = 0; k < 3; k++) maxComp[k] = Math.max(maxComp[k], Math.abs(u[k]));
        }
        if (qn > 10) {
          const order = [0, 1, 2].sort((a, b) => maxComp[a] - maxComp[b]);
          if (maxComp[order[0]] < 0.17 && maxComp[order[1]] > 0.35) { // ≈ < 10° from horizontal, unambiguous
            barAxis = [0, 0, 0]; barAxis[order[0]] = 1;
            barAxisConf = Math.min(1, (maxComp[order[1]] - maxComp[order[0]]) / 0.5);
          }
        }
      }

      // attitude: gyro integration (bias removed) + light Mahony correction while quasi-static
      let q = qFromTwoVectors(g0, [0, 0, 1]);
      const up = new Array(n), aVert = new Array(n), aHor = new Array(n), tilt = new Array(n);
      let hDir = null;
      const Kp = 0.6;
      for (let i = 0; i < n; i++) {
        let w = [gyr[i][0] - bias[0], gyr[i][1] - bias[1], gyr[i][2] - bias[2]];
        const an = v3.norm(acc[i]);
        const upBody = qRot([q[0], -q[1], -q[2], -q[3]], [0, 0, 1]);
        if (Math.abs(an - G0) < 0.6 && v3.norm(w) < 0.5) {
          const e = v3.cross(v3.unit(acc[i]), upBody);
          w = [w[0] + Kp * e[0], w[1] + Kp * e[1], w[2] + Kp * e[2]];
        }
        const ang = v3.norm(w) * dt;
        if (ang > 0) {
          const ax = v3.unit(w), s = Math.sin(ang / 2);
          q = qNorm(qMul(q, [Math.cos(ang / 2), ax[0] * s, ax[1] * s, ax[2] * s]));
        }
        const aw = qRot(q, acc[i]);
        aVert[i] = aw[2] - G0;
        up[i] = qRot([q[0], -q[1], -q[2], -q[3]], [0, 0, 1]);
        if (barAxis) {
          const bw = qRot(q, barAxis);
          // horizontal sagittal direction ⟂ bar (fixed once, sign arbitrary but consistent in the set)
          if (!hDir) hDir = v3.unit(v3.cross([0, 0, 1], bw));
          aHor[i] = v3.dot(aw, hDir);
          tilt[i] = Math.asin(Math.max(-1, Math.min(1, v3.dot(up[i], barAxis)))) * 180 / Math.PI;
        } else { aHor[i] = 0; tilt[i] = 0; }
      }

      // ---- concentric segmentation on filtered velocity ----
      const segs = [];
      for (let i = 0; i < n;) {
        if (v[i] > 0.02) {
          let j = i; while (j < n && v[j] > 0.02) j++;
          let pk = i; for (let k = i; k < j; k++) if (v[k] > v[pk]) pk = k;
          const th = Math.max(0.02, 0.1 * v[pk]);
          let s = pk; while (s > i && v[s - 1] > th) s--;
          let e = pk; while (e < j - 1 && v[e + 1] > th) e++;
          let disp = 0; for (let k = s; k <= e; k++) disp += v[k] * dt;
          if (disp >= 0.08 && v[pk] > 0.08) segs.push({ s, e, pk, disp });
          i = j;
        } else i++;
      }

      const rules = TRACE_LIFT_RULES[getLiftKey(exercise)] || null;
      const reps = segs.map((sg) => {
        const { s, e } = sg;
        const len = e - s + 1;
        const pos = []; let z = 0;
        for (let k = s; k <= e; k++) { z += v[k] * dt; pos.push(z); }
        const rom = z;
        let mv = 0; for (let k = s; k <= e; k++) mv += v[k]; mv /= len;
        // propulsive phase ends where vertical acceleration (firmware) turns negative after the peak
        let ip = sg.pk;
        let mpv = 0; for (let k = s; k <= ip; k++) mpv += v[k]; mpv /= Math.max(1, ip - s + 1);

        // ---- sticking point: V1 (first local max) -> Vmin -> V2 ----
        let stick = null;
        const segV = v.slice(s, e + 1);
        let p1 = -1;
        for (let k = 2; k < len - 2; k++) {
          if (segV[k] >= segV[k - 1] && segV[k] >= segV[k + 1] && segV[k] >= segV[k - 2] && segV[k] >= segV[k + 2] && pos[k] < rom * 0.7) { p1 = k; break; }
        }
        if (p1 > 0) {
          let mi = p1; for (let k = p1; k < len; k++) if (segV[k] < segV[mi]) mi = k;
          // the minimum must be followed by re-acceleration
          let mi2 = p1, p2 = -1;
          for (let k = p1 + 1; k < len; k++) {
            if (segV[k] < segV[mi2]) mi2 = k;
            if (segV[k] - segV[mi2] >= STICK_MIN_DROP && segV[p1] - segV[mi2] >= STICK_MIN_DROP) {
              let pp = k; while (pp + 1 < len && segV[pp + 1] >= segV[pp]) pp++;
              p2 = pp; break;
            }
          }
          if (p2 > 0) {
            const v1 = segV[p1], vmin = segV[mi2], v2 = segV[p2];
            const lvl = vmin + 0.25 * (Math.min(v1, v2) - vmin);
            let a = mi2; while (a > p1 && segV[a - 1] <= lvl) a--;
            let b = mi2; while (b < p2 && segV[b + 1] <= lvl) b++;
            stick = {
              heightCm: pos[mi2] * 100, vmin, v1, v2,
              durationMs: Math.round((b - a + 1) * dt * 1000),
              pctRom: pos[mi2] / rom * 100, idx: mi2
            };
          }
        }
        // slowest point in the middle 20–80 % of ROM (useful even without a classic V1-V2 pattern)
        let midMin = null;
        for (let k = 0; k < len; k++) {
          if (pos[k] < rom * 0.2 || pos[k] > rom * 0.8) continue;
          if (midMin === null || segV[k] < midMin.v) midMin = { v: segV[k], heightCm: pos[k] * 100 };
        }

        // ---- horizontal path (ZUPT-style detrend over the concentric window) ----
        let path = null, dxMax = null, dxNet = null, tiltMax = null;
        // horizontal double integration drifts: only trusted for short concentrics (≤ 3 s)
        if (barAxis && len * dt <= 3.0) {
          const vh = []; let acc0 = 0;
          for (let k = s; k <= e; k++) { acc0 += aHor[k] * dt; vh.push(acc0); }
          const vEnd = vh[vh.length - 1];
          for (let k = 0; k < vh.length; k++) vh[k] -= vEnd * k / Math.max(1, vh.length - 1);
          const xs = []; let x = 0;
          for (let k = 0; k < vh.length; k++) { x += vh[k] * dt; xs.push(x * 100); }
          dxNet = xs[xs.length - 1];
          dxMax = xs.reduce((m, val) => (Math.abs(val) > Math.abs(m) ? val : m), 0);
          // resample to 21 points by % of ROM
          path = [];
          let k = 0;
          for (let f = 0; f <= 20; f++) {
            const target = rom * f / 20;
            while (k < len - 1 && pos[k] < target) k++;
            path.push([Math.round(xs[k] * 10) / 10, Math.round(pos[k] * 1000) / 10]);
          }
          const t0 = tilt[s];
          tiltMax = 0;
          for (let k = s; k <= e; k++) tiltMax = Math.max(tiltMax, Math.abs(tilt[k] - t0));
        }
        // compact velocity curve (40 Hz, mm/s) for plotting
        const curve = [];
        for (let k = 0; k < len; k += 2) curve.push([Math.round(pos[k] * 1000) / 10, Math.round(segV[k] * 1000)]);
        // pause at the bottom before this concentric (touch-and-go)
        let pauseMs = null;
        let b0i = s - 1; while (b0i > 0 && v[b0i] > -0.03) b0i--;
        if (b0i > 0 && s - b0i < TRACE_FS * 8) pauseMs = Math.round((s - b0i) * dt * 1000);
        return {
          romCm: rom * 100, mv, mpv, vPeak: v[sg.pk], durMs: Math.round(len * dt * 1000),
          stick, midMin, path, dxMax, dxNet, tiltMax, curve, pauseMs
        };
      });
      return { reps, barAxis, barAxisConf, quietSamples: ql, samples: n, rules };
    }

    // match trace reps to app reps in order, minimising |MV difference| (handles ghost reps on either side)
    function matchTraceReps(traceReps, appReps) {
      const A = traceReps.length, B = appReps.length;
      const INF = 1e9, cost = Array.from({ length: A + 1 }, () => new Array(B + 1).fill(INF));
      const from = Array.from({ length: A + 1 }, () => new Array(B + 1).fill(null));
      cost[0][0] = 0;
      const SKIP = 0.15;
      for (let i = 0; i <= A; i++) for (let j = 0; j <= B; j++) {
        const c = cost[i][j]; if (c >= INF) continue;
        if (i < A && j < B) {
          const d = c + Math.abs(traceReps[i].mv - (Number(appReps[j].meanVelocity) || 0));
          if (d < cost[i + 1][j + 1]) { cost[i + 1][j + 1] = d; from[i + 1][j + 1] = [i, j, 'm']; }
        }
        if (i < A && c + SKIP < cost[i + 1][j]) { cost[i + 1][j] = c + SKIP; from[i + 1][j] = [i, j, 's']; }
        if (j < B && c + SKIP < cost[i][j + 1]) { cost[i][j + 1] = c + SKIP; from[i][j + 1] = [i, j, 's']; }
      }
      const map = new Array(B).fill(-1);
      let i = A, j = B;
      while (i > 0 || j > 0) {
        const f = from[i][j]; if (!f) break;
        if (f[2] === 'm') map[f[1]] = f[0];
        i = f[0]; j = f[1];
      }
      return map;
    }

    function attachTraceToRecentSet(raw) {
      const now = Date.now();
      // candidate: open set in progress / just finished, else the most recently saved set
      let targets = [];
      let exercise = null;
      const recent = (reps) => reps && reps.length && (now - (reps[reps.length - 1].t || 0)) < 90000;
      if (recent(currentReps)) {
        targets.push(currentReps);
        if (currentSetSaved && lastSavedSetRef) targets.push(lastSavedSetRef.reps);
        exercise = (activeSetMeta && activeSetMeta.exercise) || (lastSavedSetRef && lastSavedSetRef.exercise) || getCurrentSelectedExerciseName();
      } else {
        let cand = null;
        workouts.forEach((w) => (w.sets || []).forEach((s) => { if (recent(s.reps) && (!cand || s.reps[s.reps.length - 1].t > cand.reps[cand.reps.length - 1].t)) cand = s; }));
        if (cand) { targets.push(cand.reps); exercise = cand.exercise; }
      }
      if (!targets.length) { lastTraceFailed = true; lastTraceStatus = '📡 Raakadata vastaanotettu, mutta sarjaa ei löytynyt'; return; }
      const ta = analyzeTrace(raw.rows, exercise);
      const map = matchTraceReps(ta.reps, targets[0]);
      let matched = 0;
      targets.forEach((reps) => {
        reps.forEach((r, j) => {
          const k = map[j];
          if (k < 0) return;
          const tr = ta.reps[k];
          r.trace = {
            romCm: +tr.romCm.toFixed(1), mvF: +tr.mv.toFixed(3), vPeak: +tr.vPeak.toFixed(3), durMs: tr.durMs,
            stick: tr.stick ? { h: +tr.stick.heightCm.toFixed(1), vmin: +tr.stick.vmin.toFixed(3), v1: +tr.stick.v1.toFixed(3), v2: +tr.stick.v2.toFixed(3), ms: tr.stick.durationMs, pct: Math.round(tr.stick.pctRom) } : null,
            midMin: tr.midMin ? { v: +tr.midMin.v.toFixed(3), h: +tr.midMin.heightCm.toFixed(1) } : null,
            dxMax: tr.dxMax !== null ? +tr.dxMax.toFixed(1) : null,
            dxNet: tr.dxNet !== null ? +tr.dxNet.toFixed(1) : null,
            tilt: tr.tiltMax !== null ? +tr.tiltMax.toFixed(1) : null,
            path: tr.path, curve: tr.curve, pauseMs: tr.pauseMs
          };
          if (Number.isFinite(tr.pauseMs)) r.pauseMs = tr.pauseMs;
          if (reps === targets[0]) matched++;
        });
      });
      const extraReps = Math.max(0, ta.reps.length - targets[0].length);
      const meta = {
        samples: ta.samples,
        coverage: +raw.coverage.toFixed(3),
        barAxis: ta.barAxis ? 'xyz'[ta.barAxis.indexOf(1)] : null,
        barAxisConf: +ta.barAxisConf.toFixed(2),
        segments: ta.reps.length,
        matched,
        extraReps
      };
      if (currentSetSaved && lastSavedSetRef && targets.includes(lastSavedSetRef.reps)) lastSavedSetRef.traceMeta = meta;
      else if (!targets.includes(currentReps)) {
        workouts.forEach((w) => (w.sets || []).forEach((s) => { if (targets.includes(s.reps)) s.traceMeta = meta; }));
      } else pendingTraceMeta = meta;
      saveJSON(KEY_WORKOUTS, workouts);
      if (extraReps > 0) {
        logBleDiag('trace-mismatch', `80 Hz raakadata havaitsi ${ta.reps.length} nostoa, sovellus tallensi ${targets[0].length} (+${extraReps} puuttuvaa)`);
        lastTraceFailed = true;
        lastTraceStatus = `⚠️ Pin 80 Hz havaitsi ${ta.reps.length} nostoa, mutta sovellukseen tallentui ${targets[0].length} toistoa (+${extraReps} puuttuvaa) – korjaa toistomäärä Analyysissä.`;
      } else {
        lastTraceFailed = false;
        lastTraceStatus = `📡 Raakadata analysoitu: ${matched}/${targets[0].length} toistoa (${ta.samples} näytettä${meta.barAxis ? ', tangon akseli ' + meta.barAxis.toUpperCase() : ', tangon akseli ei tunnistettu'})`;
      }
      renderCalendar();
      renderHistoryList();
    }
    let pendingTraceMeta = null;

    // ---------- per-rep path / technique scoring ----------
    function pathTemplateDeviation(path, tmpl) {
      if (!path || !tmpl || path.length !== tmpl.length) return null;
      // compare shapes after aligning both to start at x = 0
      let ss = 0;
      for (let i = 0; i < path.length; i++) {
        const d = (path[i][0] - path[0][0]) - (tmpl[i][0] - tmpl[0][0]);
        ss += d * d;
      }
      return Math.sqrt(ss / path.length);
    }

    function exportRawTracesCSV() {
      if (!recentRawTraces.length) { alert('Ei raakadataa tässä istunnossa. Tee sarja ja odota ~10 s sarjan jälkeen.'); return; }
      const lines = ['trace,received_at,sample,dt_us,ax,ay,gx,gy,gz,az,a_vert_mm_s2,v_vert_mm_s'];
      recentRawTraces.forEach((t, ti) => t.rows.forEach((r, i) => lines.push([ti + 1, new Date(t.receivedAt).toISOString(), i, ...r].join(','))));
      const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
      const a = document.createElement('a');
