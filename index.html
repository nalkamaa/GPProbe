    // --- Velocity -> %1RM from the population table (linear interpolation / extrapolation) ---
    function pctFromVelocityTable(cfg, v) {
      if (!cfg || !(v > 0)) return null;
      const t = cfg.lv; // pct ascending, velocity descending
      let lo = t[0], hi = t[1];
      if (v <= t[t.length - 1][1]) { lo = t[t.length - 2]; hi = t[t.length - 1]; }
      else {
        for (let i = 0; i < t.length - 1; i++) {
          if (v <= t[i][1] && v >= t[i + 1][1]) { lo = t[i]; hi = t[i + 1]; break; }
        }
      }
      const pct = lo[0] + (v - lo[1]) * (hi[0] - lo[0]) / (hi[1] - lo[1]);
      return Math.max(30, Math.min(110, pct));
    }
    function velocityFromPctTable(cfg, pct) {
      if (!cfg) return null;
      const t = cfg.lv;
      let lo = t[0], hi = t[1];
      if (pct >= t[t.length - 1][0]) { lo = t[t.length - 2]; hi = t[t.length - 1]; }
      else {
        for (let i = 0; i < t.length - 1; i++) {
          if (pct >= t[i][0] && pct <= t[i + 1][0]) { lo = t[i]; hi = t[i + 1]; break; }
        }
      }
      return lo[1] + (pct - lo[0]) * (hi[1] - lo[1]) / (hi[0] - lo[0]);
    }

    // --- Suspect rep detection (unrack / positioning / partial ROM) ---
    function flagSuspectReps(reps, cfg) {
      const n = reps.length;
      const flags = new Array(n).fill(false);
      if (n < 2) return flags;
      const vs = reps.map(repV);
      const roms = reps.map((r) => Number(r.rangeOfMotionCm) || 0);
      const medRom = vbtMedian(roms);
      const minRom = cfg ? cfg.minRomCm : 15;
      reps.forEach((r, i) => {
        // 1. Unrack / positioning movement recorded as 1st rep (much slower than the rest)
        if (i === 0) {
          const others = vbtMedian(vs.slice(1));
          if (others && vs[0] < others * 0.5) flags[0] = true;
        }
        // 2. Partial movement: ROM clearly below set median AND below lift-specific minimum
        if (medRom && roms[i] < medRom * 0.5 && roms[i] < minRom) flags[i] = true;
      });
      return flags;
    }

    // --- Personal MVT: manual override > learned from completed reps > population default ---
    let _mvtCache = { sig: '', map: {} };
    function workoutsSignature() {
      let n = 0;
      workouts.forEach((w) => (w.sets || []).forEach((s) => { n += (s.reps || []).length; }));
      return `${workouts.length}:${n}:${vbtSettings.velocityMetric}`;
    }
    function learnedMvt(liftKey) {
      const sig = workoutsSignature();
      if (_mvtCache.sig !== sig) _mvtCache = { sig, map: {} };
      if (_mvtCache.map[liftKey] !== undefined) return _mvtCache.map[liftKey];
      const cfg = LIFT_ANALYSIS[liftKey];
      let minV = null;
      workouts.forEach((w) => (w.sets || []).forEach((s) => {
        if (getLiftKey(s.exercise) !== liftKey) return;
        const reps = s.reps || [];
        const sus = flagSuspectReps(reps, cfg);
        reps.forEach((r, i) => {
          if (sus[i]) return;
          const v = repV(r);
          if (v >= cfg.mvtFloor && (minV === null || v < minV)) minV = v;
        });
      }));
      const res = (minV !== null && minV < cfg.mvt) ? minV : null;
      _mvtCache.map[liftKey] = res;
      return res;
    }
    function getEffectiveMvt(exerciseName) {
      const k = getLiftKey(exerciseName);
      if (!k) return null;
      const cfg = LIFT_ANALYSIS[k];
      const man = parseFloat(vbtSettings.mvtOverride[k]);
      if (Number.isFinite(man) && man > 0) return { value: man, source: 'manual', label: 'oma asetus' };
      const learned = learnedMvt(k);
      if (learned !== null) return { value: learned, source: 'learned', label: 'opittu omista toistoista' };
      return { value: cfg.mvt, source: 'default', label: 'väestökeskiarvo' };
    }

    // --- Core: analyse one set ---
    function analyzeSet(reps, exercise, weightKg, opts = {}) {
      reps = reps || [];
      const cfg = getLiftCfg(exercise);
      const cutoffPct = getCutoffPct(exercise);
      const redVl = cfg ? cfg.redVl : GENERIC_RED_VL;
      const mvtInfo = getEffectiveMvt(exercise);
      const mvt = mvtInfo ? mvtInfo.value : null;
      const n = reps.length;
      const vs = reps.map(repV);
      const suspect = flagSuspectReps(reps, cfg);

      // Touch-and-go detection (deadlift): pause between reps < 0.8 s
      const pauses = reps.slice(1).map((r) => r.pauseMs).filter((p) => Number.isFinite(p));
      const tng = !!(cfg && cfg.id === 'deadlift' && pauses.length >= 1 && vbtMedian(pauses) < TNG_PAUSE_MS);

      // Velocity loss vs. best-so-far rep (NOT vs. 1st rep: PAP, unrack & dead-start would distort it)
      let bestSoFar = 0;
      let vBest = null, vBestIdx = -1;
      const perRep = reps.map((r, i) => {
        const v = vs[i];
        const excludedFromRef = suspect[i] || (tng && i === 0 && n > 1);
        if (!excludedFromRef && v > bestSoFar) bestSoFar = v;
        if (!suspect[i] && !(tng && i === 0 && n > 1) && (vBest === null || v > vBest)) { vBest = v; vBestIdx = i; }
        const vl = (!suspect[i] && bestSoFar > 0 && !(tng && i === 0 && n > 1)) ? Math.max(0, (bestSoFar - v) / bestSoFar * 100) : null;
        return { idx: i, v, vl, bestSoFar: bestSoFar || null, suspect: suspect[i], rir: null, quality: 'good' };
      });
      if (vBest === null && n > 0) { vBest = Math.max(...vs); vBestIdx = vs.indexOf(vBest); }

      // Velocity cost per rep: from this set's own slope (best rep -> end) or lift default
      let cost = cfg ? cfg.repCost : null, costSource = cfg ? 'default' : null;
      const tail = perRep.filter((p) => p.idx >= vBestIdx && !p.suspect);
      if (tail.length >= 3) {
        const reg = vbtLinReg(tail.map((p) => p.idx), tail.map((p) => p.v));
        if (reg && reg.slope < -0.005) { cost = Math.min(0.12, Math.max(0.02, -reg.slope)); costSource = 'set'; }
      }

      perRep.forEach((p) => {
        if (mvt !== null && cost && !p.suspect) p.rir = Math.max(0, Math.floor((p.v - mvt) / cost + 1e-9));
        if (p.suspect) p.quality = 'suspect';
        else if (mvt !== null && p.v < mvt) p.quality = 'bad';
        else if (p.vl !== null && p.vl > redVl) p.quality = 'bad';
        else if (p.vl !== null && p.vl > cutoffPct) p.quality = 'warn';
        else if (p.rir !== null && p.rir < 1) p.quality = 'warn';
        else p.quality = 'good';
      });

      // --- Gpath Pin raw-trace metrics: sticking point, bar path vs best rep, tilt ---
      const rules = cfg ? TRACE_LIFT_RULES[cfg.id] : null;
      const hasTrace = reps.some((r) => r && r.trace);
      const bestTrRep = (vBestIdx >= 0 && reps[vBestIdx] && reps[vBestIdx].trace && reps[vBestIdx].trace.path)
        ? reps[vBestIdx] : reps.find((r, i) => r.trace && r.trace.path && !suspect[i]);
      const bestTr = bestTrRep ? bestTrRep.trace : null;
      perRep.forEach((p) => {
        p.flags = [];
        p.pathDev = null;
        const tr = reps[p.idx].trace;
        if (!tr || p.suspect) return;
        if (tr.stick && tr.stick.vmin < 0.10 && p.quality !== 'bad') {
          p.flags.push('stick');
          if (p.rir !== null) p.rir = 0;
          if (p.quality === 'good') p.quality = 'warn';
        }
        if (tr.path && bestTr && bestTr.path) p.pathDev = tr === bestTr ? 0 : pathTemplateDeviation(tr.path, bestTr.path);
        if (p.pathDev !== null && rules && p.pathDev > rules.templMax) { p.flags.push('tech'); if (p.quality === 'good') p.quality = 'warn'; }
        if (tr.dxMax !== null && tr.dxMax !== undefined && rules && rules.dxMax && Math.abs(tr.dxMax) > rules.dxMax) { p.flags.push('dx'); if (p.quality === 'good') p.quality = 'warn'; }
        if (tr.tilt !== null && tr.tilt !== undefined && tr.tilt > TILT_WARN_DEG) { p.flags.push('tilt'); if (p.quality === 'good') p.quality = 'warn'; }
      });

      const valid = perRep.filter((p) => !p.suspect);
      const lastValid = valid[valid.length - 1] || null;
      const vlFinal = lastValid && lastValid.vl !== null ? lastValid.vl : null;
      const vlMax = valid.reduce((m, p) => (p.vl !== null && p.vl > m ? p.vl : m), 0);
      const vCutoff = vBest ? vBest * (1 - cutoffPct / 100) : null;
      const rirEnd = lastValid ? lastValid.rir : null;
      const qualityReps = valid.filter((p) => p.quality === 'good').length;
      const firstOver = valid.find((p) => p.vl !== null && p.vl > cutoffPct);
      const stopAfterRep = firstOver ? firstOver.idx : null; // 0-based index of last rep that was still within the cutoff = firstOver.idx - 1
      const junkReps = firstOver ? valid.filter((p) => p.idx >= firstOver.idx).length : 0;
      const effectiveReps = valid.filter((p) => p.rir !== null && p.rir <= 4).length;

      // Projected reps left / reps to cutoff
      let repsToCutoff = null;
      if (lastValid && vCutoff !== null && cost) repsToCutoff = Math.max(0, Math.floor((lastValid.v - vCutoff) / cost + 1e-9));

      // Intensity (%1RM) from personal profile, else population table
      let pct1RM = null, pctSource = null, e1RM = null;
      const prof = opts.profile || null;
      if (vBest && weightKg > 0) {
        if (prof && prof.valid && prof.e1RM > 0) {
          // personal profile: the load the profile predicts for today's vBest gives the
          // day-adjusted relative intensity (faster than usual -> lower %1RM -> higher e1RM)
          const loadAtV = (vBest - prof.intercept) / prof.slope;
          pct1RM = Math.max(30, Math.min(110, loadAtV / prof.e1RM * 100));
          pctSource = 'profile';
          e1RM = weightKg / (pct1RM / 100);
          if (!Number.isFinite(e1RM) || e1RM <= 0) e1RM = prof.e1RM;
        } else if (cfg) {
          // shift table so its 1RM velocity equals this lifter's effective MVT
          const shift = (mvt !== null ? mvt : cfg.mvt) - cfg.mvt;
          pct1RM = pctFromVelocityTable(cfg, vBest - shift);
          pctSource = 'table';
          e1RM = pct1RM ? weightKg / (pct1RM / 100) : null;
        }
      }
      const isWarmup = pct1RM !== null && pct1RM < 65;

      // Epley corrected with reps-in-reserve (reps to failure = reps done + RIR)
      const epleyRir = (weightKg > 0 && valid.length > 0)
        ? weightKg * (1 + (valid.length + (rirEnd || 0)) / 30) : null;

      // --- Rep Quality Index (RQI) = 0.40·S_intensity + 0.40·S_fatigue + 0.20·S_path ---
      const roms = valid.map((p) => Number(reps[p.idx].rangeOfMotionCm) || 0).filter((x) => x > 0);
      let romCv = null;
      if (roms.length >= 2) {
        const m = roms.reduce((a, b) => a + b, 0) / roms.length;
        const sd = Math.sqrt(roms.reduce((a, b) => a + (b - m) ** 2, 0) / (roms.length - 1));
        romCv = m > 0 ? sd / m * 100 : null;
      }
      const [pLo, pHi] = getGoal().pctRange;
      let sInt = null, vWin = null;
      if (cfg && vBest) {
        const mvtShift = (mvt !== null ? mvt : cfg.mvt) - cfg.mvt;
        const vAt = (pc) => (prof && prof.valid) ? prof.intercept + prof.slope * (prof.e1RM * pc / 100) : velocityFromPctTable(cfg, pc) + mvtShift;
        vWin = [vAt(pHi) - 0.03, vAt(pLo) + 0.03];
        const dist = vBest < vWin[0] ? vWin[0] - vBest : (vBest > vWin[1] ? vBest - vWin[1] : 0);
        sInt = Math.max(0, 100 - dist / 0.10 * 100);
      }
      const medRom = vbtMedian(roms);
      perRep.forEach((p) => {
        if (p.suspect) { p.rqi = null; return; }
        let f;
        if (mvt !== null && p.v < mvt) f = 0;
        else if (p.vl === null || p.vl <= cutoffPct) f = 100;
        else if (p.vl <= redVl) f = 100 - 70 * (p.vl - cutoffPct) / Math.max(1, redVl - cutoffPct);
        else f = Math.max(0, 30 - 3 * (p.vl - redVl));
        if (p.flags.includes('stick')) f = Math.min(f, 30);
        p.sFat = f;
        const tr = reps[p.idx].trace;
        const comps = [];
        if (tr) {
          if (p.pathDev !== null) comps.push(p.pathDev <= 1 ? 100 : Math.max(0, 100 - (p.pathDev - 1) / ((rules ? rules.templMax * 2 : 6) - 1) * 100));
          if (tr.dxMax !== null && tr.dxMax !== undefined && rules && rules.dxMax) {
            const ad = Math.abs(tr.dxMax);
            comps.push(ad <= rules.dxMax ? 100 : Math.max(0, 100 - (ad - rules.dxMax) / rules.dxMax * 100));
          }
          if (tr.tilt !== null && tr.tilt !== undefined) comps.push(tr.tilt <= 2 ? 100 : Math.max(0, 100 - (tr.tilt - 2) / (TILT_WARN_DEG * 2 - 2) * 100));
        }
        if (comps.length) { p.sPath = comps.reduce((a, b) => a + b, 0) / comps.length; p.pathSrc = 'trace'; }
        else {
          const rc = [];
          const rom = Number(reps[p.idx].rangeOfMotionCm) || 0;
          if (medRom && rom > 0) { const dev = Math.abs(rom - medRom) / medRom * 100; rc.push(dev <= 10 ? 100 : Math.max(0, 100 - (dev - 10) / 30 * 100)); }
          const lw = reps[p.idx].loweringVelocity;
          if (lw !== null && lw !== undefined) rc.push(isControlled(lw) ? 100 : 40);
          p.sPath = rc.length ? rc.reduce((a, b) => a + b, 0) / rc.length : 70;
          p.pathSrc = 'proxy';
        }
        p.rqi = sInt === null ? (0.667 * f + 0.333 * p.sPath) : (0.4 * sInt + 0.4 * f + 0.2 * p.sPath);
      });
      const rq = valid.filter((p) => p.rqi !== null && p.rqi !== undefined);
      const wInt = sInt === null ? 0 : 40, wFat = sInt === null ? 67 : 40, wPath = sInt === null ? 33 : 20;
      const parts = {
        intensity: sInt === null ? null : sInt * wInt / 100,
        // set level: the most fatigued rep decides (a set taken to failure must not average out to "good")
        fatigue: rq.length ? wFat * Math.min(...rq.map((p) => p.sFat)) / 100 : 0,
        path: rq.length ? wPath * rq.reduce((acc, p) => acc + p.sPath, 0) / rq.length / 100 : 0,
        wInt, wFat, wPath, pathSrc: rq.some((p) => p.pathSrc === 'trace') ? 'trace' : 'proxy'
      };
      const score = rq.length ? Math.round((parts.intensity || 0) + parts.fatigue + parts.path) : 0;
      const stickReps = valid.filter((p) => reps[p.idx].trace && reps[p.idx].trace.stick);
      const stickSummary = stickReps.length ? {
        n: stickReps.length,
        hAvg: stickReps.reduce((acc, p) => acc + reps[p.idx].trace.stick.h, 0) / stickReps.length,
        vminMin: Math.min(...stickReps.map((p) => reps[p.idx].trace.stick.vmin))
      } : null;
      const techFirst = valid.find((p) => p.flags.includes('tech') || p.flags.includes('dx'));
      const tiltReps = valid.filter((p) => p.flags.includes('tilt')).map((p) => p.idx + 1);
      const grade = score >= 85 ? 'Erinomainen' : score >= 70 ? 'Hyvä' : score >= 50 ? 'Kohtalainen' : 'Heikko';
      const gradeClass = score >= 70 ? 'green' : score >= 50 ? 'amber' : 'red';

      return {
        n, cfg, perRep, valid, suspectCount: perRep.filter((p) => p.suspect).length,
        vBest, vBestIdx, vlFinal, vlMax, cutoffPct, redVl, vCutoff, mvt, mvtInfo, cost, costSource,
        rirEnd, qualityReps, stopAfterRep, junkReps, effectiveReps, repsToCutoff, tng,
        pct1RM, pctSource, e1RM, epleyRir, isWarmup, romCv,
        score, scoreParts: parts, grade, gradeClass,
        hasTrace, sInt, vWin, stickSummary, techFirst, tiltReps, rules
      };
    }

    // --- Collect set points for one exercise ---
    function setsForExercise(exercise, dateFilter) {
      const out = [];
      workouts.forEach((w) => {
        if (dateFilter && !dateFilter(w.date)) return;
        (w.sets || []).forEach((s, sIdx) => {
          if (s.exercise !== exercise || !s.reps || !s.reps.length || !(s.weightKg > 0)) return;
          out.push({ date: w.date, set: s, sIdx });
        });
      });
      return out;
    }

    // --- Load–velocity profile (best rep of each load) & VBT e1RM at MVT ---
    function buildLVProfile(points, exercise) {
      const mvtInfo = getEffectiveMvt(exercise);
      const byLoad = new Map();
      points.forEach((p) => {
        const key = Math.round(p.load * 2) / 2;
        if (!byLoad.has(key) || byLoad.get(key).v < p.v) byLoad.set(key, { load: key, v: p.v, date: p.date });
      });
      const pts = [...byLoad.values()].sort((a, b) => a.load - b.load);
      const res = { points: pts, allPoints: points, valid: false, mvt: mvtInfo ? mvtInfo.value : null, mvtInfo };
      if (pts.length < 2) { res.reason = 'Tarvitaan vähintään 2 eri kuormaa (mieluiten 3–4, n. 40–90 % 1RM).'; return res; }
      const span = pts[pts.length - 1].load - pts[0].load;
      const reg = vbtLinReg(pts.map((p) => p.load), pts.map((p) => p.v));
      if (!reg) { res.reason = 'Regressiota ei voitu laskea.'; return res; }
      Object.assign(res, reg);
      if (reg.slope >= 0) { res.reason = 'Nopeus ei laske kuorman kasvaessa – tarkista data.'; return res; }
      if (res.mvt === null) { res.reason = 'Liikkeelle ei ole MVT-arvoa (vain kyykky, penkki ja maastaveto).'; return res; }
      res.e1RM = (res.mvt - reg.intercept) / reg.slope;
      res.v0 = reg.intercept;
      res.l0 = -reg.intercept / reg.slope;
      res.spanKg = span;
      res.valid = Number.isFinite(res.e1RM) && res.e1RM > pts[pts.length - 1].load * 0.9;
      res.reliability = reg.r2 >= 0.95 && pts.length >= 3 ? 'Hyvä' : (reg.r2 >= 0.85 ? 'Kohtalainen' : 'Heikko');
      if (!res.valid) res.reason = 'Profiili ei ole uskottava (e1RM alle raskaimman kuorman).';
      return res;
    }
    function sessionProfile(exercise, dateStr) {
      const sets = setsForExercise(exercise, (d) => d === dateStr);
      const pts = sets.map(({ date, set }) => {
        const a = analyzeSet(set.reps, set.exercise, set.weightKg);
        return { load: set.weightKg, v: a.vBest, date };
      }).filter((p) => p.v > 0);
      return buildLVProfile(pts, exercise);
    }
    // Latest valid personal profile on/before a date (single session, else pooled 28 d)
    function recentProfile(exercise, onOrBeforeDate) {
      if (!exercise || !getLiftCfg(exercise)) return null;
      const dates = [...new Set(setsForExercise(exercise, (d) => d <= onOrBeforeDate).map((x) => x.date))].sort().reverse();
      for (const d of dates.slice(0, 6)) {
        const p = sessionProfile(exercise, d);
        if (p.valid && p.r2 >= 0.8) { p.date = d; p.method = 'session'; return p; }
      }
      const from = new Date(onOrBeforeDate); from.setDate(from.getDate() - 28);
      const fromIso = from.toISOString().slice(0, 10);
      const sets = setsForExercise(exercise, (d) => d <= onOrBeforeDate && d >= fromIso);
      const pts = sets.map(({ date, set }) => ({ load: set.weightKg, v: analyzeSet(set.reps, set.exercise, set.weightKg).vBest, date })).filter((p) => p.v > 0);
      const p = buildLVProfile(pts, exercise);
      if (p.valid && p.r2 >= 0.7) { p.date = dates[0]; p.method = 'pooled28'; return p; }
      return null;
    }

    // --- e1RM trend: session profile if possible, else best single-set estimate (work sets) ---
    function e1rmTrend(exercise) {
      const dates = [...new Set(setsForExercise(exercise).map((x) => x.date))].sort();
      return dates.map((d) => {
        const p = sessionProfile(exercise, d);
        if (p.valid && p.r2 >= 0.8) return { date: d, e1RM: p.e1RM, method: 'profiili' };
        let best = null;
        setsForExercise(exercise, (x) => x === d).forEach(({ set }) => {
          const a = analyzeSet(set.reps, set.exercise, set.weightKg);
          if (a.e1RM && !a.isWarmup && (best === null || a.e1RM > best)) best = a.e1RM;
        });
        return best ? { date: d, e1RM: best, method: 'yksittäinen sarja' } : null;
      }).filter(Boolean);
    }

    // --- Day readiness: same absolute load vs. previous sessions (90 d) ---
    function readinessForDate(exercise, dateStr) {
      const today = setsForExercise(exercise, (d) => d === dateStr);
      if (!today.length) return null;
      const from = new Date(dateStr); from.setDate(from.getDate() - 90);
      const fromIso = from.toISOString().slice(0, 10);
      const prev = setsForExercise(exercise, (d) => d < dateStr && d >= fromIso);
      let best = null;
      today.forEach(({ set }) => {
        const vT = analyzeSet(set.reps, set.exercise, set.weightKg).vBest;
        const same = prev.filter((p) => Math.abs(p.set.weightKg - set.weightKg) < 0.6)
          .map((p) => analyzeSet(p.set.reps, p.set.exercise, p.set.weightKg).vBest).filter((v) => v > 0);
        if (!same.length || !vT) return;
        const base = same.reduce((a, b) => a + b, 0) / same.length;
        const cand = { weight: set.weightKg, today: vT, baseline: base, deltaPct: (vT - base) / base * 100, nPrev: same.length };
        if (!best || cand.weight > best.weight) best = cand;
      });
      return best;
    }

    // --- Verdict text ---
    function buildVerdict(a, exercise) {
      if (!a || a.n === 0) return '';
      const g = getGoal();
      const parts = [];
      if (a.suspectCount) parts.push(`${a.suspectCount} epäilyttävä(ä) liike(ttä) (telineestä otto / vajaa liikerata) jätettiin laskennan ulkopuolelle.`);
      if (a.tng) parts.push('Touch-and-go tunnistettu (tauko < 0,8 s): 1. toistoa ei verrata muihin.');
      if (a.isWarmup) {
        parts.push(`Arvioitu kuorma ~${Math.round(a.pct1RM)} % 1RM → lämmittely-/tekniikkasarja, ei laatuluokitusta maksimivoimalle.`);
        return parts.join(' ');
      }
      if (a.n >= 2 && a.vlFinal !== null) {
        if (a.stopAfterRep !== null) {
          const keep = a.stopAfterRep; // reps within cutoff = idx of first over
          parts.push(`${g.short}: VL-raja ${a.cutoffPct} % ylittyi toistolla ${a.stopAfterRep + 1} → sarja olisi kannattanut katkaista toiston ${keep} jälkeen. ${a.junkReps} toisto(a) kerrytti lähinnä väsymystä.`);
        } else {
          parts.push(`${g.short}: nopeuden lasku ${a.vlFinal.toFixed(0)} % pysyi rajan ${a.cutoffPct} % sisällä – jokainen toisto tehtiin hyvällä hermostollisella laadulla.`);
        }
      }
      if (a.rirEnd !== null && a.mvt !== null) {
        if (a.rirEnd === 0) parts.push(`Viimeinen toisto oli lähellä failure-rajaa (MVT ${fmtV(a.mvt)} m/s) – RIR ~0.`);
        else parts.push(`Varastoon jäi arviolta ~${a.rirEnd} toisto${a.rirEnd === 1 ? '' : 'a'} ennen MVT-rajaa.`);
        if (a.stopAfterRep === null && a.repsToCutoff !== null && a.repsToCutoff >= 2 && a.pct1RM !== null && a.pct1RM >= g.pctRange[0]) {
          parts.push(`VL-rajaan olisi ollut vielä ~${a.repsToCutoff} toistoa → voit lisätä toiston tai kuormaa.`);
        }
      }
      if (a.pct1RM !== null) {
        const [lo, hi] = g.pctRange;
        if (a.pct1RM < lo - 2) parts.push(`Kuorma ~${Math.round(a.pct1RM)} % 1RM on tavoitteen (${lo}–${hi} %) alapuolella.`);
        else if (a.pct1RM > hi + 2) parts.push(`Kuorma ~${Math.round(a.pct1RM)} % 1RM on tavoitteen (${lo}–${hi} %) yläpuolella.`);
      }
      if (a.techFirst) parts.push(`Toistolla ${a.techFirst.idx + 1} tankoreitti poikkesi parhaasta toistosta (${a.techFirst.pathDev !== null ? a.techFirst.pathDev.toFixed(1) + ' cm' : 'raja ylittyi'}) → tekninen uupumus${a.rules ? ' (' + a.rules.label + ')' : ''}, vaikka nopeutta olisi vielä ollut jäljellä.`);
      if (a.tiltReps && a.tiltReps.length) parts.push(`Epäsymmetriavaroitus: tanko kallistui yli ${TILT_WARN_DEG}° toistoilla ${a.tiltReps.join(', ')}.`);
      if (a.stickSummary) parts.push(`Kuolokohta keskimäärin ${a.stickSummary.hAvg.toFixed(0)} cm pohjasta, hitaimmillaan ${fmtV(a.stickSummary.vminMin)} m/s${a.stickSummary.vminMin < 0.10 ? ' – erittäin lähellä epäonnistumista' : ''}.`);
      if (a.romCv !== null && a.romCv > 20 && !a.hasTrace) parts.push(`Liikelaajuus vaihteli paljon (CV ${a.romCv.toFixed(0)} %) – tarkista tekniikka tai anturin kiinnitys.`);
      return parts.join(' ');
    }

    // --- SVG: rep velocity curve with V_cutoff and MVT lines (+ projection) ---
    const Q_COLORS = { good: '#22c55e', warn: '#f59e0b', bad: '#ef4444', suspect: '#64748b' };
    function buildRepCurveSVG(a, opts = {}) {
      if (!a || a.n === 0) return '';
      const W = 340, H = opts.height || 190, padL = 34, padR = 10, padT = 18, padB = 22;
      const proj = [];
      const last = a.valid[a.valid.length - 1];
      if (opts.projection !== false && last && a.mvt !== null && a.cost && !a.isWarmup) {
        let v = last.v, i = last.idx;
        for (let k = 0; k < 8 && v - a.cost >= a.mvt - a.cost * 0.999; k++) {
          v -= a.cost; i += 1; if (v < a.mvt) break; proj.push({ idx: i, v });
        }
      }
      const nSlots = Math.max(a.n + proj.length, 3);
      const vMax = Math.max(0.6, ...a.perRep.map((p) => p.v), a.vBest || 0) * 1.12;
      const yMax = Math.ceil(vMax * 10) / 10;
      const x = (i) => padL + (nSlots === 1 ? 0.5 : i / (nSlots - 1)) * (W - padL - padR);
      const y = (v) => padT + (1 - Math.max(0, Math.min(yMax, v)) / yMax) * (H - padT - padB);
      let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block; max-height:${H + 20}px;" role="img" aria-label="Toistokohtainen nopeuskäyrä">`;
      const gStep = yMax <= 0.8 ? 0.2 : (yMax > 1.2 ? 0.5 : 0.25);
      for (let g = 0; g <= yMax + 1e-9; g += gStep) {
        s += `<line x1="${padL}" x2="${W - padR}" y1="${y(g)}" y2="${y(g)}" stroke="rgba(148,163,184,0.15)"/>`;
        s += `<text x="${padL - 4}" y="${y(g) + 3}" fill="#94a3b8" font-size="9" text-anchor="end">${g.toFixed(2)}</text>`;
      }
      if (a.vCutoff && !a.isWarmup) {
        s += `<line x1="${padL}" x2="${W - padR}" y1="${y(a.vCutoff)}" y2="${y(a.vCutoff)}" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="6 4"/>`;
        s += `<text x="${W - padR}" y="${y(a.vCutoff) - 3}" fill="#f59e0b" font-size="9" text-anchor="end">VL ${a.cutoffPct} % · ${fmtV(a.vCutoff)}</text>`;
      }
      if (a.mvt !== null) {
        s += `<line x1="${padL}" x2="${W - padR}" y1="${y(a.mvt)}" y2="${y(a.mvt)}" stroke="#ec4899" stroke-width="1.4" stroke-dasharray="2 3"/>`;
        s += `<text x="${W - padR}" y="${y(a.mvt) + 11}" fill="#ec4899" font-size="9" text-anchor="end">MVT ${fmtV(a.mvt)}</text>`;
      }
      if (proj.length && last) {
        const pts = [[x(last.idx), y(last.v)], ...proj.map((p) => [x(p.idx), y(p.v)])];
        s += `<polyline points="${pts.map((p) => p.join(',')).join(' ')}" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>`;
        proj.forEach((p) => { s += `<circle cx="${x(p.idx)}" cy="${y(p.v)}" r="3" fill="none" stroke="#64748b"/>`; });
      }
      const line = a.perRep.filter((p) => !p.suspect).map((p) => `${x(p.idx)},${y(p.v)}`).join(' ');
      if (line) s += `<polyline points="${line}" fill="none" stroke="#3b82f6" stroke-width="2"/>`;
      a.perRep.forEach((p) => {
        const c = Q_COLORS[p.quality] || '#3b82f6';
        s += `<circle cx="${x(p.idx)}" cy="${y(p.v)}" r="5" fill="#0f172a" stroke="${c}" stroke-width="2.4"/>`;
        s += `<text x="${x(p.idx)}" y="${y(p.v) - 8}" fill="#e2e8f0" font-size="9" text-anchor="middle">${p.v.toFixed(2)}</text>`;
      });
      for (let i = 0; i < nSlots; i++) {
        const isProj = i >= a.n;
        s += `<text x="${x(i)}" y="${H - 6}" fill="${isProj ? '#475569' : '#94a3b8'}" font-size="9" text-anchor="middle">T${i + 1}</text>`;
      }
      s += `</svg>`;
      return s;
    }

    function buildVbtKpiHTML(a, live) {
      if (!a || a.n === 0) return '';
      const mvtSrc = a.mvtInfo ? a.mvtInfo.label : '';
      const vlNow = a.valid.length ? a.valid[a.valid.length - 1].vl : null;
      const vlCls = (vlNow === null || a.isWarmup) ? '' : (vlNow > a.redVl ? 'red' : (vlNow > a.cutoffPct ? 'amber' : 'green'));
      const rirTxt = a.rirEnd === null ? '--' : (a.rirEnd >= 10 ? '10+' : `~${a.rirEnd}`);
      const rirCls = (a.rirEnd === null || a.isWarmup) ? '' : (a.rirEnd <= 0 ? 'red' : (a.rirEnd <= 1 ? 'amber' : 'green'));
      const scoreTxt = a.isWarmup ? 'LÄ' : a.score;
      const scoreSub = a.isWarmup ? 'lämmittely' : a.grade;
      return `
        <div class="vbt-kpi-grid">
          <div class="vbt-kpi"><span class="vbt-kpi-l">V<sub>best</sub> (${metricLabel()})</span><span class="vbt-kpi-v">${fmtV(a.vBest)}</span><span class="vbt-kpi-s">${a.pct1RM !== null ? `~${Math.round(a.pct1RM)} % 1RM` : (a.vBestIdx >= 0 ? `toisto ${a.vBestIdx + 1}` : '')}</span></div>
          <div class="vbt-kpi"><span class="vbt-kpi-l">VL ${live ? 'nyt' : 'lopussa'}</span><span class="vbt-kpi-v ${vlCls}">${vlNow === null ? '--' : vlNow.toFixed(0) + ' %'}</span><span class="vbt-kpi-s">raja ${a.cutoffPct} % · ${fmtV(a.vCutoff)} m/s</span></div>
          <div class="vbt-kpi"><span class="vbt-kpi-l">RIR-arvio</span><span class="vbt-kpi-v ${rirCls}">${rirTxt}</span><span class="vbt-kpi-s">MVT ${fmtV(a.mvt)} (${mvtSrc})</span></div>
          <div class="vbt-kpi"><span class="vbt-kpi-l">${live ? 'Laadukkaat' : 'RQI (0–100)'}</span><span class="vbt-kpi-v ${live || a.isWarmup ? '' : a.gradeClass}">${live ? `${a.qualityReps}/${a.valid.length}` : scoreTxt}</span><span class="vbt-kpi-s">${live ? (a.isWarmup ? 'lämmittely' : (a.repsToCutoff !== null && a.stopAfterRep === null ? `~${a.repsToCutoff} toistoa rajaan` : (a.stopAfterRep !== null ? 'raja ylitetty' : ''))) : scoreSub}</span></div>
        </div>`;
    }

    function buildVbtLegendHTML() {
      return `<div class="vbt-legend" style="display:flex; gap:10px; flex-wrap:wrap; font-size:11px; color:var(--muted);">
        <span><span class="q-dot" style="border-color:${Q_COLORS.good}"></span>Laadukas</span>
        <span><span class="q-dot" style="border-color:${Q_COLORS.warn}"></span>Yli VL-rajan / RIR&lt;1</span>
        <span><span class="q-dot" style="border-color:${Q_COLORS.bad}"></span>Liian väsynyt / alle MVT</span>
        <span><span class="q-dot" style="border-color:${Q_COLORS.suspect}"></span>Epäilyttävä</span>
        <span style="color:#94a3b8;">┈ ennuste</span>
      </div>`;
    }

    function buildScoreBreakdownHTML(a) {
      const p = a.scoreParts;
      const row = (label, val, max) => `
        <div class="score-row"><span>${label}</span>
          <div class="score-track"><div class="score-fill" style="width:${max ? Math.round(val / max * 100) : 0}%"></div></div>
          <strong>${val.toFixed(0)}/${max}</strong></div>`;
      return `<div class="score-break">
        <div style="font-size:11px; color:var(--muted); font-weight:700;">RQI = 0.40·intensiteetti + 0.40·väsymys + 0.20·tankoreitti</div>
        ${p.intensity !== null ? row(`Intensiteetti (V<sub>best</sub> ${a.vWin ? fmtV(a.vWin[0]) + '–' + fmtV(a.vWin[1]) : ''} m/s)`, p.intensity, p.wInt) : ''}
        ${row('Väsymyksen hallinta (VL, kuolokohta)', p.fatigue, p.wFat)}
        ${row(p.pathSrc === 'trace' ? 'Tankoreitti & kallistus (Pin 80 Hz)' : 'Tekniikka (arvio: ROM + lasku)', p.path, p.wPath)}
      </div>`;
    }

    // Full VBT block used in saved-set analysis
    function buildVbtSetBlockHTML(s, dateStr) {
      const prof = getLiftCfg(s.exercise) ? recentProfile(s.exercise, dateStr || todayISO()) : null;
      const a = analyzeSet(s.reps, s.exercise, s.weightKg, { profile: prof });
      if (!a.n) return '';
      const e1 = a.e1RM ? `${a.e1RM.toFixed(1)} kg <span style="color:var(--muted); font-weight:500; font-size:11px;">(${a.pctSource === 'profile' ? 'oma profiili' : 'nopeustaulukko'})</span>` : '--';
      return `
        <div class="analysis-card">
          <div class="row" style="align-items:flex-start;">
            <span style="font-size:11px; text-transform:uppercase; font-weight:700; color:var(--muted); letter-spacing:0.04em;">VBT-laatuanalyysi · ${getGoal().short} · ${metricLabel()}</span>
            <span class="vbt-zone-badge" style="font-size:11px; padding:2px 8px;">${a.isWarmup ? 'Lämmittely' : 'Työsarja'}${a.tng ? ' · TnG' : ''}</span>
          </div>
          ${buildVbtKpiHTML(a, false)}
          ${buildRepCurveSVG(a)}
          ${buildVbtLegendHTML()}
          <p class="vbt-verdict">${buildVerdict(a, s.exercise)}</p>
          ${buildScoreBreakdownHTML(a)}
          ${buildTraceSectionHTML(s, a)}
          <div class="stat-pill-grid" style="margin-top:8px;">
            <div class="stat-pill"><span class="stat-pill-label">e1RM (VBT)</span><span class="stat-pill-val" style="color:#60a5fa; font-size:13px;">${e1}</span></div>
            <div class="stat-pill"><span class="stat-pill-label">e1RM (Epley + RIR)</span><span class="stat-pill-val" style="font-size:13px;">${a.epleyRir ? a.epleyRir.toFixed(1) + ' kg' : '--'}</span></div>
            <div class="stat-pill"><span class="stat-pill-label">Nopeuskustannus / toisto</span><span class="stat-pill-val" style="font-size:13px;">${a.cost ? '−' + a.cost.toFixed(3) + ' m/s' : '--'}</span></div>
            <div class="stat-pill"><span class="stat-pill-label">Efektiiviset toistot (RIR ≤ 4)</span><span class="stat-pill-val" style="font-size:13px;">${a.mvt !== null ? a.effectiveReps : '--'}</span></div>
          </div>
        </div>`;
    }

    // --- Live VBT card ---
    function renderVbtLiveCard() {
      const el = document.getElementById('vbtLiveCard');
      if (!el) return;
      const exercise = (activeSetMeta && activeSetMeta.exercise) || getCurrentSelectedExerciseName();
      const weightKg = (activeSetMeta && activeSetMeta.weightKg) || parseFloat(document.getElementById('weightInput').value) || 0;
      if (!currentReps.length || isFreeMode()) { el.classList.add('hidden'); el.innerHTML = ''; return; }
      const prof = getLiftCfg(exercise) ? recentProfile(exercise, document.getElementById('workoutDate').value || todayISO()) : null;
      const a = analyzeSet(currentReps, exercise, weightKg, { profile: prof });
      el.classList.remove('hidden');
      let alert = '';
      const lastP = a.valid[a.valid.length - 1];
      if (!a.isWarmup && lastP) {
        if (a.mvt !== null && lastP.rir === 0) {
          alert = `<div class="vbt-alert red">⛔ Lähellä failurea (RIR ~0, ${fmtV(lastP.v)} m/s vs. MVT ${fmtV(a.mvt)}) – lopeta sarja.</div>`;
        } else if (lastP.vl !== null && lastP.vl > a.cutoffPct) {
          alert = `<div class="vbt-alert amber">🛑 VL ${lastP.vl.toFixed(0)} % > raja ${a.cutoffPct} % – katkaise sarja, laatu heikkenee.</div>`;
        }
      }
      el.innerHTML = `
        ${alert}
        ${lastTraceStatus ? `<div style="font-size:11px; color:var(--muted); margin-top:4px;">${lastTraceStatus}</div>` : ''}
        ${buildVbtKpiHTML(a, true)}
        ${buildRepCurveSVG(a, { height: 170 })}
        ${buildVbtLegendHTML()}
        <p class="vbt-verdict">${buildVerdict(a, exercise)}</p>`;
      return a;
    }

    // Called right after a new rep was pushed during an active set. Returns true if the set was auto-stopped.
    function vbtOnNewRep() {
      const exercise = (activeSetMeta && activeSetMeta.exercise) || getCurrentSelectedExerciseName();
      const weightKg = (activeSetMeta && activeSetMeta.weightKg) || 0;
      const a = analyzeSet(currentReps, exercise, weightKg);
      const lastP = a.valid[a.valid.length - 1];
      if (!lastP || a.isWarmup) return false;
      const overCutoff = lastP.vl !== null && lastP.vl > a.cutoffPct;
      const nearFailure = a.mvt !== null && lastP.rir === 0;
      if ((overCutoff && !vbtCutoffAlerted) || (nearFailure && !vbtFailureAlerted)) {
        if (overCutoff) vbtCutoffAlerted = true;
        if (nearFailure) vbtFailureAlerted = true;
        if (vbtSettings.cutoffSound) soundCutoff();
        if (vbtSettings.autoStopOnCutoff) { stopSetOnPin(true); return true; }
      }
      return false;
    }

    function soundCutoff() {
      playCue([
        { freq: 988, durationMs: 120, delayMs: 0, type: 'square', gain: 0.32 },
        { freq: 740, durationMs: 120, delayMs: 140, type: 'square', gain: 0.32 },
        { freq: 494, durationMs: 260, delayMs: 280, type: 'square', gain: 0.36 }
      ]);
    }

    // --- Setup card forecast for the chosen weight ---
    function renderSetupVbtForecast() {
      const el = document.getElementById('setupVbtForecast');
      const goalSel = document.getElementById('goalSelect');
      const cycInfo = document.getElementById('setupCycleInfo');
      const cycKey = cycleGoalKey();
      if (goalSel) {
        const want = cycKey || vbtSettings.goal;
        if (goalSel.value !== want) goalSel.value = want;
        goalSel.disabled = !!cycKey;
        goalSel.title = cycKey ? 'Jaksosuunnittelija ohjaa tavoitetta (Analyysi → Jaksosuunnittelija)' : '';
      }
      if (cycInfo) {
        const t = cycleBadgeText();
        cycInfo.textContent = t;
        cycInfo.style.display = t ? '' : 'none';
      }
      const cutEl = document.getElementById('setupCutoffInfo');
      const exercise = getCurrentSelectedExerciseName();
      if (cutEl) {
        const mvtInfo = getEffectiveMvt(exercise);
        cutEl.textContent = `VL-raja ${getCutoffPct(exercise)} %` + (mvtInfo ? ` · MVT ${fmtV(mvtInfo.value)} m/s` : '');
      }
      if (!el) return;
      const cfg = getLiftCfg(exercise);
      const w = parseFloat(document.getElementById('weightInput').value) || 0;
      if (!cfg) { el.innerHTML = '<span style="color:var(--muted)">VBT-ennuste vain kyykylle, penkille ja maastavedolle</span>'; return; }
      const prof = recentProfile(exercise, document.getElementById('workoutDate').value || todayISO());
      if (prof && w > 0) {
        const pct = w / prof.e1RM * 100;
        const vExp = prof.intercept + prof.slope * w;
        const [lo, hi] = getGoal().pctRange;
        const wLo = prof.e1RM * lo / 100, wHi = prof.e1RM * hi / 100;
        el.innerHTML = `~${Math.round(pct)} % 1RM · odotettu V<sub>best</sub> <strong>${fmtV(vExp)}</strong> m/s (±0.03)<br>
          <span style="color:var(--muted)">e1RM ${prof.e1RM.toFixed(0)} kg (${prof.method === 'session' ? 'profiili ' + fmtDateFi(prof.date) : '28 pv profiili'}) · tavoitealue ${Math.round(wLo)}–${Math.round(wHi)} kg</span>`;
      } else {
        const [lo, hi] = getGoal().pctRange;
        const mvt = getEffectiveMvt(exercise).value;
        const shift = mvt - cfg.mvt;
        el.innerHTML = `Tavoite ${lo}–${hi} % 1RM ≈ V<sub>best</sub> <strong>${fmtV(velocityFromPctTable(cfg, hi) + shift)}–${fmtV(velocityFromPctTable(cfg, lo) + shift)}</strong> m/s<br>
          <span style="color:var(--muted)">Oma profiili puuttuu: tee 3–4 nousevaa kuormaa samana päivänä</span>`;
      }
    }

    // ===================== ANALYYSI-VÄLILEHTI =====================
    let anaExercise = null;
    let anaDate = null;

    function exercisesWithData() {
      const set = new Set();
      workouts.forEach((w) => (w.sets || []).forEach((s) => { if (s.reps && s.reps.length) set.add(s.exercise); }));
      const arr = [...set];
      arr.sort((a, b) => (getLiftCfg(b) ? 1 : 0) - (getLiftCfg(a) ? 1 : 0) || a.localeCompare(b));
      return arr;
    }

    function buildLVProfileSVG(prof) {
      const W = 340, H = 210, padL = 36, padR = 12, padT = 14, padB = 26;
      const pts = prof.allPoints && prof.allPoints.length ? prof.allPoints : prof.points;
      const loads = pts.map((p) => p.load);
      const xMaxData = Math.max(...loads, prof.valid ? prof.e1RM : 0);
      const xMin = Math.max(0, Math.floor((Math.min(...loads) * 0.85) / 10) * 10);
      const xMax = Math.ceil((xMaxData * 1.05) / 10) * 10;
      const yMax = Math.ceil(Math.max(0.6, ...pts.map((p) => p.v), prof.valid ? prof.intercept + prof.slope * xMin : 0) * 1.1 * 10) / 10;
      const x = (l) => padL + (l - xMin) / Math.max(1, xMax - xMin) * (W - padL - padR);
      const y = (v) => padT + (1 - Math.max(0, Math.min(yMax, v)) / yMax) * (H - padT - padB);
      let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;" role="img" aria-label="Kuorma–nopeusprofiili">`;
      const yStep = yMax > 1.2 ? 0.5 : 0.25;
      for (let g = 0; g <= yMax + 1e-9; g += yStep) {
        s += `<line x1="${padL}" x2="${W - padR}" y1="${y(g)}" y2="${y(g)}" stroke="rgba(148,163,184,0.15)"/>`;
        s += `<text x="${padL - 4}" y="${y(g) + 3}" fill="#94a3b8" font-size="9" text-anchor="end">${g.toFixed(2)}</text>`;
      }
      const xStep = (xMax - xMin) > 120 ? 40 : 20;
      for (let l = Math.ceil(xMin / xStep) * xStep; l <= xMax; l += xStep) {
        s += `<text x="${x(l)}" y="${H - 8}" fill="#94a3b8" font-size="9" text-anchor="middle">${l}</text>`;
      }
      s += `<text x="${W - padR}" y="${H - 8}" fill="#64748b" font-size="9" text-anchor="end">kg</text>`;
      if (prof.mvt !== null) {
        s += `<line x1="${padL}" x2="${W - padR}" y1="${y(prof.mvt)}" y2="${y(prof.mvt)}" stroke="#ec4899" stroke-width="1.3" stroke-dasharray="2 3"/>`;
        s += `<text x="${padL + 4}" y="${y(prof.mvt) - 4}" fill="#ec4899" font-size="9">MVT ${fmtV(prof.mvt)}</text>`;
      }
      if (prof.slope !== undefined && prof.slope < 0) {
        const xEnd = prof.valid ? prof.e1RM : xMax;
        s += `<line x1="${x(xMin)}" y1="${y(prof.intercept + prof.slope * xMin)}" x2="${x(xEnd)}" y2="${y(prof.intercept + prof.slope * xEnd)}" stroke="#3b82f6" stroke-width="2"/>`;
      }
      pts.forEach((p) => {
        const top = prof.points.find((q) => Math.abs(q.load - p.load) < 0.3 && Math.abs(q.v - p.v) < 1e-6);
        s += `<circle cx="${x(p.load)}" cy="${y(p.v)}" r="${top ? 5 : 3.5}" fill="${top ? '#0f172a' : 'rgba(148,163,184,0.35)'}" stroke="${top ? '#60a5fa' : 'none'}" stroke-width="2.2"/>`;
        if (top) s += `<text x="${x(p.load)}" y="${y(p.v) - 8}" fill="#e2e8f0" font-size="9" text-anchor="middle">${p.v.toFixed(2)}</text>`;
      });
      if (prof.valid) {
        s += `<circle cx="${x(prof.e1RM)}" cy="${y(prof.mvt)}" r="6" fill="#ec4899"/>`;
        s += `<text x="${x(prof.e1RM)}" y="${y(prof.mvt) + 16}" fill="#f9a8d4" font-size="10" font-weight="700" text-anchor="end">e1RM ${prof.e1RM.toFixed(0)} kg</text>`;
      }
      s += '</svg>';
      return s;
    }

    function buildTrendSVG(points) {
      const W = 340, H = 150, padL = 36, padR = 12, padT = 14, padB = 24;
      const vals = points.map((p) => p.e1RM);
      let yMin = Math.floor(Math.min(...vals) * 0.95 / 5) * 5;
      let yMax = Math.ceil(Math.max(...vals) * 1.05 / 5) * 5;
      if (yMax - yMin < 30) { const mid = (yMax + yMin) / 2; yMin = Math.floor((mid - 15) / 5) * 5; yMax = yMin + 30; }
      const x = (i) => padL + (points.length === 1 ? 0.5 : i / (points.length - 1)) * (W - padL - padR);
      const y = (v) => padT + (1 - (v - yMin) / Math.max(1, yMax - yMin)) * (H - padT - padB);
      let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;" role="img" aria-label="e1RM-trendi">`;
      [yMin, (yMin + yMax) / 2, yMax].forEach((g) => {

      });
      s += '</svg>';
      return s;
    }

          ${(() => { const st = work.map((x) => x.a.stickSummary).filter(Boolean); if (!st.length) return ''; const h = st.reduce((acc, x) => acc + x.hAvg, 0) / st.length; const vm = Math.min(...st.map((x) => x.vminMin)); return `<div class="stat-pill"><span class="stat-pill-label">Kuolokohta (työsarjat)</span><span class="stat-pill-val" style="font-size:13px;">${h.toFixed(0)} cm · V<sub>min</sub> <span class="${vm < 0.10 ? 'red' : ''}">${fmtV(vm)}</span></span></div>`; })()}

            <tbody>${rows}</tbody>

        </div>
        <div style="font-size:11px; color:var(--muted); margin-top:6px; line-height:1.4;">LÄ = lämmittely (&lt; 65 % 1RM, ei laatuluokitusta). Suluissa VL-rajan jälkeen tehdyt toistot. Efektiiviset toistot = toistot, joissa RIR ≤ 4.</div>`;

      // Daily plan (Prilepin + VBT)
      const planEl = document.getElementById('anaPlanCard');
      if (planEl) {
        const plan = cfg ? computeDailyPlan(anaExercise, anaDate) : null;

        planEl.innerHTML = plan ? buildDailyPlanHTML(plan) + `
          <details style="margin-top:8px;"><summary style="font-size:12px; color:var(--muted); cursor:pointer;">Prilepinin taulukko</summary>

            <tbody>${PRILEPIN.map((r) => `<tr><td>${r.label}</td><td>${r.repsMin}–${r.repsMax}</td><td>${r.opt}</td><td>${r.rangeLo}–${r.rangeHi}</td></tr>`).join('')}</tbody></table>
            <div style="font-size:11px; color:var(--muted); margin-top:4px; line-height:1.4;">%1RM lasketaan päivän nopeuspohjaisesta e1RM:stä, ei vanhasta testimaksimista. Toistot/sarja rajataan lisäksi VL-katkaisurajalla ja RIR-varmuudella, joten nopeasti väsyvä nostaja saa automaattisesti lyhyempiä sarjoja ja enemmän sarjoja.</div>
          </details>` : '';
      }

      // L–V profile
      if (cfg) {
        const sp = sessionProfile(anaExercise, anaDate);
        const showProf = sp.points.length >= 2 ? sp : (prof || sp);

        profEl.innerHTML = `

            <span style="font-size:11px; color:var(--muted);">${sp.points.length >= 2 ? fmtDateFi(anaDate) : (prof ? (prof.method === 'session' ? fmtDateFi(prof.date) : '28 pv yhdistetty') : fmtDateFi(anaDate))}</span></div>
          ${body}
          <div style="font-size:11px; color:var(--muted); margin-top:6px; line-height:1.4;">Jokaisen kuorman paras toisto (${metricLabel()}) → lineaarinen regressio → kuorma, jolla nopeus = MVT ${fmtV(getEffectiveMvt(anaExercise).value)} m/s (${getEffectiveMvt(anaExercise).label}). Paras tarkkuus: 3–4 kuormaa välillä 40–90 % 1RM, nostettu maksimaalisella tahdolla.</div>`;
        const tr = e1rmTrend(anaExercise);
        trendEl.innerHTML = tr.length
          ? `<div class="row" style="margin-bottom:4px;"><strong style="font-size:14px;">🏆 e1RM-kehitys</strong><span style="font-size:11px; color:var(--muted);">● profiili ○ yksittäinen sarja</span></div>
             ${buildTrendSVG(tr.slice(-12))}
             ${tr.length >= 2 ? `<p class="vbt-verdict">Muutos ensimmäisestä: <strong class="${tr[tr.length - 1].e1RM >= tr[0].e1RM ? 'green' : 'red'}">${(tr[tr.length - 1].e1RM - tr[0].e1RM >= 0 ? '+' : '') + (tr[tr.length - 1].e1RM - tr[0].e1RM).toFixed(1)} kg</strong> (${tr.length} sessiota).</p>` : ''}`
          : '';
      } else {
        profEl.innerHTML = '<div style="font-size:12px; color:var(--muted);">Kuorma–nopeusprofiili, MVT ja e1RM ovat käytössä jalkakyykylle, penkkipunnerrukselle ja maastavedolle.</div>';

      renderCycleCard();

            </select></div>

          <label class="row" style="justify-content:flex-start; gap:8px; font-size:13px;"><input type="checkbox" id="anaAutoStop" ${vbtSettings.autoStopOnCutoff ? 'checked' : ''}> Lopeta sarja automaattisesti VL-rajalla</label>
          <div class="row"><label class="small" for="anaBarAxis">Tangon akseli (Pin)</label>
            <select id="anaBarAxis">
              <option value="auto" ${(vbtSettings.barAxis || 'auto') === 'auto' ? 'selected' : ''}>Automaattinen (painovoimasta)</option>
              <option value="x" ${vbtSettings.barAxis === 'x' ? 'selected' : ''}>Anturin X</option>
              <option value="y" ${vbtSettings.barAxis === 'y' ? 'selected' : ''}>Anturin Y</option>
              <option value="z" ${vbtSettings.barAxis === 'z' ? 'selected' : ''}>Anturin Z</option>

          <div class="row"><span class="small">Raakadata (${recentRawTraces.length} sarjaa muistissa)</span>

        </div>
        <div style="font-size:12px; font-weight:700; margin:10px 0 4px;">Failure-raja (MVT, m/s) ja VL-katkaisurajat</div>
        <div style="overflow-x:auto;"><table class="ana-table">
          <thead><tr><th>Liike</th><th>Oletus</th><th>Opittu</th><th>Oma</th><th>Käyt.</th><th>VL %<br>P/M/V</th></tr></thead>
          <tbody>${liftRows}</tbody></table></div>
        <div style="font-size:11px; color:var(--muted); margin-top:6px; line-height:1.45;">
          <strong>Opittu MVT</strong> = hitain loppuun asti suoritettu toisto (epäilyttävät liikkeet poistettu) – jos se alittaa väestöoletuksen, sitä käytetään automaattisesti. Oma arvo ohittaa molemmat (esim. aidon 1RM-noston nopeus).
          VL-rajat: P = piikkaus, M = kehittävä maksimivoima, V = perusvoima/hypertrofia. <strong>MPV</strong> poistaa jarrutusvaiheen kevyillä kuormilla (&lt; 80 % 1RM); raskailla kuormilla MV ≈ MPV.

      el.querySelector('#anaGoalSelect').addEventListener('change', (e) => { vbtSettings.goal = e.target.value; saveVbtSettings(); onVbtSettingsChanged(); });

    // =====================================================================
    // ===  PÄIVÄN SUOSITUS: viitesarja (~70–80 %) → päivän e1RM →        ===
    // ===  Prilepin-volyymi + progressio + VBT-toistomäärä                ===
    // =====================================================================
    // Prilepinin taulukko (A. S. Prilepin, 1974): toistot/sarja, optimaalinen kokonaistoistomäärä ja vaihteluväli
    const PRILEPIN = [
      { lo: 0,  hi: 70,  label: '55–65 %', repsMin: 3, repsMax: 6, opt: 24, rangeLo: 18, rangeHi: 30 },
      { lo: 70, hi: 80,  label: '70–80 %', repsMin: 3, repsMax: 6, opt: 18, rangeLo: 12, rangeHi: 24 },
      { lo: 80, hi: 90,  label: '80–90 %', repsMin: 2, repsMax: 4, opt: 15, rangeLo: 10, rangeHi: 20 },
      { lo: 90, hi: 999, label: '90+ %',   repsMin: 1, repsMax: 2, opt: 7,  rangeLo: 4,  rangeHi: 10 }
    ];
    const REF_PCT_MIN = 65, REF_PCT_MAX = 88;   // viitesarjaksi kelpaava arvioitu %1RM
    function prilepinRow(pct) { return PRILEPIN.find((r) => pct >= r.lo && pct < r.hi) || PRILEPIN[PRILEPIN.length - 1]; }
    function plateRound(kg) { return Math.round(kg / 2.5) * 2.5; }
    function liftIncrement(cfg) { return cfg.id === 'bench' ? 2.5 : 5; }
    function addDaysIso(iso, d) {
      const t = new Date(iso + 'T12:00:00');
      t.setDate(t.getDate() + d);
      return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
    }

    function computeDailyPlan(exercise, dateStr) {
      const cfg = getLiftCfg(exercise);
      if (!cfg || !exercise) return null;
      const g = getGoal();
      const [pLo, pHi] = g.pctRange;
      const mvt = getEffectiveMvt(exercise).value;
      const cutoff = getCutoffPct(exercise);
      const histProf = recentProfile(exercise, addDaysIso(dateStr, -1)); // vain aiemmat päivät
      const shift = mvt - cfg.mvt;

      // --- historia: e1RM-lähtötaso (42 pv) ja edellinen sessio ---
      const trend = e1rmTrend(exercise).filter((t) => t.date < dateStr && t.date >= addDaysIso(dateStr, -42));
      const baseline = trend.length ? vbtMedian(trend.slice(-3).map((t) => t.e1RM)) : null;
      const prevDates = [...new Set(setsForExercise(exercise, (d) => d < dateStr).map((x) => x.date))].sort().reverse();
      let last = null;
      for (const d of prevDates.slice(0, 8)) {
        const work = setsForExercise(exercise, (x) => x === d)
          .map(({ set }) => ({ set, a: analyzeSet(set.reps, exercise, set.weightKg, { profile: recentProfile(exercise, d) }) }))
          .filter((x) => !x.a.isWarmup && x.a.valid.length > 0 && x.a.pct1RM !== null && x.a.pct1RM >= pLo - 7.5);
        if (work.length) { last = { date: d, work }; break; }
      }
      // tyypillinen nopeuskustannus / toisto omista sarjoista (42 pv)
      const costsObs = setsForExercise(exercise, (d) => d <= dateStr && d >= addDaysIso(dateStr, -42))
        .map(({ set }) => analyzeSet(set.reps, exercise, set.weightKg))
        .filter((a) => a.costSource === 'set' && !a.isWarmup).map((a) => a.cost);

      // --- tämän päivän sarjat & viitesarja ---
      const today = setsForExercise(exercise, (d) => d === dateStr)
        .map(({ set }) => ({ set, a: analyzeSet(set.reps, exercise, set.weightKg, { profile: histProf }) }))
        .filter((x) => x.a.vBest);
      const pointE1rm = (w, v) => {
        if (histProf && histProf.valid && histProf.slope < 0) return w + (mvt - v) / histProf.slope;
        const pct = pctFromVelocityTable(cfg, v - shift);
        return pct ? w / (pct / 100) : null;
      };
      // viitesarjat = 65–82 % sarjat ennen ensimmäistä raskaampaa (työ)sarjaa; työsarjat eivät muuta päivän e1RM:ää
      const refsAll = [];
      for (const x of today) {
        if (x.a.pct1RM === null) continue;
        if (x.a.pct1RM > 82) { if (!refsAll.length && x.a.pct1RM <= REF_PCT_MAX) refsAll.push(x); break; }
        if (x.a.pct1RM >= REF_PCT_MIN) refsAll.push(x);
      }
      const refs = refsAll.sort((x, y) => y.set.weightKg - x.set.weightKg);

      const prevE1rm = (histProf && histProf.valid) ? histProf.e1RM : (trend.length ? trend[trend.length - 1].e1RM : null);
      if (!refs.length) {
        const plan = { stage: 'needRef', exercise, cfg, goal: g, prevE1rm, baseline, last, todayCount: today.length };
        if (prevE1rm) {
          plan.refLoad = plateRound(prevE1rm * 0.75);
          plan.refRange = [plateRound(prevE1rm * 0.70), plateRound(prevE1rm * 0.80)];
        }
        plan.refVel = [velocityFromPctTable(cfg, 80) + shift, velocityFromPctTable(cfg, 70) + shift];
        if (histProf && histProf.valid) plan.refVel = [histProf.intercept + histProf.slope * prevE1rm * 0.80, histProf.intercept + histProf.slope * prevE1rm * 0.70];
        return plan;
      }

      // --- päivän e1RM: raskain viitesarja (+ toiseksi raskain) historiallisella L–V-kulmalla, + päivän profiili ---
      const ests = refs.slice(0, 1).map((x) => pointE1rm(x.set.weightKg, x.a.vBest)).filter((e) => e && Number.isFinite(e));
      let e1RM = ests.reduce((s, e) => s + e, 0) / ests.length;
      let e1Src = histProf && histProf.valid ? 'viitesarja + oma L–V-kulma' : 'viitesarja + väestötaulukko';
      const ref = refs[0];
      // päivän L–V-profiili vain lämmittely- ja viitesarjoista (ei väsyneitä työsarjoja)
      const sp = buildLVProfile(today.slice(0, today.indexOf(ref) + 1).map((x) => ({ load: x.set.weightKg, v: x.a.vBest, date: dateStr })), exercise);
      if (sp.valid && sp.r2 >= 0.9 && sp.points.length >= 3) { e1RM = (e1RM + sp.e1RM) / 2; e1Src += ' + päivän profiili'; }
      const slope = (histProf && histProf.valid && histProf.slope < 0) ? histProf.slope : null;
      const predV = (L) => slope !== null ? ref.a.vBest + slope * (L - ref.set.weightKg) : velocityFromPctTable(cfg, L / e1RM * 100) + shift;

      // --- valmius suhteessa aiempiin treeneihin ---
      const readiness = baseline ? (e1RM - baseline) / baseline * 100 : null;
      let targetPct = (pLo + pHi) / 2;
      let hiPct = pHi;
      const notes = [];
      if (readiness !== null && readiness <= -5) {
        targetPct -= 2.5; hiPct = (pLo + pHi) / 2;
        notes.push(`Päivän e1RM on ${Math.abs(readiness).toFixed(1)} % alle viime treenien tason (${baseline.toFixed(0)} kg) → intensiteetti −2,5 %-yks. ja volyymi Prilepinin alarajalle.`);
      } else if (readiness !== null && readiness >= 3) {
        notes.push(`Päivän e1RM on +${readiness.toFixed(1)} % yli viime treenien tason (${baseline.toFixed(0)} kg) → hyvä päivä, kuormat lasketaan päivän tasosta.`);
      } else if (readiness !== null) {
        notes.push(`Valmius normaali (${readiness >= 0 ? '+' : ''}${readiness.toFixed(1)} % vs. ${baseline.toFixed(0)} kg).`);
      } else {
        notes.push('Ei aiempaa e1RM-tasoa vertailuun (alle 42 pv historiaa) – suositus perustuu pelkkään viitesarjaan.');
      }

      // --- kuorma: progressio edellisestä treenistä, rajattuna päivän tavoitealueeseen ---
      const loLoad = plateRound(e1RM * pLo / 100);
      const hiLoad = plateRound(e1RM * hiPct / 100);
      const autoLoad = plateRound(e1RM * targetPct / 100);
      let load = autoLoad;
      let lastInfo = null;
      if (last) {
        const byLoad = new Map();
        last.work.forEach(({ set, a }) => byLoad.set(set.weightKg, (byLoad.get(set.weightKg) || 0) + a.valid.length));
        const lastLoad = [...byLoad.entries()].sort((x, y) => y[1] - x[1] || y[0] - x[0])[0][0];
        const lastReps = last.work.reduce((s, x) => s + x.a.valid.length, 0);
        const scores = last.work.map((x) => x.a.score);
        const meanScore = scores.reduce((s, x) => s + x, 0) / scores.length;
        const overVl = last.work.filter((x) => x.a.vlFinal !== null && x.a.vlFinal > x.a.cutoffPct + 2).length;
        const tooFatigued = last.work.some((x) => x.a.vlFinal !== null && x.a.vlFinal > x.a.redVl) || meanScore < 50;
        const ok = overVl === 0 && meanScore >= 65;
        const inc = liftIncrement(cfg);
        const progLoad = ok ? lastLoad + inc : (tooFatigued ? lastLoad - inc : lastLoad);
        load = Math.min(hiLoad, Math.max(loLoad, progLoad));
        lastInfo = { date: last.date, load: lastLoad, reps: lastReps, sets: last.work.length, meanScore, ok, tooFatigued, progLoad };
        const why = ok ? `kaikki työsarjat VL-rajan sisällä ja RQI ka. ${meanScore.toFixed(0)} → +${inc} kg`
          : tooFatigued ? `sarjat menivät liian väsyneiksi (RQI ka. ${meanScore.toFixed(0)}) → −${inc} kg`
            : `${overVl} sarjaa ylitti VL-rajan → sama kuorma`;
        let txt = `Edellinen treeni ${fmtDateFi(last.date)}: ${lastInfo.sets} työsarjaa @ ${lastLoad} kg (${lastReps} toistoa): ${why} = ${progLoad} kg.`;
        if (progLoad > hiLoad) txt += ` Rajattu päivän tavoitealueen ylärajaan ${hiLoad} kg (${Math.round(hiPct)} % päivän e1RM:stä).`;
        else if (progLoad < loLoad) txt += ` Nostettu päivän tavoitealueen alarajaan ${loLoad} kg (${pLo} %) – päivän taso on noussut.`;
        notes.push(txt);
      } else {
        notes.push(`Ei aiempaa työsarjadataa → kuorma = ${Math.round(targetPct)} % päivän e1RM:stä.`);
      }
      const pct = load / e1RM * 100;
      const row = prilepinRow(pct);

      // --- volyymi (Prilepin) valmiuden mukaan ---
      const cst = getCycleState(dateStr);
      const wave = cst && !cst.finished && !cst.notStarted ? cst.wave : 'opt';
      let volume = waveVolume(row, wave);
      if (cst && !cst.finished && !cst.notStarted) notes.push(`Jakso: ${cst.phase.label}, viikko ${cst.weekInBlock}/${cst.weeks} → Prilepin-${WAVE_LABELS[wave]} = ${volume} toistoa.`);
      if (readiness !== null && readiness <= -5) volume = Math.min(volume, row.rangeLo);
      else if (readiness !== null && readiness < -2) volume = Math.min(volume, Math.round((row.rangeLo + row.opt) / 2));

      // --- toistot / sarja: Prilepin ∩ VL-raja ∩ RIR-varmuus ---
      const v0 = predV(load);
      // nopeuskustannus/toisto: malli (v0 − MVT) / maksimitoistot (Epley-käänteis) ja omat sarjat
      const maxReps = Math.max(1, 30 * (100 / pct - 1));
      const costModel = Math.max(0.015, (v0 - mvt) / maxReps);
      const costObs = costsObs.length >= 2 ? vbtMedian(costsObs) : null;
      const cost = costObs !== null ? (costModel + costObs) / 2 : costModel;
      const costSrc = costObs !== null ? `malli ${costModel.toFixed(3)} + omat sarjat ${costObs.toFixed(3)} (n=${costsObs.length})` : `malli: (V₀ − MVT) / ~${maxReps.toFixed(1)} maksimitoistoa`;
      const vCut = v0 * (1 - cutoff / 100);
      const repsVL = Math.max(1, Math.floor((v0 - vCut) / cost + 1e-9) + 1);
      const rirMin = g.key === 'peaking' ? 1 : 2;
      const repsRIR = Math.max(1, Math.floor((v0 - mvt) / cost + 1e-9) + 1 - rirMin);
      let reps = Math.min(row.repsMax, repsVL, repsRIR);
      reps = Math.max(1, reps);
      if (reps < row.repsMin) notes.push(`VBT rajoittaa: ennuste ${repsVL} toistoa ennen VL ${cutoff} % -rajaa → ${reps} toistoa/sarja ja enemmän sarjoja (Prilepin ${row.repsMin}–${row.repsMax}).`);
      let sets = Math.max(2, Math.min(10, Math.round(volume / reps)));

      // --- tehty tänään ja sarjojen välinen väsymys ---
      const refIdx = today.indexOf(ref);
      const work = today.filter((x, i) => i > refIdx && x.set.weightKg >= load - 2.5);
      const doneReps = work.reduce((s, x) => s + x.a.valid.length, 0);
      const doneSets = work.length;
      let adjust = null;
      if (work.length) {
        const lastW = work[work.length - 1];
        const vExp = predV(lastW.set.weightKg);
        if (lastW.a.vBest < vExp - 0.06) {
          adjust = { type: 'down', load: plateRound(lastW.set.weightKg * 0.95), text: `Viimeisen työsarjan V<sub>best</sub> ${fmtV(lastW.a.vBest)} on > 0,06 m/s alle odotetun (${fmtV(vExp)}) → sarjojen välinen väsymys. Pudota ${plateRound(lastW.set.weightKg * 0.95)} kg:aan tai lopeta, jos Prilepinin alaraja (${row.rangeLo}) on täynnä.` };
        } else if (lastW.a.vBest > vExp + 0.06 && lastW.set.weightKg + liftIncrement(cfg) <= plateRound(e1RM * pHi / 100)) {
          adjust = { type: 'up', load: lastW.set.weightKg + liftIncrement(cfg), text: `Viimeinen työsarja kulki ${fmtV(lastW.a.vBest)} m/s (odotus ${fmtV(vExp)}) → voit nostaa ${lastW.set.weightKg + liftIncrement(cfg)} kg:aan.` };
        }
        if (lastW.a.vlFinal !== null && lastW.a.vlFinal > cutoff && lastW.a.valid.length < reps) {
          notes.push(`Viimeisessä työsarjassa VL-raja tuli vastaan jo ${lastW.a.stopAfterRep !== null ? lastW.a.stopAfterRep : lastW.a.valid.length} toiston kohdalla → pidä ${Math.max(1, reps - 1)} toistoa/sarja.`);
        }
      }
      const remainingSets = Math.max(0, sets - doneSets);
      const remainingReps = Math.max(0, volume - doneReps);

      return {
        stage: 'plan', exercise, cfg, goal: g, e1RM, e1Src, baseline, readiness, ref, load, pct, row, volume,
        reps, sets, v0, vCut, cutoff, mvt, cost, costSrc, repsVL, repsRIR, notes, lastInfo,
        doneReps, doneSets, remainingSets, remainingReps, adjust, loLoad, hiLoad
      };
    }

    function buildDailyPlanHTML(plan, opts = {}) {
      if (!plan) return '';
      const head = `<div class="row" style="margin-bottom:6px;"><strong style="font-size:14px;">🧠 Päivän suositus · ${plan.exercise}</strong><span style="font-size:11px; color:var(--muted);">${plan.goal.short} · Prilepin + VBT</span></div>`;
      if (plan.stage === 'needRef') {
        const vr = plan.refVel ? `${fmtV(Math.min(...plan.refVel))}–${fmtV(Math.max(...plan.refVel))} m/s` : '';
        return `${head}
          <div class="vbt-verdict" style="margin-top:0;">Tee ensin <strong>viitesarja</strong> nousevan lämmittelyn päätteeksi: ${plan.refLoad ? `<strong>${plan.refLoad} kg × 2</strong> (≈75 %, alue ${plan.refRange[0]}–${plan.refRange[1]} kg)` : '~70–80 % 1RM × 2'} maksimaalisella tahdolla. Tavoitenopeus noin ${vr}.
          Sarjan jälkeen sovellus laskee päivän e1RM:n ja suosittelee työsarjat.</div>
          ${plan.prevE1rm ? `<div style="font-size:11px; color:var(--muted);">Edellinen e1RM ${plan.prevE1rm.toFixed(0)} kg${plan.last ? ` · viimeisin treeni ${fmtDateFi(plan.last.date)}` : ''}${plan.todayCount ? ` · tänään ${plan.todayCount} sarjaa, ei vielä 65–88 % sarjaa` : ''}</div>` : `<div style="font-size:11px; color:var(--muted);">Ei aiempaa dataa: lämmittele nousevasti – ensimmäinen sarja, jonka nopeus osuu yllä olevaan väliin, toimii viitesarjana.</div>`}
          ${opts.withButtons && plan.refLoad ? `<button type="button" class="primary" data-plan-apply="${plan.refLoad}|2" style="margin-top:8px; width:100%;">Käytä: ${plan.refLoad} kg × 2</button>` : ''}`;
      }
      const rd = plan.readiness;
      const rdCls = rd === null ? '' : rd <= -5 ? 'red' : rd < -2 ? 'amber' : rd >= 3 ? 'green' : '';
      const doneFrac = Math.min(1, plan.doneReps / Math.max(1, plan.volume));
      const nextLoad = plan.adjust ? plan.adjust.load : plan.load;
      return `${head}
        <div class="vbt-kpi-grid">
          <div class="vbt-kpi"><span class="vbt-kpi-l">Päivän e1RM</span><span class="vbt-kpi-v">${plan.e1RM.toFixed(0)}</span><span class="vbt-kpi-s ${rdCls}">${rd === null ? 'ei vertailua' : (rd >= 0 ? '+' : '') + rd.toFixed(1) + ' % vs. ' + plan.baseline.toFixed(0)}</span></div>
          <div class="vbt-kpi" style="grid-column: span 2;"><span class="vbt-kpi-l">Työsarjat</span><span class="vbt-kpi-v" style="color:#60a5fa;">${plan.sets} × ${plan.reps} @ ${plan.load} kg</span><span class="vbt-kpi-s">${Math.round(plan.pct)} % päivän e1RM · ${plan.sets * plan.reps} toistoa</span></div>
          <div class="vbt-kpi"><span class="vbt-kpi-l">Nopeusohje</span><span class="vbt-kpi-v" style="font-size:16px;">${fmtV(plan.v0)}</span><span class="vbt-kpi-s">±0.03 · stop ${fmtV(plan.vCut)} (VL ${plan.cutoff} %)</span></div>
        </div>
        <div style="font-size:11px; color:var(--muted); margin:4px 0;">Prilepin ${plan.row.label}: ${plan.row.repsMin}–${plan.row.repsMax} toistoa/sarja, optimi ${plan.row.opt} (${plan.row.rangeLo}–${plan.row.rangeHi}) → tavoite <strong style="color:var(--text);">${plan.volume}</strong> toistoa</div>
        <div class="progress-bar" style="margin:4px 0;"><div class="progress-fill ${doneFrac >= 1 ? 'done' : ''}" style="width:${Math.round(doneFrac * 100)}%"></div></div>
        <div style="font-size:12px; margin-bottom:4px;">Tehty: <strong>${plan.doneSets}</strong> sarjaa / <strong>${plan.doneReps}</strong> toistoa ≥ ${plan.load - 2.5} kg${plan.remainingReps > 0 ? ` · jäljellä ~${plan.remainingSets} × ${plan.reps}` : ' · <span class="green">volyymi täynnä ✓</span>'}</div>
        ${plan.adjust ? `<div class="vbt-alert ${plan.adjust.type === 'down' ? 'amber' : ''}" style="${plan.adjust.type === 'up' ? 'background:rgba(34,197,94,0.14); border:1px solid rgba(34,197,94,0.5); color:#86efac;' : ''}">${plan.adjust.text}</div>` : ''}
        <ul style="font-size:12px; line-height:1.45; margin:6px 0 0; padding-left:18px;">
          <li>Päivän e1RM: viitesarja ${plan.ref.set.weightKg} kg @ ${fmtV(plan.ref.a.vBest)} m/s (${plan.e1Src}).</li>
          ${plan.notes.map((n) => `<li>${n}</li>`).join('')}
          <li>Toistot/sarja: min(Prilepin ${plan.row.repsMax}, VL-raja ${plan.repsVL}, RIR ≥ ${plan.goal.key === 'peaking' ? 1 : 2} → ${plan.repsRIR}) = ${plan.reps}. Nopeuskustannus ${plan.cost.toFixed(3)} m/s/toisto (${plan.costSrc}).</li>
        </ul>
        ${opts.withButtons ? `<button type="button" class="primary" data-plan-apply="${nextLoad}|${plan.reps}" style="margin-top:8px; width:100%;">Käytä: ${nextLoad} kg × ${plan.reps}</button>` : ''}`;
    }

    function renderDailyPlanCard() {
      const el = document.getElementById('dailyPlanCard');
      if (!el) return;
      const ex = getCurrentSelectedExerciseName();
      const plan = (getLiftCfg(ex) && !isFreeMode()) ? computeDailyPlan(ex, document.getElementById('workoutDate').value || todayISO()) : null;
      if (!plan) { el.classList.add('hidden'); el.innerHTML = ''; return; }
      el.classList.remove('hidden');
      el.innerHTML = buildDailyPlanHTML(plan, { withButtons: true });
    }
    function applyPlanToSetup(load, reps) {
      const w = document.getElementById('weightInput');
      const t = document.getElementById('targetRepsInput');
      w.value = load;
      t.value = reps;
      handleWeightChanged();
      handleTargetRepsChanged();
    }
    // =================== /PÄIVÄN SUOSITUS ===================


    // =====================================================================
    // ===  JAKSOSUUNNITTELIJA (blokkiperiodisaatio + viikkoaalto)        ===
    // =====================================================================
    const CYCLE_PHASES = {
      accum:  { key: 'accum',  label: 'Kerääminen',       goal: 'baseStrength', color: '#22c55e' },
      trans:  { key: 'trans',  label: 'Muuntaminen',      goal: 'maxStrength',  color: '#3b82f6' },
      real:   { key: 'real',   label: 'Realisointi',      goal: 'peaking',      color: '#f59e0b' },
      deload: { key: 'deload', label: 'Kevennys / testi', goal: 'maxStrength',  color: '#94a3b8' }
    };
    const WAVE_LABELS = {
      low: 'alaraja', opt: 'optimi', high: 'yläraja', deload: 'kevennys', taper: 'piikkaus/tapering', test: 'testi'
    };
    const DEFAULT_CYCLE_BLOCKS = [
      { phase: 'accum', weeks: 4 }, { phase: 'trans', weeks: 4 }, { phase: 'real', weeks: 2 }, { phase: 'deload', weeks: 1 }
    ];

    function mondayOf(iso) {
      const d = new Date(iso + 'T12:00:00');
      const dow = (d.getDay() + 6) % 7;
      d.setDate(d.getDate() - dow);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    function weeksBetween(aIso, bIso) {
      return Math.floor((new Date(mondayOf(bIso) + 'T12:00:00') - new Date(mondayOf(aIso) + 'T12:00:00')) / (7 * 864e5) + 0.5);
    }
    function waveFor(phase, weekInBlock, weeks) {
      if (phase === 'deload') return weekInBlock === weeks ? 'test' : 'deload';
      if (phase === 'real') return weekInBlock === weeks ? 'taper' : 'low';
      if (weeks >= 4 && weekInBlock === weeks) return 'deload';
      const n = weeks >= 4 ? weeks - 1 : weeks;
      if (n <= 2) return weekInBlock === 1 ? 'opt' : 'high';
      return ['low', 'opt', 'high'][Math.min(2, Math.floor((weekInBlock - 1) * 3 / n))];
    }
    function getCycle() { return vbtSettings.cycle && vbtSettings.cycle.active ? vbtSettings.cycle : null; }
    function getContextDate() {
      const el = document.getElementById('workoutDate');
      return (el && el.value) || todayISO();
    }

    // Cycle state for a date
    function getCycleState(dateStr) {
      const c = getCycle();
      if (!c) return null;
      const d = dateStr || getContextDate();
      const mon = mondayOf(d);
      const inserts = (c.inserts || []).filter((x) => x <= mon);
      const insertedNow = (c.inserts || []).includes(mon);
      const raw = weeksBetween(c.startDate, d);
      if (raw < 0) return { active: true, notStarted: true, startDate: c.startDate };
      const idx = raw - inserts.filter((x) => x < mon).length - (insertedNow ? 0 : 0);
      const totalWeeks = c.blocks.reduce((s, b) => s + b.weeks, 0);
      if (insertedNow) {
        // extra deload inserted for this week; block position = the week that was postponed
        let acc = 0, bi = 0;
        for (; bi < c.blocks.length; bi++) { if (idx < acc + c.blocks[bi].weeks) break; acc += c.blocks[bi].weeks; }
        const blk = c.blocks[Math.min(bi, c.blocks.length - 1)];
        return { active: true, blockIdx: bi, phase: CYCLE_PHASES[blk.phase], weekInBlock: idx - acc + 1, weeks: blk.weeks, wave: 'deload', inserted: true, weekIdx: idx, totalWeeks, monday: mon };
      }
      if (idx >= totalWeeks) return { active: true, finished: true, weekIdx: idx, totalWeeks, monday: mon };
      let acc = 0;
      for (let bi = 0; bi < c.blocks.length; bi++) {
        const b = c.blocks[bi];
        if (idx < acc + b.weeks) {
          const wib = idx - acc + 1;
          return { active: true, blockIdx: bi, phase: CYCLE_PHASES[b.phase], weekInBlock: wib, weeks: b.weeks, wave: waveFor(b.phase, wib, b.weeks), weekIdx: idx, totalWeeks, monday: mon };
        }
        acc += b.weeks;
      }
      return null;
    }
    function cycleGoalKey(dateStr) {
      const st = getCycleState(dateStr);
      if (!st || st.finished || st.notStarted) return null;
      return st.phase.goal;
    }
    // Prilepin-volume for the wave
    function waveVolume(row, wave) {
      switch (wave) {
        case 'low': return row.rangeLo;
        case 'high': return row.rangeHi;
        case 'deload': case 'taper': return Math.max(row.repsMin * 2, Math.round(row.rangeLo * 0.6));
        case 'test': return Math.max(2, row.repsMin * 2);
        default: return row.opt;
      }
    }
    function cutoffWaveDelta(dateStr) {
      const st = getCycleState(dateStr);
      return st && !st.finished && !st.notStarted && (st.wave === 'deload' || st.wave === 'taper') ? -5 : 0;
    }

    // ---- weekly volume (work reps & tonnage, warm-ups excluded) ----
    function weeklyVolume(exercise, mondayIso) {
      const end = addDaysIso(mondayIso, 6);
      let reps = 0, tonnage = 0, sets = 0, sessions = new Set();
      workouts.forEach((w) => {
        if (w.date < mondayIso || w.date > end) return;
        (w.sets || []).forEach((s) => {
          if (exercise && s.exercise !== exercise) return;
          if (!s.reps || !s.reps.length) return;
          const a = analyzeSet(s.reps, s.exercise, s.weightKg);
          if (a.isWarmup) return;
          reps += a.valid.length; tonnage += a.valid.length * (s.weightKg || 0); sets++;
          sessions.add(w.date);
        });
      });
      return { reps, tonnage, sets, sessions: sessions.size };
    }

    // ---- suggestions from data ----
    function cycleSuggestions(dateStr) {
      const out = [];
      const st = getCycleState(dateStr);
      const lifts = exercisesWithData().filter((e) => getLiftCfg(e));
      lifts.forEach((ex) => {
        const tr = e1rmTrend(ex).filter((t) => t.date <= dateStr && t.date >= addDaysIso(dateStr, -28));
        if (tr.length >= 3) {
          const first = tr[0], last = tr[tr.length - 1];
          const days = (new Date(last.date) - new Date(first.date)) / 864e5;
          const chg = (last.e1RM - first.e1RM) / first.e1RM * 100;
          if (days >= 13 && chg < 0.5) out.push({ type: 'plateau', ex, text: `${ex}: e1RM ${chg <= -2 ? 'laskenut' : 'tasaantunut'} (${chg >= 0 ? '+' : ''}${chg.toFixed(1)} % / ${Math.round(days)} pv) → ${chg <= -2 ? 'tarkista palautuminen; kevennys tai ' : ''}siirry seuraavaan jaksoon tai muuta ärsykettä.` });
          else if (chg >= 2) out.push({ type: 'progress', ex, text: `${ex}: e1RM nousee (+${chg.toFixed(1)} % / ${Math.round(days)} pv) → jatka nykyisellä jaksolla.` });
        }
        // readiness of the two latest sessions
        const dates = [...new Set(setsForExercise(ex, (d) => d <= dateStr).map((x) => x.date))].sort().reverse().slice(0, 2);
        const rds = dates.map((d) => { const p = computeDailyPlan(ex, d); return p && p.stage === 'plan' ? p.readiness : null; });
        if (rds.length === 2 && rds.every((r) => r !== null && r <= -5)) {
          out.push({ type: 'deload', ex, text: `${ex}: valmius alle −5 % kahdella perättäisellä kerralla (${rds.map((r) => r.toFixed(1) + ' %').join(', ')}) → pidä kevennysviikko etuajassa.` });
        }
        const thisW = weeklyVolume(ex, mondayOf(dateStr));
        const prevW = weeklyVolume(ex, addDaysIso(mondayOf(dateStr), -7));
        if (prevW.reps >= 10 && thisW.reps > prevW.reps * 1.3) {
          out.push({ type: 'volume', ex, text: `${ex}: viikkovolyymi +${Math.round((thisW.reps / prevW.reps - 1) * 100)} % edelliseen viikkoon (${thisW.reps} vs ${prevW.reps} toistoa) – yli 30 %:n hypyt lisäävät väsymystä.` });
        }
      });
      if (st && st.finished) out.unshift({ type: 'finished', text: 'Jakso on päättynyt. Testaa raskas yhden toiston nosto (kirjaa sen nopeus omaksi MVT:ksi) ja aloita uusi kierros korkeammalta tasolta.' });
      return out;
    }

    function startCycle(startDate, blocks) {
      vbtSettings.cycle = { active: true, startDate: mondayOf(startDate), blocks, inserts: [] };
      saveVbtSettings(); onVbtSettingsChanged();
    }
    function stopCycle() {
      if (vbtSettings.cycle) vbtSettings.cycle.active = false;
      saveVbtSettings(); onVbtSettingsChanged();
    }
    function advanceToNextBlock() {
      const c = getCycle(); const st = getCycleState(getContextDate());
      if (!c || !st || st.finished || st.notStarted) return;
      // move start so that the next block begins this week
      let acc = 0; for (let i = 0; i <= st.blockIdx; i++) acc += c.blocks[i].weeks;
      const shiftWeeks = acc - st.weekIdx;
      c.startDate = addDaysIso(c.startDate, -7 * shiftWeeks);
      saveVbtSettings(); onVbtSettingsChanged();
    }
    function insertDeloadThisWeek() {
      const c = getCycle(); if (!c) return;
      const mon = mondayOf(getContextDate());
      c.inserts = c.inserts || [];
      if (!c.inserts.includes(mon)) c.inserts.push(mon);
      saveVbtSettings(); onVbtSettingsChanged();
    }

    function cycleBadgeText(dateStr) {
      const st = getCycleState(dateStr);
      if (!st) return '';
      if (st.notStarted) return `📅 Jakso alkaa ${fmtDateFi(st.startDate)}`;
      if (st.finished) return '📅 Jakso päättynyt – testaa ja aloita uusi';
      return `📅 ${st.phase.label} · vk ${st.weekInBlock}/${st.weeks} (${WAVE_LABELS[st.wave]}${st.inserted ? ', lisätty' : ''}) · kokonaisvk ${st.weekIdx + 1}/${st.totalWeeks}`;
    }

    function buildCycleTimelineSVG(st) {
      const c = getCycle(); if (!c) return '';
      const total = c.blocks.reduce((s, b) => s + b.weeks, 0);
      const W = 340, H = 46, pad = 4;
      const wPx = (W - 2 * pad) / total;
      let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;" role="img" aria-label="Jakson aikajana">`;
      let x = pad, wk = 0;
      c.blocks.forEach((b) => {
        const ph = CYCLE_PHASES[b.phase];
        for (let i = 1; i <= b.weeks; i++) {
          const wave = waveFor(b.phase, i, b.weeks);
          const h = { low: 14, opt: 18, high: 22, deload: 8, taper: 10, test: 12 }[wave] || 14;
          const cur = st && !st.finished && !st.notStarted && st.weekIdx === wk;
          s += `<rect x="${x + 1}" y="${28 - h}" width="${wPx - 2}" height="${h}" rx="2" fill="${ph.color}" opacity="${cur ? 1 : 0.45}" ${cur ? 'stroke="#f8fafc" stroke-width="1.5"' : ''}/>`;
          x += wPx; wk++;
        }
      });
      x = pad;
      c.blocks.forEach((b) => {
        s += `<text x="${x + 2}" y="${H - 4}" fill="#94a3b8" font-size="9">${CYCLE_PHASES[b.phase].label.split(' ')[0]}</text>`;
        x += wPx * b.weeks;
      });
      return s + '</svg>';
    }

      el.innerHTML = `

    function buildVelocityChartHTML(reps, exerciseName) {
      if (!reps || reps.length === 0) {
        return `

          </div>
        `;
      }
      const maxVel = Math.max(0.01, ...reps.map((r) => r.meanVelocity));
      return reps.map((r, idx) => {
        const heightPct = Math.max(10, Math.round((r.meanVelocity / maxVel) * 100));
        const zoneClass = '';
        const zoneTitle = `${r.meanVelocity.toFixed(2)} m/s`;
        return `
          <div class="vel-col" title="${zoneTitle}">
            <span class="vel-col-val">${r.meanVelocity.toFixed(2)}</span>
