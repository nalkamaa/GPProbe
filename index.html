<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Gpath Lite</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-alt: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green: #22c55e;
      --red: #ef4444;
      --amber: #f59e0b;
      --border: #334155;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px));
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 14px;
      padding-top: max(12px, env(safe-area-inset-top, 12px));
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
      width: 100%;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      min-width: 0;
      flex: 1;
    }
    #statusText {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .dot.ready { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .dot.busy { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
    .top-actions { display: flex; gap: 6px; flex-shrink: 0; }
    button {
      font: inherit;
      font-size: 14px;
      color: var(--text);
      background: var(--card-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 11px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:active { transform: scale(0.97); }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
    }
    button.success {
      background: var(--green);
      border-color: var(--green);
      color: #052e16;
    }
    button.danger {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--red);
      color: #fca5a5;
    }
    button:disabled {
      opacity: 0.45;
      pointer-events: none;
    }
    main {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }
    .setup-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
      width: 100%;
    }
    .row-wrap {
      flex-wrap: wrap;
    }
    label.small {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    input, select {
      font: inherit;
      font-size: 16px; /* Prevents iOS WebKit auto-zoom on focus */
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 8px;
      max-width: 100%;
      min-width: 0;
    }
    select {
      flex: 1;
      min-width: 0;
      text-overflow: ellipsis;
    }
    input[type="number"] {
      width: 68px;
      text-align: center;
      font-weight: 700;
      padding: 7px 4px;
    }
    .stepper {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .stepper button {
      padding: 7px 8px;
      min-width: 34px;
      font-size: 13px;
    }
    .set-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(59, 130, 246, 0.18);
      border: 1px solid var(--accent);
      color: #93c5fd;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }
    .set-badge.saved {
      background: rgba(34, 197, 94, 0.18);
      border-color: var(--green);
      color: #86efac;
    }
    .readiness-banner {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 10px;
      border: 2px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      transition: all 0.2s ease;
    }
    .readiness-banner.calibrating {
      background: rgba(245, 158, 11, 0.18);
      border-color: var(--amber);
      color: #fde68a;
    }
    .readiness-banner.ready-to-start {
      background: rgba(59, 130, 246, 0.2);
      border-color: var(--accent);
      color: #bfdbfe;
    }
    .readiness-banner.active-set {
      background: rgba(34, 197, 94, 0.25);
      border-color: var(--green);
      color: #bbf7d0;
      box-shadow: 0 0 14px rgba(34, 197, 94, 0.35);
    }
    .card.hero.active-glow {
      border-color: var(--green);
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.22);
    }
    .hero {
      text-align: center;
      padding: 14px 12px;
    }
    .hero-vel {
      font-size: 56px;
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }
    .hero-watts {
      font-size: 28px;
      font-weight: 700;
      color: #60a5fa;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }
    .sub-metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .sub-metric-val {
      font-size: 16px;
      font-weight: 700;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }
    .green { color: var(--green); }
    .amber { color: var(--amber); }
    .red { color: var(--red); }
    .progress-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .progress-bar {
      height: 10px;
      background: var(--bg);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.2s ease, background 0.2s ease;
    }
    .progress-fill.done { background: var(--green); }
    .drop-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
    .vel-chart {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 118px;
      padding: 18px 8px 6px;
      background: var(--bg);
      border-radius: 10px;
      overflow-x: auto;
    }
    .vel-col {
      flex: 1;
      min-width: 28px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      gap: 4px;
    }
    .vel-col-val {
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }
    .vel-col-bar {
      width: 100%;
      max-width: 32px;
      border-radius: 6px 6px 3px 3px;
      background: var(--accent);
      transition: height 0.2s ease;
      min-height: 6px;
    }
    .vel-col-bar.good { background: var(--green); }
    .vel-col-bar.warn { background: var(--amber); }
    .vel-col-bar.high-drop { background: var(--red); }
    .vel-col-bar.vbt-max, .rep-bar-fill.vbt-max { background: #ef4444 !important; }
    .vel-col-bar.vbt-acc, .rep-bar-fill.vbt-acc { background: #22c55e !important; }
    .vel-col-bar.vbt-str-spd, .rep-bar-fill.vbt-str-spd { background: #3b82f6 !important; }
    .vel-col-bar.vbt-spd-str, .rep-bar-fill.vbt-spd-str { background: #eab308 !important; }
    .vel-col-lbl {
      font-size: 10px;
      color: var(--muted);
      font-weight: 600;
    }
    .rep-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 240px;
      overflow-y: auto;
    }
    .rep-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 8px 10px;
      background: var(--bg);
      border-radius: 10px;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }
    .rep-item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .rep-bar-track {
      height: 6px;
      background: rgba(148, 163, 184, 0.15);
      border-radius: 999px;
      overflow: hidden;
    }
    .rep-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--accent);
      transition: width 0.2s ease;
    }
    .rep-bar-fill.good { background: var(--green); }
    .rep-bar-fill.warn { background: var(--amber); }
    .rep-bar-fill.high-drop { background: var(--red); }
    .rep-num {
      font-weight: 700;
      color: var(--muted);
      width: 32px;
    }
    .action-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .action-bar button {
      padding: 13px 10px;
      font-size: 16px;
    }
    .finish-workout-btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
    }
    /* Bottom navigation */
    nav.tabs {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 4px;
      padding: 6px 8px 14px;
      z-index: 30;
    }
    nav.tabs button {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 8px;
      font-size: 14px;
      border-radius: 10px;
    }
    nav.tabs button.active {
      color: var(--text);
      background: var(--card);
    }
    .hidden { display: none !important; }
    /* Calendar grid */
    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-weight: 700;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      font-size: 13px;
    }
    .cal-dow {
      color: var(--muted);
      font-size: 11px;
      padding: 4px 0;
    }
    .cal-day {
      padding: 8px 0;
      border-radius: 8px;
      cursor: pointer;
      position: relative;
      user-select: none;
    }
    .cal-day.selected {
      background: var(--accent);
      font-weight: 700;
    }
    .cal-day.has-workout::after {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--green);
      position: absolute;
      bottom: 3px;
      left: calc(50% - 2.5px);
    }
    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: max(28px, env(safe-area-inset-top, 28px)) 12px 16px;
      z-index: 50;
      overflow-y: auto;
    }
    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 10px;
    }
    .ex-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      -webkit-overflow-scrolling: touch;
    }
    .ex-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      padding: 9px 10px;
      border-radius: 10px;
    }
    .ex-row.selected-ex {
      border: 1px solid var(--accent);
      background: rgba(59, 130, 246, 0.12);
    }
    .history-set {
      background: var(--bg);
      border-radius: 10px;
      padding: 10px;
      margin-top: 8px;
    }
    .today-set-item {
      background: var(--bg);
      border-radius: 10px;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
      user-select: none;
    }
    .today-set-item:hover {
      background: rgba(51, 65, 85, 0.45);
      border-color: rgba(59, 130, 246, 0.45);
    }
    .today-set-item.expanded {
      border-color: var(--accent);
      background: rgba(30, 41, 59, 0.75);
    }
    .today-set-header {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .today-set-chevron {
      display: inline-block;
      font-size: 10px;
      color: var(--muted);
      width: 14px;
      text-align: center;
      transition: transform 0.2s ease, color 0.15s ease;
    }
    .today-set-item.expanded .today-set-chevron {
      color: var(--accent);
    }
    .analysis-card {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      margin-top: 6px;
    }
    .stat-pill-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 8px;
    }
    .stat-pill {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-pill-label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .stat-pill-val {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    /* VBT Velocity Zones (Squat, Bench Press, Military Bench, Deadlift) */
    .vbt-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .vbt-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }
    .vbt-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 5px;
    }
    .vbt-zone-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 9px;
      border-radius: 9px;
      background: var(--bg);
      border: 1px solid var(--border);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .vbt-zone-row.target-selected {
      border-color: var(--accent);
      background: rgba(59, 130, 246, 0.16);
    }
    .vbt-zone-row.active-hit {
      border-color: var(--green);
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.28);
    }
    .vbt-zone-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: var(--bg);
    }
    .vbt-zone-badge.zone-max {
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.55);
      background: rgba(239, 68, 68, 0.16);
    }
    .vbt-zone-badge.zone-acc {
      color: #86efac;
      border-color: rgba(34, 197, 94, 0.55);
      background: rgba(34, 197, 94, 0.16);
    }
    .vbt-zone-badge.zone-str-spd {
      color: #93c5fd;
      border-color: rgba(59, 130, 246, 0.6);
      background: rgba(59, 130, 246, 0.18);
    }
    .vbt-zone-badge.zone-spd-str {
      color: #fef08a;
      border-color: rgba(234, 179, 8, 0.55);
      background: rgba(234, 179, 8, 0.16);
    }
    /* --- Syvä VBT-analyysi --- */
    .vbt-kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 8px 0 6px; }
    .vbt-kpi { background: rgba(15,23,42,0.6); border: 1px solid rgba(51,65,85,0.6); border-radius: 10px; padding: 7px 8px; display: flex; flex-direction: column; min-width: 0; }
    .vbt-kpi-l { font-size: 10px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vbt-kpi-v { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.25; }
    .vbt-kpi-s { font-size: 10px; color: var(--muted); line-height: 1.3; }
    @media (max-width: 380px) { .vbt-kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .vbt-verdict { font-size: 12px; line-height: 1.45; color: var(--text); margin: 6px 0 2px; }
    .vbt-alert { font-size: 13px; font-weight: 700; padding: 8px 10px; border-radius: 10px; margin-top: 6px; }
    .vbt-alert.amber { background: rgba(245,158,11,0.16); border: 1px solid rgba(245,158,11,0.55); color: #fcd34d; }
    .vbt-alert.red { background: rgba(239,68,68,0.16); border: 1px solid rgba(239,68,68,0.6); color: #fca5a5; }
    .q-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 2.4px solid; margin-right: 4px; vertical-align: -1px; }
    .score-break { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
    .score-row { display: grid; grid-template-columns: 1.5fr 1fr auto; gap: 8px; align-items: center; font-size: 11px; color: var(--muted); }
    .score-row strong { color: var(--text); font-variant-numeric: tabular-nums; min-width: 38px; text-align: right; }
    .score-track { height: 6px; background: rgba(51,65,85,0.7); border-radius: 4px; overflow: hidden; }
    .score-fill { height: 100%; background: var(--accent); border-radius: 4px; }
    .ana-table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
    .ana-table th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11px; padding: 4px 5px; border-bottom: 1px solid var(--border); }
    .ana-table td { padding: 5px; border-bottom: 1px solid rgba(51,65,85,0.45); }
    #vbtLiveCard { margin-top: 4px; }
    .mode-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
    .mode-switch button { background: transparent; border: none; color: var(--muted); padding: 7px 6px; font-size: 13px; border-radius: 8px; }
    .mode-switch button.active { background: var(--card-alt); color: var(--text); font-weight: 700; }
    body.free-mode .guided-only { display: none !important; }
    body:not(.free-mode) .free-only { display: none !important; }
    .setup-vbt { font-size: 12px; line-height: 1.45; }
  </style>
</head>
<body>

  <header>
    <div class="status-row">
      <div id="statusDot" class="dot"></div>
      <span id="statusText">Ei yhdistetty</span>
      <span id="batteryText" style="color: var(--muted); font-weight: 500; flex-shrink: 0;"></span>
    </div>
    <div class="top-actions">
      <button type="button" id="reloadAppBtn" title="Päivitä sovellus" style="padding: 8px 9px;">🔄</button>
      <button type="button" id="soundBtn" title="Äänimerkit">🔊</button>
      <button type="button" id="connectBtn" class="primary">Yhdistä Pin</button>
    </div>
  </header>

  <!-- TAB 1: LIVE TRAINING -->
  <main id="tabLift">
    <div class="card setup-grid">
      <div class="mode-switch" role="tablist" aria-label="Treenitila">
        <button type="button" id="modeGuidedBtn" class="active">🎯 Ohjattu (VBT)</button>
        <button type="button" id="modeFreeBtn">📝 Vapaa treeni</button>
      </div>
      <div class="row">
        <label class="small" for="workoutDate">Päivä</label>
        <input type="date" id="workoutDate" />
      </div>

      <div class="row">
        <select id="exerciseSelect" aria-label="Liike"></select>

  <script>
    // --- Gpath Pin BLE Constants ---
    const SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
    const ADV_UUID     = '00008018-0000-1000-8000-00805f9b34fb';
    const CHAR_UUID    = 'beb5483e-36e1-4688-b7f5-ea07361b2688';
    const CMD_HELLO    = 0x06;
    const CMD_BATTERY  = 0x01;
    const CMD_START    = 0x03;
    const CMD_STOP     = 0x04;
    const CMD_END      = 0x05;

    // --- Storage Keys ---
    const KEY_EXERCISES = 'gpath_exercises_v1';
    const KEY_WORKOUTS  = 'gpath_workouts_v1';
    const ADD_NEW_EX_VALUE = '__add_new_exercise__';

    const DEFAULT_EXERCISES = [
      'Jalkakyykky',
      'Penkkipunnerrus',
      'Sotilaspenkkipunnerrus',
      'Maastaveto',
      'Ylätalja (Lat Pulldown)',
      'Alatalja (Seated Row)',
      'Rintaprässi (Chest Press)',
      'Pystypunnerrus (Shoulder Press)',
      'Ojentajat taljassa (Triceps Pushdown)',
      'Hauiskääntö taljassa (Cable Curl)',
      'Jalkaprässi (Leg Press)',
      'Reiden ojennus (Leg Extension)',
      'Reiden koukistus (Leg Curl)'
    ];

    // --- State ---
    let bleDevice = null;
    let dataChar = null;
    let manualDisconnect = false;
    let soundEnabled = true;
    let audioCtx = null;
    let audioUnlocked = false;
    let setActive = false;
    let zeroing = false;
    let activeSetToken = 0;

    let pendingRep = { propVel: null, propAcc: null, romCm: null, phaseStartedAt: 0 };
    let currentReps = [];
    let currentSetSaved = false;
    let lastSavedSetRef = null;
    let lastSetStoppedAt = 0;
    let setStartedAt = 0;
    let lastRepAt = 0;
    let activeSetMeta = null;
    let keepWarmOsc = null;
    let keepWarmGain = null;

    const memoryStore = {};
    let exercises = loadJSON(KEY_EXERCISES, [...DEFAULT_EXERCISES]);
    if (!Array.isArray(exercises) || exercises.length === 0) {
      exercises = [...DEFAULT_EXERCISES];
    } else {
      const topDefaults = ['Jalkakyykky', 'Penkkipunnerrus', 'Sotilaspenkkipunnerrus', 'Maastaveto'];
      const missingTop = topDefaults.filter((ex) => !exercises.includes(ex));
      if (missingTop.length > 0) {
        exercises = [...missingTop, ...exercises];
        saveJSON(KEY_EXERCISES, exercises);
      }
    }
    let workouts = loadJSON(KEY_WORKOUTS, []); // [{ date: 'YYYY-MM-DD', sets: [...] }]
    if (!Array.isArray(workouts)) {
      workouts = [];
    }

    let calYear = new Date().getFullYear();
    let calMonth = new Date().getMonth();
    let selectedHistoryDate = todayISO();

    function todayISO() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function readWindowNameStore() {
      try {
        if (window.name && window.name.startsWith('{')) {
          return JSON.parse(window.name);
        }
      } catch {}
      return {};
    }

    function loadJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (raw) return JSON.parse(raw);
      } catch {}
      try {
        const wn = readWindowNameStore();
        if (wn && wn[key] !== undefined) return wn[key];
      } catch {}
      return memoryStore[key] !== undefined ? memoryStore[key] : fallback;
    }

    function saveJSON(key, val) {
      memoryStore[key] = val;
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (e) {
        console.warn('localStorage write fallback:', e);
      }
      try {
        const wn = readWindowNameStore();
        wn[key] = val;
        window.name = JSON.stringify(wn);
      } catch {}
    }

    // --- Pure Web Audio API Engine (Bluetooth Music Safe + Zero-Clip Cue Synthesis) ---
    // Uses ONLY Web Audio API (no <audio> or <video> elements) and sets
    // navigator.audioSession.type = 'ambient' so iOS/Android Bluetooth music
    // (Spotify, Apple Music) keeps playing without interruption.
    function configureAmbientAudioSession() {
      try {
        if ('audioSession' in navigator && navigator.audioSession) {
          navigator.audioSession.type = 'ambient';
        }
      } catch {}
    }

    function ensureAudio() {
      configureAmbientAudioSession();
      try {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) {
            audioCtx = new Ctx({ latencyHint: 'interactive' });
          }
        }
        if (audioCtx) {
          if (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted') {
            audioCtx.resume().catch(() => {});
          }
          if (!audioUnlocked && audioCtx.state === 'running') {
            // Play 1-sample silent buffer once to unlock WebKit AudioContext
            const buf = audioCtx.createBuffer(1, 1, 22050);
            const src = audioCtx.createBufferSource();
            src.buffer = buf;
            src.connect(audioCtx.destination);
            if (src.start) src.start(0);
            audioUnlocked = true;
          }
        }
      } catch {}
    }

    // Keep Web Audio graph warm during active sets so Bluetooth A2DP never clips short beeps
    function startAudioKeepWarm() {
      ensureAudio();
      if (!audioCtx || keepWarmOsc) return;
      try {
        keepWarmOsc = audioCtx.createOscillator();
        keepWarmGain = audioCtx.createGain();
        keepWarmOsc.type = 'sine';
        keepWarmOsc.frequency.value = 60;
        keepWarmGain.gain.value = 0.00001; // -100 dB: completely inaudible, keeps mixer & BT pipeline warm
        keepWarmOsc.connect(keepWarmGain);
        keepWarmGain.connect(audioCtx.destination);
        keepWarmOsc.start();
      } catch {
        keepWarmOsc = null;
        keepWarmGain = null;
      }
    }

    function stopAudioKeepWarm() {
      try {
        if (keepWarmOsc) {
          keepWarmOsc.stop();
          keepWarmOsc.disconnect();
        }
        if (keepWarmGain) {
          keepWarmGain.disconnect();
        }
      } catch {}
      keepWarmOsc = null;
      keepWarmGain = null;
    }

    // Unlock AudioContext on user gesture only when needed (never interrupts Bluetooth music)
    ['touchstart', 'pointerdown', 'click'].forEach((evtName) => {
      document.addEventListener(evtName, () => {
        if (!audioUnlocked || (audioCtx && audioCtx.state !== 'running')) {
          ensureAudio();
        }
      }, { passive: true });
    });

    function playCue(notes) {
      if (!soundEnabled) return;
      ensureAudio();
      if (!audioCtx) return;
      try {
        if (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted') {
          audioCtx.resume().catch(() => {});
        }
        const baseNow = audioCtx.currentTime + 0.005;
        for (const n of notes) {
          const startAt = baseNow + (n.delayMs || 0) / 1000;
          const durSec = Math.max(0.04, (n.durationMs || 140) / 1000);
          const stopAt = startAt + durSec;
          const peakGain = n.gain || 0.42;
          const attackEnd = startAt + Math.min(0.012, durSec * 0.2);
          const sustainEnd = startAt + durSec * 0.65;

          // Fundamental oscillator
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = n.type || 'triangle';
          osc.frequency.setValueAtTime(n.freq || 880, startAt);

          gain.gain.setValueAtTime(0.0001, startAt);
          gain.gain.linearRampToValueAtTime(peakGain, attackEnd);
          gain.gain.setValueAtTime(peakGain * 0.88, sustainEnd);
          gain.gain.exponentialRampToValueAtTime(0.0001, stopAt);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(startAt);
          osc.stop(stopAt + 0.01);

          // Harmonic overtone so beeps cut cleanly through Bluetooth music & gym noise
          if ((n.type || 'triangle') !== 'sawtooth') {
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime((n.freq || 880) * 2, startAt);
            gain2.gain.setValueAtTime(0.0001, startAt);
            gain2.gain.linearRampToValueAtTime(peakGain * 0.32, attackEnd);
            gain2.gain.exponentialRampToValueAtTime(0.0001, stopAt);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(startAt);
            osc2.stop(stopAt + 0.01);
          }
        }
      } catch {}
    }

    function soundReady() {
      playCue([
        { freq: 523.25, durationMs: 130, delayMs: 0, gain: 0.38 },
        { freq: 783.99, durationMs: 200, delayMs: 135, gain: 0.44 }
      ]);
    }
    function soundRep() {
      // Crisp 2-tone upward chime (A5 -> D6, 255 ms total) so fast reps never get clipped over Bluetooth
      playCue([
        { freq: 880.0, durationMs: 105, delayMs: 0, gain: 0.42 },
        { freq: 1174.66, durationMs: 150, delayMs: 105, gain: 0.46 }
      ]);
    }
    function soundTargetReached() {
      playCue([
        { freq: 587.33, durationMs: 120, delayMs: 0, gain: 0.42 },
        { freq: 783.99, durationMs: 120, delayMs: 125, gain: 0.44 },
        { freq: 1046.5, durationMs: 280, delayMs: 250, gain: 0.48 }
      ]);
    }
    function soundLoweringWarn() {
      playCue([
        { freq: 250, durationMs: 160, delayMs: 0, type: 'sawtooth', gain: 0.40 },
        { freq: 195, durationMs: 190, delayMs: 170, type: 'sawtooth', gain: 0.40 }
      ]);
    }

    // --- BLE Communication, Screen Wake Lock & Keep-Alive ---
    function setStatus(text, mode) {
      document.getElementById('statusText').textContent = text;
      const dot = document.getElementById('statusDot');
      dot.className = 'dot' + (mode ? ' ' + mode : '');
    }

    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    let writeChain = Promise.resolve();
    let pinStarted = false;
    let zeroTimer = null;
    let bleKeepAliveTimer = null;
    let lastBleActivityAt = 0;
    const BLE_KEEPALIVE_INTERVAL_MS = 15000;

    // --- Screen Wake Lock (Standard W3C Wake Lock API Only – Never Hijacks Bluetooth Media) ---
    let keepAwakeWanted = false;
    let wakeLockSentinel = null;

    async function requestScreenWakeLock() {
      keepAwakeWanted = true;
      if ('wakeLock' in navigator && navigator.wakeLock && navigator.wakeLock.request) {
        try {
          if (!wakeLockSentinel || wakeLockSentinel.released) {
            wakeLockSentinel = await navigator.wakeLock.request('screen');
            wakeLockSentinel.addEventListener('release', () => {
              if (keepAwakeWanted && document.visibilityState === 'visible') {
                navigator.wakeLock.request('screen').then((s) => {
                  wakeLockSentinel = s;
                }).catch(() => {});
              }
            });
          }
        } catch (err) {
          console.debug('WakeLock API unavailable:', err);
        }
      }
    }

    async function releaseScreenWakeLock() {
      keepAwakeWanted = false;
      try {
        if (wakeLockSentinel) {
          await wakeLockSentinel.release();
          wakeLockSentinel = null;
        }
      } catch {}
    }

    function startBleKeepAlive() {
      stopBleKeepAlive();
      lastBleActivityAt = Date.now();
      bleKeepAliveTimer = setInterval(() => {
        if (!dataChar || !bleDevice || !bleDevice.gatt || !bleDevice.gatt.connected) {
          return;
        }
        // Keep AudioContext & WakeLock alive during multi-minute sets
        if (keepAwakeWanted) {
          requestScreenWakeLock();
          if (audioCtx && (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted')) {
            audioCtx.resume().catch(() => {});
          }
        }
        // Do not interrupt the 3-second initial sensor calibration (0x03)
        if (zeroing) return;
        writeByte(CMD_HELLO);
      }, BLE_KEEPALIVE_INTERVAL_MS);
    }

    function stopBleKeepAlive() {
      if (bleKeepAliveTimer) {
        clearInterval(bleKeepAliveTimer);
        bleKeepAliveTimer = null;
      }
    }

    // Re-acquire Wake Lock and verify BLE connection if user switches back to the browser
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        configureAmbientAudioSession();
        if (keepAwakeWanted) {
          requestScreenWakeLock();
        }
        if (audioCtx && (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted')) {
          audioCtx.resume().catch(() => {});
        }
        if (dataChar && bleDevice && bleDevice.gatt && bleDevice.gatt.connected) {
          if (!zeroing) writeByte(CMD_HELLO);
        } else if (bleDevice && !manualDisconnect) {
          openGattSession().catch(() => {});
        }
      }
    });

    // Refresh Wake Lock on touch while connected
    ['touchstart', 'pointerdown', 'click'].forEach((evtName) => {
      document.addEventListener(evtName, () => {
        if (keepAwakeWanted) {
          requestScreenWakeLock();
        }
      }, { passive: true });
    });

    function writeByte(byte) {
      writeChain = writeChain.then(async () => {
        if (!dataChar) return;
        const arr = new Uint8Array([byte]);
        try {
          const op = dataChar.writeValue
            ? dataChar.writeValue(arr)
            : dataChar.writeValueWithResponse(arr);
          await Promise.race([op, sleep(450)]);
        } catch (e) {
          console.warn('BLE write warning:', e);
        }
      });
      return writeChain;
    }

    let zeroInterval = null;
    let zeroCountdownSec = 0;
    let autoStartAfterZero = false;

    function clearZeroTimer() {
      if (zeroTimer) {
        clearTimeout(zeroTimer);
        zeroTimer = null;
      }
      if (zeroInterval) {
        clearInterval(zeroInterval);
        zeroInterval = null;
      }
    }

    function getCompletedSetsForCurrentDate() {
      const dateEl = document.getElementById('workoutDate');
      const dateStr = (dateEl && dateEl.value) ? dateEl.value : todayISO();
      const workout = workouts.find((w) => w.date === dateStr);
      return workout ? workout.sets : [];
    }

    function getActiveSetDisplayNumber() {
      const completedCount = getCompletedSetsForCurrentDate().length;
      if (currentSetSaved && currentReps.length > 0) {
        return Math.max(1, completedCount);
      }
      return completedCount + 1;
    }

    function snapshotCurrentSetMeta() {
      const selVal = document.getElementById('exerciseSelect').value;
      const exercise = (selVal && selVal !== ADD_NEW_EX_VALUE) ? selVal : (exercises[0] || DEFAULT_EXERCISES[0]);
      const weightKg = parseFloat(document.getElementById('weightInput').value) || 0;
      const targetReps = parseInt(document.getElementById('targetRepsInput').value, 10) || 5;
      return {
        exercise,
        weightKg,
        targetReps,
        time: new Date().toTimeString().slice(0, 8)
      };
    }

    function finishCalibrationAndActivate(expectedToken) {
      if (expectedToken !== undefined && expectedToken !== activeSetToken) return;
      clearZeroTimer();
      if (!zeroing) return;
      pinStarted = true;
      zeroing = false;
      pendingRep = { propVel: null, propAcc: null, romCm: null, phaseStartedAt: 0 };

      if (autoStartAfterZero) {
        autoStartAfterZero = false;
        setActive = true;
        setStartedAt = Date.now();
        activeSetMeta = snapshotCurrentSetMeta();
        startAudioKeepWarm();
        const setNum = getActiveSetDisplayNumber();
        setStatus(`🟢 Sarja #${setNum} käynnissä – tee toistoja!`, 'ready');
        soundReady();
      } else {
        const nextNum = getCompletedSetsForCurrentDate().length + 1;
        setStatus(`✅ Pin valmis – paina Aloita sarja #${nextNum}`, 'ready');
        soundReady();
      }
      renderLiveSet();
      updateSetButton();
    }

    async function disconnectPin() {
      manualDisconnect = true;
      activeSetToken++;
      clearZeroTimer();
      stopBleKeepAlive();
      stopAudioKeepWarm();
      releaseScreenWakeLock();
      autoStartAfterZero = false;
      setActive = false;
      zeroing = false;
      pinStarted = false;
      try {
        if (dataChar) {
          await writeByte(CMD_STOP);
          await sleep(50);
          await writeByte(CMD_END);
        }
      } catch {}
      try {
        if (bleDevice && bleDevice.gatt && bleDevice.gatt.connected) {
          bleDevice.gatt.disconnect();
        }
      } catch {}
      dataChar = null;
      renderLiveSet();
      updateSetButton();
      document.getElementById('connectBtn').textContent = 'Yhdistä Pin';
      setStatus('Ei yhdistetty', '');
    }

    async function releaseStaleConnections() {
      try {
        if (bleDevice && bleDevice.gatt && bleDevice.gatt.connected) {
          bleDevice.gatt.disconnect();
          await sleep(300);
        }
        if (navigator.bluetooth && navigator.bluetooth.getDevices) {
          const devs = await navigator.bluetooth.getDevices();
          for (const d of devs) {
            if (d.gatt && d.gatt.connected) {
              d.gatt.disconnect();
            }
          }
        }
      } catch {}
    }

    async function connectPin() {
      ensureAudio();
      requestScreenWakeLock();
      if (!navigator.bluetooth) {
        alert('Selaimesi ei tue Web Bluetoothia. Avaa tämä sivu iPhonessa ilmaisella Bluefy-selaimella (App Store) tai Android/Windows Chrome-selaimella.');
        return;
      }

      if (bleDevice && bleDevice.gatt && bleDevice.gatt.connected && dataChar) {
        await disconnectPin();
        return;
      }

      manualDisconnect = false;
      try {
        if (bleDevice) {
          try {
            await openGattSession();
            return;
          } catch {
            await releaseStaleConnections();
          }
        } else {
          await releaseStaleConnections();
        }

        setStatus('Etsitään Piniä...', 'busy');
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [
            { namePrefix: 'GPATH' },
            { namePrefix: 'Gpath' },
            { services: [ADV_UUID] },
            { services: [SERVICE_UUID] }
          ],
          optionalServices: [SERVICE_UUID, ADV_UUID]
        });
        bleDevice.removeEventListener('gattserverdisconnected', onDisconnected);
        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
        await openGattSession();
      } catch (err) {
        releaseScreenWakeLock();
        setStatus('Ei yhdistetty', '');
        console.error(err);
      }
    }

    function updateSetButton() {
      const startBtn = document.getElementById('startSetBtn');
      const stopBtn = document.getElementById('stopSetBtn');
      const finishBtn = document.getElementById('finishWorkoutBtn');
      const completedCount = getCompletedSetsForCurrentDate().length;
      const nextSetNum = completedCount + 1;

      if (startBtn) {
        startBtn.disabled = !dataChar || setActive || (zeroing && autoStartAfterZero);
        if (zeroing) {
          startBtn.textContent = autoStartAfterZero
            ? `⏳ Kalibroidaan (${zeroCountdownSec} s)...`
            : `▶ Aloita sarja #${nextSetNum}`;
        } else {
          startBtn.textContent = `▶ Aloita sarja #${nextSetNum}`;
        }
      }

      if (stopBtn) {
        stopBtn.disabled = !setActive && !(zeroing && autoStartAfterZero);
        stopBtn.textContent = '⏹ Lopeta sarja';
      }

      if (finishBtn) {
        finishBtn.disabled = false;
        finishBtn.textContent = '🏁 Lopeta treeni';
      }
    }

    function beginZeroCountdown(token, autoStart) {
      clearZeroTimer();
      zeroing = true;
      autoStartAfterZero = Boolean(autoStart);
      zeroCountdownSec = 3;
      renderLiveSet();
      updateSetButton();

      zeroInterval = setInterval(() => {
        if (!zeroing || token !== activeSetToken) {
          clearZeroTimer();
          return;
        }
        zeroCountdownSec = Math.max(1, zeroCountdownSec - 1);
        renderLiveSet();
        updateSetButton();
      }, 1000);

      zeroTimer = setTimeout(() => finishCalibrationAndActivate(token), 3000);
    }

    async function openGattSession() {
      if (!bleDevice) return;
      setStatus('Yhdistetään...', 'busy');
      const server = await bleDevice.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);
      dataChar = await service.getCharacteristic(CHAR_UUID);

      // Keep screen awake and start periodic BLE 0x06 keep-alive for multi-minute sets
      requestScreenWakeLock();
      startBleKeepAlive();

      // Mandatory 0x06 handshake before and after enabling notifications + calibrate (0x03) on connect
      await writeByte(CMD_HELLO);
      await dataChar.startNotifications();
      dataChar.removeEventListener('characteristicvaluechanged', onNotification);
      dataChar.addEventListener('characteristicvaluechanged', onNotification);
      await sleep(50);
      await writeByte(CMD_HELLO);
      await sleep(50);
      await writeByte(CMD_BATTERY);

      pinStarted = false;
      setActive = false;
      const token = ++activeSetToken;
      document.getElementById('connectBtn').textContent = 'Katkaise';
      setStatus('Kalibroidaan Pin (3 s) – pidä paikallaan...', 'busy');
      beginZeroCountdown(token, false);
      await sleep(50);
      await writeByte(CMD_START);
    }

    function recalculateRepsPower(reps, weightKg) {
      const w = Number(weightKg) || 0;
      reps.forEach((r) => {
        const a = Number(r.propulsiveAcceleration) || 0;
        const v = Number(r.meanVelocity) || 0;
        r.power = w * (9.80665 + 0.58 * a) * v;
      });
    }

    function commitCurrentSetToWorkouts(metaOverride = null) {
      if (currentReps.length === 0 || currentSetSaved) return false;
      const dateStr = document.getElementById('workoutDate').value || todayISO();
      const selVal = document.getElementById('exerciseSelect').value;
      const currentExercise = (selVal && selVal !== ADD_NEW_EX_VALUE) ? selVal : (exercises[0] || DEFAULT_EXERCISES[0]);
      const currentWeightKg = parseFloat(document.getElementById('weightInput').value) || 0;
      const currentTargetReps = parseInt(document.getElementById('targetRepsInput').value, 10) || 5;

      const meta = metaOverride || activeSetMeta || {
        exercise: currentExercise,
        weightKg: currentWeightKg,
        targetReps: currentTargetReps,
        time: new Date().toTimeString().slice(0, 8)
      };

      // Ensure every rep's Watts matches the saved set weightKg
      recalculateRepsPower(currentReps, meta.weightKg);

      let workout = workouts.find((w) => w.date === dateStr);
      if (!workout) {
        workout = { date: dateStr, sets: [] };
        workouts.push(workout);
      }
      const setCopy = {
        time: meta.time || new Date().toTimeString().slice(0, 8),
        exercise: meta.exercise,
        weightKg: meta.weightKg,
        targetReps: isFreeMode() ? currentReps.length : meta.targetReps,
        reps: currentReps.map((r) => ({ ...r })),
        goal: getGoal().key
      };
      if (isFreeMode()) setCopy.free = true;
      { const cst = getCycleState(dateStr); if (cst && !cst.finished && !cst.notStarted) setCopy.cycle = { phase: cst.phase.key, week: cst.weekIdx + 1, wave: cst.wave }; }
      if (pendingTraceMeta) { setCopy.traceMeta = pendingTraceMeta; pendingTraceMeta = null; }
      workout.sets.push(setCopy);
      lastSavedSetRef = setCopy;
      currentSetSaved = true;

      saveJSON(KEY_WORKOUTS, workouts);
      selectedHistoryDate = dateStr;
      renderCalendar();
      renderHistoryList();
      return true;
    }

    async function startSetOnPin() {
      if (!dataChar) return;
      ensureAudio();
      startAudioKeepWarm();
      requestScreenWakeLock();

      // If previous set had reps, ensure it is saved before starting the new set, then clear currentReps!
      if (currentReps.length > 0) {
        if (!currentSetSaved) {
          commitCurrentSetToWorkouts(activeSetMeta);
        }
        currentReps = [];
        currentSetSaved = false;
        lastSavedSetRef = null;
      }

      pendingRep = { propVel: null, propAcc: null, romCm: null, phaseStartedAt: 0 };
      activeSetMeta = snapshotCurrentSetMeta();
      vbtCutoffAlerted = false;
      vbtFailureAlerted = false;
      lastTraceStatus = '';
      setStartedAt = Date.now();
      lastRepAt = 0;

      // If initial 3s calibration on connect is still running, queue auto-start as soon as it finishes
      if (zeroing) {
        autoStartAfterZero = true;
        renderLiveSet();
        updateSetButton();
        return;
      }

      if (!pinStarted) {
        const token = ++activeSetToken;
        setActive = false;
        setStatus('Kalibroidaan Pin (3 s) – pidä paikallaan...', 'busy');
        beginZeroCountdown(token, true);
        await writeByte(CMD_HELLO);
        await sleep(50);
        await writeByte(CMD_BATTERY);
        await sleep(50);
        await writeByte(CMD_START);
      } else {
        // Pin is already calibrated and running in 0x03 mode -> start set IMMEDIATELY with zero delay!
        clearZeroTimer();
        zeroing = false;
        setActive = true;
        setStartedAt = Date.now();
        const setNum = getActiveSetDisplayNumber();
        setStatus(`🟢 Sarja #${setNum} käynnissä – tee toistoja!`, 'ready');
        soundReady();
        renderLiveSet();
        updateSetButton();
        writeByte(CMD_HELLO);
      }
    }

    async function stopSetOnPin(autoSave = true) {
      activeSetToken++;
      clearZeroTimer();
      stopAudioKeepWarm();
      autoStartAfterZero = false;
      setActive = false;
      zeroing = false;
      lastSetStoppedAt = Date.now();
      pendingRep = { propVel: null, propAcc: null, romCm: null, phaseStartedAt: 0 };

      // Automatically save completed set when user ends the set so next set starts fresh
      if (autoSave && currentReps.length > 0 && !currentSetSaved) {
        commitCurrentSetToWorkouts(activeSetMeta);
      }

      renderLiveSet();
      updateSetButton();
      if (dataChar) {
        const nextNum = getCompletedSetsForCurrentDate().length + 1;
        if (currentSetSaved && currentReps.length > 0) {
          setStatus(`✓ Sarja tallennettu – valmis sarjaan #${nextNum}`, 'ready');
        } else {
          setStatus(`✅ Valmis – paina Aloita sarja #${nextNum}`, 'ready');
        }
      }
    }

    async function toggleSetOnPin() {
      if (!dataChar) return;
      if (setActive || (zeroing && autoStartAfterZero)) {
        await stopSetOnPin(true);
      } else {
        await startSetOnPin();
      }
    }

    function onDisconnected() {
      activeSetToken++;
      clearZeroTimer();
      stopBleKeepAlive();
      stopAudioKeepWarm();
      autoStartAfterZero = false;
      dataChar = null;
      pinStarted = false;
      setActive = false;
      zeroing = false;
      renderLiveSet();
      updateSetButton();
      document.getElementById('connectBtn').textContent = 'Yhdistä Pin';
      if (manualDisconnect) {
        releaseScreenWakeLock();
        setStatus('Ei yhdistetty', '');
        return;
      }
      setStatus('Yhteys katkesi – yhdistetään...', 'busy');
      setTimeout(async () => {
        if (bleDevice && !manualDisconnect) {
          try { await openGattSession(); } catch { setStatus('Ei yhdistetty', ''); }
        }
      }, 1200);
    }

    window.addEventListener('pagehide', () => {
      try {
        if (bleDevice && bleDevice.gatt && bleDevice.gatt.connected) {
          bleDevice.gatt.disconnect();
        }
      } catch {}
    });
    window.addEventListener('beforeunload', () => {
      try {
        if (bleDevice && bleDevice.gatt && bleDevice.gatt.connected) {
          bleDevice.gatt.disconnect();
        }
      } catch {}
    });

    // Minimum thresholds to filter out Pin handling, cable slack pull, and bar unrack/rack noise
    const MIN_VALID_VEL_M_S = 0.12;
    let lastBottomAt = 0;
    let lastEccEndAt = 0;
    const MIN_VALID_ROM_CM  = 12.0;

    function onNotification(event) {
      const dv = event.target.value;
      if (!dv || dv.byteLength === 0) return;
      lastBleActivityAt = Date.now();
      const type = dv.getUint8(0);

      // Raw 80 Hz set trace dump & markers (0xA4 / 0xB0–0xB4)
      if (type === 0xa4 || (type >= 0xb0 && type <= 0xb4)) {
        handleTraceNotification(dv);
        return;
      }

      if (dv.byteLength === 1 && type >= 0x81 && type <= 0x86) {
        if (type === 0x83 && zeroing) {
          finishCalibrationAndActivate(activeSetToken);
        }
        return;
      }

      // Movement phase state machine (0x01 0x01 = concentric start, 0x01 0x02 = lowering, 0x01 0x03 = rest)
      if (dv.byteLength === 2 && type === 0x01) {
        const phase = dv.getUint8(1);
        if (phase === 0x01) {
          // Fresh upward movement started: clear any leftover partial packets from prior movements
          pendingRep = { propVel: null, propAcc: null, romCm: null, phaseStartedAt: Date.now() };
        } else if (phase === 0x03) {
          lastBottomAt = Date.now(); // bottom / rest reached (used for touch-and-go detection)
        }
        return;
      }

      if (dv.byteLength !== 5) return;
      const val = dv.getFloat32(1, true); // little-endian Float32

      if (type === 0x81) {
        document.getElementById('batteryText').textContent = `• ${Math.round(val)}%`;
        return;
      }

      // Allow final rep's eccentric lowering packet (0x06) within 4s of stopping the set (auto or manual)
      if (!setActive) {
        if (type === 0x06 && currentReps.length > 0 && (Date.now() - lastSetStoppedAt) < 4000) {
          const eccVel = val / 1000.0;
          const last = currentReps[currentReps.length - 1];
          if (last.loweringVelocity === null && eccVel >= 0.08 && eccVel <= 3.5) {
            last.loweringVelocity = eccVel;
            if (lastSavedSetRef && lastSavedSetRef.reps && lastSavedSetRef.reps.length > 0) {
              lastSavedSetRef.reps[lastSavedSetRef.reps.length - 1].loweringVelocity = eccVel;
              saveJSON(KEY_WORKOUTS, workouts);
            }
            if (eccVel > 0.60) soundLoweringWarn();
            renderLiveSet();
          }
        }
        return;
      }

      if (type === 0x03) {
        pendingRep.propVel = val / 1000.0;
      } else if (type === 0x05) {
        pendingRep.romCm = val / 10.0;
      } else if (type === 0x04) {
        pendingRep.propAcc = val / 1000.0;
      } else if (type === 0x02) {
        const meanVel = val / 1000.0;
        const hasFullBurst = pendingRep.propVel !== null && pendingRep.romCm !== null && pendingRep.propAcc !== null;
        const propVel = pendingRep.propVel ?? meanVel;
        const propAcc = pendingRep.propAcc ?? 0;
        const romCm   = pendingRep.romCm ?? 0;
        const liftStartAt = pendingRep.phaseStartedAt || 0;
        pendingRep = { propVel: null, propAcc: null, romCm: null, phaseStartedAt: 0 };

        // 1. Ignore incomplete packet bursts (e.g. movement started before "Aloita sarja" was tapped)
        if (!hasFullBurst) {
          console.debug('Ignored incomplete rep burst on 0x02:', { meanVel, propVel, propAcc, romCm });
          return;
        }

        // 2. Reject non-lift ghost movements (cable slack pull, pin adjustment, <0.12 m/s or <12 cm ROM)
        if (meanVel < MIN_VALID_VEL_M_S || romCm < MIN_VALID_ROM_CM || propAcc < 0 || !Number.isFinite(meanVel)) {
          console.debug('Filtered ghost movement:', { meanVel, romCm, propAcc });
          return;
        }

        // 3. Reject end-of-set bar-racking ghost movement (e.g., after >=2 consistent reps, a sudden <0.21 m/s
        //    movement that is <40% of the previous rep's velocity when setting the bar into the rack)
        if (currentReps.length >= 2) {
          const prevRep = currentReps[currentReps.length - 1];
          if (meanVel < 0.21 && prevRep.meanVelocity > 0.45 && meanVel < prevRep.meanVelocity * 0.40) {
            console.debug('Filtered bar-racking movement at end of set:', { meanVel, prevVel: prevRep.meanVelocity });
            return;
          }
        }

        // 4. Auto-replace bogus 1st "unrack / positioning" movement if rep #1 was slow (<0.22 m/s, no lowering)
        //    and the immediate next lift is >2.2x faster (the real 1st rep of the set)
        if (
          currentReps.length === 1 &&
          currentReps[0].meanVelocity < 0.22 &&
          currentReps[0].loweringVelocity === null &&
          meanVel > currentReps[0].meanVelocity * 2.2
        ) {
          console.debug('Replaced initial unrack movement with real 1st rep:', {
            unrackVel: currentReps[0].meanVelocity,
            realFirstVel: meanVel
          });
          currentReps.pop();
        }

        const weightKg = parseFloat(document.getElementById('weightInput').value) || 0;
        if (!activeSetMeta) {
          activeSetMeta = snapshotCurrentSetMeta();
        } else if (currentReps.length === 0) {
          activeSetMeta = snapshotCurrentSetMeta();
        }
        // Verified power formula: P = m * (g + 0.58 * a_prop) * v
        const power = weightKg * (9.80665 + 0.58 * propAcc) * meanVel;

        // Pause at the bottom before this rep (touch-and-go detection). Requires the previous rep's
        // eccentric end (0x06) or bottom phase (0x01 0x03) after that rep, and this rep's lift start.
        let pauseMs = null;
        if (currentReps.length > 0 && liftStartAt > 0) {
          const prevT = currentReps[currentReps.length - 1].t || 0;
          const bottom = Math.max(lastBottomAt, lastEccEndAt);
          if (bottom > prevT && liftStartAt >= bottom) pauseMs = liftStartAt - bottom;
          else if (bottom <= prevT && liftStartAt > prevT) pauseMs = 0; // no rest phase seen between reps
        }
        if (currentReps.length === 0) { vbtCutoffAlerted = false; vbtFailureAlerted = false; }

        currentReps.push({
          meanVelocity: meanVel,
          propulsiveVelocity: propVel,
          propulsiveAcceleration: propAcc,
          rangeOfMotionCm: romCm,
          loweringVelocity: null,
          power: power,
          t: Date.now(),
          pauseMs: pauseMs
        });
        lastRepAt = Date.now();
        if (!isFreeMode() && vbtOnNewRep()) return; // set auto-stopped at the velocity-loss cutoff

        const targetReps = parseInt(document.getElementById('targetRepsInput').value, 10) || 5;
        if (!isFreeMode() && currentReps.length >= targetReps) {
          // Target reps reached: play fanfare and automatically complete & save this set!
          soundTargetReached();
          stopSetOnPin(true);
        } else {
          soundRep();
          renderLiveSet();
          updateSetButton();
        }
      } else if (type === 0x06) {
        const eccVel = val / 1000.0;
        lastEccEndAt = Date.now();
        if (currentReps.length > 0 && eccVel >= 0.08 && eccVel <= 3.5) {
          const last = currentReps[currentReps.length - 1];
          last.loweringVelocity = eccVel;
          if (eccVel > 0.60) {
            soundLoweringWarn();
          }
          renderLiveSet();
        }
      }
    }

    function getVbtProfileForExercise(exerciseName) {
      const s = String(exerciseName || '').toLowerCase().trim();
      if (!s) return null;
      if (s.includes('kyykky') || s.includes('squat')) {
        return VBT_PROFILES.squat;
      }
      if (s.includes('penkki') || s.includes('bench')) {
        return VBT_PROFILES.bench;

      squat:    { dxMax: 6.0, templMax: 3.0, label: 'kyykyssä tanko kippaa eteen (good morning)' },

        }
        if (i < A && c + SKIP < cost[i + 1][j]) { cost[i + 1][j] = c + SKIP; from[i + 1][j] = [i, j, 's']; }
        if (j < B && c + SKIP < cost[i][j + 1]) { cost[i][j + 1] = c + SKIP; from[i][j + 1] = [i, j, 's']; }
      }
      const map = new Array(B).fill(-1);
      let i = A, j = B;
      while (i > 0 || j > 0) {
        const f = from[i][j]; if (!f) break;
        if (f[2] === 'm') map[f[1]] = f[0];
        i = f[0]; j = f[1];
      }
      return map;
    }

    function attachTraceToRecentSet(raw) {

      if (recent(currentReps)) {
        targets.push(currentReps);

        exercise = (activeSetMeta && activeSetMeta.exercise) || (lastSavedSetRef && lastSavedSetRef.exercise) || getCurrentSelectedExerciseName();
      } else {
        let cand = null;

      if (currentSetSaved && lastSavedSetRef && targets.includes(lastSavedSetRef.reps)) lastSavedSetRef.traceMeta = meta;

      renderCalendar();
      renderHistoryList();
    }
    let pendingTraceMeta = null;

    // ---------- per-rep path / technique scoring ----------
    function pathTemplateDeviation(path, tmpl) {
      if (!path || !tmpl || path.length !== tmpl.length) return null;
      // compare shapes after aligning both to start at x = 0
      let ss = 0;
      for (let i = 0; i < path.length; i++) {
        const d = (path[i][0] - path[0][0]) - (tmpl[i][0] - tmpl[0][0]);
        ss += d * d;
      }
      return Math.sqrt(ss / path.length);
    }

    function exportRawTracesCSV() {
      if (!recentRawTraces.length) { alert('Ei raakadataa tässä istunnossa. Tee sarja ja odota ~10 s sarjan jälkeen.'); return; }
      const lines = ['trace,received_at,sample,dt_us,ax,ay,gx,gy,gz,az,a_vert_mm_s2,v_vert_mm_s'];
      recentRawTraces.forEach((t, ti) => t.rows.forEach((r, i) => lines.push([ti + 1, new Date(t.receivedAt).toISOString(), i, ...r].join(','))));
      const blob = new Blob([lines.join('\n')], { type: 'text/csv' });

      document.body.appendChild(a); a.click(); a.remove();

    // =================== /RAAKADATA ===================

    // ---------- UI: Gpath Pin raw-trace section for a saved set ----------
    function repColor(i, n) {
      const t = n <= 1 ? 1 : i / (n - 1);
      const lerp = (a, b) => Math.round(a + (b - a) * t);
      return `rgb(${lerp(147, 239)},${lerp(197, 68)},${lerp(253, 68)})`;
    }
    function buildTraceCurvesSVG(reps, a) {
      const items = reps.map((r, i) => ({ r, i })).filter((x) => x.r.trace && x.r.trace.curve && !(a.perRep[x.i] && a.perRep[x.i].suspect));
      if (!items.length) return '';
      const W = 340, H = 180, padL = 34, padR = 10, padT = 10, padB = 24;
      const xMax = Math.max(10, ...items.map((x) => x.r.trace.curve[x.r.trace.curve.length - 1][0]));
      const yMax = Math.max(0.3, ...items.map((x) => Math.max(...x.r.trace.curve.map((c) => c[1] / 1000)))) * 1.1;
      const X = (cm) => padL + cm / xMax * (W - padL - padR);
      const Y = (v) => padT + (1 - Math.max(0, v) / yMax) * (H - padT - padB);
      let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;" role="img" aria-label="Nopeuskäyrät liikematkan funktiona">`;
      const step = yMax > 1.2 ? 0.5 : (yMax > 0.6 ? 0.2 : 0.1);
      for (let g = 0; g <= yMax + 1e-9; g += step) {
        s += `<line x1="${padL}" x2="${W - padR}" y1="${Y(g)}" y2="${Y(g)}" stroke="rgba(148,163,184,0.15)"/><text x="${padL - 4}" y="${Y(g) + 3}" fill="#94a3b8" font-size="9" text-anchor="end">${g.toFixed(1)}</text>`;
      }
      for (let c = 0; c <= xMax; c += xMax > 50 ? 20 : 10) s += `<text x="${X(c)}" y="${H - 8}" fill="#94a3b8" font-size="9" text-anchor="middle">${c}</text>`;
      s += `<text x="${W - padR}" y="${padT + 8}" fill="#64748b" font-size="9" text-anchor="end">x = cm pohjasta, y = m/s</text>`;
      if (a.mvt !== null) s += `<line x1="${padL}" x2="${W - padR}" y1="${Y(0.10)}" y2="${Y(0.10)}" stroke="#ec4899" stroke-dasharray="2 3"/><text x="${padL + 3}" y="${Y(0.10) - 3}" fill="#ec4899" font-size="9">0.10 m/s</text>`;
      items.forEach(({ r, i }, k) => {
        const col = i === a.vBestIdx ? '#3b82f6' : repColor(k, items.length);
        s += `<polyline points="${r.trace.curve.map((c) => `${X(c[0]).toFixed(1)},${Y(c[1] / 1000).toFixed(1)}`).join(' ')}" fill="none" stroke="${col}" stroke-width="${i === a.vBestIdx ? 2.4 : 1.6}" opacity="0.95"/>`;
        if (r.trace.stick) {
          s += `<circle cx="${X(r.trace.stick.h)}" cy="${Y(r.trace.stick.vmin)}" r="4" fill="#0f172a" stroke="#f9a8d4" stroke-width="2"/>`;
        }
        const last = r.trace.curve[r.trace.curve.length - 1];
        s += `<text x="${Math.min(W - padR - 2, X(last[0]) + 2)}" y="${Y(last[1] / 1000) - 2}" fill="${col}" font-size="9">T${i + 1}</text>`;
      });
      return s + '</svg>';
    }
    function buildBarPathSVG(reps, a, rules) {
      const items = reps.map((r, i) => ({ r, i })).filter((x) => x.r.trace && x.r.trace.path && !(a.perRep[x.i] && a.perRep[x.i].suspect));
      if (!items.length) return '';
      const W = 340, H = 230, padL = 34, padR = 10, padT = 10, padB = 24;
      const xs = items.flatMap((x) => x.r.trace.path.map((p) => p[0] - x.r.trace.path[0][0]));
      const lim = Math.max(8, (rules && rules.dxMax ? rules.dxMax * 1.4 : 0), ...xs.map(Math.abs)) * 1.1;
      const zMax = Math.max(20, ...items.map((x) => x.r.trace.path[x.r.trace.path.length - 1][1]));
      const X = (cm) => padL + (cm + lim) / (2 * lim) * (W - padL - padR);
      const Y = (cm) => padT + (1 - cm / zMax) * (H - padT - padB);
      let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;" role="img" aria-label="Tankoreitti sivulta">`;
      for (let c = 0; c <= zMax; c += zMax > 50 ? 20 : 10) s += `<line x1="${padL}" x2="${W - padR}" y1="${Y(c)}" y2="${Y(c)}" stroke="rgba(148,163,184,0.12)"/><text x="${padL - 4}" y="${Y(c) + 3}" fill="#94a3b8" font-size="9" text-anchor="end">${c}</text>`;
      const xStep = lim > 20 ? 10 : 5;
      for (let c = -Math.floor(lim / xStep) * xStep; c <= lim; c += xStep) s += `<text x="${X(c)}" y="${H - 8}" fill="#94a3b8" font-size="9" text-anchor="middle">${c > 0 ? '+' : ''}${c}</text>`;
      s += `<line x1="${X(0)}" x2="${X(0)}" y1="${padT}" y2="${H - padB}" stroke="rgba(148,163,184,0.35)"/>`;
      if (rules && rules.dxMax) {
        [-1, 1].forEach((sg) => { s += `<line x1="${X(sg * rules.dxMax)}" x2="${X(sg * rules.dxMax)}" y1="${padT}" y2="${H - padB}" stroke="#f59e0b" stroke-dasharray="5 4"/>`; });
        s += `<text x="${X(rules.dxMax) + 3}" y="${padT + 9}" fill="#f59e0b" font-size="9">±${rules.dxMax} cm</text>`;
      }
      items.forEach(({ r, i }, k) => {
        const col = i === a.vBestIdx ? '#3b82f6' : repColor(k, items.length);
        const x0 = r.trace.path[0][0];
        s += `<polyline points="${r.trace.path.map((p) => `${X(p[0] - x0).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ')}" fill="none" stroke="${col}" stroke-width="${i === a.vBestIdx ? 2.4 : 1.6}"/>`;
        const end = r.trace.path[r.trace.path.length - 1];
        s += `<text x="${X(end[0] - x0)}" y="${Y(end[1]) - 3}" fill="${col}" font-size="9" text-anchor="middle">T${i + 1}</text>`;
      });
      s += `<text x="${padL + 3}" y="${padT + 8}" fill="#64748b" font-size="9">y = korkeus cm, x = vaaka cm</text>`;
      return s + '</svg>';
    }
    function buildTraceSectionHTML(s, a) {
      const reps = s.reps || [];
      if (!reps.some((r) => r.trace)) {
        return `<div style="font-size:11px; color:var(--muted); margin-top:8px; line-height:1.4;">📡 Ei Gpath Pin -raakadataa tälle sarjalle. Pin lähettää 80 Hz aikasarjan automaattisesti ~5–10 s viimeisen toiston jälkeen – odota hetki ennen seuraavaa sarjaa, niin kuolokohta, tankoreitti ja kallistus analysoidaan.</div>`;
      }

      const flagTxt = { stick: 'kuolokohta < 0.10 m/s', tech: 'tankoreitti hajosi', dx: 'vaakasiirtymä', tilt: 'kallistus' };
      const rows = reps.map((r, i) => {
        const p = a.perRep[i]; const t = r.trace;
        if (!t) return `<tr><td>${i + 1}</td><td colspan="6" style="color:var(--muted)">ei raakadataa</td><td>${p && p.rqi !== null ? Math.round(p.rqi) : '--'}</td></tr>`;
        const st = t.stick ? `${t.stick.h.toFixed(0)} cm<br><span class="${t.stick.vmin < 0.10 ? 'red' : t.stick.vmin < 0.2 ? 'amber' : ''}">${t.stick.vmin.toFixed(2)}</span>` : '–';
        const mid = t.midMin ? t.midMin.v.toFixed(2) : '--';

        const dev = p && p.pathDev !== null && p.pathDev !== undefined ? `<span class="${rules && p.pathDev > rules.templMax ? 'amber' : ''}">${p.pathDev.toFixed(1)}</span>` : '--';

        const rq = p && p.rqi !== null ? `<strong class="${p.rqi >= 70 ? 'green' : p.rqi >= 50 ? 'amber' : 'red'}">${Math.round(p.rqi)}</strong>` : '--';
        const fl = p && p.flags && p.flags.length ? `<div style="font-size:10px; color:#fcd34d;">${p.flags.map((f) => flagTxt[f]).join(', ')}</div>` : '';
        return `<tr><td>${i + 1}</td><td>${st}</td><td>${mid}</td><td>${dx}</td><td>${dev}</td><td>${tl}</td><td>${t.pauseMs !== null && t.pauseMs !== undefined ? (t.pauseMs / 1000).toFixed(1) + ' s' : '--'}</td><td>${rq}${fl}</td></tr>`;
      }).join('');
      return `
        <div style="margin-top:10px; padding-top:8px; border-top:1px dashed rgba(148,163,184,0.25);">
          <div class="row"><strong style="font-size:12px;">📡 Gpath Pin -raakadata (80 Hz)</strong>
            <span style="font-size:10px; color:var(--muted);">${meta.samples ? meta.samples + ' näytettä' : ''}${meta.barAxis ? ' · tangon akseli ' + meta.barAxis.toUpperCase() : ''}</span></div>
          <div style="font-size:11px; color:var(--muted); margin:4px 0 2px;">Nopeus liikematkan funktiona (Butterworth 8 Hz) · ◯ = kuolokohta (V<sub>min</sub>)</div>
          ${buildTraceCurvesSVG(reps, a)}
          ${hasPath ? `<div style="font-size:11px; color:var(--muted); margin:6px 0 2px;">Tankoreitti sivulta (kokeellinen: IMU-kaksoisintegrointi, suunta ±)</div>${buildBarPathSVG(reps, a, rules)}` : `<div style="font-size:11px; color:var(--muted); margin-top:4px;">Tankoreittiä ja kallistusta ei voitu laskea: tangon akselia ei tunnistettu anturin asennosta. Valitse akseli Analyysi → VBT-asetukset.</div>`}
          <div style="overflow-x:auto; margin-top:6px;"><table class="ana-table">
            <thead><tr><th>#</th><th>Kuolo&shy;kohta</th><th>V<sub>min</sub> 20–80 %</th><th>ΔX max</th><th>Poikk. parh.</th><th>Kallist.</th><th>Tauko</th><th>RQI</th></tr></thead>
            <tbody>${rows}</tbody></table></div>
          <div style="font-size:10px; color:var(--muted); margin-top:4px; line-height:1.4;">Kuolokohta = korkeus pohjasta ja miniminopeus V₁→V<sub>min</sub>→V₂-kuviossa. V<sub>min</sub> &lt; 0.10 m/s ⇒ RIR 0 vaikka keskinopeus näyttäisi hyvältä. ΔX = suurin vaakasiirtymä lähtölinjasta (cm), poikkeama = RMS-ero sarjan parhaan toiston reittiin. Kallistus = tangon akselin kulman muutos nousun aikana.</div>
        </div>`;
    }

    // =====================================================================
    // ===  SYVÄ VBT-ANALYYSI  (Velocity Loss, RIR, MVT, laatupisteet,   ===
    // ===  kuorma–nopeusprofiili, VBT-e1RM, valmius & trendit)         ===
    // =====================================================================
    // Perusteet: González-Badillo & Sánchez-Medina (2010, 2011), Pareja-Blanco ym. (2017, 2020),
    // Helms ym. (2017), Weakley ym. (2021), Morán-Navarro ym. (2021).
    // Kaikki raja-arvot ovat väestökeskiarvoja – sovellus oppii käyttäjän oman MVT:n ja
    // kuorma–nopeusprofiilin tallennetuista sarjoista.

    const KEY_VBT_SETTINGS = 'gpath_vbt_settings_v1';

    const VBT_GOALS = {
      peaking: {
        key: 'peaking', label: 'Piikkaus / hermostollinen maksimivoima', short: 'Piikkaus',
        pctRange: [85, 95], vl: { squat: 10, bench: 10, deadlift: 5, generic: 10 },
        why: 'Maksimoi tehon ja hermoston terävyyden, minimoi lihasvaurion.'

        why: 'Paras suhde voimankehityksen ja palautumisen välillä.'

      baseStrength: {
        key: 'baseStrength', label: 'Perusvoima / voima-hypertrofia (70–80 % 1RM)', short: 'Perusvoima',

    };

    // lv = väestön kuorma–nopeustaulukko [ %1RM, keskinopeus m/s ] (vaihteluvälien keskikohdat)
    const LIFT_ANALYSIS = {
      squat: {
        id: 'squat', name: 'Jalkakyykky', mvt: 0.30, mvtFloor: 0.15, repCost: 0.06, minRomCm: 35, redVl: 25,
        lv: [[60, 0.86], [70, 0.715], [75, 0.63], [80, 0.55], [85, 0.47], [90, 0.40], [95, 0.34], [100, 0.30]]
      },
      bench: {
        id: 'bench', name: 'Penkkipunnerrus', mvt: 0.165, mvtFloor: 0.08, repCost: 0.05, minRomCm: 20, redVl: 30,
        lv: [[60, 0.72], [70, 0.575], [75, 0.50], [80, 0.43], [85, 0.36], [90, 0.285], [95, 0.22], [100, 0.165]]
      },
      deadlift: {
        id: 'deadlift', name: 'Maastaveto', mvt: 0.155, mvtFloor: 0.08, repCost: 0.05, minRomCm: 25, redVl: 15,
        lv: [[60, 0.66], [70, 0.535], [75, 0.465], [80, 0.405], [85, 0.335], [90, 0.275], [95, 0.22], [100, 0.155]]

    let vbtSettings = Object.assign(

    if (!vbtSettings.mvtOverride || typeof vbtSettings.mvtOverride !== 'object') vbtSettings.mvtOverride = {};
    function saveVbtSettings() { saveJSON(KEY_VBT_SETTINGS, vbtSettings); }

    let vbtCutoffAlerted = false;
    let vbtFailureAlerted = false;

    function getLiftKey(exerciseName) {
      const p = getVbtProfileForExercise(exerciseName);
      return p ? p.id : null;
    }
    function getLiftCfg(exerciseName) {
      const k = getLiftKey(exerciseName);
      return k ? LIFT_ANALYSIS[k] : null;
    }
    function getGoal() {
      const ck = (typeof cycleGoalKey === 'function') ? cycleGoalKey() : null;
      return VBT_GOALS[ck || vbtSettings.goal] || VBT_GOALS.maxStrength;
    }
    function getCutoffPct(exerciseName) {
      const g = getGoal();
      const k = getLiftKey(exerciseName);
      return Math.max(5, g.vl[k || 'generic'] + cutoffWaveDelta());
    }
    function isFreeMode() { return vbtSettings.mode === 'free'; }
    function repV(r) {
      if (!r) return 0;
      if (vbtSettings.velocityMetric === 'mpv' && Number(r.propulsiveVelocity) > 0) return Number(r.propulsiveVelocity);
      return Number(r.meanVelocity) || 0;
    }
    function metricLabel() { return vbtSettings.velocityMetric === 'mpv' ? 'MPV' : 'MV'; }

    function vbtMedian(arr) {
      const a = arr.filter((x) => Number.isFinite(x)).sort((x, y) => x - y);
      if (!a.length) return null;
      const m = Math.floor(a.length / 2);
      return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
    }
    function vbtLinReg(xs, ys) {
      const n = xs.length;
      if (n < 2) return null;
      const mx = xs.reduce((a, b) => a + b, 0) / n;
      const my = ys.reduce((a, b) => a + b, 0) / n;
      let sxy = 0, sxx = 0, syy = 0;
      for (let i = 0; i < n; i++) {
        sxy += (xs[i] - mx) * (ys[i] - my);
        sxx += (xs[i] - mx) ** 2;
        syy += (ys[i] - my) ** 2;
      }
      if (sxx === 0) return null;
      const slope = sxy / sxx;
      const intercept = my - slope * mx;
      const r2 = syy === 0 ? 1 : (sxy * sxy) / (sxx * syy);
      return { slope, intercept, r2, n };
    }
    function fmtV(v) { return (v === null || v === undefined || !Number.isFinite(v)) ? '--' : v.toFixed(2); }
