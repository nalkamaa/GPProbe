        intensity: sInt === null ? null : sInt * wInt / 100,
        // set level: the most fatigued rep decides (a set taken to failure must not average out to "good")
        fatigue: rq.length ? wFat * Math.min(...rq.map((p) => p.sFat)) / 100 : 0,
        path: rq.length ? wPath * rq.reduce((acc, p) => acc + p.sPath, 0) / rq.length / 100 : 0,
        wInt, wFat, wPath, pathSrc: rq.some((p) => p.pathSrc === 'trace') ? 'trace' : 'proxy'
      };
      const score = rq.length ? Math.round((parts.intensity || 0) + parts.fatigue + parts.path) : 0;
      const stickReps = valid.filter((p) => reps[p.idx].trace && reps[p.idx].trace.stick);
      const stickSummary = stickReps.length ? {
        n: stickReps.length,
        hAvg: stickReps.reduce((acc, p) => acc + reps[p.idx].trace.stick.h, 0) / stickReps.length,
        vminMin: Math.min(...stickReps.map((p) => reps[p.idx].trace.stick.vmin))
      } : null;
      const techFirst = valid.find((p) => p.flags.includes('tech') || p.flags.includes('dx'));
      const tiltReps = valid.filter((p) => p.flags.includes('tilt')).map((p) => p.idx + 1);
      const grade = score >= 85 ? 'Erinomainen' : score >= 70 ? 'Hyvä' : score >= 50 ? 'Kohtalainen' : 'Heikko';
      const gradeClass = score >= 70 ? 'green' : score >= 50 ? 'amber' : 'red';

      return {
        n, cfg, perRep, valid, suspectCount: perRep.filter((p) => p.suspect).length,
        mergedReps, mergedCount: mergedReps.length,
        driftReps, driftCount, completedCount,
        vBest, vBestIdx, vlFinal, vlMax, cutoffPct, redVl, vCutoff, mvt, mvtInfo, cost, costSource,
        rirEnd, qualityReps, stopAfterRep, junkReps, effectiveReps, repsToCutoff, tng,
        pct1RM, pctSource, e1RM, epleyRir, isWarmup, romCv,
        score, scoreParts: parts, grade, gradeClass,
        hasTrace, sInt, vWin, stickSummary, techFirst, tiltReps, rules, anchor1RM
      };
    }

    // --- Collect set points for one exercise ---
    function setsForExercise(exercise, dateFilter) {
      const out = [];
      workouts.forEach((w) => {
        if (dateFilter && !dateFilter(w.date)) return;
        (w.sets || []).forEach((s, sIdx) => {
          if (s.exercise !== exercise || !s.reps || !s.reps.length || !(s.weightKg > 0)) return;
          out.push({ date: w.date, set: s, sIdx });
        });
      });
      return out;
    }

    // --- Oma nopeuskustannus (m/s / toisto) omista sarjoista ---
    // Havainto = yhden työsarjan nopeuden lineaarinen kulmakerroin V_best-toistosta eteenpäin (vain kelvolliset toistot,
    // ei lämmittelyjä, ei yhdistyneitä/epäilyttäviä toistoja). Yhdistetään mediaanilla: ensin tämän päivän aiemmat sarjat,
    // sitten 28 pv sarjat samalla kuormatasolla (±7,5 % 1RM).
    const OWN_COST_MIN_TAIL = 2; // vähintään näin monta kelvollista toistoa V_best (mukaan lukien) jälkeen
    let _ownCostCache = { sig: '', map: new Map() };
    function setCostObservation(set, exercise, dateStr) {
      const a = analyzeSet(set.reps, exercise, set.weightKg, { noOwnCost: true, dateStr, touchAndGo: !!(set && set.touchAndGo) });
      if (a.isWarmup || a.pct1RM === null || a.vBestIdx < 0) return null;
      const tail = a.valid.filter((p) => p.idx >= a.vBestIdx);
      if (tail.length < OWN_COST_MIN_TAIL) return null;
      const reg = vbtLinReg(tail.map((p) => p.idx), tail.map((p) => p.v));
      if (!reg) return null;
      return { cost: Math.max(0, -reg.slope), pct: a.pct1RM, nTail: tail.length };
    }
    // Palauttaa { cost, n, scope: 'today'|'28d' } tai null (jos havaintoja < minN)
    function ownVelocityCost(exercise, dateStr, pct, minN) {
      if (!exercise || !getLiftCfg(exercise)) return null;
      dateStr = dateStr || todayISO();
      minN = minN || 2;
      const wsig = workoutsSignature();
      if (_ownCostCache.sig !== wsig) _ownCostCache = { sig: wsig, map: new Map() };
      const key = exercise + '|' + dateStr;
      let obs = _ownCostCache.map.get(key);
      if (!obs) {
        obs = [];
        const from = addDaysIso(dateStr, -28);
        setsForExercise(exercise, (d) => d <= dateStr && d >= from).forEach(({ date, set }) => {
          const o = setCostObservation(set, exercise, date);
          if (o) obs.push({ date, weightKg: set.weightKg, ...o });
        });
        _ownCostCache.map.set(key, obs);
      }
      const todayObs = obs.filter((o) => o.date === dateStr && (!(pct > 0) || Math.abs(o.pct - pct) <= 7.5));
      if (todayObs.length >= minN) return { cost: vbtMedian(todayObs.map((o) => o.cost)), n: todayObs.length, scope: 'today' };
      const near = pct > 0 ? obs.filter((o) => Math.abs(o.pct - pct) <= 7.5) : obs;
      if (near.length >= minN) return { cost: vbtMedian(near.map((o) => o.cost)), n: near.length, scope: '28d' };
      return null;
    }

    // --- Load–velocity profile (best rep of each load) & VBT e1RM at MVT ---
    function buildLVProfile(points, exercise) {
      const mvtInfo = getEffectiveMvt(exercise);
      const anchor1RM = getAnchor1RM(exercise);
      const byLoad = new Map();
      points.forEach((p) => {
        const key = Math.round(p.load * 2) / 2;
        if (!byLoad.has(key) || byLoad.get(key).v < p.v) byLoad.set(key, { load: key, v: p.v, date: p.date });
      });
      const allPts = [...byLoad.values()].sort((a, b) => a.load - b.load);
      // Exclude very light submaximal warm-up loads (<56% of anchor or max load) from linear regression
      // so casual 20–50 kg warmups do not flatten the slope and inflate e1RM
      const maxLoad = allPts.length ? allPts[allPts.length - 1].load : 0;
      const minRegLoad = anchor1RM ? anchor1RM * 0.56 : maxLoad * 0.56;
      const filteredPts = allPts.filter((p) => p.load >= minRegLoad);
      const pts = filteredPts.length >= 2 ? filteredPts : allPts;

      const res = { points: pts, allPoints: points, valid: false, mvt: mvtInfo ? mvtInfo.value : null, mvtInfo };
      if (pts.length < 2) { res.reason = 'Tarvitaan vähintään 2 eri kuormaa (mieluiten 3–4, n. 60–90 % 1RM).'; return res; }
      const span = pts[pts.length - 1].load - pts[0].load;
      const reg = vbtLinReg(pts.map((p) => p.load), pts.map((p) => p.v));
      if (!reg) { res.reason = 'Regressiota ei voitu laskea.'; return res; }
      Object.assign(res, reg);
      if (reg.slope >= 0) { res.reason = 'Nopeus ei laske kuorman kasvaessa – tarkista data.'; return res; }
      if (res.mvt === null) { res.reason = 'Liikkeelle ei ole MVT-arvoa (vain kyykky, penkki ja maastaveto).'; return res; }
      let rawE1RM = (res.mvt - reg.intercept) / reg.slope;
      // Regularize extrapolated e1RM against reference anchor so submaximal warmup slopes cannot runaway
      if (anchor1RM && anchor1RM > 0 && Number.isFinite(rawE1RM)) {
        const blended = 0.45 * rawE1RM + 0.55 * anchor1RM;
        rawE1RM = Math.max(anchor1RM * 0.88, Math.min(anchor1RM * 1.07, blended));
        const meanL = pts.reduce((s, p) => s + p.load, 0) / pts.length;
        const meanV = pts.reduce((s, p) => s + p.v, 0) / pts.length;
        if (rawE1RM > meanL + 5) {
          res.slope = (res.mvt - meanV) / (rawE1RM - meanL);
          res.intercept = meanV - res.slope * meanL;
        }
      }
      res.e1RM = rawE1RM;
      res.v0 = res.intercept;
      res.l0 = -res.intercept / res.slope;
      res.spanKg = span;
      const minSpan = getLiftKey(exercise) === 'bench' ? 12 : 15;
      res.valid = Number.isFinite(res.e1RM) && span >= minSpan && res.e1RM > pts[pts.length - 1].load * 0.92 && res.e1RM < pts[pts.length - 1].load * 1.45;
      res.reliability = reg.r2 >= 0.92 && pts.length >= 3 ? 'Hyvä' : (reg.r2 >= 0.80 ? 'Kohtalainen' : 'Heikko');
      if (!res.valid) res.reason = span < minSpan ? `Kuormaväli (${span.toFixed(0)} kg) on liian kapea luotettavaan suoraan.` : 'Profiili ei ole uskottava (e1RM poikkeaa liikaa nostetuista kuormista).';
      return res;
    }
    function sessionProfile(exercise, dateStr) {
      const sets = setsForExercise(exercise, (d) => d === dateStr);
      const pts = sets.map(({ date, set }) => {
        const a = analyzeSet(set.reps, set.exercise, set.weightKg, { dateStr, touchAndGo: !!set.touchAndGo });
        return { load: set.weightKg, v: a.vBest, date };
      }).filter((p) => p.v > 0);
      return buildLVProfile(pts, exercise);
    }
    // Latest valid personal profile on/before a date (single session, else pooled 28 d)
    function recentProfile(exercise, onOrBeforeDate) {
      if (!exercise || !getLiftCfg(exercise)) return null;
      const dates = [...new Set(setsForExercise(exercise, (d) => d <= onOrBeforeDate).map((x) => x.date))].sort().reverse();
      for (const d of dates.slice(0, 6)) {
        const p = sessionProfile(exercise, d);
        if (p.valid && p.r2 >= 0.82 && p.points.length >= 3) { p.date = d; p.method = 'session'; return p; }
      }
      const from = new Date(onOrBeforeDate); from.setDate(from.getDate() - 28);
      const fromIso = from.toISOString().slice(0, 10);
      const sets = setsForExercise(exercise, (d) => d <= onOrBeforeDate && d >= fromIso);
      const pts = sets.map(({ date, set }) => ({ load: set.weightKg, v: analyzeSet(set.reps, set.exercise, set.weightKg, { dateStr: date, touchAndGo: !!set.touchAndGo }).vBest, date })).filter((p) => p.v > 0);
      const p = buildLVProfile(pts, exercise);
      if (p.valid && p.r2 >= 0.75 && p.points.length >= 3) { p.date = dates[0]; p.method = 'pooled28'; return p; }
      return null;
    }

    // --- e1RM trend: session profile if possible, else best single-set estimate (work sets) ---
    function e1rmTrend(exercise) {
      const dates = [...new Set(setsForExercise(exercise).map((x) => x.date))].sort();
      return dates.map((d) => {
        const workE1s = [];
        setsForExercise(exercise, (x) => x === d).forEach(({ set }) => {
          const a = analyzeSet(set.reps, set.exercise, set.weightKg, { dateStr: d, touchAndGo: !!set.touchAndGo });
          if (a.e1RM && !a.isWarmup) workE1s.push(a.e1RM);
        });
        if (workE1s.length) return { date: d, e1RM: vbtMedian(workE1s), method: workE1s.length >= 2 ? 'työsarjat' : 'yksittäinen sarja' };
        const p = sessionProfile(exercise, d);
        if (p.valid && p.r2 >= 0.82) return { date: d, e1RM: p.e1RM, method: 'profiili' };
        return null;
      }).filter(Boolean);
    }

    // --- Day readiness: same absolute load vs. previous sessions (90 d), ascending/fresh sets only ---
    function readinessForDate(exercise, dateStr) {
      const freshAscendingSets = (list) => {
        const out = [];
        const seenW = [];
        let maxW = 0;
        for (const item of list) {
          const w = Number(item.set.weightKg) || 0;
          if (!(w > 0)) continue;
          if (w < maxW - 0.5) break;
          if (!seenW.some((sw) => Math.abs(sw - w) < 0.6)) {
            out.push(item);
            seenW.push(w);
            if (w > maxW) maxW = w;
          }
        }
        return out;
      };
      const today = freshAscendingSets(setsForExercise(exercise, (d) => d === dateStr));
      if (!today.length) return null;
      const from = new Date(dateStr); from.setDate(from.getDate() - 90);
      const fromIso = from.toISOString().slice(0, 10);
      const prevRaw = setsForExercise(exercise, (d) => d < dateStr && d >= fromIso);
      const prevByDate = new Map();
      prevRaw.forEach((p) => {
        if (!prevByDate.has(p.date)) prevByDate.set(p.date, []);
        prevByDate.get(p.date).push(p);
      });
      const prev = [];
      prevByDate.forEach((list) => { prev.push(...freshAscendingSets(list)); });
      let best = null;
      today.forEach(({ set }) => {
        const vT = analyzeSet(set.reps, set.exercise, set.weightKg, { dateStr, touchAndGo: !!set.touchAndGo }).vBest;
        const same = prev.filter((p) => Math.abs(p.set.weightKg - set.weightKg) < 0.6)
          .map((p) => analyzeSet(p.set.reps, p.set.exercise, p.set.weightKg, { dateStr: p.date, touchAndGo: !!p.set.touchAndGo }).vBest).filter((v) => v > 0);
        if (!same.length || !vT) return;
        const base = same.reduce((a, b) => a + b, 0) / same.length;
        const cand = { weight: set.weightKg, today: vT, baseline: base, deltaPct: (vT - base) / base * 100, nPrev: same.length };
        if (!best || cand.weight > best.weight) best = cand;
      });
      return best;
    }

    // --- Verdict text ---
    function buildVerdict(a, exercise, opts = {}) {
      if (!a || a.n === 0) return '';
      const g = getGoal();
      const parts = [];
      const tm = opts.traceMeta || null;
      const cnt = opts.count ?? a.n;
      const traceExtra = tm ? (tm.extraReps > 0 ? tm.extraReps : (tm.segments > cnt ? tm.segments - cnt : 0)) : 0;
      if (traceExtra > 0) {
        parts.push(`⚠️ Pin 80 Hz -raakadata havaitsi ${tm.segments} nostoa, mutta sovellukseen tallentui ${cnt} toistoa (+${traceExtra} puuttuvaa) – voit korjata toistomäärän alta.`);
      }
      if (a.mergedReps && a.mergedReps.length) a.mergedReps.forEach((m) => parts.push(mergedWarnText(m)));
      if (a.driftReps && a.driftReps.length) a.driftReps.forEach((d) => parts.push(driftWarnText(d)));
      const otherSuspect = a.suspectCount - (a.mergedCount || 0) - (a.driftCount || 0);
      if (otherSuspect > 0) parts.push(`${otherSuspect} epäilyttävä(ä) liike(ttä) (telineestä otto / vajaa liikerata) jätettiin laskennan ulkopuolelle.`);
      if (a.tng) parts.push('Touch-and-go (maastaveto): 1. toistoa ei verrata muihin.');
      if (a.isWarmup) {
        parts.push(`Arvioitu kuorma ~${Math.round(a.pct1RM)} % 1RM → lämmittely-/tekniikkasarja, ei laatuluokitusta maksimivoimalle.`);
        return parts.join(' ');
      }
      if (a.valid.length >= 2 && a.vlFinal !== null) {
        if (a.stopAfterRep !== null) {
          const keep = a.stopAfterRep; // reps within cutoff = idx of first over
          parts.push(`${g.short}: VL-raja ${a.cutoffPct} % ylittyi toistolla ${a.stopAfterRep + 1} → sarja olisi kannattanut katkaista toiston ${keep} jälkeen. ${a.junkReps} toisto(a) kerrytti lähinnä väsymystä.`);
        } else {
          parts.push(`${g.short}: nopeuden lasku ${a.vlFinal.toFixed(0)} % pysyi rajan ${a.cutoffPct} % sisällä – jokainen toisto tehtiin hyvällä hermostollisella laadulla.`);
        }
      }
      if (a.rirEnd !== null && a.mvt !== null) {
        if (a.rirEnd === 0) parts.push(`Viimeinen toisto oli lähellä failure-rajaa (MVT ${fmtV(a.mvt)} m/s) – RIR ~0.`);
        else parts.push(`Varastoon jäi arviolta ~${a.rirEnd} toisto${a.rirEnd === 1 ? '' : 'a'} ennen MVT-rajaa.`);
        if (a.stopAfterRep === null && a.repsToCutoff !== null && a.repsToCutoff >= 2 && a.pct1RM !== null && a.pct1RM >= g.pctRange[0]) {
          parts.push(`VL-rajaan olisi ollut vielä ~${a.repsToCutoff} toistoa → voit lisätä toiston tai kuormaa.`);
        }
      }
      if (a.pct1RM !== null) {
        const [lo, hi] = g.pctRange;
        if (a.pct1RM < lo - 2) parts.push(`Kuorma ~${Math.round(a.pct1RM)} % 1RM on tavoitteen (${lo}–${hi} %) alapuolella.`);
        else if (a.pct1RM > hi + 2) parts.push(`Kuorma ~${Math.round(a.pct1RM)} % 1RM on tavoitteen (${lo}–${hi} %) yläpuolella.`);
      }
      if (a.techFirst) parts.push(`Toistolla ${a.techFirst.idx + 1} tankoreitti poikkesi parhaasta toistosta (${a.techFirst.pathDev !== null ? a.techFirst.pathDev.toFixed(1) + ' cm' : 'raja ylittyi'}) → tekninen uupumus${a.rules ? ' (' + a.rules.label + ')' : ''}, vaikka nopeutta olisi vielä ollut jäljellä.`);
      if (a.tiltReps && a.tiltReps.length) parts.push(`Epäsymmetriavaroitus: tanko kallistui yli ${TILT_WARN_DEG}° toistoilla ${a.tiltReps.join(', ')}.`);
      if (a.stickSummary) parts.push(`Kuolokohta keskimäärin ${a.stickSummary.hAvg.toFixed(0)} cm pohjasta, hitaimmillaan ${fmtV(a.stickSummary.vminMin)} m/s${a.stickSummary.vminMin < 0.10 ? ' – erittäin lähellä epäonnistumista' : ''}.`);
      if (a.romCv !== null && a.romCv > 20 && !a.hasTrace) parts.push(`Liikelaajuus vaihteli paljon (CV ${a.romCv.toFixed(0)} %) – tarkista tekniikka tai anturin kiinnitys.`);
      return parts.join(' ');
    }

    // --- SVG: rep velocity curve with V_cutoff and MVT lines (+ projection) ---
    const Q_COLORS = { good: '#22c55e', warn: '#f59e0b', bad: '#ef4444', suspect: '#64748b' };
    function buildRepCurveSVG(a, opts = {}) {
      if (!a || a.n === 0) return '';
      const W = 340, H = opts.height || 190, padL = 34, padR = 10, padT = 18, padB = 22;
      const proj = [];
      const last = a.valid[a.valid.length - 1];
      if (opts.projection !== false && last && a.mvt !== null && a.cost && !a.isWarmup) {
        let v = last.v, i = last.idx;
        for (let k = 0; k < 8 && v - a.cost >= a.mvt - a.cost * 0.999; k++) {
          v -= a.cost; i += 1; if (v < a.mvt) break; proj.push({ idx: i, v });
        }
      }
      const nSlots = Math.max(a.n + proj.length, 3);
      const vMax = Math.max(0.6, ...a.perRep.map((p) => p.v), a.vBest || 0) * 1.12;
      const yMax = Math.ceil(vMax * 10) / 10;
      const x = (i) => padL + (nSlots === 1 ? 0.5 : i / (nSlots - 1)) * (W - padL - padR);
      const y = (v) => padT + (1 - Math.max(0, Math.min(yMax, v)) / yMax) * (H - padT - padB);
      let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block; max-height:${H + 20}px;" role="img" aria-label="Toistokohtainen nopeuskäyrä">`;
      const gStep = yMax <= 0.8 ? 0.2 : (yMax > 1.2 ? 0.5 : 0.25);
      for (let g = 0; g <= yMax + 1e-9; g += gStep) {
        s += `<line x1="${padL}" x2="${W - padR}" y1="${y(g)}" y2="${y(g)}" stroke="rgba(148,163,184,0.15)"/>`;
        s += `<text x="${padL - 4}" y="${y(g) + 3}" fill="#94a3b8" font-size="9" text-anchor="end">${g.toFixed(2)}</text>`;
      }
      if (a.vCutoff && !a.isWarmup) {
        s += `<line x1="${padL}" x2="${W - padR}" y1="${y(a.vCutoff)}" y2="${y(a.vCutoff)}" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="6 4"/>`;
        s += `<text x="${W - padR}" y="${y(a.vCutoff) - 3}" fill="#f59e0b" font-size="9" text-anchor="end">VL ${a.cutoffPct} % · ${fmtV(a.vCutoff)}</text>`;
      }
      if (a.mvt !== null) {
        s += `<line x1="${padL}" x2="${W - padR}" y1="${y(a.mvt)}" y2="${y(a.mvt)}" stroke="#ec4899" stroke-width="1.4" stroke-dasharray="2 3"/>`;
        s += `<text x="${W - padR}" y="${y(a.mvt) + 11}" fill="#ec4899" font-size="9" text-anchor="end">MVT ${fmtV(a.mvt)}</text>`;
      }
      if (proj.length && last) {
        const pts = [[x(last.idx), y(last.v)], ...proj.map((p) => [x(p.idx), y(p.v)])];
        s += `<polyline points="${pts.map((p) => p.join(',')).join(' ')}" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>`;
        proj.forEach((p) => { s += `<circle cx="${x(p.idx)}" cy="${y(p.v)}" r="3" fill="none" stroke="#64748b"/>`; });
      }
      const line = a.perRep.filter((p) => !p.suspect).map((p) => `${x(p.idx)},${y(p.v)}`).join(' ');
      if (line) s += `<polyline points="${line}" fill="none" stroke="#3b82f6" stroke-width="2"/>`;
      a.perRep.forEach((p) => {
        const c = Q_COLORS[p.quality] || '#3b82f6';
        s += `<circle cx="${x(p.idx)}" cy="${y(p.v)}" r="5" fill="#0f172a" stroke="${c}" stroke-width="2.4"/>`;
        s += `<text x="${x(p.idx)}" y="${y(p.v) - 8}" fill="#e2e8f0" font-size="9" text-anchor="middle">${p.v.toFixed(2)}</text>`;
      });
      for (let i = 0; i < nSlots; i++) {
        const isProj = i >= a.n;
        s += `<text x="${x(i)}" y="${H - 6}" fill="${isProj ? '#475569' : '#94a3b8'}" font-size="9" text-anchor="middle">T${i + 1}</text>`;
      }
      s += `</svg>`;
      return s;
    }

    function buildVbtKpiHTML(a, live) {
      if (!a || a.n === 0) return '';
      const mvtSrc = a.mvtInfo ? a.mvtInfo.label : '';
      const vlNow = a.valid.length ? a.valid[a.valid.length - 1].vl : null;
      const vlCls = (vlNow === null || a.isWarmup) ? '' : (vlNow > a.redVl ? 'red' : (vlNow > a.cutoffPct ? 'amber' : 'green'));
      const rirTxt = a.rirEnd === null ? '--' : (a.rirEnd >= 10 ? '10+' : `~${a.rirEnd}`);
      const rirCls = (a.rirEnd === null || a.isWarmup) ? '' : (a.rirEnd <= 0 ? 'red' : (a.rirEnd <= 1 ? 'amber' : 'green'));
      const scoreTxt = a.isWarmup ? 'LÄ' : a.score;
      const scoreSub = a.isWarmup ? 'lämmittely' : a.grade;
      return `
        <div class="vbt-kpi-grid">
          <div class="vbt-kpi"><span class="vbt-kpi-l">V<sub>best</sub> (${metricLabel()})</span><span class="vbt-kpi-v">${fmtV(a.vBest)}</span><span class="vbt-kpi-s">${a.pct1RM !== null ? `~${Math.round(a.pct1RM)} % 1RM` : (a.vBestIdx >= 0 ? `toisto ${a.vBestIdx + 1}` : '')}</span></div>
          <div class="vbt-kpi"><span class="vbt-kpi-l">VL ${live ? 'nyt' : 'lopussa'}</span><span class="vbt-kpi-v ${vlCls}">${vlNow === null ? '--' : vlNow.toFixed(0) + ' %'}</span><span class="vbt-kpi-s">raja ${a.cutoffPct} % · ${fmtV(a.vCutoff)} m/s</span></div>
          <div class="vbt-kpi"><span class="vbt-kpi-l">RIR-arvio</span><span class="vbt-kpi-v ${rirCls}">${rirTxt}</span><span class="vbt-kpi-s">MVT ${fmtV(a.mvt)} (${mvtSrc})</span></div>
          <div class="vbt-kpi"><span class="vbt-kpi-l">${live ? 'Laadukkaat' : 'RQI (0–100)'}</span><span class="vbt-kpi-v ${live || a.isWarmup ? '' : a.gradeClass}">${live ? `${a.qualityReps}/${a.valid.length}` : scoreTxt}</span><span class="vbt-kpi-s">${live ? (a.isWarmup ? 'lämmittely' : (a.repsToCutoff !== null && a.stopAfterRep === null ? `~${a.repsToCutoff} toistoa rajaan` : (a.stopAfterRep !== null ? 'raja ylitetty' : ''))) : scoreSub}</span></div>
        </div>`;
    }

    function buildVbtLegendHTML() {
      return `<div class="vbt-legend" style="display:flex; gap:10px; flex-wrap:wrap; font-size:11px; color:var(--muted);">
        <span><span class="q-dot" style="border-color:${Q_COLORS.good}"></span>Laadukas</span>
        <span><span class="q-dot" style="border-color:${Q_COLORS.warn}"></span>Yli VL-rajan / RIR&lt;1</span>
        <span><span class="q-dot" style="border-color:${Q_COLORS.bad}"></span>Liian väsynyt / alle MVT</span>
        <span><span class="q-dot" style="border-color:${Q_COLORS.suspect}"></span>Epäilyttävä</span>
        <span style="color:#94a3b8;">┈ ennuste</span>
      </div>`;
    }

    function buildScoreBreakdownHTML(a) {
      const p = a.scoreParts;
      const row = (label, val, max) => `
        <div class="score-row"><span>${label}</span>
          <div class="score-track"><div class="score-fill" style="width:${max ? Math.round(val / max * 100) : 0}%"></div></div>
          <strong>${val.toFixed(0)}/${max}</strong></div>`;
      return `<div class="score-break">
        <div style="font-size:11px; color:var(--muted); font-weight:700;">RQI = 0.40·intensiteetti + 0.40·väsymys + 0.20·tankoreitti</div>
        ${p.intensity !== null ? row(`Intensiteetti (V<sub>best</sub> ${a.vWin ? fmtV(a.vWin[0]) + '–' + fmtV(a.vWin[1]) : ''} m/s)`, p.intensity, p.wInt) : ''}
        ${row('Väsymyksen hallinta (VL, kuolokohta)', p.fatigue, p.wFat)}
        ${row(p.pathSrc === 'trace' ? 'Tankoreitti & kallistus (Pin 80 Hz)' : 'Tekniikka (arvio: ROM + lasku)', p.path, p.wPath)}
      </div>`;
    }

    // Full VBT block used in saved-set analysis
    function buildVbtSetBlockHTML(s, dateStr) {
      const useDate = dateStr || todayISO();
      const prof = getLiftCfg(s.exercise) ? recentProfile(s.exercise, useDate) : null;
      const a = analyzeSet(s.reps, s.exercise, s.weightKg, { profile: prof, dateStr: useDate, touchAndGo: !!(s && s.touchAndGo) });
      if (!a.n) return '';
      const e1 = a.e1RM ? `${a.e1RM.toFixed(1)} kg <span style="color:var(--muted); font-weight:500; font-size:11px;">(${a.pctSource === 'profile' ? 'oma profiili' : 'nopeustaulukko'})</span>` : '--';
      return `
        <div class="analysis-card">
          <div class="row" style="align-items:flex-start;">
            <span style="font-size:11px; text-transform:uppercase; font-weight:700; color:var(--muted); letter-spacing:0.04em;">VBT-laatuanalyysi · ${getGoal().short} · ${metricLabel()}</span>
            <span class="vbt-zone-badge" style="font-size:11px; padding:2px 8px;">${a.isWarmup ? 'Lämmittely' : 'Työsarja'}${a.tng ? ' · TnG' : ''}</span>
          </div>
          ${buildVbtKpiHTML(a, false)}
          ${buildRepCurveSVG(a)}
          ${buildVbtLegendHTML()}
          <p class="vbt-verdict">${buildVerdict(a, s.exercise, { traceMeta: s.traceMeta, count: (s.reps || []).length })}</p>
          ${buildScoreBreakdownHTML(a)}
          ${buildTraceSectionHTML(s, a)}
          <div class="stat-pill-grid" style="margin-top:8px;">
            <div class="stat-pill"><span class="stat-pill-label">e1RM (VBT)</span><span class="stat-pill-val" style="color:#60a5fa; font-size:13px;">${e1}</span></div>
            <div class="stat-pill"><span class="stat-pill-label">e1RM (Epley + RIR)</span><span class="stat-pill-val" style="font-size:13px;">${a.epleyRir ? a.epleyRir.toFixed(1) + ' kg' : '--'}</span></div>
            <div class="stat-pill"><span class="stat-pill-label">Nopeuskustannus / toisto</span><span class="stat-pill-val" style="font-size:13px;">${a.cost ? '−' + a.cost.toFixed(3) + ' m/s' : '--'}</span></div>
            <div class="stat-pill"><span class="stat-pill-label">Efektiiviset toistot (RIR ≤ 4)</span><span class="stat-pill-val" style="font-size:13px;">${a.mvt !== null ? a.effectiveReps : '--'}</span></div>
          </div>
        </div>`;
    }

    // --- Same-load historical comparison (RepOne-style) ---
    function getRecentSameLoadHistory(exercise, weightKg, beforeDate, limit = 3) {
      if (!exercise || !(weightKg > 0)) return [];
      const out = [];
      const sorted = [...workouts].sort((a, b) => b.date.localeCompare(a.date));
      for (const w of sorted) {
        if (beforeDate && w.date >= beforeDate) continue;
        const matches = (w.sets || []).filter((s) =>
          s.exercise === exercise &&
          Math.abs((Number(s.weightKg) || 0) - weightKg) < 0.6 &&
          s.reps && s.reps.length
        );
        if (!matches.length) continue;
        let bestV = 0;
        matches.forEach((s) => {
          const a = analyzeSet(s.reps, s.exercise, s.weightKg, { dateStr: w.date, touchAndGo: !!s.touchAndGo });
          if (a.vBest && a.vBest > bestV) bestV = a.vBest;
        });
        if (bestV > 0) {
          out.push({ date: w.date, vBest: bestV });
          if (out.length >= limit) break;
        }
      }
      return out;
    }

    // --- Unified mini-bars component (used in active set for both guided and free mode) ---
    function buildMiniBarsHTML(reps, a, targetReps, isFree) {
      const list = reps || [];
      if (list.length === 0) {
        if (isFree) {
          return '<div style="width:100%; text-align:center; font-size:12px; color:var(--muted); align-self:center;">Odotetaan toistoja…</div>';
        }
        const slots = Math.min(12, Math.max(1, targetReps || 5));
        return Array.from({ length: slots }, () =>
          '<div class="mini-bar-col"><div class="mini-bar-fill ghost" style="height:46%;"></div></div>'
        ).join('');
      }
      const vMax = Math.max(0.4, ...list.map((r) => repV(r)), (a && a.vBest) ? a.vBest : 0) * 1.1;
      const vCut = (!isFree && a && a.vCutoff && !a.isWarmup) ? a.vCutoff : null;
      const totalSlots = isFree ? list.length : Math.max(list.length, Math.min(targetReps || 5, 15));
      let html = '';
      if (vCut !== null && vCut > 0 && vCut < vMax) {
        const bottomPct = Math.max(8, Math.min(92, Math.round((vCut / vMax) * 76) + 8));
        html += `<div class="mini-cutoff-line" style="bottom:${bottomPct}%;"></div>`;
      }
      for (let i = 0; i < totalSlots; i++) {
        if (i < list.length) {
          const v = repV(list[i]);
          const hPct = Math.max(14, Math.min(100, Math.round((v / vMax) * 100)));
          const q = isFree ? 'good' : ((a && a.perRep[i]) ? a.perRep[i].quality : 'good');
          html += `<div class="mini-bar-col"><span class="mini-bar-val">${v.toFixed(2)}</span><div class="mini-bar-fill ${q}" style="height:${hPct}%;"></div></div>`;
        } else {
          html += `<div class="mini-bar-col"><div class="mini-bar-fill ghost" style="height:44%;"></div></div>`;
        }
      }
      return html;
    }

    // --- Single most important rest finding (max 1 line) ---
    function buildShortRestFinding(a, exercise, opts = {}) {
      if (!a || !a.n) return null;
      const tm = opts.traceMeta || null;
      const cnt = opts.count ?? a.n;
      const traceExtra = tm ? (tm.extraReps > 0 ? tm.extraReps : (tm.segments > cnt ? tm.segments - cnt : 0)) : 0;
      if (traceExtra > 0) {
        return { text: `⚠️ Pin 80 Hz havaitsi ${tm.segments} nostoa, mutta sovellus tallensi ${cnt} (+${traceExtra} puuttuvaa)`, cls: 'amber' };
      }
      if (a.mergedReps && a.mergedReps.length) {
        return { text: a.mergedReps.map(mergedWarnText).join(' '), cls: 'amber' };
      }
      if (a.mvt !== null && a.rirEnd === 0) {
        return { text: '⛔ Lähellä failurea (RIR ~0) – kevennä kuormaa tai pidennä lepoa', cls: 'red' };
      }
      if (a.driftReps && a.driftReps.length) {
        return { text: a.driftReps.map(driftWarnText).join(' '), cls: 'amber' };
      }
      if (a.techFirst) {
        return { text: `⚠ Tankoreitti poikkesi toistolla ${a.techFirst.idx + 1}${a.techFirst.pathDev !== null ? ' (' + a.techFirst.pathDev.toFixed(1) + ' cm)' : ''}`, cls: 'amber' };
      }
      if (a.tiltReps && a.tiltReps.length) {
        return { text: `⚠ Tanko kallistui yli ${TILT_WARN_DEG}° toistolla ${a.tiltReps.join(', ')}`, cls: 'amber' };
      }
      if (a.stopAfterRep !== null && !a.isWarmup) {
        return { text: `🛑 VL-raja ${a.cutoffPct} % ylittyi toistolla ${a.stopAfterRep + 1} (${a.junkReps} ylitystoistoa)`, cls: 'amber' };
      }
      if (a.stickSummary && a.stickSummary.vminMin < 0.12) {
        return { text: `⚠ Kuolokohta ${a.stickSummary.hAvg.toFixed(0)} cm pohjasta · Vmin ${fmtV(a.stickSummary.vminMin)} m/s`, cls: 'amber' };
      }
      if (a.isWarmup) {
        return { text: `Lämmittelysarja (~${Math.round(a.pct1RM)} % 1RM)`, cls: '' };
      }
      if (a.vlFinal !== null) {
        return { text: `✓ Laadukas sarja · VL ${a.vlFinal.toFixed(0)} % pysyi rajan (${a.cutoffPct} %) sisällä`, cls: 'green' };
      }
      return null;
    }

    // "+1 toisto ok" -vihje (ohjattu tila): tavoitetoistot täynnä (kelvollisia toistoja), VL < 0,5 × raja, viimeisen toiston RIR ≥ 3 (piikkaus ≥ 2),
    // toistoja < Prilepinin max/sarja ja kyseessä ei ole päivän ensimmäinen kartoittava viitesarja. Palauttaa null tai { vl, cutoff, rir, max, text }.
    function isReferenceSetContext(exercise, dateStr, setObj) {
      if (!exercise || !getLiftCfg(exercise)) return false;
      const plan = computeDailyPlan(exercise, dateStr);
      if (!plan) return false;
      if (plan.stage === 'needRef') return true;
      if (setObj && plan.ref && plan.ref.set === setObj) return true;
      return false;
    }
    function extraRepHint(a, count, targetReps, opts = {}) {
      if (isFreeMode() || (opts && opts.isRef) || !a || !a.cfg || a.isWarmup) return null;
      const validCount = a.valid ? a.valid.length : 0;
      const completedCount = a.completedCount ?? validCount;
      if (!(validCount >= 1) || !(completedCount >= targetReps)) return null;
      const last = a.valid[a.valid.length - 1];
      if (!last || last.idx !== a.n - 1 || a.pct1RM === null || a.mvt === null || last.rir === null) return null;
      const vl = last.vl === null ? 0 : last.vl;
      const max = prilepinRow(a.pct1RM).repsMax;
      const rirMin = getGoal().key === 'peaking' ? 2 : 3;
      if (!(vl < 0.5 * a.cutoffPct) || last.rir < rirMin || completedCount >= max) return null;
      const rirTxt = last.rir >= 10 ? '10+' : last.rir;
      return { vl, cutoff: a.cutoffPct, rir: last.rir, max, text: `✅ +1 toisto ok (VL ${vl.toFixed(0)} % / raja ${a.cutoffPct} %, RIR ~${rirTxt}, max ${max}/sarja)` };
    }
    function liveExtraRepHint(targetReps) {
      const exercise = (activeSetMeta && activeSetMeta.exercise) || getCurrentSelectedExerciseName();
      const weightKg = (activeSetMeta && activeSetMeta.weightKg) || 0;
      const dateStr = document.getElementById('workoutDate').value || todayISO();
      const prof = getLiftCfg(exercise) ? recentProfile(exercise, dateStr) : null;
      const isRef = isReferenceSetContext(exercise, dateStr);
      return extraRepHint(analyzeSet(currentReps, exercise, weightKg, { profile: prof, dateStr, touchAndGo: isLiveTouchAndGo(exercise) }), currentReps.length, targetReps, { isRef });
    }

    // Called right after a new rep was pushed during an active set. Returns true if the set was auto-stopped.
    function vbtOnNewRep() {
      const exercise = (activeSetMeta && activeSetMeta.exercise) || getCurrentSelectedExerciseName();
      const weightKg = (activeSetMeta && activeSetMeta.weightKg) || 0;
      const dateStr = document.getElementById('workoutDate').value || todayISO();
      const a = analyzeSet(currentReps, exercise, weightKg, { dateStr, touchAndGo: isLiveTouchAndGo(exercise) });
      const lastP = a.valid[a.valid.length - 1];
      if (!lastP || a.isWarmup) return false;
      const overCutoff = lastP.vl !== null && lastP.vl > a.cutoffPct;
      const nearFailure = a.mvt !== null && lastP.rir === 0;
      if ((overCutoff && !vbtCutoffAlerted) || (nearFailure && !vbtFailureAlerted)) {
        if (overCutoff) vbtCutoffAlerted = true;
        if (nearFailure) vbtFailureAlerted = true;
        if (vbtSettings.cutoffSound) soundCutoff();
        if (vbtSettings.autoStopOnCutoff) { stopSetOnPin(true); return true; }
      }
      return false;
    }

    function soundCutoff() {
      playCue([
        { freq: 988, durationMs: 120, delayMs: 0, type: 'square', gain: 0.32 },
        { freq: 740, durationMs: 120, delayMs: 140, type: 'square', gain: 0.32 },
        { freq: 494, durationMs: 260, delayMs: 280, type: 'square', gain: 0.36 }
      ]);
    }

    // --- Forecast details & concise setup summary ---
    function buildSetupForecastData(exercise, w, dateStr) {
      const cfg = getLiftCfg(exercise);
      if (!cfg) {
        return { shortExpected: '', detailHtml: '<span style="color:var(--muted)">VBT-ennuste vain kyykylle, penkille ja maastavedolle</span>' };
      }
      const prof = recentProfile(exercise, dateStr);
      const anchor1RM = getAnchor1RM(exercise);
      if (prof && w > 0) {
        const pct = w / prof.e1RM * 100;
        const vExp = prof.intercept + prof.slope * w;
        const [lo, hi] = getGoal().pctRange;
        const wLo = prof.e1RM * lo / 100, wHi = prof.e1RM * hi / 100;
        return {
          shortExpected: `odotettu ~${fmtV(vExp)} m/s`,
          detailHtml: `~${Math.round(pct)} % 1RM · odotettu V<sub>best</sub> <strong>${fmtV(vExp)}</strong> m/s (±0.03)<br><span style="color:var(--muted)">e1RM ${prof.e1RM.toFixed(0)} kg (${prof.method === 'session' ? 'profiili ' + fmtDateFi(prof.date) : '28 pv profiili'}) · tavoitealue ${Math.round(wLo)}–${Math.round(wHi)} kg</span>`
        };
      }
      if (anchor1RM && w > 0) {
        const pct = w / anchor1RM * 100;
        const mvt = getEffectiveMvt(exercise).value;
        const shift = taperedMvtShift(cfg, mvt, pct);
        const vExp = velocityFromPctTable(cfg, pct) + shift;
        const [lo, hi] = getGoal().pctRange;
        const wLo = anchor1RM * lo / 100, wHi = anchor1RM * hi / 100;
        return {
          shortExpected: `odotettu ~${fmtV(vExp)} m/s`,
          detailHtml: `~${Math.round(pct)} % 1RM · odotettu V<sub>best</sub> <strong>${fmtV(vExp)}</strong> m/s (±0.03)<br><span style="color:var(--muted)">Ankkuri-1RM ${anchor1RM.toFixed(0)} kg · tavoitealue ${Math.round(wLo)}–${Math.round(wHi)} kg</span>`
        };
      }
      const [lo, hi] = getGoal().pctRange;
      const mvt = getEffectiveMvt(exercise).value;
      const shiftLo = taperedMvtShift(cfg, mvt, lo);
      const shiftHi = taperedMvtShift(cfg, mvt, hi);
      return {
        shortExpected: `alue ~${fmtV(velocityFromPctTable(cfg, hi) + shiftHi)}–${fmtV(velocityFromPctTable(cfg, lo) + shiftLo)} m/s`,
        detailHtml: `Tavoite ${lo}–${hi} % 1RM ≈ V<sub>best</sub> <strong>${fmtV(velocityFromPctTable(cfg, hi) + shiftHi)}–${fmtV(velocityFromPctTable(cfg, lo) + shiftLo)}</strong> m/s<br><span style="color:var(--muted)">Oma profiili puuttuu: tee 3–4 nousevaa kuormaa samana päivänä</span>`
      };
    }

    function renderContextAndSteppers() {
      const exercise = getCurrentSelectedExerciseName();
      const dateStr = document.getElementById('workoutDate').value || todayISO();
      const w = parseFloat(document.getElementById('weightInput').value) || 0;

      // Cycle 1-line badge
      const cycEl = document.getElementById('setupCycleInfo');
      if (cycEl) {
        const st = getCycleState(dateStr);
        if (!st || isFreeMode()) {
          cycEl.classList.add('hidden');
          cycEl.textContent = '';
        } else {
          cycEl.classList.remove('hidden');
          if (st.notStarted) cycEl.textContent = `Alkaa ${fmtDateFi(st.startDate)}`;
          else if (st.finished) cycEl.textContent = 'Jakso päättynyt';
          else cycEl.textContent = `${st.phase.label} vk ${st.weekInBlock}/${st.weeks}`;
        }
      }

      // Settings summary pill
      const sumEl = document.getElementById('liftSettingsSummary');
      const sumBtn = document.getElementById('openLiftSettingsBtn');
      const isToday = dateStr === todayISO();
      if (sumEl) {
        const modeTxt = isFreeMode() ? 'Vapaa' : 'Ohjattu';
        const goalTxt = isFreeMode() ? '' : ` · ${getGoal().short}`;
        const dateTxt = isToday ? 'Tänään' : `⚠️ Päivä: ${fmtDateFi(dateStr)} (ei tänään)`;
        sumEl.textContent = `⚙ ${modeTxt}${goalTxt} · ${dateTxt}`;
      }
      if (sumBtn) {
        sumBtn.classList.toggle('date-warn', !isToday);
      }

      // Deadlift-only manual Touch-and-go toggle
      const tngRow = document.getElementById('tngToggleRow');
      const tngEl = document.getElementById('tngToggle');
      const isDeadlift = getLiftKey(exercise) === 'deadlift';
      if (tngRow) tngRow.classList.toggle('hidden', !isDeadlift);
      if (tngEl && !isDeadlift) tngEl.checked = false;

      // Weight hint (expected velocity + same load history)
      const hintEl = document.getElementById('weightContextHint');
      if (hintEl) {
        const parts = [];
        if (!isFreeMode()) {
          const fc = buildSetupForecastData(exercise, w, dateStr);
          if (fc.shortExpected) parts.push(fc.shortExpected);
        }
        const prevLoads = getRecentSameLoadHistory(exercise, w, dateStr, 3);
        if (prevLoads.length) {
          parts.push(`edelliset: ${prevLoads.map((p) => fmtV(p.vBest)).join(' · ')} m/s`);
        }
        hintEl.textContent = parts.join(' · ');
      }
    }

    // ===================== ANALYYSI-VÄLILEHTI =====================
    let anaExercise = null;
    let anaDate = null;
    let anaSubTab = 'sessio';
    let anaSelectedSetIdx = 0;

    function setAnaSubTab(sub) {
      anaSubTab = sub || 'sessio';
      const tabs = document.getElementById('anaSubTabs');
      if (tabs) {
        tabs.querySelectorAll('[data-ana-sub]').forEach((btn) => {
          btn.classList.toggle('active', btn.getAttribute('data-ana-sub') === anaSubTab);
        });
      }
      const sessEl = document.getElementById('anaSessionCard');
      const setEl = document.getElementById('anaSetDetailCard');
      const profEl = document.getElementById('anaProfileCard');
      const trendEl = document.getElementById('anaTrendCard');
      const cycEl = document.getElementById('anaCycleCard');
      const planEl = document.getElementById('anaPlanCard');
      const setgEl = document.getElementById('anaSettingsCard');

      if (sessEl) sessEl.classList.toggle('hidden', anaSubTab !== 'sessio');
      if (setEl) setEl.classList.toggle('hidden', anaSubTab !== 'sarjat');
      if (profEl) profEl.classList.toggle('hidden', anaSubTab !== 'profiili');
      if (trendEl) trendEl.classList.toggle('hidden', anaSubTab !== 'profiili' || !trendEl.innerHTML.trim());
      if (cycEl) cycEl.classList.toggle('hidden', anaSubTab !== 'jakso');
      if (planEl) planEl.classList.toggle('hidden', anaSubTab !== 'jakso' || !planEl.innerHTML.trim());
      if (setgEl) setgEl.classList.toggle('hidden', anaSubTab !== 'asetukset');
    }

    function openSetInAnalysis(dateStr, workoutSetIdx) {
      const w = workouts.find((x) => x.date === dateStr);
      if (!w || !w.sets || !w.sets[workoutSetIdx]) return;
      const targetSet = w.sets[workoutSetIdx];
      anaExercise = targetSet.exercise;
      anaDate = dateStr;
      const exSets = setsForExercise(anaExercise, (d) => d === anaDate);
      const matchIdx = exSets.findIndex((x) => x.sIdx === workoutSetIdx || x.set === targetSet);
      anaSelectedSetIdx = matchIdx >= 0 ? matchIdx : 0;
      showTab('analysis', 'sarjat');
    }

    function exercisesWithData() {
      const set = new Set();
      workouts.forEach((w) => (w.sets || []).forEach((s) => { if (s.reps && s.reps.length) set.add(s.exercise); }));
      const arr = [...set];
      arr.sort((a, b) => (getLiftCfg(b) ? 1 : 0) - (getLiftCfg(a) ? 1 : 0) || a.localeCompare(b));
      return arr;
    }

    function buildLVProfileSVG(prof) {
      const W = 340, H = 210, padL = 36, padR = 12, padT = 14, padB = 26;
      const pts = prof.allPoints && prof.allPoints.length ? prof.allPoints : prof.points;
      const loads = pts.map((p) => p.load);
      const xMaxData = Math.max(...loads, prof.valid ? prof.e1RM : 0);
      const xMin = Math.max(0, Math.floor((Math.min(...loads) * 0.85) / 10) * 10);
      const xMax = Math.ceil((xMaxData * 1.05) / 10) * 10;
      const yMax = Math.ceil(Math.max(0.6, ...pts.map((p) => p.v), prof.valid ? prof.intercept + prof.slope * xMin : 0) * 1.1 * 10) / 10;
      const x = (l) => padL + (l - xMin) / Math.max(1, xMax - xMin) * (W - padL - padR);
      const y = (v) => padT + (1 - Math.max(0, Math.min(yMax, v)) / yMax) * (H - padT - padB);
      let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;" role="img" aria-label="Kuorma–nopeusprofiili">`;
      const yStep = yMax > 1.2 ? 0.5 : 0.25;
      for (let g = 0; g <= yMax + 1e-9; g += yStep) {
        s += `<line x1="${padL}" x2="${W - padR}" y1="${y(g)}" y2="${y(g)}" stroke="rgba(148,163,184,0.15)"/>`;
        s += `<text x="${padL - 4}" y="${y(g) + 3}" fill="#94a3b8" font-size="9" text-anchor="end">${g.toFixed(2)}</text>`;
      }
      const xStep = (xMax - xMin) > 120 ? 40 : 20;
      for (let l = Math.ceil(xMin / xStep) * xStep; l <= xMax; l += xStep) {
        s += `<text x="${x(l)}" y="${H - 8}" fill="#94a3b8" font-size="9" text-anchor="middle">${l}</text>`;
      }
      s += `<text x="${W - padR}" y="${H - 8}" fill="#64748b" font-size="9" text-anchor="end">kg</text>`;
      if (prof.mvt !== null) {
        s += `<line x1="${padL}" x2="${W - padR}" y1="${y(prof.mvt)}" y2="${y(prof.mvt)}" stroke="#ec4899" stroke-width="1.3" stroke-dasharray="2 3"/>`;
        s += `<text x="${padL + 4}" y="${y(prof.mvt) - 4}" fill="#ec4899" font-size="9">MVT ${fmtV(prof.mvt)}</text>`;
      }
      if (prof.slope !== undefined && prof.slope < 0) {
        const xEnd = prof.valid ? prof.e1RM : xMax;
        s += `<line x1="${x(xMin)}" y1="${y(prof.intercept + prof.slope * xMin)}" x2="${x(xEnd)}" y2="${y(prof.intercept + prof.slope * xEnd)}" stroke="#3b82f6" stroke-width="2"/>`;
      }
      pts.forEach((p) => {
        const top = prof.points.find((q) => Math.abs(q.load - p.load) < 0.3 && Math.abs(q.v - p.v) < 1e-6);
        s += `<circle cx="${x(p.load)}" cy="${y(p.v)}" r="${top ? 5 : 3.5}" fill="${top ? '#0f172a' : 'rgba(148,163,184,0.35)'}" stroke="${top ? '#60a5fa' : 'none'}" stroke-width="2.2"/>`;
        if (top) s += `<text x="${x(p.load)}" y="${y(p.v) - 8}" fill="#e2e8f0" font-size="9" text-anchor="middle">${p.v.toFixed(2)}</text>`;
      });
      if (prof.valid) {
        s += `<circle cx="${x(prof.e1RM)}" cy="${y(prof.mvt)}" r="6" fill="#ec4899"/>`;
        s += `<text x="${x(prof.e1RM)}" y="${y(prof.mvt) + 16}" fill="#f9a8d4" font-size="10" font-weight="700" text-anchor="end">e1RM ${prof.e1RM.toFixed(0)} kg</text>`;
      }
      s += '</svg>';
      return s;
    }

    function buildTrendSVG(points) {
      const W = 340, H = 150, padL = 36, padR = 12, padT = 14, padB = 24;
      const vals = points.map((p) => p.e1RM);
      let yMin = Math.floor(Math.min(...vals) * 0.95 / 5) * 5;
      let yMax = Math.ceil(Math.max(...vals) * 1.05 / 5) * 5;
      if (yMax - yMin < 30) { const mid = (yMax + yMin) / 2; yMin = Math.floor((mid - 15) / 5) * 5; yMax = yMin + 30; }
      const x = (i) => padL + (points.length === 1 ? 0.5 : i / (points.length - 1)) * (W - padL - padR);
      const y = (v) => padT + (1 - (v - yMin) / Math.max(1, yMax - yMin)) * (H - padT - padB);
      let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;" role="img" aria-label="e1RM-trendi">`;
      [yMin, (yMin + yMax) / 2, yMax].forEach((g) => {
        s += `<line x1="${padL}" x2="${W - padR}" y1="${y(g)}" y2="${y(g)}" stroke="rgba(148,163,184,0.15)"/>`;
        s += `<text x="${padL - 4}" y="${y(g) + 3}" fill="#94a3b8" font-size="9" text-anchor="end">${g.toFixed(0)}</text>`;
      });
      if (points.length > 1) s += `<polyline points="${points.map((p, i) => `${x(i)},${y(p.e1RM)}`).join(' ')}" fill="none" stroke="#3b82f6" stroke-width="2"/>`;
      points.forEach((p, i) => {
        s += `<circle cx="${x(i)}" cy="${y(p.e1RM)}" r="4.5" fill="${p.method === 'profiili' ? '#3b82f6' : '#0f172a'}" stroke="#3b82f6" stroke-width="2"/>`;
        s += `<text x="${x(i)}" y="${y(p.e1RM) - 8}" fill="#e2e8f0" font-size="9" text-anchor="middle">${p.e1RM.toFixed(0)}</text>`;
        const lbl = fmtDateFi(p.date).split('.').slice(0, 2).join('.') + '.';
        s += `<text x="${x(i)}" y="${H - 6}" fill="#94a3b8" font-size="9" text-anchor="middle">${lbl}</text>`;
      });
      s += '</svg>';
      return s;
    }

    function renderAnaSetDetailCard(sets) {
      const setEl = document.getElementById('anaSetDetailCard');
      if (!setEl) return;
      if (!sets || !sets.length) {
        setEl.innerHTML = '<div style="color:var(--muted); text-align:center;">Ei tallennettuja sarjoja valitulle liikkeelle ja päivälle.</div>';
        return;
      }
      if (anaSelectedSetIdx < 0) anaSelectedSetIdx = 0;
      if (anaSelectedSetIdx >= sets.length) anaSelectedSetIdx = sets.length - 1;
      const item = sets[anaSelectedSetIdx];
      const s = item.set;
      const optionsHtml = sets.map((x, i) =>
        `<option value="${i}" ${i === anaSelectedSetIdx ? 'selected' : ''}>Sarja #${i + 1} · ${x.set.weightKg} kg × ${(x.set.reps || []).length}</option>`
      ).join('');
      setEl.innerHTML = `
        <div class="row" style="gap: 6px; margin-bottom: 4px;">
          <button type="button" id="anaPrevSetBtn" ${anaSelectedSetIdx <= 0 ? 'disabled' : ''} style="min-width:44px; min-height:40px;">‹</button>
          <select id="anaSetSelect" aria-label="Valitse sarja" style="flex:1; font-size:14px; font-weight:700;">${optionsHtml}</select>
          <button type="button" id="anaNextSetBtn" ${anaSelectedSetIdx >= sets.length - 1 ? 'disabled' : ''} style="min-width:44px; min-height:40px;">›</button>
        </div>
        ${buildSetAnalysisHTML(s, { dateStr: item.date, workoutSetIdx: item.sIdx, showTraceStatus: true, allowRepDelete: true, allowSetDelete: true })}
      `;
      const prevBtn = setEl.querySelector('#anaPrevSetBtn');
      const nextBtn = setEl.querySelector('#anaNextSetBtn');
      const selEl = setEl.querySelector('#anaSetSelect');
      if (prevBtn) prevBtn.addEventListener('click', () => { anaSelectedSetIdx = Math.max(0, anaSelectedSetIdx - 1); renderAnaSetDetailCard(sets); });
      if (nextBtn) nextBtn.addEventListener('click', () => { anaSelectedSetIdx = Math.min(sets.length - 1, anaSelectedSetIdx + 1); renderAnaSetDetailCard(sets); });
      if (selEl) selEl.addEventListener('change', (e) => { anaSelectedSetIdx = parseInt(e.target.value, 10) || 0; renderAnaSetDetailCard(sets); });
      bindSetAnalysisActions(setEl, item.date, item.sIdx);
    }

    function renderAnalysisTab() {
      const exSel = document.getElementById('anaExerciseSelect');
      const dateSel = document.getElementById('anaDateSelect');
      const sessionEl = document.getElementById('anaSessionCard');
      const setEl = document.getElementById('anaSetDetailCard');
      const profEl = document.getElementById('anaProfileCard');
      const trendEl = document.getElementById('anaTrendCard');
      const planEl = document.getElementById('anaPlanCard');
      if (!exSel) return;
      const exList = exercisesWithData();
      if (!exList.length) {
        exSel.innerHTML = ''; dateSel.innerHTML = '';
        sessionEl.innerHTML = '<div style="color:var(--muted); text-align:center;">Ei vielä tallennettuja sarjoja analysoitavaksi.</div>';
        if (setEl) setEl.innerHTML = '<div style="color:var(--muted); text-align:center;">Ei vielä tallennettuja sarjoja analysoitavaksi.</div>';
        profEl.innerHTML = '<div style="color:var(--muted); text-align:center;">Ei vielä tallennettuja sarjoja profiiliin.</div>';
        trendEl.innerHTML = '';
        if (planEl) planEl.innerHTML = '';
        renderCycleCard();
        renderVbtSettingsCard();
        setAnaSubTab(anaSubTab);
        return;
      }
      if (!anaExercise || !exList.includes(anaExercise)) {
        const cur = getCurrentSelectedExerciseName();
        anaExercise = exList.includes(cur) ? cur : exList[0];
      }
      exSel.innerHTML = exList.map((e) => `<option value="${e.replace(/"/g, '&quot;')}" ${e === anaExercise ? 'selected' : ''}>${e}</option>`).join('');
      const dates = [...new Set(setsForExercise(anaExercise).map((x) => x.date))].sort().reverse();
      if (!anaDate || !dates.includes(anaDate)) anaDate = dates[0];
      dateSel.innerHTML = dates.map((d) => `<option value="${d}" ${d === anaDate ? 'selected' : ''}>${fmtDateFi(d)}</option>`).join('');

      const cfg = getLiftCfg(anaExercise);
      const prof = cfg ? recentProfile(anaExercise, anaDate) : null;
      const sets = setsForExercise(anaExercise, (d) => d === anaDate);
      const analyses = sets.map(({ set }) => ({ set, a: analyzeSet(set.reps, set.exercise, set.weightKg, { profile: prof, dateStr: anaDate, touchAndGo: !!set.touchAndGo }) }));
      const work = analyses.filter((x) => !x.a.isWarmup);
      const totalReps = analyses.reduce((s, x) => s + planRepsOf(x), 0);
      const goodReps = work.reduce((s, x) => s + x.a.qualityReps, 0);
      const junk = work.reduce((s, x) => s + x.a.junkReps, 0);
      const avgScore = work.length ? Math.round(work.reduce((s, x) => s + x.a.score, 0) / work.length) : null;
      const effReps = work.reduce((s, x) => s + (x.a.mvt !== null ? x.a.effectiveReps : 0), 0);
      const tonnage = analyses.reduce((s, x) => s + x.set.weightKg * planRepsOf(x), 0);
      const ready = readinessForDate(anaExercise, anaDate);

      const rows = analyses.map(({ set, a }, i) => {
        const vlTxt = a.vlFinal === null ? '--' : a.vlFinal.toFixed(0) + ' %';
        const vlCls = (a.vlFinal === null || a.isWarmup) ? '' : (a.vlFinal > a.redVl ? 'red' : a.vlFinal > a.cutoffPct ? 'amber' : 'green');
        return `<tr class="ana-set-row" data-ana-set-idx="${i}">
          <td>${i + 1}</td><td>${set.weightKg}</td><td>${a.pct1RM !== null ? Math.round(a.pct1RM) : '--'}</td>
          <td>${fmtV(a.vBest)}</td><td class="${vlCls}">${vlTxt}</td>
          <td>${a.rirEnd === null ? '--' : (a.rirEnd >= 10 ? '10+' : a.rirEnd)}</td><td>${a.completedCount ?? a.valid.length}${a.junkReps && !a.isWarmup ? `<span class="amber"> (${a.junkReps})</span>` : ''}</td>
          <td class="${a.isWarmup ? '' : a.gradeClass}">${a.isWarmup ? 'LÄ' : a.score} <span style="color:var(--muted);">›</span></td></tr>`;
      }).join('');

      const readyHtml = ready
        ? `<div class="stat-pill"><span class="stat-pill-label">Päivän valmius @ ${ready.weight} kg</span><span class="stat-pill-val ${ready.deltaPct >= 3 ? 'green' : ready.deltaPct <= -5 ? 'red' : ready.deltaPct < -2 ? 'amber' : ''}" style="font-size:13px;">${ready.deltaPct >= 0 ? '+' : ''}${ready.deltaPct.toFixed(1)} % <span style="color:var(--muted); font-weight:500;">(${fmtV(ready.today)} vs ${fmtV(ready.baseline)})</span></span></div>`
        : `<div class="stat-pill"><span class="stat-pill-label">Päivän valmius</span><span class="stat-pill-val" style="font-size:12px; color:var(--muted);">Ei vertailukuormaa</span></div>`;

      let readinessAdvice = '';
      if (ready) {
        if (ready.deltaPct <= -5) readinessAdvice = 'Nopeus on selvästi tavallista alempi samalla kuormalla → keskushermosto/palautuminen vajaa. Harkitse kuorman pudottamista 5–10 % tai sarjojen vähentämistä.';
        else if (ready.deltaPct >= 5) readinessAdvice = 'Nopeus on tavallista korkeampi → hyvä päivä. Kuormaa voi nostaa 2,5–5 % tavoitealueen sisällä.';
        else readinessAdvice = 'Valmius normaali – toteuta suunniteltu ohjelma.';
      }

      const stickWork = work.map((x) => x.a.stickSummary).filter(Boolean);
      const stickPill = stickWork.length
        ? (() => {
            const h = stickWork.reduce((acc, x) => acc + x.hAvg, 0) / stickWork.length;
            const vm = Math.min(...stickWork.map((x) => x.vminMin));
            return `<div class="stat-pill"><span class="stat-pill-label">Kuolokohta (työsarjat)</span><span class="stat-pill-val" style="font-size:13px;">${h.toFixed(0)} cm · V<sub>min</sub> <span class="${vm < 0.10 ? 'red' : ''}">${fmtV(vm)}</span></span></div>`;
          })()
        : '';

      sessionEl.innerHTML = `
        <div class="row" style="margin-bottom:6px;"><strong style="font-size:14px;">📋 Session analyysi · ${fmtDateFi(anaDate)}</strong>
          <span style="font-size:11px; color:var(--muted);">${getGoal().short} · ${metricLabel()}</span></div>
        <div class="stat-pill-grid" style="grid-template-columns: repeat(2, 1fr);">
          <div class="stat-pill"><span class="stat-pill-label">Työsarjat / kaikki</span><span class="stat-pill-val">${work.length} / ${analyses.length}</span></div>
          ${readyHtml}
          <div class="stat-pill"><span class="stat-pill-label">Yli VL-rajan (hukka)</span><span class="stat-pill-val ${junk ? 'amber' : 'green'}">${junk}</span></div>
          <div class="stat-pill"><span class="stat-pill-label">Tonnimäärä</span><span class="stat-pill-val">${Math.round(tonnage)} kg</span></div>
        </div>
        <details class="details-toggle">
          <summary>▸ Lisätilastot (${stickPill ? 5 : 4})</summary>
          <div class="stat-pill-grid" style="margin-top:6px;">
            <div class="stat-pill"><span class="stat-pill-label">RQI työsarjat (ka.)</span><span class="stat-pill-val ${avgScore === null ? '' : avgScore >= 70 ? 'green' : avgScore >= 50 ? 'amber' : 'red'}">${avgScore === null ? '--' : avgScore}</span></div>
            <div class="stat-pill"><span class="stat-pill-label">Laadukkaat toistot</span><span class="stat-pill-val">${goodReps}</span></div>
            <div class="stat-pill"><span class="stat-pill-label">Efektiiviset toistot</span><span class="stat-pill-val">${cfg ? effReps : '--'}</span></div>
            <div class="stat-pill"><span class="stat-pill-label">Toistoja yhteensä</span><span class="stat-pill-val">${totalReps}</span></div>
            ${stickPill}
          </div>
        </details>
        ${readinessAdvice ? `<p class="vbt-verdict">${readinessAdvice}</p>` : ''}
        <div style="overflow-x:auto; margin-top:8px;">
          <table class="ana-table">
            <thead><tr><th>#</th><th>kg</th><th>%1RM</th><th>V<sub>best</sub></th><th>VL</th><th>RIR</th><th>Toist.</th><th>RQI</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <div style="font-size:11px; color:var(--muted); margin-top:6px; line-height:1.4;">Napauta sarjariviä avataksesi sarjan syväanalyysin. LÄ = lämmittely (&lt; 65 % 1RM).</div>`;

      sessionEl.querySelectorAll('.ana-set-row').forEach((tr) => {
        tr.addEventListener('click', () => {
          anaSelectedSetIdx = parseInt(tr.getAttribute('data-ana-set-idx'), 10) || 0;
          setAnaSubTab('sarjat');
        });
      });

      renderAnaSetDetailCard(sets);

      // Daily plan (Prilepin + VBT)
      if (planEl) {
        const plan = cfg ? computeDailyPlan(anaExercise, anaDate) : null;
        planEl.innerHTML = plan ? buildDailyPlanHTML(plan, { fullDetails: true }) + `
          <details class="details-toggle"><summary>▸ Prilepinin taulukko</summary>
            <table class="ana-table" style="margin-top:4px;"><thead><tr><th>%1RM</th><th>Toistot/sarja</th><th>Optimi</th><th>Väli</th></tr></thead>
            <tbody>${PRILEPIN.map((r) => `<tr><td>${r.label}</td><td>${r.repsMin}–${r.repsMax}</td><td>${r.opt}</td><td>${r.rangeLo}–${r.rangeHi}</td></tr>`).join('')}</tbody></table>
            <div style="font-size:11px; color:var(--muted); margin-top:4px; line-height:1.4;">%1RM lasketaan päivän nopeuspohjaisesta e1RM:stä, ei vanhasta testimaksimista. Toistot/sarja rajataan lisäksi VL-katkaisurajalla ja RIR-varmuudella, joten nopeasti väsyvä nostaja saa automaattisesti lyhyempiä sarjoja ja enemmän sarjoja.</div>
          </details>` : '';
      }

      // L–V profile
      if (cfg) {
        const sp = sessionProfile(anaExercise, anaDate);
        const showProf = sp.points.length >= 2 ? sp : (prof || sp);
        let body = '';
        if (showProf.points && showProf.points.length) {
          body += buildLVProfileSVG(showProf);
        }
        if (showProf.valid) {
          const [lo, hi] = getGoal().pctRange;
          const tgt = [lo, (lo + hi) / 2, hi].map((pc) => {
            const load = showProf.e1RM * pc / 100;
            return `<tr><td>${Math.round(pc)} %</td><td>${(Math.round(load / 2.5) * 2.5).toFixed(1)} kg</td><td>${fmtV(showProf.intercept + showProf.slope * load)} m/s</td></tr>`;
          }).join('');
          body += `
            <div class="stat-pill-grid" style="margin-top:6px;">
              <div class="stat-pill"><span class="stat-pill-label">e1RM @ MVT</span><span class="stat-pill-val" style="color:#f9a8d4;">${showProf.e1RM.toFixed(1)} kg</span></div>
              <div class="stat-pill"><span class="stat-pill-label">Luotettavuus (R²)</span><span class="stat-pill-val ${showProf.r2 >= 0.95 ? 'green' : showProf.r2 >= 0.85 ? 'amber' : 'red'}">${showProf.r2.toFixed(3)} · ${showProf.reliability}</span></div>
              <div class="stat-pill"><span class="stat-pill-label">Kulmakerroin</span><span class="stat-pill-val" style="font-size:13px;">${(showProf.slope * 10).toFixed(3)} m/s / 10 kg</span></div>
              <div class="stat-pill"><span class="stat-pill-label">V₀ / L₀ (teoreettiset)</span><span class="stat-pill-val" style="font-size:13px;">${fmtV(showProf.v0)} m/s · ${showProf.l0.toFixed(0)} kg</span></div>
            </div>
            <div style="font-size:12px; font-weight:700; margin:8px 0 4px;">Tavoitenopeudet (${getGoal().short}, ±0.03 m/s)</div>
            <table class="ana-table"><thead><tr><th>%1RM</th><th>Kuorma</th><th>V<sub>best</sub></th></tr></thead><tbody>${tgt}</tbody></table>`;
        } else {
          body += `<p class="vbt-verdict">${showProf.reason || 'Profiilia ei voitu muodostaa.'}</p>`;
        }
        profEl.innerHTML = `
          <div class="row" style="margin-bottom:4px;"><strong style="font-size:14px;">📈 Kuorma–nopeusprofiili</strong>
            <span style="font-size:11px; color:var(--muted);">${sp.points.length >= 2 ? fmtDateFi(anaDate) : (prof ? (prof.method === 'session' ? fmtDateFi(prof.date) : '28 pv yhdistetty') : fmtDateFi(anaDate))}</span></div>
          ${body}
          <div style="font-size:11px; color:var(--muted); margin-top:6px; line-height:1.4;">Jokaisen kuorman paras toisto (${metricLabel()}) → lineaarinen regressio → kuorma, jolla nopeus = MVT ${fmtV(getEffectiveMvt(anaExercise).value)} m/s (${getEffectiveMvt(anaExercise).label}).</div>`;
        const tr = e1rmTrend(anaExercise);
        trendEl.innerHTML = tr.length
          ? `<div class="row" style="margin-bottom:4px;"><strong style="font-size:14px;">🏆 e1RM-kehitys</strong><span style="font-size:11px; color:var(--muted);">● profiili ○ yksittäinen sarja</span></div>
             ${buildTrendSVG(tr.slice(-12))}
             ${tr.length >= 2 ? `<p class="vbt-verdict">Muutos ensimmäisestä: <strong class="${tr[tr.length - 1].e1RM >= tr[0].e1RM ? 'green' : 'red'}">${(tr[tr.length - 1].e1RM - tr[0].e1RM >= 0 ? '+' : '') + (tr[tr.length - 1].e1RM - tr[0].e1RM).toFixed(1)} kg</strong> (${tr.length} sessiota).</p>` : ''}`
          : '';
      } else {
        profEl.innerHTML = '<div style="font-size:12px; color:var(--muted);">Kuorma–nopeusprofiili, MVT ja e1RM ovat käytössä jalkakyykylle, penkkipunnerrukselle ja maastavedolle.</div>';
        trendEl.innerHTML = '';
      }
      renderCycleCard();
      renderVbtSettingsCard();
      setAnaSubTab(anaSubTab);
    }

    function refreshBleDiagUI() {
      const sumEl = document.getElementById('bleDiagSummary');
      const listEl = document.getElementById('bleDiagList');
      if (sumEl) sumEl.textContent = `▸ BLE-diagnostiikka (${bleDiagLog.length})`;
      if (listEl) {
        const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        listEl.innerHTML = bleDiagLog.length
          ? bleDiagLog.slice().reverse().map((e) => `<div><span style="color:#93c5fd;">${esc(e.ts)}</span> [<strong>${esc(e.kind)}</strong>] ${esc(e.msg)}</div>`).join('')
          : 'Ei merkintöjä.';
      }
    }

    function renderVbtSettingsCard() {
      const el = document.getElementById('anaSettingsCard');
      if (!el) return;
      const cycKey = cycleGoalKey();
      const effectiveGoal = cycKey || vbtSettings.goal;
      const liftRows = Object.values(LIFT_ANALYSIS).map((c) => {
        const ex = c.id === 'squat' ? 'Jalkakyykky' : c.id === 'bench' ? 'Penkkipunnerrus' : 'Maastaveto';
        const eff = getEffectiveMvt(ex);
        const learned = learnedMvt(c.id);
        return `<tr>
          <td>${c.id === 'bench' ? 'Penkki' : c.name}</td>
          <td>${fmtV(c.mvt)}</td>
          <td>${learned !== null ? fmtV(learned) : '--'}</td>
          <td><input type="number" step="0.01" min="0.05" max="0.6" inputmode="decimal" data-mvt-lift="${c.id}" value="${vbtSettings.mvtOverride[c.id] || ''}" placeholder="auto" style="width:56px; padding:5px 3px; font-size:12px;"></td>
          <td><strong>${fmtV(eff.value)}</strong></td>
          <td style="white-space:nowrap;">${VBT_GOALS.peaking.vl[c.id]}/${VBT_GOALS.maxStrength.vl[c.id]}/${VBT_GOALS.baseStrength.vl[c.id]}</td>
        </tr>`;
      }).join('');
      const refMaxRows = Object.values(LIFT_ANALYSIS).map((c) => {

    // =====================================================================
    // ===  PÄIVÄN SUOSITUS: viitesarja (~70–80 %) → päivän e1RM →        ===
    // ===  Prilepin-volyymi + progressio + VBT-toistomäärä                ===
    // =====================================================================
    // Prilepinin taulukko (A. S. Prilepin, 1974): toistot/sarja, optimaalinen kokonaistoistomäärä ja vaihteluväli
    const PRILEPIN = [
      { lo: 0,  hi: 70,  label: '55–65 %', repsMin: 3, repsMax: 6, opt: 24, rangeLo: 18, rangeHi: 30 },
      { lo: 70, hi: 80,  label: '70–80 %', repsMin: 3, repsMax: 6, opt: 18, rangeLo: 12, rangeHi: 24 },
      { lo: 80, hi: 90,  label: '80–90 %', repsMin: 2, repsMax: 4, opt: 15, rangeLo: 10, rangeHi: 20 },
      { lo: 90, hi: 999, label: '90+ %',   repsMin: 1, repsMax: 2, opt: 7,  rangeLo: 4,  rangeHi: 10 }
    ];
    const REF_PCT_MIN = 65, REF_PCT_MAX = 88;   // viitesarjaksi kelpaava arvioitu %1RM

    function liftIncrement(cfg) { return cfg.id === 'bench' ? 2.5 : 5; }

      const t = new Date(iso + 'T12:00:00');
      t.setDate(t.getDate() + d);
      return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
    }

    // Sarjan toistomäärä päivän suunnitelmassa: käsin korjattu määrä, muuten kelvolliset + drift-toistot
    function planRepsOf(x) {
      const o = Number(x.set.repCountOverride);
      return o > 0 ? Math.round(o) : (x.a.completedCount ?? x.a.valid.length);
    }

    function computeDailyPlan(exercise, dateStr) {
      const cfg = getLiftCfg(exercise);
      if (!cfg || !exercise) return null;
      const g = getGoal();
      const [pLo, pHi] = g.pctRange;
      const mvt = getEffectiveMvt(exercise).value;
      const cutoff = getCutoffPct(exercise);
      const anchor1RM = getAnchor1RM(exercise);
      const histProf = recentProfile(exercise, addDaysIso(dateStr, -1)); // vain aiemmat päivät

      // --- historia: e1RM-lähtötaso (42 pv + kalibrointiankkuri) ja edellinen sessio ---
      const trend = e1rmTrend(exercise).filter((t) => t.date < dateStr && t.date >= addDaysIso(dateStr, -42));
      const trendMed = trend.length ? vbtMedian(trend.slice(-3).map((t) => t.e1RM)) : null;
      const baseline = trendMed && anchor1RM ? 0.65 * trendMed + 0.35 * anchor1RM : (trendMed || anchor1RM);
      const prevDates = [...new Set(setsForExercise(exercise, (d) => d < dateStr).map((x) => x.date))].sort().reverse();
      let last = null;
      for (const d of prevDates.slice(0, 8)) {
        const work = setsForExercise(exercise, (x) => x === d)
          .map(({ set }) => ({ set, a: analyzeSet(set.reps, exercise, set.weightKg, { profile: recentProfile(exercise, d), dateStr: d, touchAndGo: !!set.touchAndGo }) }))
          .filter((x) => !x.a.isWarmup && x.a.valid.length > 0 && x.a.pct1RM !== null && x.a.pct1RM >= pLo - 7.5);
        if (work.length) { last = { date: d, work }; break; }
      }
      // tyypillinen nopeuskustannus / toisto omista sarjoista (42 pv)
      const costsObs = setsForExercise(exercise, (d) => d <= dateStr && d >= addDaysIso(dateStr, -42))
        .map(({ set, date }) => analyzeSet(set.reps, exercise, set.weightKg, { dateStr: date, touchAndGo: !!set.touchAndGo }))
        .filter((a) => a.costSource === 'set' && !a.isWarmup).map((a) => a.cost);

      // --- tämän päivän sarjat & viitesarja ---
      const today = setsForExercise(exercise, (d) => d === dateStr)
        .map(({ set }) => ({ set, a: analyzeSet(set.reps, exercise, set.weightKg, { profile: histProf, dateStr, touchAndGo: !!set.touchAndGo }) }))
        .filter((x) => x.a.vBest);
      // viitesarjat = nousevan lämmittelyn viimeiset 62–79 % sarjat ennen varsinaisia työsarjoja;
      // toistuvat työsarjapainot tai raskaat (>79 %) työsarjat eivät muuta päivän viitesarjaa
      const todayWeightCounts = new Map();

        if (x.a.pct1RM < 62) continue;

          const prevRefW = refsAll[refsAll.length - 1].set.weightKg;
          const isRepeatedWorkWeight = (todayWeightCounts.get(x.set.weightKg) || 0) >= 2;
          const isHighFatigue = x.a.vlFinal !== null && x.a.vlFinal > cutoff + 5;
          if (x.set.weightKg <= prevRefW || isRepeatedWorkWeight || x.a.pct1RM > 79 || isHighFatigue) break;
        }
        if (x.a.pct1RM <= REF_PCT_MAX) refsAll.push(x);
      }
      if (!refsAll.length) {

        if (firstValid) refsAll.push(firstValid);
      }
      const refs = refsAll.sort((x, y) => y.set.weightKg - x.set.weightKg);

      const prevE1rm = (histProf && histProf.valid) ? histProf.e1RM : (baseline || anchor1RM);
      if (!refs.length) {

        }

      const calcRepsFor = (L) => {

      let lastInfo = null;
      let progression = null;
