    function renderLiveSet() {
      const weightKg = parseFloat(document.getElementById('weightInput').value) || 0;
      const target = parseInt(document.getElementById('targetRepsInput').value, 10) || 5;
      const count = currentReps.length;
      const last = currentReps[count - 1];
      const currentExercise = (activeSetMeta && setActive && activeSetMeta.exercise) ? activeSetMeta.exercise : getCurrentSelectedExerciseName();
      const activeWeight = (activeSetMeta && setActive && activeSetMeta.weightKg !== undefined) ? activeSetMeta.weightKg : weightKg;
      const dateStr = document.getElementById('workoutDate').value || todayISO();

      const uiState = getLiftUiState();
      const tabLift = document.getElementById('tabLift');
      if (tabLift) tabLift.dataset.state = uiState;

      document.body.classList.toggle('free-mode', isFreeMode());
      document.getElementById('modeGuidedBtn').classList.toggle('active', !isFreeMode());
      document.getElementById('modeFreeBtn').classList.toggle('active', isFreeMode());

      const clearBtn = document.getElementById('clearRepsBtn');
      if (clearBtn) clearBtn.classList.toggle('hidden', count === 0);

      // Analyze active/current set for hero view
      const prof = (!isFreeMode() && getLiftCfg(currentExercise)) ? recentProfile(currentExercise, dateStr) : null;
      const liveA = count > 0 ? analyzeSet(currentReps, currentExercise, activeWeight, { profile: prof, dateStr, touchAndGo: isLiveTouchAndGo(currentExercise) }) : null;
      const lastP = (liveA && liveA.valid.length) ? liveA.valid[liveA.valid.length - 1] : null;

      // Active hero view updates
      const alertEl = document.getElementById('vbtLiveAlert');
      const heroValEl = document.getElementById('heroVelVal');
      const heroSubEl = document.getElementById('heroSubLine');
      const liveCardEl = document.getElementById('liveSetCard');
      const kpiVlEl = document.getElementById('liveKpiVl');
      const kpiVlSubEl = document.getElementById('liveKpiVlSub');
      const kpiRirEl = document.getElementById('liveKpiRir');
      const kpiRirSubEl = document.getElementById('liveKpiRirSub');
      const miniBarsEl = document.getElementById('liveMiniBars');
      const repProgLbl = document.getElementById('repProgressLabel');
      const fill = document.getElementById('repProgressFill');
      const traceWarnEl = document.getElementById('liveTraceWarn');
      const extraHintEl = document.getElementById('liveExtraRepHint');
      const mergedWarnEl = document.getElementById('liveMergedWarn');

      let heroColor = '';
      let alertHtml = '';
      let alertClass = 'vbt-alert hidden';
      if (!isFreeMode() && liveA && !liveA.isWarmup && lastP) {
        if (liveA.mvt !== null && lastP.rir === 0) {
          heroColor = 'red';
          alertClass = 'vbt-alert red';
          alertHtml = `⛔ LOPETA – RIR ~0 (${fmtV(lastP.v)} m/s vs. MVT ${fmtV(liveA.mvt)})`;
        } else if (lastP.vl !== null && lastP.vl > liveA.cutoffPct) {
          heroColor = 'red';
          alertClass = 'vbt-alert amber';
          alertHtml = `🛑 LOPETA – VL ${lastP.vl.toFixed(0)} % > raja ${liveA.cutoffPct} %`;
        } else if ((lastP.vl !== null && lastP.vl >= liveA.cutoffPct * 0.5) || (lastP.rir !== null && lastP.rir <= 1)) {
          heroColor = 'amber';
        } else {
          heroColor = 'green';
        }
      } else if (last) {
        heroColor = 'green';
      }

      if (alertEl) {
        alertEl.className = alertClass;
        alertEl.textContent = alertHtml;
      }
      if (liveCardEl) {
        liveCardEl.classList.toggle('active-glow', uiState === 'active' && heroColor !== 'red');
      }

      if (heroValEl) {
        if (zeroing && autoStartAfterZero) {
          heroValEl.textContent = `${zeroCountdownSec}`;
          heroValEl.className = 'hero-vel amber';
        } else if (last) {
          heroValEl.textContent = repV(last).toFixed(2);
          heroValEl.className = 'hero-vel' + (heroColor ? ' ' + heroColor : '');
        } else {
          heroValEl.textContent = '--';
          heroValEl.className = 'hero-vel';
        }
      }

      if (heroSubEl) {
        if (zeroing && autoStartAfterZero) {
          heroSubEl.innerHTML = '<span>Kalibroidaan anturia – pidä tanko paikallaan</span>';
        } else if (last) {
          const parts = [];
          if (liveA && liveA.vBest) parts.push(`V<sub>best</sub> ${fmtV(liveA.vBest)} m/s`);
          parts.push(`${Math.round(last.power || 0)} W`);
          parts.push(`${Math.round(last.rangeOfMotionCm || 0)} cm`);
          if (last.loweringVelocity !== null) {
            const lCls = isControlled(last.loweringVelocity) ? 'green' : 'red';
            parts.push(`<span class="${lCls}">↓ ${last.loweringVelocity.toFixed(2)} m/s</span>`);
          }
          heroSubEl.innerHTML = parts.map((p) => `<span>${p}</span>`).join('');
        } else {
          heroSubEl.innerHTML = `<span>${currentExercise} · ${activeWeight} kg</span>`;
        }
      }

      if (kpiVlEl && kpiVlSubEl) {
        const vlNow = lastP ? lastP.vl : null;
        const vlCls = (vlNow === null || (liveA && liveA.isWarmup)) ? '' : (vlNow > liveA.redVl ? 'red' : (vlNow > liveA.cutoffPct ? 'amber' : 'green'));
        kpiVlEl.textContent = vlNow === null ? '--' : `${vlNow.toFixed(0)} %`;
        kpiVlEl.className = 'live-kpi-val' + (vlCls ? ' ' + vlCls : '');
        const cutPct = liveA ? liveA.cutoffPct : getCutoffPct(currentExercise);
        const cutV = (liveA && liveA.vCutoff) ? ` · stop ${fmtV(liveA.vCutoff)}` : '';
        kpiVlSubEl.textContent = `raja ${cutPct} %${cutV}`;
      }

      if (kpiRirEl && kpiRirSubEl) {
        const rirEnd = liveA ? liveA.rirEnd : null;
        const rirCls = (rirEnd === null || (liveA && liveA.isWarmup)) ? '' : (rirEnd <= 0 ? 'red' : (rirEnd <= 1 ? 'amber' : 'green'));
        kpiRirEl.textContent = rirEnd === null ? '--' : (rirEnd >= 10 ? '10+' : `~${rirEnd}`);
        kpiRirEl.className = 'live-kpi-val' + (rirCls ? ' ' + rirCls : '');
        if (liveA && liveA.isWarmup) {
          kpiRirSubEl.textContent = 'lämmittely';
        } else if (liveA && liveA.repsToCutoff !== null && liveA.stopAfterRep === null) {
          kpiRirSubEl.textContent = `~${liveA.repsToCutoff} toistoa rajaan`;
        } else if (liveA && liveA.stopAfterRep !== null) {
          kpiRirSubEl.textContent = 'VL-raja ylitetty';
        } else {
          const mvtInfo = getEffectiveMvt(currentExercise);
          kpiRirSubEl.textContent = mvtInfo ? `MVT ${fmtV(mvtInfo.value)} m/s` : 'ei MVT-rajaa';
        }
      }

      if (miniBarsEl) {
        miniBarsEl.innerHTML = buildMiniBarsHTML(currentReps, liveA, target, isFreeMode());
      }

      if (repProgLbl) {
        repProgLbl.textContent = isFreeMode() ? `${count} t` : `${count} / ${target}`;
      }
      if (fill) {
        const pct = Math.min(100, (count / Math.max(1, target)) * 100);
        fill.style.width = `${pct}%`;
        fill.className = 'progress-fill' + (count >= target ? ' done' : '');
      }
      if (extraHintEl) {
        const isRef = isReferenceSetContext(currentExercise, dateStr);
        const hint = (liveA && uiState === 'active' && setActive) ? extraRepHint(liveA, count, target, { isRef }) : null;
        extraHintEl.classList.toggle('hidden', !hint);
        extraHintEl.textContent = hint ? hint.text : '';
      }
      if (mergedWarnEl) {
        const mw = (!isFreeMode() && liveA)
          ? [
              ...(liveA.mergedReps || []).map(mergedWarnText),
              ...(liveA.driftReps || []).map(driftWarnText)
            ]
          : [];
        mergedWarnEl.classList.toggle('hidden', !mw.length);
        mergedWarnEl.innerHTML = mw.map((t) => `<div>${t}</div>`).join('');
      }
      if (traceWarnEl) {
        const showWarn = lastTraceFailed && lastTraceStatus;
        traceWarnEl.classList.toggle('hidden', !showWarn);
        traceWarnEl.textContent = showWarn ? lastTraceStatus : '';
      }

      renderContextAndSteppers();
      renderDailyPlanCard();
      renderRestSummaryCard();
      renderDoneSummaryCard();
      renderTodaySetsOnLiftTab();
      updateSetButton();
      updateHeaderStatus();
    }

    async function finishWorkout() {
      if (!confirm('Lopetetaanko treeni? Nykyinen sarja tallennetaan ja Pin-yhteys katkaistaan.')) {
        return;
      }
      // 1. Stop active set and save any unsaved reps
      if (setActive || zeroing) {
        await stopSetOnPin(true);
      } else if (currentReps.length > 0 && !currentSetSaved) {
        commitCurrentSetToWorkouts();
      }
      stopRestTimer();

      // 2. End Pin session cleanly (send 0x04 + 0x05 and disconnect) if connected
      if (dataChar || (bleDevice && bleDevice.gatt && bleDevice.gatt.connected)) {
        await disconnectPin();
      } else {
        stopBleKeepAlive();
        releaseScreenWakeLock();
      }

      // 3. Reset live set view, mark done state, and open Analyysi › Sessio
      const dateStr = document.getElementById('workoutDate').value || todayISO();
      const curEx = getCurrentSelectedExerciseName();
      currentReps = [];
      currentSetSaved = false;
      lastSavedSetRef = null;
      workoutDoneState = true;
      selectedHistoryDate = dateStr;
      document.getElementById('filterDateChk').checked = true;
      renderLiveSet();
      renderCalendar();
      renderHistoryList();

      const wToday = workouts.find((w) => w.date === dateStr);
      const todayExercises = wToday && wToday.sets ? wToday.sets.map((s) => s.exercise) : [];
      anaDate = dateStr;
      anaExercise = todayExercises.includes(curEx) ? curEx : (todayExercises[0] || null);
      showTab('analysis', 'sessio');
    }

    // --- Exercises Management ---
    function renderExerciseSelect(selectedVal) {
      const sel = document.getElementById('exerciseSelect');
      const targetVal = selectedVal || sel.value || exercises[0];
      sel.innerHTML = '';
      exercises.forEach((ex) => {
        const opt = document.createElement('option');
        opt.value = ex;
        opt.textContent = ex;
        sel.appendChild(opt);
      });
      const addOpt = document.createElement('option');
      addOpt.value = ADD_NEW_EX_VALUE;
      addOpt.textContent = '➕ Lisää uusi liike...';
      sel.appendChild(addOpt);

      if (exercises.includes(targetVal)) {
        sel.value = targetVal;
      } else if (exercises.length > 0) {
        sel.value = exercises[0];
      }
    }

    function addNewExercise(rawName) {
      const val = (rawName || '').trim();
      if (!val) return false;
      if (!exercises.includes(val)) {
        exercises.unshift(val);
        saveJSON(KEY_EXERCISES, exercises);
      }
      renderExerciseSelect(val);
      renderExerciseModal();
      return true;
    }

    function renderExerciseModal() {
      const container = document.getElementById('modalExerciseList');
      const currentSelected = document.getElementById('exerciseSelect').value;
      container.innerHTML = '';
      exercises.forEach((ex, i) => {
        const row = document.createElement('div');
        row.className = 'ex-row' + (ex === currentSelected ? ' selected-ex' : '');
        row.innerHTML = `
          <span style="cursor:pointer; flex:1; padding: 4px 0; font-weight: ${ex === currentSelected ? '700' : '500'};">
            ${ex === currentSelected ? '✓ ' : ''}${ex}
          </span>
          <button type="button" class="danger" style="padding:5px 10px; font-size:12px; flex-shrink:0;">Poista</button>
        `;
        row.querySelector('span').addEventListener('click', () => {
          renderExerciseSelect(ex);
          renderLiveSet();
          document.getElementById('exerciseModal').classList.add('hidden');
        });
        row.querySelector('button').addEventListener('click', (e) => {
          e.stopPropagation();
          exercises.splice(i, 1);
          if (exercises.length === 0) exercises.push(...DEFAULT_EXERCISES);
          saveJSON(KEY_EXERCISES, exercises);
          renderExerciseSelect();
          renderLiveSet();
          renderExerciseModal();
        });
        container.appendChild(row);
      });
    }

    // --- Calendar & History ---
    function renderCalendar() {
      const monthNames = [
        'Tammikuu', 'Helmikuu', 'Maaliskuu', 'Huhtikuu', 'Toukokuu', 'Kesäkuu',
        'Heinäkuu', 'Elokuu', 'Syyskuu', 'Lokakuu', 'Marraskuu', 'Joulukuu'
      ];
      document.getElementById('calMonthLabel').textContent = `${monthNames[calMonth]} ${calYear}`;
      const grid = document.getElementById('calDays');
      grid.innerHTML = '';

      const firstDay = new Date(calYear, calMonth, 1);
      const startOffset = (firstDay.getDay() + 6) % 7; // Monday = 0
      const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
      const workoutDates = new Set(workouts.filter((w) => w.sets.length > 0).map((w) => w.date));

      for (let i = 0; i < startOffset; i++) {
        grid.appendChild(document.createElement('div'));
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const iso = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const cell = document.createElement('div');
        cell.className = 'cal-day'
          + (iso === selectedHistoryDate ? ' selected' : '')
          + (workoutDates.has(iso) ? ' has-workout' : '');
        cell.textContent = d;
        cell.addEventListener('click', () => {
          selectedHistoryDate = iso;
          document.getElementById('filterDateChk').checked = true;
          renderCalendar();
          renderHistoryList();
        });
        grid.appendChild(cell);
      }
    }

    function getFilteredWorkouts() {
      const onlyDate = document.getElementById('filterDateChk').checked;
      const sorted = [...workouts].sort((a, b) => b.date.localeCompare(a.date));
      return onlyDate ? sorted.filter((w) => w.date === selectedHistoryDate) : sorted;
    }

    function renderHistoryList() {
      const container = document.getElementById('historyContainer');
      const list = getFilteredWorkouts();
      if (list.length === 0) {
        container.innerHTML = `<div class="card" style="text-align:center; color:var(--muted);">Ei tallennettuja sarjoja valitulle päivälle.</div>`;
        return;
      }
      container.innerHTML = '';
      list.forEach((w) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.marginBottom = '10px';
        let html = `<div style="font-weight:700; margin-bottom:6px;">📅 ${w.date}</div>`;
        w.sets.forEach((s, sIdx) => {
          const bestVel = Math.max(0, ...s.reps.map((r) => r.meanVelocity));
          const avgVel = s.reps.length ? s.reps.reduce((a, r) => a + r.meanVelocity, 0) / s.reps.length : 0;
          const bestWatt = Math.max(0, ...s.reps.map((r) => r.power || 0));
          const romVals = s.reps.map((r) => Number(r.rangeOfMotionCm) || 0).filter((x) => x > 0);
          const avgRom = romVals.length ? romVals.reduce((a, b) => a + b, 0) / romVals.length : 0;
          const dropPct = calcVelocityDropPct(s.reps, s.exercise, w.date, { touchAndGo: !!s.touchAndGo });
          const ha = analyzeSet(s.reps, s.exercise, s.weightKg, { dateStr: w.date, touchAndGo: !!s.touchAndGo });
          const dropHtml = (dropPct !== null
            ? ` • VL paras→viim.: <strong class="${dropPct > ha.redVl ? 'red' : dropPct > ha.cutoffPct ? 'amber' : 'green'}">${dropPct.toFixed(1)} %</strong>`
            : '')
            + (ha.n ? ` • ${ha.isWarmup ? 'Lämmittely' : `Laatu <strong class="${ha.gradeClass}">${ha.score}/100</strong>`}` : '')
            + (ha.rirEnd !== null ? ` • RIR ~${ha.rirEnd}` : '');
          const est1RM = ha.e1RM || calcEpley1RM(s.weightKg, s.reps.length);
          const rmHtml = est1RM
            ? ` • e1RM${ha.e1RM ? ' (VBT)' : ' (Epley)'}: <strong style="color:#60a5fa;">${est1RM.toFixed(1)} kg</strong>`
            : '';
          const vbtHtml = (s.free ? ' • 📝 vapaa' : '') + (ha.pct1RM !== null ? ` • ~${Math.round(ha.pct1RM)} % 1RM` : '');
          const chartHtml = s.reps.length > 0
            ? `<div class="vel-chart" style="height:88px; margin-top:8px;">${buildVelocityChartHTML(s.reps, s.exercise)}</div>`
            : '';
          html += `
            <div class="history-set">
              <div class="row" style="gap: 8px;">
                <strong>#${sIdx + 1} ${s.exercise}</strong>
                <div style="display:flex; align-items:center; gap:8px;">
                  <span style="color:var(--muted); font-size:13px;">${s.weightKg} kg • ${setRepCount(s)}/${s.targetReps} toistoa</span>
                  <button type="button" class="danger" data-del-date="${w.date}" data-del-idx="${sIdx}" style="padding: 4px 8px; font-size: 11px; border-radius: 6px;">🗑 Poista</button>
                </div>
              </div>
              <div style="font-size:13px; color:var(--muted); margin-top:4px;">
                Paras: ${bestVel.toFixed(2)} m/s (${bestWatt.toFixed(1)} W) • Avg ROM ${avgRom.toFixed(0)} cm${vbtHtml}${dropHtml}${rmHtml}
              </div>
              ${chartHtml}
            </div>
          `;
        });
        card.innerHTML = html;
        card.querySelectorAll('[data-del-date]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const dStr = btn.getAttribute('data-del-date');
            const idx = parseInt(btn.getAttribute('data-del-idx'), 10);
            deleteSavedSet(dStr, idx);
          });
        });
        container.appendChild(card);
      });
    }

    // --- CSV Export ---
    function buildCSV() {
      const list = getFilteredWorkouts();
      const source = list.length > 0 ? list : workouts;
      const rows = [
        'date,time,exercise,set_number,weight_kg,target_reps,rep_number,movement_power_m_s,movement_power_w,vbt_strength_zone,controlled_lowering_m_s,lowering_status,rom_cm,set_velocity_drop_1st_to_last_pct,epley_1rm_kg,'
        + 'propulsive_velocity_m_s,propulsive_accel_m_s2,pause_before_ms,analysis_metric,rep_vl_from_best_pct,rep_est_rir,rep_quality,'
        + 'set_v_best_m_s,set_vl_final_pct,set_vl_cutoff_pct,set_mvt_m_s,set_est_pct_1rm,set_e1rm_vbt_kg,set_e1rm_epley_rir_kg,set_quality_score,set_warmup,set_touch_and_go,goal,'
        + 'rep_rqi,rep_flags,trace_mv_filtered_m_s,trace_v_peak_m_s,stick_height_cm,stick_vmin_m_s,stick_duration_ms,mid_vmin_m_s,bar_dx_max_cm,bar_path_dev_cm,bar_tilt_deg'
      ];
      source.forEach((w) => {
        w.sets.forEach((s, sIdx) => {
          const ex = `"${String(s.exercise).replace(/"/g, '""')}"`;
          const setDrop = calcFirstToLastDropPct(s.reps);
          const ca = analyzeSet(s.reps, s.exercise, s.weightKg, { profile: getLiftCfg(s.exercise) ? recentProfile(s.exercise, w.date) : null, dateStr: w.date, touchAndGo: !!s.touchAndGo });
          const f = (x, d) => (x === null || x === undefined || !Number.isFinite(x)) ? '' : x.toFixed(d);
          const setDropStr = setDrop !== null ? setDrop.toFixed(1) : '';
          const set1RM = calcEpley1RM(s.weightKg, setRepCount(s));
          const set1RMStr = set1RM !== null ? set1RM.toFixed(1) : '';
          s.reps.forEach((r, rIdx) => {
            const low = r.loweringVelocity !== null && r.loweringVelocity !== undefined ? r.loweringVelocity.toFixed(3) : '';
            const status = r.loweringVelocity !== null && r.loweringVelocity !== undefined
              ? (isControlled(r.loweringVelocity) ? 'GREEN' : 'RED')
              : '';
            const repZone = classifyVbtVelocity(s.exercise, r.meanVelocity);
            const zoneStr = repZone ? `"${repZone.label}"` : '';
            rows.push([
              w.date,
              s.time || '',
              ex,
              sIdx + 1,
              (Number(s.weightKg) || 0).toFixed(1),
              s.targetReps,
              rIdx + 1,
              (Number(r.meanVelocity) || 0).toFixed(3),
              (Number(r.power) || 0).toFixed(2),
              zoneStr,
              low,
              status,
              (Number(r.rangeOfMotionCm) || 0).toFixed(1),
              setDropStr,
              set1RMStr,
              f(r.propulsiveVelocity, 3),
              f(r.propulsiveAcceleration, 3),
              f(r.pauseMs, 0),
              metricLabel(),
              f(ca.perRep[rIdx].vl, 1),
              ca.perRep[rIdx].rir === null ? '' : ca.perRep[rIdx].rir,
              ca.perRep[rIdx].quality,
              f(ca.vBest, 3),
              f(ca.vlFinal, 1),
              ca.cutoffPct,
              f(ca.mvt, 3),
              f(ca.pct1RM, 1),
              f(ca.e1RM, 1),
              f(ca.epleyRir, 1),
              ca.score,
              ca.isWarmup ? 1 : 0,
              ca.tng ? 1 : 0,
              getGoal().key,
              f(ca.perRep[rIdx].rqi, 0),
              (ca.perRep[rIdx].flags || []).join('|'),
              r.trace ? f(r.trace.mvF, 3) : '',
              r.trace ? f(r.trace.vPeak, 3) : '',
              r.trace && r.trace.stick ? f(r.trace.stick.h, 1) : '',
              r.trace && r.trace.stick ? f(r.trace.stick.vmin, 3) : '',
              r.trace && r.trace.stick ? r.trace.stick.ms : '',
              r.trace && r.trace.midMin ? f(r.trace.midMin.v, 3) : '',
              r.trace ? f(r.trace.dxMax, 1) : '',
              f(ca.perRep[rIdx].pathDev, 1),
              r.trace ? f(r.trace.tilt, 1) : ''
            ].join(','));
          });
        });
      });
      return rows.join('\n');
    }

    async function exportCSV() {
      const csv = buildCSV();
      const filename = document.getElementById('filterDateChk').checked
        ? `gpath_${selectedHistoryDate}.csv`
        : 'gpath_workouts.csv';

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });

      // Save to local disk. On desktop/Android no share sheet is used.
      // Prefer the native "Save as" dialog where supported (Chromium desktop).
      if (window.showSaveFilePicker) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: filename,
            types: [{ description: 'CSV', accept: { 'text/csv': ['.csv'] } }],
          });
          const writable = await handle.createWritable();
          await writable.write(blob);
          await writable.close();
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return; // user cancelled
          // otherwise fall through to plain download
        }
      }
      // Fallback: regular file download to the device's Downloads folder.
      // iOS (Bluefy / WKWebView) ignores <a download>, so there the only way to
      // write a file to local storage is the system sheet ("Tallenna Tiedostoihin").
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isIOS) {
        const file = new File([blob], filename, { type: 'text/csv' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file] });
          } catch (err) {
            if (!err || err.name !== 'AbortError') {
              alert('CSV-tallennus epäonnistui: ' + (err && err.message ? err.message : err));
            }
          }
          return;
        }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // --- Event Listeners ---
    document.getElementById('workoutDate').value = todayISO();
    document.getElementById('workoutDate').addEventListener('change', () => {
      workoutDoneState = false;
      renderLiveSet();
    });

    renderExerciseSelect();
    renderLiveSet();
    renderCalendar();
    renderHistoryList();

    document.getElementById('connectBtn').addEventListener('click', connectPin);
    document.getElementById('mainSetActionBtn').addEventListener('click', () => {
      if (!dataChar) {
        connectPin();
      } else if (setActive || (zeroing && autoStartAfterZero)) {
        stopSetOnPin(true);
      } else {
        startSetOnPin();
      }
    });
    document.getElementById('finishWorkoutBtn').addEventListener('click', finishWorkout);
    document.getElementById('rezeroBtn').addEventListener('click', rezeroPin);

    // More (⋯) bottom sheet
    function closeMoreMenuSheet() { document.getElementById('moreMenuSheet').classList.add('hidden'); }
    document.getElementById('moreMenuBtn').addEventListener('click', () => {
      document.getElementById('menuRezeroBtn').classList.toggle('hidden', !(dataChar && !setActive && !zeroing && !bleConnecting));
      document.getElementById('clearRepsBtn').classList.toggle('hidden', currentReps.length === 0);
      document.getElementById('moreMenuSheet').classList.remove('hidden');
    });
    document.getElementById('closeMoreMenuBtn').addEventListener('click', closeMoreMenuSheet);
    document.getElementById('moreMenuSheet').addEventListener('click', (e) => {
      if (e.target.id === 'moreMenuSheet') closeMoreMenuSheet();
    });
    document.getElementById('menuOpenSettingsBtn').addEventListener('click', () => {
      closeMoreMenuSheet();
      document.getElementById('liftSettingsSheet').classList.remove('hidden');
    });
    document.getElementById('menuRezeroBtn').addEventListener('click', () => {
      closeMoreMenuSheet();
      rezeroPin();
    });
    document.getElementById('reloadAppBtn').addEventListener('click', () => {
      if ((setActive || (currentReps.length > 0 && !currentSetSaved)) && !confirm('Sarja on kesken. Päivitetäänkö sovellus silti?')) {
        return;
      }
      location.replace(location.pathname + '?v=' + Date.now());
    });
    document.getElementById('clearRepsBtn').addEventListener('click', () => {
      if (!confirm('Tyhjennetäänkö nykyisen sarjan toistot?')) return;
      closeMoreMenuSheet();
      currentReps = [];
      currentSetSaved = false;
      lastSavedSetRef = null;
      stopRestTimer();
      renderLiveSet();
    });

    // Lift settings bottom sheet
    function closeLiftSettingsSheet() { document.getElementById('liftSettingsSheet').classList.add('hidden'); }
    document.getElementById('openLiftSettingsBtn').addEventListener('click', () => {
      document.getElementById('liftSettingsSheet').classList.remove('hidden');
    });
    document.getElementById('closeLiftSettingsBtn').addEventListener('click', closeLiftSettingsSheet);
    document.getElementById('liftSettingsSheet').addEventListener('click', (e) => {
      if (e.target.id === 'liftSettingsSheet') closeLiftSettingsSheet();
    });
    document.getElementById('gotoVbtSettingsBtn').addEventListener('click', () => {
      closeLiftSettingsSheet();
      showTab('analysis', 'asetukset');
    });

    // Rest summary actions & set analysis bottom sheet
    document.getElementById('saveUnsavedSetBtn').addEventListener('click', () => {
      if (currentReps.length > 0 && !currentSetSaved) {
        commitCurrentSetToWorkouts(activeSetMeta);
        renderLiveSet();
      }
    });
    document.getElementById('restAnalyzeBtn').addEventListener('click', () => {
      const coords = lastSavedSetRef ? findSetCoordinates(lastSavedSetRef) : null;
      if (coords) openSetAnalysisSheet(coords.date, coords.sIdx);
    });
    document.getElementById('closeSetAnalysisSheetBtn').addEventListener('click', closeSetAnalysisSheet);
    document.getElementById('setAnalysisSheet').addEventListener('click', (e) => {
      if (e.target.id === 'setAnalysisSheet') closeSetAnalysisSheet();
    });
    document.getElementById('setAnalysisOpenInTabBtn').addEventListener('click', () => {
      if (!activeSheetSetRef) return;
      const { dateStr, setIdx } = activeSheetSetRef;
      closeSetAnalysisSheet();
      openSetInAnalysis(dateStr, setIdx);
    });

    // Undo toast
    document.getElementById('undoToastBtn').addEventListener('click', performUndo);

    document.getElementById('soundBtn').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').textContent = soundEnabled ? '🔊' : '🔇';
      if (soundEnabled) {
        ensureAudio();
        soundRep();
      }
    });

    function handleWeightChanged() {
      workoutDoneState = false;
      const newWeight = parseFloat(document.getElementById('weightInput').value) || 0;
      if (!currentSetSaved && currentReps.length > 0) {
        if (lastRepAt > 0 && (Date.now() - lastRepAt) > 10000) {
          // User finished previous set (>10 s ago) and is now setting weight for the next set:
          // auto-stop & save the completed set with its original weight!
          stopSetOnPin(true);
          return;
        }
        recalculateRepsPower(currentReps, newWeight);
        if (activeSetMeta) activeSetMeta.weightKg = newWeight;
      } else if (!currentSetSaved && activeSetMeta) {
        activeSetMeta.weightKg = newWeight;
      }
      renderLiveSet();
    }

    document.querySelectorAll('[data-weight-delta]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const input = document.getElementById('weightInput');
        const delta = parseFloat(btn.getAttribute('data-weight-delta'));
        input.value = Math.max(0, (parseFloat(input.value) || 0) + delta);
        handleWeightChanged();
      });
    });
    document.getElementById('weightInput').addEventListener('input', handleWeightChanged);
    document.getElementById('weightInput').addEventListener('change', handleWeightChanged);

    function handleTargetRepsChanged() {
      workoutDoneState = false;
      const newTarget = parseInt(document.getElementById('targetRepsInput').value, 10) || 5;
      if (!currentSetSaved && currentReps.length === 0 && activeSetMeta) {
        activeSetMeta.targetReps = newTarget;
      }
      renderLiveSet();
    }

    document.getElementById('repMinusBtn').addEventListener('click', () => {
      const input = document.getElementById('targetRepsInput');
      input.value = Math.max(1, (parseInt(input.value, 10) || 5) - 1);
      handleTargetRepsChanged();
    });
    document.getElementById('repPlusBtn').addEventListener('click', () => {
      const input = document.getElementById('targetRepsInput');
      input.value = (parseInt(input.value, 10) || 5) + 1;
      handleTargetRepsChanged();
    });
    document.getElementById('targetRepsInput').addEventListener('input', handleTargetRepsChanged);
    document.getElementById('targetRepsInput').addEventListener('change', handleTargetRepsChanged);
    document.getElementById('tngToggle').addEventListener('change', (e) => {
      if (!currentSetSaved && activeSetMeta && (currentReps.length === 0 || getLiftKey(activeSetMeta.exercise) === 'deadlift')) {
        activeSetMeta.touchAndGo = !!(getLiftKey(activeSetMeta.exercise) === 'deadlift' && e.target.checked);
      }
      renderLiveSet();
    });

    // Exercise selection & adding (both modal and inline on iOS)
    document.getElementById('exerciseSelect').addEventListener('change', (e) => {
      workoutDoneState = false;
      if (e.target.value === ADD_NEW_EX_VALUE) {
        const inlineForm = document.getElementById('inlineExerciseForm');
        inlineForm.classList.remove('hidden');
        renderExerciseSelect(exercises[0]);
        renderLiveSet();
        setTimeout(() => document.getElementById('inlineExerciseInput').focus(), 50);
      } else {
        // If previous set has unsaved reps, save it under its original exercise before switching!
        if (!currentSetSaved && currentReps.length > 0) {
          stopSetOnPin(true);
        } else if (activeSetMeta) {
          activeSetMeta.exercise = e.target.value;
        }
        renderLiveSet();
      }
    });

    document.getElementById('inlineExerciseForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('inlineExerciseInput');
      if (addNewExercise(input.value)) {
        input.value = '';
        input.blur();
        document.getElementById('inlineExerciseForm').classList.add('hidden');
        renderLiveSet();
      }
    });

    document.getElementById('cancelInlineExBtn').addEventListener('click', () => {
      document.getElementById('inlineExerciseForm').classList.add('hidden');
    });

    document.getElementById('editExercisesBtn').addEventListener('click', () => {
      closeLiftSettingsSheet();
      document.getElementById('exerciseFeedback').classList.add('hidden');
      renderExerciseModal();
      document.getElementById('exerciseModal').classList.remove('hidden');
    });

    document.getElementById('closeModalBtn').addEventListener('click', () => {
      document.getElementById('exerciseModal').classList.add('hidden');
    });

    document.getElementById('exerciseModal').addEventListener('click', (e) => {
      if (e.target.id === 'exerciseModal') {
        document.getElementById('exerciseModal').classList.add('hidden');
      }
    });

    function handleModalExerciseAdd(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('newExerciseInput');
      const val = input.value.trim();
      if (!val) return;
      addNewExercise(val);
      renderLiveSet();
      input.value = '';
      input.blur();
      const fb = document.getElementById('exerciseFeedback');
      fb.textContent = `✓ "${val}" lisätty ja valittu!`;
      fb.classList.remove('hidden');
    }

    document.getElementById('addExerciseForm').addEventListener('submit', handleModalExerciseAdd);
    document.getElementById('addExerciseBtn').addEventListener('click', handleModalExerciseAdd);

    document.getElementById('calPrevBtn').addEventListener('click', () => {
      calMonth--;
      if (calMonth < 0) { calMonth = 11; calYear--; }
      renderCalendar();
    });
    document.getElementById('calNextBtn').addEventListener('click', () => {
      calMonth++;
      if (calMonth > 11) { calMonth = 0; calYear++; }
      renderCalendar();
    });
    document.getElementById('filterDateChk').addEventListener('change', renderHistoryList);
    document.getElementById('exportCsvBtn').addEventListener('click', exportCSV);

    function showTab(name, subTab) {
      if (subTab) anaSubTab = subTab;
      const map = { lift: ['tabLift', 'navLiftBtn'], analysis: ['tabAnalysis', 'navAnalysisBtn'], history: ['tabHistory', 'navHistoryBtn'] };
      Object.entries(map).forEach(([k, [tabId, btnId]]) => {
        document.getElementById(tabId).classList.toggle('hidden', k !== name);
        document.getElementById(btnId).classList.toggle('active', k === name);
      });
      if (name === 'history') { renderCalendar(); renderHistoryList(); }
      if (name === 'analysis') renderAnalysisTab();
      if (name === 'lift') renderLiveSet();
      window.scrollTo(0, 0);
    }
    document.getElementById('navLiftBtn').addEventListener('click', () => showTab('lift'));
    document.getElementById('navHistoryBtn').addEventListener('click', () => showTab('history'));
    document.getElementById('navAnalysisBtn').addEventListener('click', () => showTab('analysis'));
    document.getElementById('anaExerciseSelect').addEventListener('change', (e) => { anaExercise = e.target.value; anaDate = null; anaSelectedSetIdx = 0; renderAnalysisTab(); });
    document.getElementById('anaDateSelect').addEventListener('change', (e) => { anaDate = e.target.value; anaSelectedSetIdx = 0; renderAnalysisTab(); });
    document.getElementById('anaSubTabs').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-ana-sub]');
      if (!btn) return;
      setAnaSubTab(btn.getAttribute('data-ana-sub'));
    });
    document.getElementById('dailyPlanCard').addEventListener('click', (e) => {
      const b = e.target.closest('[data-plan-apply]');
      if (!b) return;
      const [l, r] = b.getAttribute('data-plan-apply').split('|');
      applyPlanToSetup(parseFloat(l), parseInt(r, 10));
    });
    function setTrainingMode(mode) {
      if (setActive && mode !== vbtSettings.mode) {
        // keep the running set but apply the new mode from now on
      }
      vbtSettings.mode = mode;
      saveVbtSettings();
      renderLiveSet();
    }
    document.getElementById('modeGuidedBtn').addEventListener('click', () => setTrainingMode('guided'));
    document.getElementById('modeFreeBtn').addEventListener('click', () => setTrainingMode('free'));
  </script>
