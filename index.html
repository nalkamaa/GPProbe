      }).join('');
    }

    let openTodaySetIndices = new Set();

    function deleteSavedSet(dateStr, setIdx) {
      const wIdx = workouts.findIndex((w) => w.date === dateStr);
      if (wIdx === -1) return;
      const w = workouts[wIdx];
      if (!w.sets || setIdx < 0 || setIdx >= w.sets.length) return;
      const [removed] = w.sets.splice(setIdx, 1);
      if (w.sets.length === 0) {
        workouts.splice(wIdx, 1);
      }
      if (removed && lastSavedSetRef === removed) {
        currentReps = [];
        currentSetSaved = false;
        lastSavedSetRef = null;
      }
      const updated = new Set();
      openTodaySetIndices.forEach((i) => {
        if (i < setIdx) updated.add(i);
        else if (i > setIdx) updated.add(i - 1);
      });
      openTodaySetIndices = updated;

      saveJSON(KEY_WORKOUTS, workouts);
      renderLiveSet();
      renderCalendar();
      renderHistoryList();
    }

    function buildSetAnalysisHTML(s) {
      const reps = s.reps || [];
      const count = reps.length;
      if (count === 0) {
        return `<div style="color:var(--muted); font-size:12px; padding:6px 0;">Sarjassa ei ole toistoja.</div>`;
      }
      const bestVel = Math.max(0, ...reps.map((r) => r.meanVelocity || 0));
      const avgVel = count ? reps.reduce((a, r) => a + (r.meanVelocity || 0), 0) / count : 0;
      const bestWatt = Math.max(0, ...reps.map((r) => r.power || 0));
      const avgRom = count ? reps.reduce((a, r) => a + (r.rangeOfMotionCm || 0), 0) / count : 0;
      const dropPct = calcVelocityDropPct(reps, s.exercise);
      const est1RM = calcEpley1RM(s.weightKg, count);
      const setA = analyzeSet(reps, s.exercise, s.weightKg);

      const zone = classifyVbtVelocity(s.exercise, avgVel) || getVbtZoneForVelocity(s.exercise, avgVel);

      let zoneTitle = 'Voima-alue';
      let zoneSub = '';
      let zoneDesc = '';
      let zoneIcon = '🎯';
      let zoneClass = 'zone-acc';

      if (zone) {
        zoneTitle = zone.label;
        zoneSub = zone.subLabel || (zone.rangeText ? `Liikenopeusalue: ${zone.rangeText}` : '');
        zoneIcon = zone.icon || '🎯';
        zoneClass = zone.cssClass || 'zone-acc';

        switch (zone.key) {
          case 'max':
            zoneDesc = 'Sarja kohdistui <strong>maksimivoima-alueelle</strong>. Suuri ulkoinen vastus kehittää maksimaalista voimantuottoa, nopeiden motoristen yksiköiden rekrytointia ja hermolihasjärjestelmän käskytyskykyä.';
            break;
          case 'acc':
            zoneDesc = 'Sarja kohdistui <strong>voima-alueelle (perusvoima)</strong>. Ihanteellinen kuormitusalue voimatason ja lihasmassan (hypertrofia) kasvattamiseen sekä suoritusvarmuuden kehittämiseen.';
            break;
          case 'str-spd':
            zoneDesc = 'Sarja kohdistui <strong>nopeusvoiman voimapainotteiselle alueelle</strong> (tehoalue). Kehittää dynaamista tehoa (Watt), kykyä liikuttaa vastusta suurella kiihtyvyydellä ja parantaa voiman siirtonopeutta.';
            break;
          case 'spd-str':
            zoneDesc = 'Sarja kohdistui <strong>nopeusvoiman räjähtävälle alueelle</strong>. Maksimoi liikenopeuden ja hermoston syttymisnopeuden (RFD). Kehittää räjähtävyyttä ja elastista voimantuottoa.';
            break;
          default:
            zoneDesc = `Sarja kohdistui alueelle <strong>${zone.label}</strong>.`;
            break;
        }
      }

      // Toistojen jakauma osa-alueittain
      const zoneCounts = {};
      reps.forEach((r) => {
        const rz = classifyVbtVelocity(s.exercise, r.meanVelocity) || getVbtZoneForVelocity(s.exercise, r.meanVelocity);
        if (rz) {
          if (!zoneCounts[rz.key]) {
            zoneCounts[rz.key] = { label: rz.label, icon: rz.icon, count: 0, cssClass: rz.cssClass };
          }
          zoneCounts[rz.key].count++;
        }
      });

      const zonePillsHtml = Object.values(zoneCounts).map((zc) => {
        return `<span class="vbt-zone-badge ${zc.cssClass}" style="font-size:11px; padding:3px 8px;">${zc.icon} ${zc.label}: <strong>${zc.count} ${zc.count === 1 ? 'toisto' : 'toistoa'}</strong></span>`;
      }).join(' ');

      // Fatigue assessment
      let dropDesc = '';
      if (dropPct !== null) {
        const cut = setA.cutoffPct;
        const red = setA.redVl;
        if (dropPct <= cut) {
          dropDesc = `Nopeuden lasku pysyi tavoitteen (${getGoal().short}) VL-rajan ${cut} % sisällä – hermostollinen laatu säilyi, väsymys ja palautumistarve pienet.`;
        } else if (dropPct <= red) {
          dropDesc = `VL-raja ${cut} % ylittyi – viimeiset toistot kerryttivät enemmän väsymystä kuin maksimivoimaärsykettä. Katkaise sarja aiemmin.`;
        } else {
          dropDesc = `Nopeuden lasku yli ${red} % – keskushermoston väsymys ja tekniikan hajoamisen riski. Harjoitusvaikutus siirtyy kohti voimakestävyyttä ja palautuminen pitenee.`;
        }
      }

      // Rep table
      const repListRows = reps.map((r, rIdx) => {
        const rZone = classifyVbtVelocity(s.exercise, r.meanVelocity) || getVbtZoneForVelocity(s.exercise, r.meanVelocity);
        const pr = setA.perRep[rIdx];
        const repDrop = pr && pr.vl !== null ? pr.vl : null;
        const qDot = pr ? `<span class="q-dot" style="border-color:${Q_COLORS[pr.quality]}" title="${pr.quality}"></span>` : '';
        const rirHtml = pr && pr.rir !== null ? `<span style="color:var(--muted); font-size:11px;">RIR ~${pr.rir >= 10 ? '10+' : pr.rir}</span>` : '';
        const dropHtml = pr && pr.suspect
          ? '<span style="color:#64748b; font-size:11px;">epäilyttävä</span>'
          : (repDrop === null || (pr && pr.v >= pr.bestSoFar && rIdx === setA.vBestIdx))
            ? '<span style="color:var(--muted); font-size:11px;">paras</span>'
            : `<span class="${repDrop > setA.cutoffPct ? (repDrop > setA.redVl ? 'red' : 'amber') : 'green'}" style="font-size:11px; font-weight:600;">VL ${repDrop.toFixed(0)} %</span> ${rirHtml}`;
        const zoneBadge = rZone ? `<span class="vbt-zone-badge ${rZone.cssClass}" style="font-size:10px; padding:2px 6px;">${rZone.icon} ${rZone.label}</span>` : '';
        return `
          <div style="display:flex; align-items:center; justify-content:space-between; gap:6px; background:rgba(15,23,42,0.55); border:1px solid rgba(51,65,85,0.4); padding:5px 8px; border-radius:7px; font-size:12px; font-variant-numeric:tabular-nums; flex-wrap:wrap;">
            <span style="font-weight:700; color:var(--muted); width:38px;">${qDot}#${rIdx + 1}</span>
            <strong style="color:var(--text);">${r.meanVelocity.toFixed(2)} m/s</strong>
            <span style="color:var(--muted); font-size:11px;">${(r.power || 0).toFixed(0)} W</span>
            <span style="color:var(--muted); font-size:11px;">${(r.rangeOfMotionCm || 0).toFixed(0)} cm</span>
            <div>${dropHtml}</div>
            ${pr && pr.rqi !== null && pr.rqi !== undefined ? `<span style="color:var(--muted); font-size:11px;">RQI ${Math.round(pr.rqi)}</span>` : ''}
          </div>
        `;
      }).join('');

      return `
        <div class="today-set-detail-content" style="display:flex; flex-direction:column; gap:10px; margin-top:8px; padding-top:10px; border-top:1px solid var(--border);">
          
          <!-- Syvä VBT-laatuanalyysi -->
          ${buildVbtSetBlockHTML(s, s._date)}

          <!-- Tilastoruudukko -->
          <div class="stat-pill-grid">
            <div class="stat-pill">
              <span class="stat-pill-label">Keskinopeus</span>
              <span class="stat-pill-val">${avgVel.toFixed(2)} m/s</span>
            </div>
            <div class="stat-pill">
              <span class="stat-pill-label">Huipputeho</span>
              <span class="stat-pill-val">${bestWatt.toFixed(0)} W</span>
            </div>
            <div class="stat-pill">
              <span class="stat-pill-label">Liikerata (ROM)</span>
              <span class="stat-pill-val">${avgRom.toFixed(0)} cm</span>
            </div>
            <div class="stat-pill">
              <span class="stat-pill-label">Tonnimäärä</span>
              <span class="stat-pill-val">${Math.round((s.weightKg || 0) * count)} kg</span>
            </div>
          </div>

          <!-- Toistokohtainen erittely -->
          <div>
            <div class="row" style="margin-bottom:4px;">
              <span style="font-size:12px; font-weight:700; color:var(--text);">Toistoerittely</span>
              <span style="font-size:11px; color:var(--muted);">${count} toistoa</span>
            </div>
            <div style="display:flex; flex-direction:column; gap:4px;">
              ${repListRows}
            </div>
          </div>

        </div>
      `;
    }

        const dropPct = calcVelocityDropPct(s.reps, s.exercise);
        const qa = analyzeSet(s.reps, s.exercise, s.weightKg);
        const dropText = (dropPct !== null ? ` • VL ${dropPct.toFixed(0)} %` : '')
          + (qa.n ? ` • ${qa.isWarmup ? 'Lämmittely' : `Laatu <strong class="${qa.gradeClass}">${qa.score}</strong>`}` : '')
          + (qa.rirEnd !== null ? ` • RIR ~${qa.rirEnd}` : '');
        const rmText = qa.e1RM ? ` • e1RM <strong style="color:#60a5fa;">${qa.e1RM.toFixed(0)} kg</strong>` : '';
        const vbtText = (s.free ? ' • 📝 vapaa' : '') + (qa.pct1RM !== null ? ` • ~${Math.round(qa.pct1RM)} % 1RM` : '');
        const isOpen = openTodaySetIndices.has(idx);

        return `
          <div class="today-set-item ${isOpen ? 'expanded' : ''}" data-today-idx="${idx}">
            <div class="today-set-header">
              <div class="row" style="gap: 8px;">
                <div style="display:flex; align-items:center; gap:6px; min-width:0;">
                  <span class="today-set-chevron">${isOpen ? '▼' : '▶'}</span>
                  <strong style="font-size: 13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Sarja #${idx + 1}: ${s.exercise}</strong>
                </div>
                <div style="display:flex; align-items:center; gap:8px; flex-shrink:0;">
                  <span style="color: var(--muted); font-size: 12px;">${s.weightKg} kg • ${count}/${s.targetReps} toistoa</span>
                  <button type="button" class="danger" data-del-set-idx="${idx}" title="Poista sarja" style="padding: 3px 8px; font-size: 11px; border-radius: 6px;">🗑 Poista</button>
                </div>
              </div>
              <div class="row" style="font-size: 12px; color: var(--muted); margin-top: 3px; align-items: center;">
                <div style="min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                  Paras: ${bestVel.toFixed(2)} m/s${vbtText}${dropText}${rmText}
                </div>
                <span class="today-set-hint" style="font-size: 11px; color: var(--accent); font-weight: 600; flex-shrink:0;">
                  ${isOpen ? 'Sulje ▲' : 'Palkit & analyysi ▼'}
                </span>
              </div>
            </div>
            ${isOpen ? buildSetAnalysisHTML(Object.assign({ _date: dateStr }, s)) : ''}
          </div>
        `;
      }).join('');

      listEl.querySelectorAll('.today-set-item').forEach((itemEl) => {
        itemEl.addEventListener('click', (e) => {
          if (e.target.closest('[data-del-set-idx]')) return;
          const idx = parseInt(itemEl.getAttribute('data-today-idx'), 10);
          if (openTodaySetIndices.has(idx)) {
            openTodaySetIndices.delete(idx);
          } else {
            openTodaySetIndices.add(idx);
          }
          renderTodaySetsOnLiftTab();
        });
      });

      listEl.querySelectorAll('[data-del-set-idx]').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = parseInt(btn.getAttribute('data-del-set-idx'), 10);
          deleteSavedSet(dateStr, idx);
        });
      });
    }

    function renderVbtZoneBox(exerciseName, lastVel) {
      const box = document.getElementById('vbtZoneBox');
      const titleEl = document.getElementById('vbtTitleLabel');
      const mvtEl = document.getElementById('vbtMvtLabel');
      const gridEl = document.getElementById('vbtZoneGrid');
      const liveBadge = document.getElementById('liveVbtBadge');
      if (!box || !gridEl) return;

      const profile = getVbtProfileForExercise(exerciseName);
      if (!profile) {
        box.classList.add('hidden');
        gridEl.innerHTML = '';
        if (liveBadge) {
          liveBadge.classList.add('hidden');
          liveBadge.textContent = '';
        }
        return;
      }

      box.classList.remove('hidden');
      titleEl.textContent = `🎯 Voiman osa-alueet (${exerciseName})`;
      const effMvt = getEffectiveMvt(exerciseName);
      mvtEl.textContent = effMvt ? `Failure-raja (MVT): ${fmtV(effMvt.value)} m/s · ${effMvt.label}` : profile.mvtText;

      const activeZone = classifyVbtVelocity(exerciseName, lastVel);

      gridEl.innerHTML = profile.zones.map((z) => {
        const isSelected = selectedTargetVbtZoneKey === z.key;
        const isHit = activeZone && activeZone.key === z.key;
        const cls = 'vbt-zone-row'
          + (isSelected ? ' target-selected' : '')
          + (isHit ? ' active-hit' : '');
        return `
          <div class="${cls}" data-zone-key="${z.key}">
            <div style="display:flex; align-items:center; gap:6px; min-width:0;">
              <span>${z.icon}</span>
              <div style="display:flex; flex-direction:column; min-width:0;">
                <strong style="font-size:12px; color:var(--text);">${z.label}${isSelected ? ' (Tavoite)' : ''}${isHit ? ' ✓' : ''}</strong>
                <span style="font-size:11px; color:var(--muted);">Kuorma: ${z.subLabel}</span>
              </div>
            </div>
            <strong style="font-size:12px; white-space:nowrap;">${z.rangeText}</strong>
          </div>
        `;
      }).join('');

      gridEl.querySelectorAll('.vbt-zone-row').forEach((rowEl) => {
        rowEl.addEventListener('click', () => {
          const key = rowEl.getAttribute('data-zone-key');
          selectedTargetVbtZoneKey = (selectedTargetVbtZoneKey === key) ? null : key;
          renderLiveSet();
        });
      });

      if (liveBadge) {
        if (activeZone && lastVel !== null && lastVel !== undefined) {
          liveBadge.className = `vbt-zone-badge ${activeZone.cssClass}`;
          const mvtNote = (effMvt && lastVel < effMvt.value) ? ' (alle MVT!)' : '';
          liveBadge.textContent = `${activeZone.icon} ${activeZone.label}${mvtNote}`;
          liveBadge.classList.remove('hidden');
        } else if (selectedTargetVbtZoneKey) {
          const targetZ = profile.zones.find((z) => z.key === selectedTargetVbtZoneKey);
          if (targetZ) {
            liveBadge.className = `vbt-zone-badge ${targetZ.cssClass}`;
            liveBadge.textContent = `🎯 Tavoite: ${targetZ.label} (${targetZ.rangeText})`;
            liveBadge.classList.remove('hidden');
          } else {
            liveBadge.classList.add('hidden');
          }
        } else {
          liveBadge.classList.add('hidden');
          liveBadge.textContent = '';
        }
      }
    }

    function renderLiveSet() {
      const weightKg = parseFloat(document.getElementById('weightInput').value) || 0;
      const target = parseInt(document.getElementById('targetRepsInput').value, 10) || 5;
      const count = currentReps.length;
      const last = currentReps[count - 1];
      const displaySetNum = getActiveSetDisplayNumber();
      const currentExercise = getCurrentSelectedExerciseName();

      document.body.classList.toggle('free-mode', isFreeMode());
      document.getElementById('modeGuidedBtn').classList.toggle('active', !isFreeMode());
      document.getElementById('modeFreeBtn').classList.toggle('active', isFreeMode());

      const badge = document.getElementById('setNumberBadge');
      const nextNum = getCompletedSetsForCurrentDate().length + 1;
      if (currentSetSaved && count > 0) {
        badge.textContent = `✓ Sarja #${displaySetNum} tallennettu (Seuraava: #${nextNum})`;
        badge.className = 'set-badge saved';
      } else {
        badge.textContent = setActive ? `● Sarja #${displaySetNum} käynnissä` : `Sarja #${displaySetNum}`;
        badge.className = 'set-badge';
      }

      const readinessEl = document.getElementById('readinessBanner');
      if (readinessEl) {
        if (!dataChar) {
          readinessEl.className = 'readiness-banner';
          readinessEl.textContent = '⚪ Yhdistä Pin yläkulmasta aloittaaksesi';
        } else if (zeroing) {
          readinessEl.className = 'readiness-banner calibrating';
          readinessEl.textContent = `⏳ Kalibroidaan anturia (${zeroCountdownSec} s) – pidä painopakka paikallaan...`;
        } else if (setActive) {
          readinessEl.className = 'readiness-banner active-set';
          readinessEl.textContent = `🟢 SARJA #${displaySetNum} KÄYNNISSÄ – TEE TOISTOJA NYT!`;
        } else if (currentSetSaved && count > 0) {
          readinessEl.className = 'readiness-banner ready-to-start';
          readinessEl.textContent = `✅ Sarja #${displaySetNum} valmis! Paina "▶ Aloita sarja #${nextNum}" kun aloitat seuraavan`;
        } else {
          readinessEl.className = 'readiness-banner ready-to-start';
          readinessEl.textContent = `✅ PIN VALMIS – Paina "▶ Aloita sarja #${nextNum}" ja aloita nostaminen!`;
        }
      }

      const metricsRow = document.getElementById('liveMetricsRow');
      if (metricsRow) {
        if (last) {
          metricsRow.classList.remove('hidden');
          const lastVelEl = document.getElementById('liveLastVel');
          if (lastVelEl) lastVelEl.textContent = `${last.meanVelocity.toFixed(2)} m/s`;
          const lastWattsEl = document.getElementById('liveLastWatts');
          if (lastWattsEl) lastWattsEl.textContent = `${last.power.toFixed(0)} W`;
          const lastRomEl = document.getElementById('liveLastRom');
          if (lastRomEl) lastRomEl.textContent = `${last.rangeOfMotionCm.toFixed(0)} cm`;
          const lastLowEl = document.getElementById('liveLastLowering');
          if (lastLowEl) {
            lastLowEl.textContent = last.loweringVelocity !== null ? `${last.loweringVelocity.toFixed(2)} m/s` : '-- m/s';
            lastLowEl.className = isControlled(last.loweringVelocity) ? 'green' : (last.loweringVelocity !== null ? 'red' : '');
          }
        } else {
          metricsRow.classList.add('hidden');
        }
      }

      const bannerEl = document.getElementById('velDropBanner');
      const liveA = renderVbtLiveCard();
      const dropPct = liveA ? liveA.vlFinal : null;
      if (bannerEl && count >= 2 && dropPct !== null && liveA) {
        const bestV = fmtV(liveA.vBest);
        const lastV = fmtV(liveA.valid[liveA.valid.length - 1].v);
        const cls = dropPct > liveA.redVl ? 'red' : (dropPct > liveA.cutoffPct ? 'amber' : 'green');
        bannerEl.classList.remove('hidden');
        bannerEl.innerHTML = `
          <span>Paras → viimeinen (${bestV} → ${lastV} m/s, ${metricLabel()})</span>
          <span class="${cls}">VL <strong>${dropPct.toFixed(1)} %</strong> / raja ${liveA.cutoffPct} %</span>
        `;
      } else if (bannerEl) {
        bannerEl.classList.add('hidden');
        bannerEl.innerHTML = '';
      }

      const chartEl = document.getElementById('velBarChart');
      if (chartEl) {
        chartEl.innerHTML = buildVelocityChartHTML(currentReps, currentExercise);
      }

      document.getElementById('repProgressLabel').textContent = isFreeMode() ? `Toistot: ${count}` : `Toistot: ${count} / ${target}`;
      const fill = document.getElementById('repProgressFill');
      const pct = Math.min(100, (count / Math.max(1, target)) * 100);
      fill.style.width = `${pct}%`;
      fill.className = 'progress-fill' + (count >= target ? ' done' : '');

      const listEl = document.getElementById('repList');
      listEl.innerHTML = '';
      const maxVel = Math.max(0.01, ...currentReps.map((r) => r.meanVelocity));

      currentReps.forEach((r, idx) => {
        const div = document.createElement('div');
        div.className = 'rep-item';
        const lowHtml = r.loweringVelocity !== null
          ? `<span class="${isControlled(r.loweringVelocity) ? 'green' : 'red'}">↓ ${r.loweringVelocity.toFixed(2)} m/s</span>`
          : `<span style="color:var(--muted)">↓ …</span>`;
        const pr = liveA ? liveA.perRep[idx] : null;
        const widthPct = Math.max(6, Math.round((r.meanVelocity / maxVel) * 100));
        const qDot = pr ? `<span class="q-dot" style="border-color:${Q_COLORS[pr.quality]}"></span>` : '';
        const vsFirstHtml = isFreeMode() ? '' : (pr && pr.suspect)
          ? `<span style="color:#64748b; font-size:12px;">epäilyttävä</span>`
          : (!pr || pr.vl === null || idx === liveA.vBestIdx)
            ? `<span style="color:var(--muted); font-size:12px;">paras</span>`
            : `<span class="${pr.vl > liveA.redVl ? 'red' : (pr.vl > liveA.cutoffPct ? 'amber' : 'green')}" style="font-size:12px; font-weight:600;">VL ${pr.vl.toFixed(0)} %</span>`
              + (pr.rir !== null ? ` <span style="color:var(--muted); font-size:12px;">RIR ~${pr.rir >= 10 ? '10+' : pr.rir}</span>` : '')
              + (pr.rqi !== null && pr.rqi !== undefined ? ` <span style="color:var(--muted); font-size:12px;">RQI ${Math.round(pr.rqi)}</span>` : '');
        const repVbt = getVbtZoneForVelocity(currentExercise, r.meanVelocity);
        const repVbtHtml = repVbt
          ? `<span style="font-size:11px; color:var(--muted); font-weight:600;">${repVbt.icon || ''} ${repVbt.label}</span>`
          : '';
        const repZoneClass = '';

        div.innerHTML = `
          <div class="rep-item-top" style="flex-wrap: wrap;">
            <span class="rep-num">${qDot}#${idx + 1}</span>
            <span><strong>${r.meanVelocity.toFixed(2)} m/s</strong> (${r.power.toFixed(1)} W)</span>
            ${vsFirstHtml}
            ${lowHtml}
            <span style="color:var(--muted)">${r.rangeOfMotionCm.toFixed(0)} cm</span>
            <button type="button" data-del-live-rep="${idx}" title="Poista toisto" style="padding: 2px 6px; font-size: 11px; border-radius: 6px; background: transparent; border: 1px solid var(--border); color: var(--muted);">✕</button>
          </div>
          <div class="rep-bar-track">
            <div class="rep-bar-fill ${repZoneClass}" style="width: ${widthPct}%;"></div>
          </div>
        `;
        div.querySelector('[data-del-live-rep]').addEventListener('click', () => {
          currentReps.splice(idx, 1);
          if (lastSavedSetRef && Array.isArray(lastSavedSetRef.reps)) {
            lastSavedSetRef.reps.splice(idx, 1);
            saveJSON(KEY_WORKOUTS, workouts);
            renderCalendar();
            renderHistoryList();
          }
          renderLiveSet();
        });
        listEl.appendChild(div);
      });

      renderSetupVbtForecast();
      renderDailyPlanCard();
      renderTodaySetsOnLiftTab();
      updateSetButton();
    }

    async function finishWorkout() {
      // 1. Stop active set and save any unsaved reps
      if (setActive || zeroing) {
        await stopSetOnPin(true);
      } else if (currentReps.length > 0 && !currentSetSaved) {
        commitCurrentSetToWorkouts();
      }

      // 2. End Pin session cleanly (send 0x04 + 0x05 and disconnect) if connected
      if (dataChar || (bleDevice && bleDevice.gatt && bleDevice.gatt.connected)) {
        await disconnectPin();
      } else {
        stopBleKeepAlive();
        releaseScreenWakeLock();
      }

      // 3. Reset live set view and open the Calendar & CSV workout summary tab
      const dateStr = document.getElementById('workoutDate').value || todayISO();
      currentReps = [];
      currentSetSaved = false;
      lastSavedSetRef = null;
      openTodaySetIndices.clear();
      selectedHistoryDate = dateStr;
      document.getElementById('filterDateChk').checked = true;
      renderLiveSet();
      renderCalendar();
      renderHistoryList();

      anaDate = dateStr;
      anaExercise = null;
      showTab('analysis');
    }

    // --- Exercises Management ---
    function renderExerciseSelect(selectedVal) {
      const sel = document.getElementById('exerciseSelect');
      const targetVal = selectedVal || sel.value || exercises[0];
      sel.innerHTML = '';
      exercises.forEach((ex) => {
        const opt = document.createElement('option');
        opt.value = ex;
        opt.textContent = ex;
        sel.appendChild(opt);
      });
      const addOpt = document.createElement('option');
      addOpt.value = ADD_NEW_EX_VALUE;
      addOpt.textContent = '➕ Lisää uusi liike...';
      sel.appendChild(addOpt);

      if (exercises.includes(targetVal)) {
        sel.value = targetVal;
      } else if (exercises.length > 0) {
        sel.value = exercises[0];
      }
    }

    function addNewExercise(rawName) {
      const val = (rawName || '').trim();
      if (!val) return false;
      if (!exercises.includes(val)) {
        exercises.unshift(val);
        saveJSON(KEY_EXERCISES, exercises);
      }
      renderExerciseSelect(val);
      renderExerciseModal();
      return true;
    }

    function renderExerciseModal() {
      const container = document.getElementById('modalExerciseList');
      const currentSelected = document.getElementById('exerciseSelect').value;
      container.innerHTML = '';
      exercises.forEach((ex, i) => {
        const row = document.createElement('div');
        row.className = 'ex-row' + (ex === currentSelected ? ' selected-ex' : '');
        row.innerHTML = `
          <span style="cursor:pointer; flex:1; padding: 4px 0; font-weight: ${ex === currentSelected ? '700' : '500'};">
            ${ex === currentSelected ? '✓ ' : ''}${ex}
          </span>
          <button type="button" class="danger" style="padding:5px 10px; font-size:12px; flex-shrink:0;">Poista</button>
        `;
        row.querySelector('span').addEventListener('click', () => {
          renderExerciseSelect(ex);
          renderLiveSet();
          document.getElementById('exerciseModal').classList.add('hidden');
        });
        row.querySelector('button').addEventListener('click', (e) => {
          e.stopPropagation();
          exercises.splice(i, 1);
          if (exercises.length === 0) exercises.push(...DEFAULT_EXERCISES);
          saveJSON(KEY_EXERCISES, exercises);
          renderExerciseSelect();
          renderLiveSet();
          renderExerciseModal();
        });
        container.appendChild(row);
      });
    }

    // --- Calendar & History ---
    function renderCalendar() {
      const monthNames = [
        'Tammikuu', 'Helmikuu', 'Maaliskuu', 'Huhtikuu', 'Toukokuu', 'Kesäkuu',
        'Heinäkuu', 'Elokuu', 'Syyskuu', 'Lokakuu', 'Marraskuu', 'Joulukuu'
      ];
      document.getElementById('calMonthLabel').textContent = `${monthNames[calMonth]} ${calYear}`;
      const grid = document.getElementById('calDays');
      grid.innerHTML = '';

      const firstDay = new Date(calYear, calMonth, 1);
      const startOffset = (firstDay.getDay() + 6) % 7; // Monday = 0
      const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
      const workoutDates = new Set(workouts.filter((w) => w.sets.length > 0).map((w) => w.date));

      for (let i = 0; i < startOffset; i++) {
        grid.appendChild(document.createElement('div'));
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const iso = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const cell = document.createElement('div');
        cell.className = 'cal-day'
          + (iso === selectedHistoryDate ? ' selected' : '')
          + (workoutDates.has(iso) ? ' has-workout' : '');
        cell.textContent = d;
        cell.addEventListener('click', () => {
          selectedHistoryDate = iso;
          document.getElementById('filterDateChk').checked = true;
          renderCalendar();
          renderHistoryList();
        });
        grid.appendChild(cell);
      }
    }

    function getFilteredWorkouts() {
      const onlyDate = document.getElementById('filterDateChk').checked;
      const sorted = [...workouts].sort((a, b) => b.date.localeCompare(a.date));
      return onlyDate ? sorted.filter((w) => w.date === selectedHistoryDate) : sorted;
    }

    function renderHistoryList() {
      const container = document.getElementById('historyContainer');
      const list = getFilteredWorkouts();
      if (list.length === 0) {
        container.innerHTML = `<div class="card" style="text-align:center; color:var(--muted);">Ei tallennettuja sarjoja valitulle päivälle.</div>`;
        return;
      }
      container.innerHTML = '';
      list.forEach((w) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.marginBottom = '10px';
        let html = `<div style="font-weight:700; margin-bottom:6px;">📅 ${w.date}</div>`;
        w.sets.forEach((s, sIdx) => {
          const bestVel = Math.max(0, ...s.reps.map((r) => r.meanVelocity));
          const avgVel = s.reps.length ? s.reps.reduce((a, r) => a + r.meanVelocity, 0) / s.reps.length : 0;
          const bestWatt = Math.max(0, ...s.reps.map((r) => r.power));
          const avgRom = s.reps.length ? s.reps.reduce((a, r) => a + r.rangeOfMotionCm, 0) / s.reps.length : 0;
          const dropPct = calcVelocityDropPct(s.reps, s.exercise);
          const ha = analyzeSet(s.reps, s.exercise, s.weightKg);
          const dropHtml = (dropPct !== null
            ? ` • VL paras→viim.: <strong class="${dropPct > ha.redVl ? 'red' : dropPct > ha.cutoffPct ? 'amber' : 'green'}">${dropPct.toFixed(1)} %</strong>`
            : '')
            + (ha.n ? ` • ${ha.isWarmup ? 'Lämmittely' : `Laatu <strong class="${ha.gradeClass}">${ha.score}/100</strong>`}` : '')
            + (ha.rirEnd !== null ? ` • RIR ~${ha.rirEnd}` : '');
          const est1RM = ha.e1RM || calcEpley1RM(s.weightKg, s.reps.length);
          const rmHtml = est1RM
            ? ` • e1RM${ha.e1RM ? ' (VBT)' : ' (Epley)'}: <strong style="color:#60a5fa;">${est1RM.toFixed(1)} kg</strong>`
            : '';
          const vbtHtml = (s.free ? ' • 📝 vapaa' : '') + (ha.pct1RM !== null ? ` • ~${Math.round(ha.pct1RM)} % 1RM` : '');
          const chartHtml = s.reps.length > 0
            ? `<div class="vel-chart" style="height:88px; margin-top:8px;">${buildVelocityChartHTML(s.reps, s.exercise)}</div>`
            : '';
          html += `
            <div class="history-set">
              <div class="row" style="gap: 8px;">
                <strong>#${sIdx + 1} ${s.exercise}</strong>
                <div style="display:flex; align-items:center; gap:8px;">
                  <span style="color:var(--muted); font-size:13px;">${s.weightKg} kg • ${s.reps.length}/${s.targetReps} toistoa</span>
                  <button type="button" class="danger" data-del-date="${w.date}" data-del-idx="${sIdx}" style="padding: 4px 8px; font-size: 11px; border-radius: 6px;">🗑 Poista</button>
                </div>
              </div>
              <div style="font-size:13px; color:var(--muted); margin-top:4px;">
                Paras: ${bestVel.toFixed(2)} m/s (${bestWatt.toFixed(1)} W) • Avg ROM ${avgRom.toFixed(0)} cm${vbtHtml}${dropHtml}${rmHtml}
              </div>
              ${chartHtml}
            </div>
          `;
        });
        card.innerHTML = html;
        card.querySelectorAll('[data-del-date]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const dStr = btn.getAttribute('data-del-date');
            const idx = parseInt(btn.getAttribute('data-del-idx'), 10);
            deleteSavedSet(dStr, idx);
          });
        });
        container.appendChild(card);
      });
    }

    // --- CSV Export ---
    function buildCSV() {
      const list = getFilteredWorkouts();
      const source = list.length > 0 ? list : workouts;
      const rows = [
        'date,time,exercise,set_number,weight_kg,target_reps,rep_number,movement_power_m_s,movement_power_w,vbt_strength_zone,controlled_lowering_m_s,lowering_status,rom_cm,set_velocity_drop_1st_to_last_pct,epley_1rm_kg,'
        + 'propulsive_velocity_m_s,propulsive_accel_m_s2,pause_before_ms,analysis_metric,rep_vl_from_best_pct,rep_est_rir,rep_quality,'
        + 'set_v_best_m_s,set_vl_final_pct,set_vl_cutoff_pct,set_mvt_m_s,set_est_pct_1rm,set_e1rm_vbt_kg,set_e1rm_epley_rir_kg,set_quality_score,set_warmup,set_touch_and_go,goal,'
        + 'rep_rqi,rep_flags,trace_mv_filtered_m_s,trace_v_peak_m_s,stick_height_cm,stick_vmin_m_s,stick_duration_ms,mid_vmin_m_s,bar_dx_max_cm,bar_path_dev_cm,bar_tilt_deg'
      ];
      source.forEach((w) => {
        w.sets.forEach((s, sIdx) => {
          const ex = `"${String(s.exercise).replace(/"/g, '""')}"`;
          const setDrop = calcFirstToLastDropPct(s.reps);
          const ca = analyzeSet(s.reps, s.exercise, s.weightKg, { profile: getLiftCfg(s.exercise) ? recentProfile(s.exercise, w.date) : null });
          const f = (x, d) => (x === null || x === undefined || !Number.isFinite(x)) ? '' : x.toFixed(d);
          const setDropStr = setDrop !== null ? setDrop.toFixed(1) : '';
          const set1RM = calcEpley1RM(s.weightKg, s.reps.length);
          const set1RMStr = set1RM !== null ? set1RM.toFixed(1) : '';
          s.reps.forEach((r, rIdx) => {
            const low = r.loweringVelocity !== null && r.loweringVelocity !== undefined ? r.loweringVelocity.toFixed(3) : '';
            const status = r.loweringVelocity !== null && r.loweringVelocity !== undefined
              ? (isControlled(r.loweringVelocity) ? 'GREEN' : 'RED')
              : '';
            const repZone = classifyVbtVelocity(s.exercise, r.meanVelocity);
            const zoneStr = repZone ? `"${repZone.label}"` : '';
            rows.push([
              w.date,
              s.time || '',
              ex,
              sIdx + 1,
              s.weightKg.toFixed(1),
              s.targetReps,
              rIdx + 1,
              r.meanVelocity.toFixed(3),
              r.power.toFixed(2),
              zoneStr,
              low,
              status,
              r.rangeOfMotionCm.toFixed(1),
              setDropStr,
              set1RMStr,
              f(r.propulsiveVelocity, 3),
              f(r.propulsiveAcceleration, 3),
              f(r.pauseMs, 0),
              metricLabel(),
              f(ca.perRep[rIdx].vl, 1),
              ca.perRep[rIdx].rir === null ? '' : ca.perRep[rIdx].rir,
              ca.perRep[rIdx].quality,
              f(ca.vBest, 3),
              f(ca.vlFinal, 1),
              ca.cutoffPct,
              f(ca.mvt, 3),
              f(ca.pct1RM, 1),
              f(ca.e1RM, 1),
              f(ca.epleyRir, 1),
              ca.score,
              ca.isWarmup ? 1 : 0,
              ca.tng ? 1 : 0,
              getGoal().key,
              f(ca.perRep[rIdx].rqi, 0),
              (ca.perRep[rIdx].flags || []).join('|'),
              r.trace ? f(r.trace.mvF, 3) : '',
              r.trace ? f(r.trace.vPeak, 3) : '',
              r.trace && r.trace.stick ? f(r.trace.stick.h, 1) : '',
              r.trace && r.trace.stick ? f(r.trace.stick.vmin, 3) : '',
              r.trace && r.trace.stick ? r.trace.stick.ms : '',
              r.trace && r.trace.midMin ? f(r.trace.midMin.v, 3) : '',
              r.trace ? f(r.trace.dxMax, 1) : '',
              f(ca.perRep[rIdx].pathDev, 1),
              r.trace ? f(r.trace.tilt, 1) : ''
            ].join(','));
          });
        });
      });
      return rows.join('\n');
    }

    async function exportCSV() {
      const csv = buildCSV();
      const filename = document.getElementById('filterDateChk').checked
        ? `gpath_${selectedHistoryDate}.csv`
        : 'gpath_workouts.csv';

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });

      // Save to local disk. On desktop/Android no share sheet is used.
      // Prefer the native "Save as" dialog where supported (Chromium desktop).
      if (window.showSaveFilePicker) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: filename,
            types: [{ description: 'CSV', accept: { 'text/csv': ['.csv'] } }],
          });
          const writable = await handle.createWritable();
          await writable.write(blob);
          await writable.close();
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return; // user cancelled
          // otherwise fall through to plain download
        }
      }
      // Fallback: regular file download to the device's Downloads folder.
      // iOS (Bluefy / WKWebView) ignores <a download>, so there the only way to
      // write a file to local storage is the system sheet ("Tallenna Tiedostoihin").
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isIOS) {
        const file = new File([blob], filename, { type: 'text/csv' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file] });
          } catch (err) {
            if (!err || err.name !== 'AbortError') {
              alert('CSV-tallennus epäonnistui: ' + (err && err.message ? err.message : err));
            }
          }
          return;
        }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // --- Event Listeners ---
    document.getElementById('workoutDate').value = todayISO();
    document.getElementById('workoutDate').addEventListener('change', () => {
      openTodaySetIndices.clear();
      renderLiveSet();
    });

    renderExerciseSelect();
    renderLiveSet();
    renderCalendar();
    renderHistoryList();

    document.getElementById('connectBtn').addEventListener('click', connectPin);
    document.getElementById('startSetBtn').addEventListener('click', startSetOnPin);
    document.getElementById('stopSetBtn').addEventListener('click', () => stopSetOnPin(true));
    document.getElementById('finishWorkoutBtn').addEventListener('click', finishWorkout);
    document.getElementById('reloadAppBtn').addEventListener('click', () => {
      location.replace(location.pathname + '?v=' + Date.now());
    });
    document.getElementById('clearRepsBtn').addEventListener('click', () => {
      currentReps = [];
      currentSetSaved = false;
      lastSavedSetRef = null;
      renderLiveSet();
    });

    document.getElementById('soundBtn').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').textContent = soundEnabled ? '🔊' : '🔇';
      if (soundEnabled) {
        ensureAudio();
        soundRep();
      }
    });

    function handleWeightChanged() {
      const newWeight = parseFloat(document.getElementById('weightInput').value) || 0;
      if (!currentSetSaved && currentReps.length > 0) {
        if (lastRepAt > 0 && (Date.now() - lastRepAt) > 10000) {
          // User finished previous set (>10 s ago) and is now setting weight for the next set:
          // auto-stop & save the completed set with its original weight!
          stopSetOnPin(true);
          return;
        }
        recalculateRepsPower(currentReps, newWeight);
        if (activeSetMeta) activeSetMeta.weightKg = newWeight;
      } else if (!currentSetSaved && activeSetMeta) {
        activeSetMeta.weightKg = newWeight;
      }
      renderLiveSet();
    }

    document.querySelectorAll('[data-weight-delta]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const input = document.getElementById('weightInput');
        const delta = parseFloat(btn.getAttribute('data-weight-delta'));
        input.value = Math.max(0, (parseFloat(input.value) || 0) + delta);
        handleWeightChanged();
      });
    });
    document.getElementById('weightInput').addEventListener('input', handleWeightChanged);
    document.getElementById('weightInput').addEventListener('change', handleWeightChanged);

    function handleTargetRepsChanged() {
      const newTarget = parseInt(document.getElementById('targetRepsInput').value, 10) || 5;
      if (!currentSetSaved && currentReps.length === 0 && activeSetMeta) {
        activeSetMeta.targetReps = newTarget;
      }
      renderLiveSet();
    }

    document.getElementById('repMinusBtn').addEventListener('click', () => {
      const input = document.getElementById('targetRepsInput');
      input.value = Math.max(1, (parseInt(input.value, 10) || 5) - 1);
      handleTargetRepsChanged();
    });
    document.getElementById('repPlusBtn').addEventListener('click', () => {
      const input = document.getElementById('targetRepsInput');
      input.value = (parseInt(input.value, 10) || 5) + 1;
      handleTargetRepsChanged();
    });
    document.getElementById('targetRepsInput').addEventListener('input', handleTargetRepsChanged);
    document.getElementById('targetRepsInput').addEventListener('change', handleTargetRepsChanged);

    // Exercise selection & adding (both modal and inline on iOS)
    document.getElementById('exerciseSelect').addEventListener('change', (e) => {
      if (e.target.value === ADD_NEW_EX_VALUE) {
        const inlineForm = document.getElementById('inlineExerciseForm');
        inlineForm.classList.remove('hidden');
        renderExerciseSelect(exercises[0]);
        renderLiveSet();
        setTimeout(() => document.getElementById('inlineExerciseInput').focus(), 50);
      } else {
        // If previous set has unsaved reps, save it under its original exercise before switching!
        if (!currentSetSaved && currentReps.length > 0) {
          stopSetOnPin(true);
        } else if (activeSetMeta) {
          activeSetMeta.exercise = e.target.value;
        }
        renderLiveSet();
      }
    });

    document.getElementById('inlineExerciseForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('inlineExerciseInput');
      if (addNewExercise(input.value)) {
        input.value = '';
        input.blur();
        document.getElementById('inlineExerciseForm').classList.add('hidden');
        renderLiveSet();
      }
    });

    document.getElementById('cancelInlineExBtn').addEventListener('click', () => {
      document.getElementById('inlineExerciseForm').classList.add('hidden');
    });

    document.getElementById('editExercisesBtn').addEventListener('click', () => {
      document.getElementById('exerciseFeedback').classList.add('hidden');
      renderExerciseModal();
      document.getElementById('exerciseModal').classList.remove('hidden');
    });

    document.getElementById('closeModalBtn').addEventListener('click', () => {
      document.getElementById('exerciseModal').classList.add('hidden');
    });

    document.getElementById('exerciseModal').addEventListener('click', (e) => {
      if (e.target.id === 'exerciseModal') {
        document.getElementById('exerciseModal').classList.add('hidden');
      }
    });

    function handleModalExerciseAdd(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('newExerciseInput');
      const val = input.value.trim();
      if (!val) return;
      addNewExercise(val);
      renderLiveSet();
      input.value = '';
      input.blur();
      const fb = document.getElementById('exerciseFeedback');
      fb.textContent = `✓ "${val}" lisätty ja valittu!`;
      fb.classList.remove('hidden');
    }

    document.getElementById('addExerciseForm').addEventListener('submit', handleModalExerciseAdd);
    document.getElementById('addExerciseBtn').addEventListener('click', handleModalExerciseAdd);

    document.getElementById('calPrevBtn').addEventListener('click', () => {
      calMonth--;
      if (calMonth < 0) { calMonth = 11; calYear--; }
      renderCalendar();
    });
    document.getElementById('calNextBtn').addEventListener('click', () => {
      calMonth++;
      if (calMonth > 11) { calMonth = 0; calYear++; }
      renderCalendar();
    });
    document.getElementById('filterDateChk').addEventListener('change', renderHistoryList);
    document.getElementById('exportCsvBtn').addEventListener('click', exportCSV);

    function showTab(name) {
      const map = { lift: ['tabLift', 'navLiftBtn'], analysis: ['tabAnalysis', 'navAnalysisBtn'], history: ['tabHistory', 'navHistoryBtn'] };
      Object.entries(map).forEach(([k, [tabId, btnId]]) => {
        document.getElementById(tabId).classList.toggle('hidden', k !== name);
        document.getElementById(btnId).classList.toggle('active', k === name);
      });
      if (name === 'history') { renderCalendar(); renderHistoryList(); }
      if (name === 'analysis') renderAnalysisTab();
      if (name === 'lift') renderLiveSet();
      window.scrollTo(0, 0);
    }
    document.getElementById('navLiftBtn').addEventListener('click', () => showTab('lift'));
    document.getElementById('navHistoryBtn').addEventListener('click', () => showTab('history'));
    document.getElementById('navAnalysisBtn').addEventListener('click', () => showTab('analysis'));
    document.getElementById('anaExerciseSelect').addEventListener('change', (e) => { anaExercise = e.target.value; anaDate = null; renderAnalysisTab(); });
    document.getElementById('anaDateSelect').addEventListener('change', (e) => { anaDate = e.target.value; renderAnalysisTab(); });
    document.getElementById('dailyPlanCard').addEventListener('click', (e) => {
      const b = e.target.closest('[data-plan-apply]');
      if (!b) return;
      const [l, r] = b.getAttribute('data-plan-apply').split('|');
      applyPlanToSetup(parseFloat(l), parseInt(r, 10));
    });
    function setTrainingMode(mode) {
      if (setActive && mode !== vbtSettings.mode) {
        // keep the running set but apply the new mode from now on
      }
      vbtSettings.mode = mode;
      saveVbtSettings();
      renderLiveSet();
    }
    document.getElementById('modeGuidedBtn').addEventListener('click', () => setTrainingMode('guided'));
    document.getElementById('modeFreeBtn').addEventListener('click', () => setTrainingMode('free'));
    document.getElementById('goalSelect').value = vbtSettings.goal;
    document.getElementById('goalSelect').addEventListener('change', (e) => {
      vbtSettings.goal = e.target.value;
      saveVbtSettings();
      onVbtSettingsChanged();
    });
  </script>
</body>
