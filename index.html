        const inc = liftIncrement(cfg);
        // Salli hallittu progressio enintään 85 % e1RM:ään asti, jos edellinen treeni tehtiin jo >= tavoitealueen ylärajalla puhtaasti
        const maxProgLoad = (lastLoad >= hiLoad - 2.5 && ok) ? Math.max(hiLoad, plateRound(e1RM * Math.min(85, hiPct + 5) / 100)) : hiLoad;
        const progLoad = ok ? lastLoad + inc : (tooFatigued ? lastLoad - inc : lastLoad);
        // Kaksinkertainen progressio (perusvoima / kerääminen): sama kuorma +1 toisto/sarja, kuormaa nostetaan vasta kun Prilepinin toistoraja on täynnä tai VL/RIR ei salli lisätoistoa
        const clampProg = (L) => Math.min(maxProgLoad, Math.max(loLoad, L));
        let repMode = g.key === 'baseStrength' && ok && !tooFatigued && prevPerSet < prilepinRow(lastLoad / e1RM * 100).repsMax - 1e-9;
        if (repMode && clampProg(lastLoad) !== lastLoad) repMode = false;
        if (repMode && calcRepsFor(lastLoad).cap <= Math.round(prevPerSet)) repMode = false;
        progression = { mode: repMode ? 'reps' : 'load', lastLoad, prevPerSet, loadAlt: clampProg(progLoad), ok, tooFatigued };
        // Salli hallittu progressio enintään 85 % e1RM:ään asti, jos edellinen treeni tehtiin jo >= tavoitealueen ylärajalla puhtaasti
        load = clampProg(repMode ? lastLoad : progLoad);
        lastInfo = { date: last.date, load: lastLoad, reps: lastReps, sets: last.work.length, meanScore, ok, tooFatigued, progLoad, repsPerSet: prevPerSet };
        const why = repMode ? `työsarjat VL-rajan sisällä ja RQI ka. ${meanScore.toFixed(0)}, toistoja ${prevPerSet.toFixed(1)}/sarja < Prilepin ${prilepinRow(lastLoad / e1RM * 100).repsMax} → toistoprogressio: sama kuorma, +1 toisto`
          : ok ? `kaikki työsarjat VL-rajan sisällä ja RQI ka. ${meanScore.toFixed(0)} → +${inc} kg`
          : tooFatigued ? `sarjat menivät liian väsyneiksi (RQI ka. ${meanScore.toFixed(0)}) → −${inc} kg`
            : `${overVl} sarjaa ylitti VL-rajan → sama kuorma`;
        let txt = `Edellinen treeni ${fmtDateFi(last.date)}: ${lastInfo.sets} työsarjaa @ ${lastLoad} kg (${lastReps} toistoa): ${why} = ${repMode ? lastLoad : progLoad} kg.`;
        if ((repMode ? lastLoad : progLoad) > maxProgLoad) txt += ` Rajattu päivän ylärajaan ${maxProgLoad} kg (${Math.round(maxProgLoad / e1RM * 100)} % päivän e1RM:stä).`;
        else if ((repMode ? lastLoad : progLoad) < loLoad) txt += ` Nostettu päivän tavoitealueen alarajaan ${loLoad} kg (${pLo} %).`;
        notes.push(txt);
      } else {
        notes.push(`Ei aiempaa työsarjadataa → kuorma = ${Math.round(targetPct)} % päivän e1RM:stä (${loLoad}–${hiLoad} kg).`);
      }

      // Jos nostaja on jo aloittanut työsarjat viitesarjan jälkeen eri työsarjapainolla (esim. 135 kg tai 90–95 kg),
      // suhteuta sarjamäärä ja Prilepin-alue todelliseen työsarjakuormaan
      const refIdx = today.indexOf(ref);
      const postRefWork = today.filter((x, i) => i > refIdx && !x.a.isWarmup && x.set.weightKg >= loLoad - 2.5);
      if (postRefWork.length) {
        const wCounts = new Map();
        postRefWork.forEach((x) => wCounts.set(x.set.weightKg, (wCounts.get(x.set.weightKg) || 0) + 1));
        const activeLoad = [...wCounts.entries()].sort((a, b) => b[1] - a[1] || b[0] - a[0])[0][0];
        if (Math.abs(activeLoad - load) >= 2.5 && activeLoad >= loLoad - 2.5 && activeLoad <= e1RM * 0.90) {
          load = activeLoad;
          progression = null;
        }
      }

      const pct = load / e1RM * 100;
      const row = prilepinRow(pct);

      // --- volyymi (Prilepin) valmiuden mukaan ---
      const cst = getCycleState(dateStr);
      const wave = cst && !cst.finished && !cst.notStarted ? cst.wave : 'opt';
      let volume = waveVolume(row, wave);
      if (cst && !cst.finished && !cst.notStarted) notes.push(`Jakso: ${cst.phase.label}, viikko ${cst.weekInBlock}/${cst.weeks} → Prilepin-${WAVE_LABELS[wave]} = ${volume} toistoa.`);
      if (readiness !== null && readiness <= -5) volume = Math.min(volume, row.rangeLo);
      else if (readiness !== null && readiness < -2) volume = Math.min(volume, Math.round((row.rangeLo + row.opt) / 2));

      // --- toistot / sarja ---
      const rc = calcRepsFor(load);
      const { v0, vCut, cost, costSrc, repsVL, repsRIR } = rc;
      let reps = rc.cap;
      if (progression && progression.mode === 'reps') {
        reps = Math.max(1, Math.min(Math.round(progression.prevPerSet) + 1, rc.cap));
        notes.push(reps > Math.round(progression.prevPerSet)
          ? `Toistoprogressio: sama kuorma ${load} kg, ${Math.round(progression.prevPerSet)} → ${reps} toistoa/sarja (raja min(Prilepin ${rc.row.repsMax}, VL ${repsVL}, RIR ${repsRIR}) = ${rc.cap}).`
          : `Toistoprogressio: sama kuorma ${load} kg, mutta VL-/RIR-ennuste ei salli lisätoistoa (min(Prilepin ${rc.row.repsMax}, VL ${repsVL}, RIR ${repsRIR}) = ${rc.cap}) → ${reps} toistoa/sarja.`);
      }
      reps = Math.max(1, reps);
      if (reps < row.repsMin) notes.push(`VBT rajoittaa: ennuste ${repsVL} toistoa ennen VL ${cutoff} % -rajaa → ${reps} toistoa/sarja (Prilepin ${row.repsMin}–${row.repsMax}).`);
      let sets = Math.max(2, Math.min(8, Math.round(volume / reps)));
      // Rajoita raskaiden kolmosten (tai lyhyempien sarjojen, ≥70 % 1RM) oletussarjamäärä realistiseksi (enintään 4 sarjaa, esim. 4×3 6×3:n sijaan)
      if (reps <= 3 && pct >= 70 && sets > 4) {
        sets = 4;
        volume = sets * reps;
        notes.push(`Raskaiden ${reps} toiston sarjojen (${Math.round(pct)} % 1RM) maksimisarjamäärä rajattu ${sets} × ${reps} = ${volume} toistoon hermostollisen kuormituksen hallitsemiseksi.`);
      } else if (pct >= 80 && sets > 4) {
        sets = 4;
        volume = sets * reps;
      }

      // --- tehty tänään ja sarjojen välinen väsymys / autoregulaatio (painon tai toistojen pudotus) ---
      const work = today.filter((x, i) => i > refIdx && !x.a.isWarmup);
      const doneReps = work.reduce((s, x) => s + planRepsOf(x), 0);
      const doneSets = work.length;
      // Jos nostaja tekee sarjoissa säännöllisesti eri toistomäärää kuin alkuperäinen suositus (esim. 5 toiston sarjoja 4×5×140),
      // huomioidaan nostajan käyttämä tavoitetoistomäärä ja -volyymi
      if (work.length > 0) {
        const firstWorkReps = planRepsOf(work[0]);
        const cappedFirst = Math.min(firstWorkReps, row.repsMax);
        if (cappedFirst > reps && firstWorkReps <= 8) {
          reps = cappedFirst; // tapaoverride saa nostaa toistot vain Prilepin-rajaan asti
          volume = sets * reps;
        } else {
          // Estä toistotavoitteen nousu kesken treenin yli nostajan jo tekemien puhtaiden työsarjojen
          const cleanWorkReps = work
            .filter((x) => !(x.a.vlFinal !== null && x.a.vlFinal > cutoff)
              && (x.a.rirEnd === null || x.a.rirEnd >= 2)
              && (!(Number(x.set.targetReps) > 0) || planRepsOf(x) >= Number(x.set.targetReps)))
            .map(planRepsOf)
            .filter((r) => r >= 1 && r <= 8);
          if (cleanWorkReps.length > 0) {
            const maxClean = Math.max(...cleanWorkReps);
            if (maxClean < reps) {
              reps = maxClean;
              sets = Math.max(2, Math.min(8, Math.round(volume / reps)));
              if ((reps <= 3 && pct >= 70 && sets > 4) || (pct >= 80 && sets > 4)) {
                sets = 4;
                volume = sets * reps;
              }
            }
          }
        }
      }
      reps = Math.max(1, Math.min(reps, row.repsMax));
      let adjust = null;
      if (work.length) {
        const lastW = work[work.length - 1];
        const vExp = predV(lastW.set.weightKg);
        const stickFail = cfg.stickFail || 0.18;
        const inc = liftIncrement(cfg);
        // Tarkista sarjojen välinen VL-kasvu ja kuolokohdan (V_min) hidastuminen
        const highVlSets = work.filter((x) => x.a.vlFinal !== null && x.a.vlFinal >= cutoff - 1.5);
        const stickSlowSets = work.filter((x) => {
          const vmin = x.a.stickSummary ? x.a.stickSummary.vminMin : null;
          return (vmin !== null && vmin <= stickFail + 0.05) || (x.a.rirEnd !== null && x.a.rirEnd <= 1);
        });
        const lastVmin = lastW.a.stickSummary ? lastW.a.stickSummary.vminMin : null;
        const lastOverRed = lastW.a.vlFinal !== null && lastW.a.vlFinal >= lastW.a.redVl;
        const lastOverCut = lastW.a.vlFinal !== null && lastW.a.vlFinal > cutoff;
        const lastNearFail = lastW.a.rirEnd === 0 || (lastOverCut && lastVmin !== null && lastVmin <= stickFail + 0.05);
        const lastTargetMet = Number(lastW.set.targetReps) > 0 && planRepsOf(lastW) >= Number(lastW.set.targetReps);
        const lastClean = !lastOverCut && (lastW.a.rirEnd === null || lastW.a.rirEnd >= 2);
        const missedReps = planRepsOf(lastW) < reps && !(lastTargetMet && lastClean);
        const vDropBetween = (work.length >= 2 && (work[0].a.vBest - lastW.a.vBest) >= 0.055) || (lastW.a.vBest < vExp - 0.06);
        const remRepsRaw = Math.max(0, volume - doneReps);
        // jäljellä olevat sarjat = ceil((tavoitevolyymi − tehdyt toistot) / toistoa per sarja) – huomioi ylimääräiset toistot
        const remSetsRaw = remRepsRaw > 0 ? Math.ceil(remRepsRaw / Math.max(1, reps)) : 0;

        if (remSetsRaw === 0 || remRepsRaw === 0) {
          // Päivän suunniteltu sarja-/toistotavoite on jo täynnä
          if (lastOverRed || lastNearFail) {
            const whyStop = [];
            if (lastW.a.vlFinal !== null) whyStop.push(`VL ${lastW.a.vlFinal.toFixed(1)} %`);
            if (lastVmin !== null) whyStop.push(`kuolokohta V<sub>min</sub> ${fmtV(lastVmin)} m/s`);
            if (lastW.a.rirEnd !== null) whyStop.push(`RIR ~${lastW.a.rirEnd}`);
            adjust = {
              type: 'down',
              load: plateRound(lastW.set.weightKg - inc * 2),
              reps,
              text: `Päivän tavoite (${doneSets} sarjaa / ${doneReps} toistoa) ja sarjakapasiteetti täynnä (${whyStop.join(' · ')}). Lopeta liike tähän.`
            };
          }
        } else if (lastOverRed || lastNearFail || missedReps || lastOverCut || vDropBetween || (doneSets >= 2 && (highVlSets.length >= 1 || stickSlowSets.length >= 1))) {
          // Tavoitteesta on vielä sarjoja/toistoja jäljellä (esim. 3/4 sarjaa tehty 4×5×140:stä), mutta nykyinen kuorma×toistot on liian kova:
          // Laske 1) kevennetty sarjapaino (back-off) täysille toistoille JA 2) lyhennetty toistomäärä samalla painolla
          const severeFatigue = lastOverRed || lastNearFail || missedReps;
          const dropKg = severeFatigue
            ? Math.max(inc * 2, plateRound(lastW.set.weightKg * 0.065))
            : Math.max(inc, plateRound(lastW.set.weightKg * 0.04));
          const backoffLoad = Math.max(plateRound(e1RM * 0.65), lastW.set.weightKg - dropKg);
          const safeStopRep = (lastW.a.stopAfterRep !== null && lastW.a.stopAfterRep < lastW.a.valid.length)
            ? lastW.a.stopAfterRep
            : (lastW.a.valid.length - (severeFatigue ? 2 : 1));
          const reducedReps = Math.max(1, Math.min(reps - 1, safeStopRep));
          const setsAtReduced = Math.min(remSetsRaw + 1, Math.max(1, Math.ceil(remRepsRaw / reducedReps)));

          const whyReg = [];
          if (missedReps) whyReg.push(`edellinen sarja jäi ${lastW.a.completedCount ?? lastW.a.valid.length}/${reps} toistoon`);
          if (lastW.a.vlFinal !== null && lastW.a.vlFinal >= cutoff - 1.5) whyReg.push(`VL ${lastW.a.vlFinal.toFixed(1)} %`);
          if (lastVmin !== null && lastVmin <= stickFail + 0.06) whyReg.push(`kuolokohta V<sub>min</sub> ${fmtV(lastVmin)} m/s`);
          if (lastW.a.rirEnd !== null && lastW.a.rirEnd <= 1) whyReg.push(`RIR ~${lastW.a.rirEnd}`);
          if (!whyReg.length && vDropBetween) whyReg.push(`V<sub>best</sub> ${fmtV(lastW.a.vBest)} m/s hidastunut`);

          adjust = {
            type: 'down',
            load: backoffLoad,
            reps,
            backoffOption: { load: backoffLoad, reps, sets: remSetsRaw },
            repDropOption: { load: lastW.set.weightKg, reps: reducedReps, sets: setsAtReduced },
            shortReason: `⚠ Väsymysraja ${doneSets}. sarjassa (${whyReg.join(' · ')})`,
            text: `Väsymysraja ${doneSets}. sarjassa (${whyReg.join(' · ')}) – jäljellä ${remSetsRaw} × ${reps} (${remRepsRaw} toistoa) päivän tavoitteesta:<br>` +
              `• <strong>Vaihtoehto A (kevennä painoa):</strong> pudota <strong>${backoffLoad} kg × ${reps}</strong> (${remSetsRaw} ${remSetsRaw === 1 ? 'sarja' : 'sarjaa'})<br>` +
              `• <strong>Vaihtoehto B (vähennä toistoja):</strong> pidä <strong>${lastW.set.weightKg} kg × ${reducedReps}</strong> (${setsAtReduced} ${setsAtReduced === 1 ? 'sarja' : 'sarjaa'})` +
              (doneReps >= row.rangeLo && severeFatigue ? `<br>• <em>Prilepinin minimivolyymi (${row.rangeLo} toistoa) on jo täynnä, joten voit myös lopettaa liikkeen tähän.</em>` : '')
          };
          notes.push(`Autoregulaatio (${doneSets}/${sets} sarjaa tehty): täytä loppupäivän tavoite (${remRepsRaw} toistoa) joko keventämällä kuormaa ${backoffLoad} kg × ${reps} tai lyhentämällä sarjaa ${lastW.set.weightKg} kg × ${reducedReps}.`);
        } else if (lastW.a.vBest > vExp + 0.06 && lastW.set.weightKg + inc <= plateRound(e1RM * pHi / 100)) {
          adjust = {
            type: 'up',
            load: lastW.set.weightKg + inc,
            reps,
            text: `Viimeinen työsarja kulki ${fmtV(lastW.a.vBest)} m/s (odotus ${fmtV(vExp)}) → voit nostaa ${lastW.set.weightKg + inc} kg:aan.`
          };
        }
      }
      const remainingReps = Math.max(0, volume - doneReps);
      const remainingSets = remainingReps > 0 ? Math.ceil(remainingReps / Math.max(1, reps)) : 0;

      // --- vaihtoehtoinen progressio (toisto- vs. kuormaprogressio) ---
      let alt = null;
      if (progression) {
        const volFor = (rowX) => {
          let v = waveVolume(rowX, wave);
          if (readiness !== null && readiness <= -5) v = Math.min(v, rowX.rangeLo);
          else if (readiness !== null && readiness < -2) v = Math.min(v, Math.round((rowX.rangeLo + rowX.opt) / 2));
          return v;
        };
        const setsFor = (rowX, pctX, repsX) => {
          let n = Math.max(2, Math.min(8, Math.round(volFor(rowX) / repsX)));
          if ((repsX <= 3 && pctX >= 70 && n > 4) || (pctX >= 80 && n > 4)) n = 4;
          return n;
        };
        if (progression.mode === 'reps' && progression.loadAlt !== load) {
          const rA = calcRepsFor(progression.loadAlt);
          alt = { kind: 'load', load: progression.loadAlt, reps: rA.cap, sets: setsFor(rA.row, rA.pct, rA.cap) };
        } else if (progression.mode === 'load' && !progression.tooFatigued && progression.lastLoad === load) {
          // kuormaprogressio valittu mutta sama kuorma ei noussut → ei erillistä vaihtoehtoa
        } else if (progression.mode === 'load' && !progression.tooFatigued) {
          const rA = calcRepsFor(progression.lastLoad);
          if (g.key === 'baseStrength' && progression.prevPerSet < rA.row.repsMax - 1e-9) {
            const rr = Math.max(1, Math.min(Math.round(progression.prevPerSet) + 1, rA.cap));
            if (rr > Math.round(progression.prevPerSet)) {
              alt = { kind: 'reps', load: progression.lastLoad, reps: rr, sets: setsFor(rA.row, rA.pct, rr) };
            }
          }
        }
        if (alt && alt.load === load && alt.reps === reps) alt = null;
      }

      return {
        stage: 'plan', exercise, cfg, goal: g, e1RM, e1Src, baseline, readiness, ref, load, pct, row, volume,
        reps, sets, v0, vCut, cutoff, mvt, cost, costSrc, repsVL, repsRIR, notes, lastInfo,
        doneReps, doneSets, remainingSets, remainingReps, adjust, loLoad, hiLoad, progression, alt, ownCost: rc.ownCost
      };
    }

    function planAltHTML(plan, opts = {}) {
      if (!plan || !plan.alt) return '';
      const a = plan.alt;
      const lbl = a.kind === 'load' ? 'kuormaprogressio' : 'toistoprogressio';
      const btn = opts.withButtons
        ? `<button type="button" data-plan-apply="${a.load}|${a.reps}" style="padding:3px 9px; font-size:11px; margin-left:6px; border-radius:6px;">Käytä</button>`
        : '';
      return `<div class="plan-alt-line" style="font-size:12px; color:var(--muted); margin:4px 0; display:flex; align-items:center; flex-wrap:wrap; gap:4px;"><span>Vaihtoehto (${lbl}): <strong style="color:var(--text);">${a.sets} × ${a.reps} @ ${a.load} kg</strong></span>${btn}</div>`;
    }

    function buildDailyPlanHTML(plan, opts = {}) {
      if (!plan) return '';
      const dateStr = opts.dateStr || (document.getElementById('workoutDate') ? document.getElementById('workoutDate').value : todayISO()) || todayISO();
      const curWeight = parseFloat(document.getElementById('weightInput') ? document.getElementById('weightInput').value : 0) || 0;
      const forecastHtml = buildSetupForecastData(plan.exercise, curWeight, dateStr).detailHtml;

      if (opts.fullDetails) {
        const head = `<div class="row" style="margin-bottom:6px;"><strong style="font-size:14px;">🧠 Päivän suositus · ${plan.exercise}</strong><span style="font-size:11px; color:var(--muted);">${plan.goal.short} · Prilepin + VBT</span></div>`;
        if (plan.stage === 'needRef') {
          const vr = plan.refVel ? `${fmtV(Math.min(...plan.refVel))}–${fmtV(Math.max(...plan.refVel))} m/s` : '';
          return `${head}
            <div class="vbt-verdict" style="margin-top:0;">Tee ensin <strong>viitesarja</strong> nousevan lämmittelyn päätteeksi: ${plan.refLoad ? `<strong>${plan.refLoad} kg × 2–3</strong> (≈75 %, alue ${plan.refRange[0]}–${plan.refRange[1]} kg)` : '~70–80 % 1RM × 2–3'} maksimaalisella tahdolla. Tavoitenopeus noin ${vr}.
            Sarjan jälkeen sovellus laskee päivän e1RM:n ja suosittelee työsarjat.</div>
            ${plan.prevE1rm ? `<div style="font-size:11px; color:var(--muted);">Arvioitu 1RM ${plan.prevE1rm.toFixed(0)} kg${plan.last ? ` · viimeisin treeni ${fmtDateFi(plan.last.date)}` : ''}${plan.todayCount ? ` · tänään ${plan.todayCount} sarjaa, ei vielä 65–88 % sarjaa` : ''}</div>` : `<div style="font-size:11px; color:var(--muted);">Ei aiempaa dataa: lämmittele nousevasti – ensimmäinen sarja, jonka nopeus osuu yllä olevaan väliin, toimii viitesarjana.</div>`}`;
        }
        const rd = plan.readiness;
        const rdCls = rd === null ? '' : rd <= -5 ? 'red' : rd < -2 ? 'amber' : rd >= 3 ? 'green' : '';
        const doneFrac = Math.min(1, plan.doneReps / Math.max(1, plan.volume));
        const loadRangeTxt = (plan.loLoad && plan.hiLoad && plan.loLoad !== plan.hiLoad) ? ` (alue ${plan.loLoad}–${plan.hiLoad} kg)` : '';
        return `${head}
          <div class="vbt-kpi-grid">
            <div class="vbt-kpi"><span class="vbt-kpi-l">Päivän e1RM</span><span class="vbt-kpi-v">${plan.e1RM.toFixed(0)}</span><span class="vbt-kpi-s ${rdCls}">${rd === null ? 'ei vertailua' : (rd >= 0 ? '+' : '') + rd.toFixed(1) + ' % vs. ' + plan.baseline.toFixed(0)}</span></div>
            <div class="vbt-kpi" style="grid-column: span 2;"><span class="vbt-kpi-l">Työsarjat</span><span class="vbt-kpi-v" style="color:#60a5fa;">${plan.sets} × ${plan.reps} @ ${plan.load} kg</span><span class="vbt-kpi-s">${Math.round(plan.pct)} % päivän e1RM${loadRangeTxt} · ${plan.sets * plan.reps} toistoa</span></div>
            <div class="vbt-kpi"><span class="vbt-kpi-l">Nopeusohje</span><span class="vbt-kpi-v" style="font-size:16px;">${fmtV(plan.v0)}</span><span class="vbt-kpi-s">±0.03 · stop ${fmtV(plan.vCut)} (VL ${plan.cutoff} %)</span></div>
          </div>
          ${planAltHTML(plan)}
          <div style="font-size:11px; color:var(--muted); margin:4px 0;">Prilepin ${plan.row.label}: ${plan.row.repsMin}–${plan.row.repsMax} toistoa/sarja, optimi ${plan.row.opt} (${plan.row.rangeLo}–${plan.row.rangeHi}) → tavoite <strong style="color:var(--text);">${plan.volume}</strong> toistoa</div>
          <div class="progress-bar" style="margin:4px 0;"><div class="progress-fill ${doneFrac >= 1 ? 'done' : ''}" style="width:${Math.round(doneFrac * 100)}%"></div></div>
          <div style="font-size:12px; margin-bottom:4px;">Tehty: <strong>${plan.doneSets}</strong> sarjaa / <strong>${plan.doneReps}</strong> toistoa${plan.remainingSets > 0 && plan.remainingReps > 0 ? ` · jäljellä ~${plan.remainingSets} × ${plan.reps}` : ' · <span class="green">volyymi täynnä ✓</span>'}</div>
          ${plan.adjust ? `<div class="vbt-alert ${plan.adjust.type === 'down' ? 'amber' : ''}" style="${plan.adjust.type === 'up' ? 'background:rgba(34,197,94,0.14); border:1px solid rgba(34,197,94,0.5); color:#86efac;' : ''}">${plan.adjust.text}</div>` : ''}
          <ul style="font-size:12px; line-height:1.45; margin:6px 0 0; padding-left:18px;">
            <li>Päivän e1RM: viitesarja ${plan.ref.set.weightKg} kg @ ${fmtV(plan.ref.a.vBest)} m/s (${plan.e1Src}).</li>
            ${plan.notes.map((n) => `<li>${n}</li>`).join('')}
            <li>Toistot/sarja: min(Prilepin ${plan.row.repsMax}, VL-raja ${plan.repsVL}, RIR ≥ ${plan.goal.key === 'peaking' ? 1 : 2} → ${plan.repsRIR}) = ${plan.reps}. Nopeuskustannus ${plan.cost.toFixed(3)} m/s/toisto (${plan.costSrc}).</li>
          </ul>`;
      }

      // Compact action-first mode for Treeni tab
      if (plan.stage === 'needRef') {
        const vr = plan.refVel ? `${fmtV(Math.min(...plan.refVel))}–${fmtV(Math.max(...plan.refVel))} m/s` : '';
        return `
          ${opts.withButtons && plan.refLoad ? `<button type="button" class="primary" data-plan-apply="${plan.refLoad}|3" style="width:100%; min-height:46px; font-size:15px; margin-bottom:8px;">Käytä: ${plan.refLoad} kg × 3</button>` : ''}
          <div class="plan-summary-line">🧠 Viitesarja: ${plan.refLoad ? `<strong>${plan.refLoad} kg × 2–3</strong> (≈75 %)` : '~70–80 % 1RM × 2–3'} · odotettu ${vr}</div>
          <details class="details-toggle plan-why" ${opts.whyOpen ? 'open' : ''}>
            <summary>▸ Miksi?</summary>
            <div style="font-size:12px; line-height:1.45; color:var(--muted); margin-top:4px;">
              Tee ensin viitesarja nousevan lämmittelyn päätteeksi (${plan.refLoad ? `${plan.refRange[0]}–${plan.refRange[1]} kg` : '70–80 %'}) maksimaalisella tahdolla, jotta sovellus laskee päivän e1RM:n ja työsarjat.
              ${plan.prevE1rm ? `<div style="margin-top:4px;">Arvioitu 1RM ${plan.prevE1rm.toFixed(0)} kg${plan.last ? ` · viimeisin ${fmtDateFi(plan.last.date)}` : ''}</div>` : ''}
              <div style="margin-top:4px;">${forecastHtml}</div>
            </div>
          </details>`;
      }

      const rd = plan.readiness;
      const rdTxt = rd === null ? '' : ` · valmius <span class="${rd <= -5 ? 'red' : rd < -2 ? 'amber' : rd >= 3 ? 'green' : ''}">${rd >= 0 ? '+' : ''}${rd.toFixed(1)} %</span>`;
      const doneFrac = Math.min(1, plan.doneReps / Math.max(1, plan.volume));
      const nextLoad = plan.adjust ? plan.adjust.load : plan.load;
      const actionHtml = opts.withButtons && plan.remainingSets > 0 ? (
        plan.adjust && plan.adjust.backoffOption && plan.adjust.repDropOption
          ? `${plan.adjust.shortReason ? `<div class="vbt-alert amber" style="margin-top:0; margin-bottom:8px;">${plan.adjust.shortReason}</div>` : ''}
             <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px;">
               <button type="button" class="primary" data-plan-apply="${plan.adjust.backoffOption.load}|${plan.adjust.backoffOption.reps}" style="flex:1; min-height:46px; font-size:13px;">Käytä A: ${plan.adjust.backoffOption.load} kg × ${plan.adjust.backoffOption.reps}</button>
               <button type="button" data-plan-apply="${plan.adjust.repDropOption.load}|${plan.adjust.repDropOption.reps}" style="flex:1; min-height:46px; font-size:13px;">Käytä B: ${plan.adjust.repDropOption.load} kg × ${plan.adjust.repDropOption.reps}</button>
             </div>`
          : `${plan.adjust && plan.adjust.type === 'up' ? `<div style="font-size:12px; color:#86efac; font-weight:700; margin-bottom:6px;">✓ Hyvä nopeus → suositus nostaa ${nextLoad} kg:aan</div>` : ''}
             <button type="button" class="primary" data-plan-apply="${nextLoad}|${plan.reps}" style="width:100%; min-height:46px; font-size:15px; margin-bottom:8px;">Käytä: ${nextLoad} kg × ${plan.reps}</button>`
      ) : (plan.adjust && plan.adjust.type === 'down' && plan.adjust.text ? `<div class="vbt-alert amber" style="margin-top:0; margin-bottom:8px;">${plan.adjust.text}</div>` : '');

      return `
        ${actionHtml}
        <div class="plan-summary-line">Tänään ${plan.sets} × ${plan.reps} @ ${plan.load} kg · stop &lt; ${fmtV(plan.vCut)} m/s${rdTxt}</div>
        ${planAltHTML(plan, opts)}
        <div class="progress-bar" style="margin:8px 0 6px;"><div class="progress-fill ${doneFrac >= 1 ? 'done' : ''}" style="width:${Math.round(doneFrac * 100)}%"></div></div>
        <div style="font-size:12px; color:var(--muted);">Tehty <strong style="color:var(--text);">${plan.doneSets}/${plan.sets}</strong> sarjaa (${plan.doneReps}/${plan.volume} toistoa)${plan.remainingSets > 0 && plan.remainingReps > 0 ? ` · jäljellä ~${plan.remainingSets} × ${plan.reps}` : ' · <span class="green">volyymi täynnä ✓</span>'}</div>
        <details class="details-toggle plan-why" ${opts.whyOpen ? 'open' : ''}>
          <summary>▸ Miksi?</summary>
          <div style="margin-top:6px;">
            ${plan.adjust && plan.adjust.backoffOption ? `<div class="vbt-alert amber" style="margin-top:0; margin-bottom:6px; font-weight:500;">${plan.adjust.text}</div>` : ''}
            <div style="font-size:12px; margin-bottom:6px;">${forecastHtml}</div>
            <div style="font-size:11px; color:var(--muted); margin-bottom:4px;">Prilepin ${plan.row.label}: ${plan.row.repsMin}–${plan.row.repsMax} toistoa/sarja, optimi ${plan.row.opt} (${plan.row.rangeLo}–${plan.row.rangeHi}) → tavoite ${plan.volume} toistoa.</div>
            <ul style="font-size:12px; line-height:1.45; margin:4px 0 0; padding-left:18px; color:var(--muted);">
              <li>Päivän e1RM ${plan.e1RM.toFixed(0)} kg: viitesarja ${plan.ref.set.weightKg} kg @ ${fmtV(plan.ref.a.vBest)} m/s (${plan.e1Src}).</li>
              ${plan.notes.map((n) => `<li>${n}</li>`).join('')}
              <li>Toistot/sarja: min(Prilepin ${plan.row.repsMax}, VL ${plan.repsVL}, RIR ${plan.repsRIR}) = ${plan.reps}. Kustannus ${plan.cost.toFixed(3)} m/s/toisto.</li>
            </ul>
          </div>
        </details>`;
    }

    function renderDailyPlanCard() {
      const el = document.getElementById('dailyPlanCard');
      if (!el) return;
      const ex = getCurrentSelectedExerciseName();
      const dateStr = document.getElementById('workoutDate').value || todayISO();
      const plan = (getLiftCfg(ex) && !isFreeMode()) ? computeDailyPlan(ex, dateStr) : null;
      if (!plan) { el.classList.add('hidden'); el.innerHTML = ''; return; }
      const whyOpen = !!(el.querySelector('details.plan-why') && el.querySelector('details.plan-why').open);
      el.classList.remove('hidden');
      el.innerHTML = buildDailyPlanHTML(plan, { withButtons: true, whyOpen, dateStr });
    }
    function applyPlanToSetup(load, reps) {
      const w = document.getElementById('weightInput');
      const t = document.getElementById('targetRepsInput');
      w.value = load;
      t.value = reps;
      handleWeightChanged();
      handleTargetRepsChanged();
    }
    // =================== /PÄIVÄN SUOSITUS ===================


    // =====================================================================
    // ===  JAKSOSUUNNITTELIJA (blokkiperiodisaatio + viikkoaalto)        ===
    // =====================================================================
    const CYCLE_PHASES = {
      accum:  { key: 'accum',  label: 'Kerääminen',       goal: 'baseStrength', color: '#22c55e' },
      trans:  { key: 'trans',  label: 'Muuntaminen',      goal: 'maxStrength',  color: '#3b82f6' },
      real:   { key: 'real',   label: 'Realisointi',      goal: 'peaking',      color: '#f59e0b' },
      deload: { key: 'deload', label: 'Kevennys / testi', goal: 'maxStrength',  color: '#94a3b8' }
    };
    const WAVE_LABELS = {
      low: 'alaraja', opt: 'optimi', high: 'yläraja', deload: 'kevennys', taper: 'piikkaus/tapering', test: 'testi'
    };
    const DEFAULT_CYCLE_BLOCKS = [
      { phase: 'accum', weeks: 4 }, { phase: 'trans', weeks: 4 }, { phase: 'real', weeks: 2 }, { phase: 'deload', weeks: 1 }
    ];

    function mondayOf(iso) {
      const d = new Date(iso + 'T12:00:00');
      const dow = (d.getDay() + 6) % 7;
      d.setDate(d.getDate() - dow);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    function weeksBetween(aIso, bIso) {
      return Math.floor((new Date(mondayOf(bIso) + 'T12:00:00') - new Date(mondayOf(aIso) + 'T12:00:00')) / (7 * 864e5) + 0.5);
    }
    function waveFor(phase, weekInBlock, weeks) {
      if (phase === 'deload') return weekInBlock === weeks ? 'test' : 'deload';
      if (phase === 'real') return weekInBlock === weeks ? 'taper' : 'low';
      if (weeks >= 4 && weekInBlock === weeks) return 'deload';
      const n = weeks >= 4 ? weeks - 1 : weeks;
      if (n <= 2) return weekInBlock === 1 ? 'opt' : 'high';
      return ['low', 'opt', 'high'][Math.min(2, Math.floor((weekInBlock - 1) * 3 / n))];
    }
    function getCycle() { return vbtSettings.cycle && vbtSettings.cycle.active ? vbtSettings.cycle : null; }
    function getContextDate() {
      const el = document.getElementById('workoutDate');
      return (el && el.value) || todayISO();
    }

    // Cycle state for a date
    function getCycleState(dateStr) {
      const c = getCycle();
      if (!c) return null;
      const d = dateStr || getContextDate();
      const mon = mondayOf(d);
      const inserts = (c.inserts || []).filter((x) => x <= mon);
      const insertedNow = (c.inserts || []).includes(mon);
      const raw = weeksBetween(c.startDate, d);
      if (raw < 0) return { active: true, notStarted: true, startDate: c.startDate };
      const idx = raw - inserts.filter((x) => x < mon).length - (insertedNow ? 0 : 0);
      const totalWeeks = c.blocks.reduce((s, b) => s + b.weeks, 0);
      if (insertedNow) {
        // extra deload inserted for this week; block position = the week that was postponed
        let acc = 0, bi = 0;
        for (; bi < c.blocks.length; bi++) { if (idx < acc + c.blocks[bi].weeks) break; acc += c.blocks[bi].weeks; }
        const blk = c.blocks[Math.min(bi, c.blocks.length - 1)];
        return { active: true, blockIdx: bi, phase: CYCLE_PHASES[blk.phase], weekInBlock: idx - acc + 1, weeks: blk.weeks, wave: 'deload', inserted: true, weekIdx: idx, totalWeeks, monday: mon };
      }
      if (idx >= totalWeeks) return { active: true, finished: true, weekIdx: idx, totalWeeks, monday: mon };
      let acc = 0;
      for (let bi = 0; bi < c.blocks.length; bi++) {
        const b = c.blocks[bi];
        if (idx < acc + b.weeks) {
          const wib = idx - acc + 1;
          return { active: true, blockIdx: bi, phase: CYCLE_PHASES[b.phase], weekInBlock: wib, weeks: b.weeks, wave: waveFor(b.phase, wib, b.weeks), weekIdx: idx, totalWeeks, monday: mon };
        }
        acc += b.weeks;
      }
      return null;
    }
    function cycleGoalKey(dateStr) {
      const st = getCycleState(dateStr);
      if (!st || st.finished || st.notStarted) return null;
      return st.phase.goal;
    }
    // Prilepin-volume for the wave
    function waveVolume(row, wave) {
      switch (wave) {
        case 'low': return row.rangeLo;
        case 'high': return row.rangeHi;
        case 'deload': case 'taper': return Math.max(row.repsMin * 2, Math.round(row.rangeLo * 0.6));
        case 'test': return Math.max(2, row.repsMin * 2);
        default: return row.opt;
      }
    }
    function cutoffWaveDelta(dateStr) {
      const st = getCycleState(dateStr);
      return st && !st.finished && !st.notStarted && (st.wave === 'deload' || st.wave === 'taper') ? -5 : 0;
    }

    // ---- weekly volume (work reps & tonnage, warm-ups excluded) ----
    function weeklyVolume(exercise, mondayIso) {
      const end = addDaysIso(mondayIso, 6);
      let reps = 0, tonnage = 0, sets = 0, sessions = new Set();
      workouts.forEach((w) => {
        if (w.date < mondayIso || w.date > end) return;
        (w.sets || []).forEach((s) => {
          if (exercise && s.exercise !== exercise) return;
          if (!s.reps || !s.reps.length) return;
          const a = analyzeSet(s.reps, s.exercise, s.weightKg, { dateStr: w.date, touchAndGo: !!s.touchAndGo });
          if (a.isWarmup) return;
          const rc = Number(s.repCountOverride) > 0 ? setRepCount(s) : (a.completedCount ?? a.valid.length);
          reps += rc; tonnage += rc * (s.weightKg || 0); sets++;
          sessions.add(w.date);
        });
      });
      return { reps, tonnage, sets, sessions: sessions.size };
    }

    // ---- suggestions from data ----
    function cycleSuggestions(dateStr) {
      const out = [];
      const st = getCycleState(dateStr);
      const lifts = exercisesWithData().filter((e) => getLiftCfg(e));
      lifts.forEach((ex) => {
        const tr = e1rmTrend(ex).filter((t) => t.date <= dateStr && t.date >= addDaysIso(dateStr, -28));
        if (tr.length >= 3) {
          const first = tr[0], last = tr[tr.length - 1];
          const days = (new Date(last.date) - new Date(first.date)) / 864e5;
          const chg = (last.e1RM - first.e1RM) / first.e1RM * 100;
          if (days >= 13 && chg < 0.5) out.push({ type: 'plateau', ex, text: `${ex}: e1RM ${chg <= -2 ? 'laskenut' : 'tasaantunut'} (${chg >= 0 ? '+' : ''}${chg.toFixed(1)} % / ${Math.round(days)} pv) → ${chg <= -2 ? 'tarkista palautuminen; kevennys tai ' : ''}siirry seuraavaan jaksoon tai muuta ärsykettä.` });
          else if (chg >= 2) out.push({ type: 'progress', ex, text: `${ex}: e1RM nousee (+${chg.toFixed(1)} % / ${Math.round(days)} pv) → jatka nykyisellä jaksolla.` });
        }
        // readiness of the two latest sessions
        const dates = [...new Set(setsForExercise(ex, (d) => d <= dateStr).map((x) => x.date))].sort().reverse().slice(0, 2);
        const rds = dates.map((d) => { const p = computeDailyPlan(ex, d); return p && p.stage === 'plan' ? p.readiness : null; });
        if (rds.length === 2 && rds.every((r) => r !== null && r <= -5)) {
          out.push({ type: 'deload', ex, text: `${ex}: valmius alle −5 % kahdella perättäisellä kerralla (${rds.map((r) => r.toFixed(1) + ' %').join(', ')}) → pidä kevennysviikko etuajassa.` });
        }
        const thisW = weeklyVolume(ex, mondayOf(dateStr));
        const prevW = weeklyVolume(ex, addDaysIso(mondayOf(dateStr), -7));
        if (prevW.reps >= 10 && thisW.reps > prevW.reps * 1.3) {
          out.push({ type: 'volume', ex, text: `${ex}: viikkovolyymi +${Math.round((thisW.reps / prevW.reps - 1) * 100)} % edelliseen viikkoon (${thisW.reps} vs ${prevW.reps} toistoa) – yli 30 %:n hypyt lisäävät väsymystä.` });
        }
      });
      if (st && st.finished) out.unshift({ type: 'finished', text: 'Jakso on päättynyt. Testaa raskas yhden toiston nosto (kirjaa sen nopeus omaksi MVT:ksi) ja aloita uusi kierros korkeammalta tasolta.' });
      return out;
    }

    function startCycle(startDate, blocks) {
      vbtSettings.cycle = { active: true, startDate: mondayOf(startDate), blocks, inserts: [] };
      saveVbtSettings(); onVbtSettingsChanged();
    }
    function stopCycle() {
      if (vbtSettings.cycle) vbtSettings.cycle.active = false;
      saveVbtSettings(); onVbtSettingsChanged();
    }
    function advanceToNextBlock() {
      const c = getCycle(); const st = getCycleState(getContextDate());
      if (!c || !st || st.finished || st.notStarted) return;
      // move start so that the next block begins this week
      let acc = 0; for (let i = 0; i <= st.blockIdx; i++) acc += c.blocks[i].weeks;
      const shiftWeeks = acc - st.weekIdx;
      c.startDate = addDaysIso(c.startDate, -7 * shiftWeeks);
      saveVbtSettings(); onVbtSettingsChanged();
    }
    function insertDeloadThisWeek() {
      const c = getCycle(); if (!c) return;
      const mon = mondayOf(getContextDate());
      c.inserts = c.inserts || [];
      if (!c.inserts.includes(mon)) c.inserts.push(mon);
      saveVbtSettings(); onVbtSettingsChanged();
    }

    function cycleBadgeText(dateStr) {
      const st = getCycleState(dateStr);
      if (!st) return '';
      if (st.notStarted) return `📅 Jakso alkaa ${fmtDateFi(st.startDate)}`;
      if (st.finished) return '📅 Jakso päättynyt – testaa ja aloita uusi';
      return `📅 ${st.phase.label} · vk ${st.weekInBlock}/${st.weeks} (${WAVE_LABELS[st.wave]}${st.inserted ? ', lisätty' : ''}) · kokonaisvk ${st.weekIdx + 1}/${st.totalWeeks}`;
    }

    function buildCycleTimelineSVG(st) {
      const c = getCycle(); if (!c) return '';
      const total = c.blocks.reduce((s, b) => s + b.weeks, 0);
      const W = 340, H = 46, pad = 4;
      const wPx = (W - 2 * pad) / total;
      let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;" role="img" aria-label="Jakson aikajana">`;
      let x = pad, wk = 0;
      c.blocks.forEach((b) => {
        const ph = CYCLE_PHASES[b.phase];
        for (let i = 1; i <= b.weeks; i++) {
          const wave = waveFor(b.phase, i, b.weeks);
          const h = { low: 14, opt: 18, high: 22, deload: 8, taper: 10, test: 12 }[wave] || 14;
          const cur = st && !st.finished && !st.notStarted && st.weekIdx === wk;
          s += `<rect x="${x + 1}" y="${28 - h}" width="${wPx - 2}" height="${h}" rx="2" fill="${ph.color}" opacity="${cur ? 1 : 0.45}" ${cur ? 'stroke="#f8fafc" stroke-width="1.5"' : ''}/>`;
          x += wPx; wk++;
        }
      });
      x = pad;
      c.blocks.forEach((b) => {
        s += `<text x="${x + 2}" y="${H - 4}" fill="#94a3b8" font-size="9">${CYCLE_PHASES[b.phase].label.split(' ')[0]}</text>`;
        x += wPx * b.weeks;
      });
      return s + '</svg>';
    }

    function renderCycleCard() {
      const el = document.getElementById('anaCycleCard');
      if (!el) return;
      const dateStr = getContextDate(); // jakso näytetään aina treenipäivän (Treeni-välilehden päivä) mukaan
      const c = getCycle();
      if (!c) {
        const blocks = (vbtSettings.cycle && vbtSettings.cycle.blocks) || DEFAULT_CYCLE_BLOCKS;
        el.innerHTML = `
          <strong style="font-size:14px;">📅 Jaksosuunnittelija</strong>
          <p class="vbt-verdict">Blokkiperiodisaatio: <strong>Kerääminen</strong> (perusvoima 70–80 %) → <strong>Muuntaminen</strong> (maksimivoima 80–90 %) → <strong>Realisointi</strong> (piikkaus 85–95 %) → <strong>Kevennys / testi</strong>. Jakso valitsee tavoitteen automaattisesti ja säätää Prilepin-volyymia viikoittain (alaraja → optimi → yläraja → kevennys).</p>
          <div class="setup-grid" style="margin-top:6px;">
            <div class="row"><label class="small" for="cycStart">Aloitusviikko</label><input type="date" id="cycStart" value="${mondayOf(todayISO())}"></div>
            ${blocks.map((b, i) => `<div class="row"><label class="small">${CYCLE_PHASES[b.phase].label}</label>
              <div class="stepper"><input type="number" min="0" max="8" step="1" data-cyc-weeks="${i}" data-cyc-phase="${b.phase}" value="${b.weeks}"> <span style="font-size:12px; color:var(--muted);">vk</span></div></div>`).join('')}
            <button type="button" class="primary" id="cycStartBtn">▶ Aloita jakso</button>
          </div>`;
        el.querySelector('#cycStartBtn').addEventListener('click', () => {
          const bl = [...el.querySelectorAll('[data-cyc-weeks]')].map((inp) => ({ phase: inp.getAttribute('data-cyc-phase'), weeks: Math.max(0, parseInt(inp.value, 10) || 0) })).filter((b) => b.weeks > 0);
          if (!bl.length) return;
          startCycle(el.querySelector('#cycStart').value || todayISO(), bl);
        });
        return;
      }
      const st = getCycleState(dateStr);
      const lifts = exercisesWithData().filter((e) => getLiftCfg(e));
      const mon = mondayOf(dateStr);
      const volRows = lifts.map((ex) => {
        const a = weeklyVolume(ex, mon), b = weeklyVolume(ex, addDaysIso(mon, -7));
        const ongoing = mondayOf(todayISO()) === mon;
        const chg = (b.reps && !ongoing) ? Math.round((a.reps / b.reps - 1) * 100) : null;
        return `<tr><td>${ex}</td><td>${a.reps} <span style="color:var(--muted)">(${a.sets})</span></td><td>${b.reps}</td><td class="${chg === null ? '' : chg > 30 ? 'amber' : ''}">${chg === null ? (ongoing ? 'kesken' : '--') : (chg > 0 ? '+' : '') + chg + ' %'}</td><td>${Math.round(a.tonnage)}</td></tr>`;
      }).join('');
      const sugg = cycleSuggestions(dateStr);
      let wavePlan = '';
      if (st && !st.finished && !st.notStarted) {
        const g = VBT_GOALS[st.phase.goal];
        const mid = (g.pctRange[0] + g.pctRange[1]) / 2;
        const row = prilepinRow(mid);
        wavePlan = `<div class="vbt-kpi-grid" style="grid-template-columns: repeat(2, minmax(0, 1fr));">
          <div class="vbt-kpi"><span class="vbt-kpi-l">Jakso</span><span class="vbt-kpi-v" style="font-size:17px; color:${st.phase.color};">${st.phase.label}</span><span class="vbt-kpi-s">vk ${st.weekInBlock}/${st.weeks}</span></div>
          <div class="vbt-kpi"><span class="vbt-kpi-l">Viikkoaalto</span><span class="vbt-kpi-v" style="font-size:15px;">${WAVE_LABELS[st.wave]}</span><span class="vbt-kpi-s">${st.inserted ? 'lisätty kevennys' : 'kokonaisvk ' + (st.weekIdx + 1) + '/' + st.totalWeeks}</span></div>
          <div class="vbt-kpi"><span class="vbt-kpi-l">Tavoite</span><span class="vbt-kpi-v" style="font-size:15px;">${g.pctRange[0]}–${g.pctRange[1]} %</span><span class="vbt-kpi-s">${g.short}</span></div>
          <div class="vbt-kpi"><span class="vbt-kpi-l">Volyymi / liike / treeni</span><span class="vbt-kpi-v" style="font-size:15px;">${waveVolume(row, st.wave)}</span><span class="vbt-kpi-s">toistoa (Prilepin ${row.label})</span></div>
        </div>
        ${(st.wave === 'deload' || st.wave === 'taper') ? '<p class="vbt-verdict">Kevennysviikko: volyymi ~60 % Prilepinin alarajasta, intensiteetti ennallaan, VL-raja −5 %-yks.</p>' : ''}
        ${st.wave === 'test' ? '<p class="vbt-verdict">Testiviikko: tee raskas yhden toiston nosto (~95–100 %) jokaisessa pääliikkeessä ja kirjaa sen nopeus Analyysi → VBT-asetukset → Oma MVT. Tarkista samalla kuorma–nopeusprofiili 3–4 kuormalla.</p>' : ''}`;
      }
      el.innerHTML = `
        <div class="row" style="margin-bottom:4px;"><strong style="font-size:14px;">📅 Jaksosuunnittelija</strong><span style="font-size:11px; color:var(--muted);">alkoi ${fmtDateFi(c.startDate)}</span></div>
        ${buildCycleTimelineSVG(st)}
        <div style="font-size:12px; margin:4px 0;">${cycleBadgeText(dateStr)}</div>
        ${wavePlan}
        ${sugg.length ? `<div style="margin-top:6px;">${sugg.map((x) => `<div class="vbt-alert ${x.type === 'progress' ? '' : 'amber'}" style="${x.type === 'progress' ? 'background:rgba(34,197,94,0.14); border:1px solid rgba(34,197,94,0.5); color:#86efac;' : ''} font-weight:600; font-size:12px;">${x.text}</div>`).join('')}</div>` : ''}
        <div style="font-size:12px; font-weight:700; margin:10px 0 4px;">Viikkovolyymi (työsarjat, lämmittely pois)</div>
        <div style="overflow-x:auto;"><table class="ana-table"><thead><tr><th>Liike</th><th>Tämä vk</th><th>Ed. vk</th><th>Muutos</th><th>kg</th></tr></thead><tbody>${volRows || '<tr><td colspan="5" style="color:var(--muted)">Ei dataa</td></tr>'}</tbody></table></div>
        <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;">
          <button type="button" id="cycNextBtn" style="flex:1; font-size:12px;">⏭ Seuraava jakso nyt</button>
          <button type="button" id="cycDeloadBtn" style="flex:1; font-size:12px;">🛌 Kevennys tälle viikolle</button>
          <button type="button" id="cycStopBtn" class="danger" style="flex:1; font-size:12px;">Lopeta jakso</button>
        </div>`;

      el.querySelector('#cycDeloadBtn').addEventListener('click', insertDeloadThisWeek);
      el.querySelector('#cycStopBtn').addEventListener('click', stopCycle);
    }

    function onVbtSettingsChanged() {
      _mvtCache = { sig: '', map: {} };
      renderLiveSet();
      renderHistoryList();
      if (!document.getElementById('tabAnalysis').classList.contains('hidden')) renderAnalysisTab();
    }
    // =================== /SYVÄ VBT-ANALYYSI ===================


    function buildVelocityChartHTML(reps, exerciseName) {
      if (!reps || reps.length === 0) {
        return `
          <div style="width:100%; height:100%; min-height:80px; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; text-align:center; padding: 12px 0;">
            📊 Ei vielä toistoja.
          </div>
        `;
      }
      const maxVel = Math.max(0.01, ...reps.map((r) => r.meanVelocity));
      return reps.map((r, idx) => {
        const heightPct = Math.max(10, Math.round((r.meanVelocity / maxVel) * 100));
        return `
          <div class="vel-col" title="${r.meanVelocity.toFixed(2)} m/s">
            <span class="vel-col-val">${r.meanVelocity.toFixed(2)}</span>
            <div class="vel-col-bar" style="height: ${heightPct}%;"></div>
            <span class="vel-col-lbl">#${idx + 1}</span>
          </div>
        `;
      }).join('');
    }

    // --- Undo Toast & Safe Deletion ---
    function findSetCoordinates(targetSetRef) {
      if (!targetSetRef) return null;
      for (const w of workouts) {
        const sIdx = (w.sets || []).indexOf(targetSetRef);
        if (sIdx !== -1) return { date: w.date, sIdx };
      }
      return null;
    }

    function captureUndoSnapshot(label) {
      return {
        label,
        workouts: JSON.parse(JSON.stringify(workouts)),
        currentReps: JSON.parse(JSON.stringify(currentReps)),
        currentSetSaved,
        lastSetStoppedAt,
        workoutDoneState,
        activeSetMeta: activeSetMeta ? { ...activeSetMeta } : null,
        lastSavedCoords: lastSavedSetRef ? findSetCoordinates(lastSavedSetRef) : null
      };
    }

    function hideUndoToast() {
      if (undoTimerId) {
        clearTimeout(undoTimerId);
        undoTimerId = null;
      }
      undoState = null;
      const toast = document.getElementById('undoToast');
      if (toast) toast.classList.add('hidden');
    }

    function showUndoToast(label, snapshot) {
      if (undoTimerId) clearTimeout(undoTimerId);
      undoState = snapshot;
      const toast = document.getElementById('undoToast');
      const txt = document.getElementById('undoToastText');
      if (txt) txt.textContent = label || 'Poistettu';
      if (toast) toast.classList.remove('hidden');
      undoTimerId = setTimeout(hideUndoToast, 6000);
    }

    function performUndo() {
      if (!undoState) return;
      const snap = undoState;
      hideUndoToast();
      workouts = snap.workouts;
      currentReps = snap.currentReps;
      currentSetSaved = snap.currentSetSaved;
      lastSetStoppedAt = snap.lastSetStoppedAt;
      workoutDoneState = snap.workoutDoneState;
      activeSetMeta = snap.activeSetMeta;
      lastSavedSetRef = null;
      if (snap.lastSavedCoords) {
        const w = workouts.find((x) => x.date === snap.lastSavedCoords.date);
        if (w && w.sets && w.sets[snap.lastSavedCoords.sIdx]) {
          lastSavedSetRef = w.sets[snap.lastSavedCoords.sIdx];
        }
      }
      saveJSON(KEY_WORKOUTS, workouts);
      if (getLiftUiState() === 'rest' && currentSetSaved && lastSetStoppedAt > 0) {
        startRestTimer();
      } else {
        stopRestTimer();
      }
      renderLiveSet();
      renderCalendar();
      renderHistoryList();
      if (!document.getElementById('tabAnalysis').classList.contains('hidden')) renderAnalysisTab();
      refreshOpenSetAnalysisSheet();
    }

    function deleteSavedSet(dateStr, setIdx) {
      const wIdx = workouts.findIndex((w) => w.date === dateStr);
      if (wIdx === -1) return;
      const w = workouts[wIdx];
      if (!w.sets || setIdx < 0 || setIdx >= w.sets.length) return;
      const snap = captureUndoSnapshot('Sarja poistettu');
      const [removed] = w.sets.splice(setIdx, 1);
      if (w.sets.length === 0) {
        workouts.splice(wIdx, 1);
      }
      if (removed && lastSavedSetRef === removed) {
        currentReps = [];
        currentSetSaved = false;
        lastSavedSetRef = null;
        stopRestTimer();
      }
      if (activeSheetSetRef && activeSheetSetRef.dateStr === dateStr) {
        if (activeSheetSetRef.setIdx === setIdx) {
          closeSetAnalysisSheet();
        } else if (activeSheetSetRef.setIdx > setIdx) {
          activeSheetSetRef.setIdx--;
        }
      }
      saveJSON(KEY_WORKOUTS, workouts);
      showUndoToast('Sarja poistettu', snap);
      renderLiveSet();
      renderCalendar();
      renderHistoryList();
      if (!document.getElementById('tabAnalysis').classList.contains('hidden')) renderAnalysisTab();
    }

    function deleteRepFromSavedSet(dateStr, setIdx, repIdx) {
      const wIdx = workouts.findIndex((w) => w.date === dateStr);
      if (wIdx === -1) return;
      const w = workouts[wIdx];
      if (!w.sets || !w.sets[setIdx] || !w.sets[setIdx].reps) return;
      const s = w.sets[setIdx];
      if (repIdx < 0 || repIdx >= s.reps.length) return;

      const snap = captureUndoSnapshot('Toisto poistettu');
      s.reps.splice(repIdx, 1);
      if (lastSavedSetRef === s) {
        currentReps = s.reps.map((r) => ({ ...r }));
      }
      if (s.reps.length === 0) {
        w.sets.splice(setIdx, 1);
        if (w.sets.length === 0) workouts.splice(wIdx, 1);
        if (lastSavedSetRef === s) {
          currentReps = [];
          currentSetSaved = false;
          lastSavedSetRef = null;
          stopRestTimer();
        }
        if (activeSheetSetRef && activeSheetSetRef.dateStr === dateStr && activeSheetSetRef.setIdx === setIdx) {
          closeSetAnalysisSheet();
        }
      }
      saveJSON(KEY_WORKOUTS, workouts);
      showUndoToast('Toisto poistettu', snap);
      renderLiveSet();
      renderCalendar();
      renderHistoryList();
      if (!document.getElementById('tabAnalysis').classList.contains('hidden')) renderAnalysisTab();
      refreshOpenSetAnalysisSheet();
    }

    // Käsin korjattu toistomäärä (esim. yhdistyneet toistot): set.repCountOverride; null/tyhjä/sama kuin tallennettu = poista korjaus
    function setRepCountOverride(dateStr, setIdx, value) {
      const w = workouts.find((x) => x.date === dateStr);
      if (!w || !w.sets || !w.sets[setIdx]) return false;
      const s = w.sets[setIdx];
      const n = (value === null || value === '' || value === undefined) ? null : Math.round(Number(value));
      if (n !== null && !(n >= 1 && n <= 99)) return false;
      const snap = captureUndoSnapshot('Toistomäärä korjattu');
      const cfg = getLiftCfg(s.exercise);
      const mInfo = detectMergedReps(s.reps || [], cfg, dateStr);
      const flagged = flagSuspectReps(s.reps || [], cfg, mInfo, dateStr);
      const hasSuspect = flagged.some((f, i) => f && !(mInfo[i] && mInfo[i].drift));
      if (n === null || (n === (s.reps || []).length && !hasSuspect)) delete s.repCountOverride;
      else s.repCountOverride = n;
      saveJSON(KEY_WORKOUTS, workouts);
      showUndoToast(n === null ? 'Toistomäärän korjaus poistettu' : `Toistomäärä korjattu: ${n}`, snap);
      renderLiveSet();
      renderCalendar();
      renderHistoryList();
      if (!document.getElementById('tabAnalysis').classList.contains('hidden')) renderAnalysisTab();
      refreshOpenSetAnalysisSheet();
      return true;
    }

    function setTouchAndGo(dateStr, setIdx, enabled) {
      const w = workouts.find((x) => x.date === dateStr);
      if (!w || !w.sets || !w.sets[setIdx]) return false;
      const s = w.sets[setIdx];
      if (enabled) s.touchAndGo = true;
      else delete s.touchAndGo;
      if (lastSavedSetRef === s && activeSetMeta) activeSetMeta.touchAndGo = !!enabled;
      _ownCostCache = { sig: '', map: new Map() };
      _mvtCache = { sig: '', map: {} };
      saveJSON(KEY_WORKOUTS, workouts);
      renderLiveSet();
      renderCalendar();
      renderHistoryList();
      if (!document.getElementById('tabAnalysis').classList.contains('hidden')) renderAnalysisTab();
      refreshOpenSetAnalysisSheet();
      return true;
    }

    function deleteLiveRep(idx) {
      if (idx < 0 || idx >= currentReps.length) return;
      const snap = captureUndoSnapshot('Toisto poistettu');
      currentReps.splice(idx, 1);
      if (lastSavedSetRef && Array.isArray(lastSavedSetRef.reps)) {
        lastSavedSetRef.reps.splice(idx, 1);
        if (lastSavedSetRef.reps.length === 0) {
          const coords = findSetCoordinates(lastSavedSetRef);
          if (coords) {
            const wIdx = workouts.findIndex((w) => w.date === coords.date);
            if (wIdx !== -1) {
              workouts[wIdx].sets.splice(coords.sIdx, 1);
              if (workouts[wIdx].sets.length === 0) workouts.splice(wIdx, 1);
            }
          }
          lastSavedSetRef = null;
          currentSetSaved = false;
          stopRestTimer();
        }
        saveJSON(KEY_WORKOUTS, workouts);
        renderCalendar();
        renderHistoryList();
      }
      showUndoToast('Toisto poistettu', snap);
      renderLiveSet();
      if (!document.getElementById('tabAnalysis').classList.contains('hidden')) renderAnalysisTab();
      refreshOpenSetAnalysisSheet();
    }

    function buildSetAnalysisHTML(s, opts = {}) {
      const reps = s.reps || [];
      const count = reps.length;
      if (count === 0) {
        return `<div style="color:var(--muted); font-size:12px; padding:6px 0;">Sarjassa ei ole toistoja.</div>`;
      }
      const useDate = opts.dateStr || s._date || todayISO();
      const prof = getLiftCfg(s.exercise) ? recentProfile(s.exercise, useDate) : null;
      const setA = analyzeSet(reps, s.exercise, s.weightKg, { profile: prof, dateStr: useDate, touchAndGo: !!(s && s.touchAndGo) });
      const statReps = (setA.valid && setA.valid.length >= 1) ? setA.valid.map((p) => reps[p.idx]) : reps;
      const statCount = statReps.length;
      const bestVel = Math.max(0, ...statReps.map((r) => r.meanVelocity || 0));
      const avgVel = statCount ? statReps.reduce((a, r) => a + (r.meanVelocity || 0), 0) / statCount : 0;
      const bestWatt = Math.max(0, ...statReps.map((r) => r.power || 0));
      const romVals = statReps.map((r) => Number(r.rangeOfMotionCm) || 0).filter((x) => x > 0);
      const avgRom = romVals.length ? romVals.reduce((a, b) => a + b, 0) / romVals.length : 0;

      const repListRows = reps.map((r, rIdx) => {
        const pr = setA.perRep[rIdx];
        const repDrop = pr && pr.vl !== null ? pr.vl : null;
        const qDot = pr ? `<span class="q-dot" style="border-color:${Q_COLORS[pr.quality]}" title="${pr.quality}"></span>` : '';
        const rirHtml = pr && pr.rir !== null ? `<span style="color:var(--muted); font-size:11px;">RIR ~${pr.rir >= 10 ? '10+' : pr.rir}</span>` : '';
        const dropHtml = pr && pr.suspect
          ? `<span style="color:#64748b; font-size:11px;">${pr.merged ? 'yhdistetty' : (pr.drift ? 'IMU-ajautuma' : 'epäilyttävä')}</span>`
          : (repDrop === null || (pr && pr.v >= pr.bestSoFar && rIdx === setA.vBestIdx))
            ? '<span style="color:var(--muted); font-size:11px;">paras</span>'
            : `<span class="${repDrop > setA.cutoffPct ? (repDrop > setA.redVl ? 'red' : 'amber') : 'green'}" style="font-size:11px; font-weight:600;">VL ${repDrop.toFixed(0)} %</span> ${rirHtml}`;
        const delBtn = opts.allowRepDelete
          ? `<button type="button" data-del-set-rep="${rIdx}" title="Poista toisto" style="padding: 3px 8px; font-size: 11px; border-radius: 6px; background: transparent; border: 1px solid var(--border); color: var(--muted);">✕</button>`
          : '';
        return `
          <div style="display:flex; align-items:center; justify-content:space-between; gap:6px; background:rgba(15,23,42,0.55); border:1px solid rgba(51,65,85,0.4); padding:6px 8px; border-radius:7px; font-size:12px; font-variant-numeric:tabular-nums; flex-wrap:wrap;">
            <span style="font-weight:700; color:var(--muted); width:38px;">${qDot}#${rIdx + 1}</span>
            <strong style="color:var(--text);">${r.meanVelocity.toFixed(2)} m/s</strong>
            <span style="color:var(--muted); font-size:11px;">${(r.power || 0).toFixed(0)} W</span>
            <span style="color:var(--muted); font-size:11px;">${(Number(r.rangeOfMotionCm) || 0).toFixed(0)} cm</span>
            <div>${dropHtml}</div>
            ${pr && pr.rqi !== null && pr.rqi !== undefined ? `<span style="color:var(--muted); font-size:11px;">RQI ${Math.round(pr.rqi)}</span>` : ''}
            ${delBtn}
          </div>
        `;
      }).join('');

      const meta = s.traceMeta;
      const traceExtra = meta && meta.extraReps > 0 ? meta.extraReps : (meta && meta.segments > count ? meta.segments - count : 0);
      const traceStatusHtml = opts.showTraceStatus && (meta || lastTraceStatus)
        ? `<div style="font-size:11px; color:${traceExtra > 0 ? 'var(--amber)' : 'var(--muted)'};">${
            meta
              ? `📡 Pin 80 Hz: ${meta.matched}/${count} toistoa (segmenttejä ${meta.segments ?? meta.matched}) · ${meta.samples} näytettä${meta.barAxis ? ' · akseli ' + meta.barAxis.toUpperCase() : ''}${traceExtra > 0 ? ` · ⚠️ havaitsi ${meta.segments} nostoa (+${traceExtra} puuttuvaa)` : ''}`
              : lastTraceStatus
          }</div>`
        : '';

      const tngToggleHtml = (opts.allowRepDelete && getLiftKey(s.exercise) === 'deadlift')
        ? `<label class="row" style="justify-content:flex-start; gap:8px; font-size:12px; cursor:pointer;">
            <input type="checkbox" data-toggle-tng="1" ${s.touchAndGo ? 'checked' : ''} />
            <span>Touch-and-go (maastaveto: ohita 1. toisto V<sub>best</sub>/VL-vertailusta)</span>
          </label>`
        : '';

      const completedDef = (setA.completedCount ?? setA.valid.length) + (setA.mergedReps ? setA.mergedReps.reduce((acc, m) => acc + m.est, 0) : 0);
      const fixDefault = Number(s.repCountOverride) > 0 ? Math.round(s.repCountOverride)
        : ((setA.mergedCount || setA.driftCount) ? completedDef : count);
      const fixCountHtml = opts.allowRepDelete
        ? `<div class="row" style="gap:6px; flex-wrap:wrap; align-items:center;">
            <span style="font-size:12px; font-weight:700;">Korjaa toistomäärä</span>
            <input type="number" data-fix-repcount-input min="1" max="99" step="1" inputmode="numeric" value="${fixDefault}" style="width:64px;" />
            <button type="button" data-fix-repcount="1" style="padding:6px 10px; font-size:12px;">Tallenna</button>
            ${Number(s.repCountOverride) > 0 ? `<button type="button" data-fix-repcount-clear="1" style="padding:6px 10px; font-size:12px;">Nollaa</button>` : ''}
            <span style="font-size:11px; color:var(--muted); flex-basis:100%;">${Number(s.repCountOverride) > 0 ? `Käsin korjattu: ${Math.round(s.repCountOverride)} toistoa (tallennettu ${count}). ` : ''}Käytetään volyymiin ja toistosummiin; nopeustilastot lasketaan vain kelvollisista toistoista.</span>
          </div>`
        : '';
      const delSetHtml = opts.allowSetDelete
        ? `<button type="button" class="danger" data-del-this-set="1" style="width:100%; min-height:44px; margin-top:4px;">🗑 Poista tämä sarja</button>`
        : '';

      return `
        <div class="today-set-detail-content" style="display:flex; flex-direction:column; gap:10px; margin-top:6px;">
          ${traceStatusHtml}
          ${buildVbtSetBlockHTML(s, opts.dateStr || s._date)}

          <div class="stat-pill-grid">
            <div class="stat-pill">
              <span class="stat-pill-label">Keskinopeus</span>
              <span class="stat-pill-val">${avgVel.toFixed(2)} m/s</span>
            </div>
            <div class="stat-pill">
              <span class="stat-pill-label">Huipputeho</span>
              <span class="stat-pill-val">${bestWatt.toFixed(0)} W</span>
            </div>
            <div class="stat-pill">
              <span class="stat-pill-label">Liikerata (ROM)</span>
              <span class="stat-pill-val">${avgRom.toFixed(0)} cm</span>
            </div>
            <div class="stat-pill">
              <span class="stat-pill-label">Tonnimäärä</span>
              <span class="stat-pill-val">${Math.round((s.weightKg || 0) * setRepCount(s))} kg</span>
            </div>
          </div>

          <div>
            <div class="row" style="margin-bottom:4px;">
              <span style="font-size:12px; font-weight:700; color:var(--text);">Toistoerittely</span>
              <span style="font-size:11px; color:var(--muted);">${count} toistoa${Number(s.repCountOverride) > 0 ? ` (korjattu ${Math.round(s.repCountOverride)})` : ''}</span>
            </div>
            <div style="display:flex; flex-direction:column; gap:4px;">
              ${repListRows}
            </div>
          </div>
          ${tngToggleHtml}
          ${fixCountHtml}
          ${delSetHtml}
        </div>
      `;
    }

    function bindSetAnalysisActions(containerEl, dateStr, workoutSetIdx) {
      if (!containerEl) return;
      containerEl.querySelectorAll('[data-del-set-rep]').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const rIdx = parseInt(btn.getAttribute('data-del-set-rep'), 10);
          deleteRepFromSavedSet(dateStr, workoutSetIdx, rIdx);
        });
      });
      const tngChk = containerEl.querySelector('[data-toggle-tng]');
      if (tngChk) {
        tngChk.addEventListener('change', (e) => {
          e.stopPropagation();
          setTouchAndGo(dateStr, workoutSetIdx, tngChk.checked);
        });
      }
      const fixBtn = containerEl.querySelector('[data-fix-repcount]');
      if (fixBtn) {
        fixBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const inp = containerEl.querySelector('[data-fix-repcount-input]');
          setRepCountOverride(dateStr, workoutSetIdx, inp ? inp.value : '');
        });
      }
      const fixClr = containerEl.querySelector('[data-fix-repcount-clear]');
      if (fixClr) {
        fixClr.addEventListener('click', (e) => { e.stopPropagation(); setRepCountOverride(dateStr, workoutSetIdx, null); });
      }
      const delSetBtn = containerEl.querySelector('[data-del-this-set]');
      if (delSetBtn) {
        delSetBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteSavedSet(dateStr, workoutSetIdx);
        });
      }
    }

    function openSetAnalysisSheet(dateStr, workoutSetIdx) {
      const w = workouts.find((x) => x.date === dateStr);
      if (!w || !w.sets || !w.sets[workoutSetIdx]) return;
      const s = w.sets[workoutSetIdx];
      activeSheetSetRef = { dateStr, setIdx: workoutSetIdx };
      const titleEl = document.getElementById('setAnalysisSheetTitle');
      const bodyEl = document.getElementById('setAnalysisSheetBody');
      if (titleEl) titleEl.textContent = `Sarja #${workoutSetIdx + 1} · ${s.exercise} (${s.weightKg} kg)`;
      if (bodyEl) {
        bodyEl.innerHTML = buildSetAnalysisHTML(s, {
          dateStr,
          workoutSetIdx,
          showTraceStatus: true,
          allowRepDelete: true,
          allowSetDelete: true
        });
        bindSetAnalysisActions(bodyEl, dateStr, workoutSetIdx);
      }
      document.getElementById('setAnalysisSheet').classList.remove('hidden');
    }

    function closeSetAnalysisSheet() {
      activeSheetSetRef = null;
      const sh = document.getElementById('setAnalysisSheet');
      if (sh) sh.classList.add('hidden');
    }

    function refreshOpenSetAnalysisSheet() {
      const sh = document.getElementById('setAnalysisSheet');
      if (!sh || sh.classList.contains('hidden') || !activeSheetSetRef) return;
      const { dateStr, setIdx } = activeSheetSetRef;
      const w = workouts.find((x) => x.date === dateStr);
      if (!w || !w.sets || !w.sets[setIdx]) {
        closeSetAnalysisSheet();
        return;
      }
      openSetAnalysisSheet(dateStr, setIdx);
    }

    function renderRestSummaryCard() {
      if (getLiftUiState() !== 'rest') return;
      const meta = (lastSavedSetRef) || activeSetMeta || snapshotCurrentSetMeta();
      const dateStr = document.getElementById('workoutDate').value || todayISO();
      const displaySetNum = getActiveSetDisplayNumber();
      const titleEl = document.getElementById('restSetTitle');
      const timerBadge = document.getElementById('restTimerBadge');
      const unsavedBox = document.getElementById('restUnsavedActions');
      const resultEl = document.getElementById('restResultLine');
      const compEl = document.getElementById('restCompareLine');
      const findEl = document.getElementById('restFindingLine');
      const repsSumEl = document.getElementById('restRepsSummary');
      const listEl = document.getElementById('repList');
      const analyzeBtn = document.getElementById('restAnalyzeBtn');

      if (currentSetSaved) {
        if (titleEl) {
          titleEl.textContent = `✓ Sarja #${displaySetNum} tallennettu`;
          titleEl.style.color = 'var(--green)';
        }
        if (timerBadge) timerBadge.classList.remove('hidden');
        if (unsavedBox) unsavedBox.classList.add('hidden');
        updateRestTimerDisplay();
      } else {
        if (titleEl) {
          titleEl.textContent = `● Sarja #${displaySetNum} kesken (ei tallennettu)`;
          titleEl.style.color = 'var(--amber)';
        }
        if (timerBadge) timerBadge.classList.add('hidden');
        if (unsavedBox) unsavedBox.classList.remove('hidden');
      }

      const ex = meta.exercise || getCurrentSelectedExerciseName();
      const wKg = Number(meta.weightKg) || 0;
      const prof = (!isFreeMode() && getLiftCfg(ex)) ? recentProfile(ex, dateStr) : null;
      const restTng = lastSavedSetRef ? !!lastSavedSetRef.touchAndGo : isLiveTouchAndGo(ex);
      const a = analyzeSet(currentReps, ex, wKg, { profile: prof, dateStr, touchAndGo: restTng });
      const bestV = a.vBest || Math.max(0, ...currentReps.map((r) => r.meanVelocity || 0));
      const displayRepCount = (lastSavedSetRef && Number(lastSavedSetRef.repCountOverride) > 0)
        ? setRepCount(lastSavedSetRef)
        : currentReps.length;

      const metricsParts = [`${wKg} kg × ${displayRepCount}`, `paras ${fmtV(bestV)} m/s`];
      if (!isFreeMode()) {
        if (a.vlFinal !== null) metricsParts.push(`VL ${a.vlFinal.toFixed(0)} %`);
        if (a.rirEnd !== null) metricsParts.push(`RIR ~${a.rirEnd >= 10 ? '10+' : a.rirEnd}`);
      }
      if (resultEl) resultEl.textContent = metricsParts.join(' · ');

      // Same-load history comparison
      const prevLoads = getRecentSameLoadHistory(ex, wKg, dateStr, 3);
      if (compEl) {
        if (prevLoads.length && bestV > 0) {
          const avgPrev = prevLoads.reduce((s, x) => s + x.vBest, 0) / prevLoads.length;
          const deltaPct = ((bestV - avgPrev) / avgPrev) * 100;
          compEl.classList.remove('hidden');
          compEl.textContent = `Vs. edelliset @ ${wKg} kg: ${deltaPct >= 0 ? '+' : ''}${deltaPct.toFixed(1)} % (${fmtV(bestV)} vs ${fmtV(avgPrev)} m/s)`;
        } else {
          compEl.classList.add('hidden');
          compEl.textContent = '';
        }
      }

      // Max 1 finding line
      if (findEl) {
        const restTraceMeta = (lastSavedSetRef && lastSavedSetRef.traceMeta) || pendingTraceMeta || null;
        let finding = isFreeMode() ? null : buildShortRestFinding(a, ex, { traceMeta: restTraceMeta, count: currentReps.length });
        if (!finding && restTraceMeta) {
          const extra = restTraceMeta.extraReps > 0 ? restTraceMeta.extraReps : (restTraceMeta.segments > currentReps.length ? restTraceMeta.segments - currentReps.length : 0);
          if (extra > 0) finding = { text: `⚠️ Pin 80 Hz havaitsi ${restTraceMeta.segments} nostoa, mutta sovellus tallensi ${currentReps.length} (+${extra} puuttuvaa)`, cls: 'amber' };
        }
        if (finding) {
          findEl.className = finding.cls;
          findEl.classList.remove('hidden');
          findEl.textContent = finding.text;
        } else {
          findEl.classList.add('hidden');
          findEl.textContent = '';
        }
      }

      if (analyzeBtn) {
        const coords = lastSavedSetRef ? findSetCoordinates(lastSavedSetRef) : null;
        analyzeBtn.classList.toggle('hidden', !coords);
      }

      if (repsSumEl) repsSumEl.textContent = `▸ Toistot (${currentReps.length})`;
      if (listEl) {
        listEl.innerHTML = '';
        const maxVel = Math.max(0.01, ...currentReps.map((r) => r.meanVelocity));
        currentReps.forEach((r, idx) => {
          const div = document.createElement('div');
          div.className = 'rep-item';
          const lowHtml = r.loweringVelocity !== null
            ? `<span class="${isControlled(r.loweringVelocity) ? 'green' : 'red'}">↓ ${r.loweringVelocity.toFixed(2)} m/s</span>`
            : `<span style="color:var(--muted)">↓ …</span>`;
          const pr = a ? a.perRep[idx] : null;
          const widthPct = Math.max(6, Math.round((r.meanVelocity / maxVel) * 100));
          const qDot = pr ? `<span class="q-dot" style="border-color:${Q_COLORS[pr.quality]}"></span>` : '';
          const vsFirstHtml = isFreeMode() ? '' : (pr && pr.suspect)
            ? `<span style="color:#64748b; font-size:12px;">${pr.merged ? 'yhdistetty' : (pr.drift ? 'IMU-ajautuma' : 'epäilyttävä')}</span>`
            : (!pr || pr.vl === null || idx === a.vBestIdx)
              ? `<span style="color:var(--muted); font-size:12px;">paras</span>`
              : `<span class="${pr.vl > a.redVl ? 'red' : (pr.vl > a.cutoffPct ? 'amber' : 'green')}" style="font-size:12px; font-weight:600;">VL ${pr.vl.toFixed(0)} %</span>`
                + (pr.rir !== null ? ` <span style="color:var(--muted); font-size:12px;">RIR ~${pr.rir >= 10 ? '10+' : pr.rir}</span>` : '');

          div.innerHTML = `
            <div class="rep-item-top" style="flex-wrap: wrap;">
              <span class="rep-num">${qDot}#${idx + 1}</span>
              <span><strong>${r.meanVelocity.toFixed(2)} m/s</strong> (${(r.power || 0).toFixed(0)} W)</span>
              ${vsFirstHtml}
              ${lowHtml}
              <span style="color:var(--muted)">${(Number(r.rangeOfMotionCm) || 0).toFixed(0)} cm</span>
              <button type="button" data-del-live-rep="${idx}" title="Poista toisto" style="padding: 4px 8px; font-size: 12px; border-radius: 6px; background: transparent; border: 1px solid var(--border); color: var(--muted); min-width:34px; min-height:32px;">✕</button>
            </div>
            <div class="rep-bar-track">
              <div class="rep-bar-fill" style="width: ${widthPct}%;"></div>
            </div>
          `;
          div.querySelector('[data-del-live-rep]').addEventListener('click', () => deleteLiveRep(idx));
          listEl.appendChild(div);
        });
      }
    }

    function renderDoneSummaryCard() {
      const card = document.getElementById('doneSummaryCard');
      if (!card || getLiftUiState() !== 'done') return;
      const dateStr = document.getElementById('workoutDate').value || todayISO();
      const sets = getCompletedSetsForCurrentDate();
      const totalReps = sets.reduce((sum, s) => sum + setRepCount(s), 0);
      const tonnage = sets.reduce((sum, s) => sum + ((s.weightKg || 0) * setRepCount(s)), 0);
      let overVlCount = 0;
      let bestE1 = null;
      sets.forEach((s) => {
        const a = analyzeSet(s.reps, s.exercise, s.weightKg, { dateStr, touchAndGo: !!s.touchAndGo });
        if (!a.isWarmup && a.vlFinal !== null && a.vlFinal > a.cutoffPct) overVlCount++;
        if (a.e1RM && (!bestE1 || a.e1RM > bestE1.e1RM)) bestE1 = { ex: s.exercise, e1RM: a.e1RM };
      });
      card.innerHTML = `
        <div class="row">
          <strong style="font-size:15px; color:var(--green);">🏁 Treeni valmis · ${fmtDateFi(dateStr)}</strong>
          <span style="font-size:12px; color:var(--muted);">${sets.length} sarjaa</span>
        </div>
        <div class="stat-pill-grid" style="grid-template-columns: repeat(2, 1fr);">
          <div class="stat-pill"><span class="stat-pill-label">Sarjat / toistot</span><span class="stat-pill-val">${sets.length} / ${totalReps}</span></div>
          <div class="stat-pill"><span class="stat-pill-label">Tonnimäärä</span><span class="stat-pill-val">${Math.round(tonnage)} kg</span></div>
          <div class="stat-pill"><span class="stat-pill-label">Paras e1RM</span><span class="stat-pill-val" style="color:#60a5fa;">${bestE1 ? bestE1.e1RM.toFixed(0) + ' kg' : '--'}</span></div>
          <div class="stat-pill"><span class="stat-pill-label">VL-rajan ylityksiä</span><span class="stat-pill-val ${overVlCount ? 'amber' : 'green'}">${overVlCount}</span></div>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:4px;">
          <button type="button" id="doneOpenAnaBtn" class="primary" style="flex:1; min-height:48px;">📈 Avaa Analyysi</button>
          <button type="button" id="resumeWorkoutBtn" style="flex:1; min-height:48px;">▶ Aloita uusi sarja</button>
        </div>
      `;
      card.querySelector('#doneOpenAnaBtn').addEventListener('click', () => {
        anaDate = dateStr;
        showTab('analysis', 'sessio');
      });
      card.querySelector('#resumeWorkoutBtn').addEventListener('click', () => {
        workoutDoneState = false;
        renderLiveSet();
      });

    function renderTodaySetsOnLiftTab() {
      const card = document.getElementById('todaySetsCard');
      const listEl = document.getElementById('todaySetsList');
      const countEl = document.getElementById('todaySetsCount');
      const dateStr = document.getElementById('workoutDate').value || todayISO();

      if (!sets || sets.length === 0) {
        card.classList.add('hidden');
        listEl.innerHTML = '';
        return;
      }

      listEl.innerHTML = sets.map((s, idx) => {
        const count = setRepCount(s);
        const bestVel = (s.reps && s.reps.length) ? Math.max(0, ...s.reps.map((r) => r.meanVelocity || 0)) : 0;
        const dropPct = calcVelocityDropPct(s.reps, s.exercise, dateStr, { touchAndGo: !!s.touchAndGo });
        const qa = analyzeSet(s.reps, s.exercise, s.weightKg, { dateStr, touchAndGo: !!s.touchAndGo });
        const parts = [
          `<strong>#${idx + 1}</strong> ${s.exercise}`,
          `${s.weightKg} × ${count}`
        ];
        if (bestVel > 0) parts.push(`${bestVel.toFixed(2)} m/s`);
        if (!s.free && dropPct !== null) parts.push(`VL ${dropPct.toFixed(0)} %`);
        if (!s.free && qa.rirEnd !== null) parts.push(`RIR ~${qa.rirEnd >= 10 ? '10+' : qa.rirEnd}`);
        return `
          <div class="today-set-compact" data-today-idx="${idx}">
            <div class="today-set-compact-main">
              <div style="font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${parts.join(' · ')}</div>
            </div>
            <div class="today-set-compact-actions">
              <button type="button" data-analyze-set-idx="${idx}" style="color:#93c5fd; border-color:rgba(59,130,246,0.45);">Analysoi ›</button>
              <button type="button" class="danger" data-del-set-idx="${idx}" title="Poista sarja" aria-label="Poista sarja">🗑</button>
            </div>
          </div>
        `;
      }).join('');

      listEl.querySelectorAll('[data-analyze-set-idx]').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = parseInt(btn.getAttribute('data-analyze-set-idx'), 10);
          openSetAnalysisSheet(dateStr, idx);
