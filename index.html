<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Gpath Lite</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-alt: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green: #22c55e;
      --red: #ef4444;
      --amber: #f59e0b;
      --border: #334155;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px));
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 14px;
      padding-top: max(12px, env(safe-area-inset-top, 12px));
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
      width: 100%;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      min-width: 0;
      flex: 1;
    }
    #statusText {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .dot.ready { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .dot.busy { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
    .top-actions { display: flex; gap: 6px; flex-shrink: 0; }
    button {
      font: inherit;
      font-size: 14px;
      color: var(--text);
      background: var(--card-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 11px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:active { transform: scale(0.97); }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
    }
    button.success {
      background: var(--green);
      border-color: var(--green);
      color: #052e16;
    }
    button.danger {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--red);
      color: #fca5a5;
    }
    button:disabled {
      opacity: 0.45;
      pointer-events: none;
    }
    main {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }
    .setup-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
      width: 100%;
    }
    .row-wrap {
      flex-wrap: wrap;
    }
    label.small {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    input, select {
      font: inherit;
      font-size: 16px; /* Prevents iOS WebKit auto-zoom on focus */
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 8px;
      max-width: 100%;
      min-width: 0;
    }
    select {
      flex: 1;
      min-width: 0;
      text-overflow: ellipsis;
    }
    input[type="number"] {
      width: 60px;
      text-align: center;
      font-weight: 700;
      padding: 7px 4px;
    }
    .stepper {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .stepper button {
      padding: 7px 8px;
      min-width: 34px;
      font-size: 13px;
    }
    .set-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(59, 130, 246, 0.18);
      border: 1px solid var(--accent);
      color: #93c5fd;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }
    .set-badge.saved {
      background: rgba(34, 197, 94, 0.18);
      border-color: var(--green);
      color: #86efac;
    }
    .hero {
      text-align: center;
      padding: 16px 12px;
    }
    .hero-vel {
      font-size: 56px;
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }
    .hero-watts {
      font-size: 28px;
      font-weight: 700;
      color: #60a5fa;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }
    .sub-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .sub-metric-val {
      font-size: 18px;
      font-weight: 700;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }
    .green { color: var(--green); }
    .amber { color: var(--amber); }
    .red { color: var(--red); }
    .progress-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .progress-bar {
      height: 10px;
      background: var(--bg);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.2s ease, background 0.2s ease;
    }
    .progress-fill.done { background: var(--green); }
    .drop-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
    .vel-chart {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 118px;
      padding: 18px 8px 6px;
      background: var(--bg);
      border-radius: 10px;
      overflow-x: auto;
    }
    .vel-col {
      flex: 1;
      min-width: 28px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      gap: 4px;
    }
    .vel-col-val {
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }
    .vel-col-bar {
      width: 100%;
      max-width: 32px;
      border-radius: 6px 6px 3px 3px;
      background: var(--accent);
      transition: height 0.2s ease;
      min-height: 6px;
    }
    .vel-col-bar.good { background: var(--green); }
    .vel-col-bar.warn { background: var(--amber); }
    .vel-col-bar.high-drop { background: var(--red); }
    .vel-col-lbl {
      font-size: 10px;
      color: var(--muted);
      font-weight: 600;
    }
    .rep-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 240px;
      overflow-y: auto;
    }
    .rep-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 8px 10px;
      background: var(--bg);
      border-radius: 10px;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }
    .rep-item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .rep-bar-track {
      height: 6px;
      background: rgba(148, 163, 184, 0.15);
      border-radius: 999px;
      overflow: hidden;
    }
    .rep-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--accent);
      transition: width 0.2s ease;
    }
    .rep-bar-fill.good { background: var(--green); }
    .rep-bar-fill.warn { background: var(--amber); }
    .rep-bar-fill.high-drop { background: var(--red); }
    .rep-num {
      font-weight: 700;
      color: var(--muted);
      width: 32px;
    }
    .action-bar {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 10px;
    }
    .action-bar button {
      padding: 13px;
      font-size: 16px;
    }
    /* Bottom navigation */
    nav.tabs {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 6px 12px 14px;
      z-index: 30;
    }
    nav.tabs button {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 8px;
      font-size: 14px;
      border-radius: 10px;
    }
    nav.tabs button.active {
      color: var(--text);
      background: var(--card);
    }
    .hidden { display: none !important; }
    /* Calendar grid */
    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-weight: 700;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      font-size: 13px;
    }
    .cal-dow {
      color: var(--muted);
      font-size: 11px;
      padding: 4px 0;
    }
    .cal-day {
      padding: 8px 0;
      border-radius: 8px;
      cursor: pointer;
      position: relative;
      user-select: none;
    }
    .cal-day.selected {
      background: var(--accent);
      font-weight: 700;
    }
    .cal-day.has-workout::after {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--green);
      position: absolute;
      bottom: 3px;
      left: calc(50% - 2.5px);
    }
    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: max(28px, env(safe-area-inset-top, 28px)) 12px 16px;
      z-index: 50;
      overflow-y: auto;
    }
    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 10px;
    }
    .ex-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      -webkit-overflow-scrolling: touch;
    }
    .ex-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      padding: 9px 10px;
      border-radius: 10px;
    }
    .ex-row.selected-ex {
      border: 1px solid var(--accent);
      background: rgba(59, 130, 246, 0.12);
    }
    .history-set {
      background: var(--bg);
      border-radius: 10px;
      padding: 10px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <header>
    <div class="status-row">
      <div id="statusDot" class="dot"></div>
      <span id="statusText">Ei yhdistetty</span>
      <span id="batteryText" style="color: var(--muted); font-weight: 500; flex-shrink: 0;"></span>
    </div>
    <div class="top-actions">
      <button type="button" id="soundBtn" title="Äänimerkit">🔊</button>
      <button type="button" id="connectBtn" class="primary">Yhdistä Pin</button>
    </div>
  </header>

  <!-- TAB 1: LIVE TRAINING -->
  <main id="tabLift">
    <div class="card setup-grid">
      <div class="row">
        <label class="small" for="workoutDate">Päivä</label>
        <input type="date" id="workoutDate" />
      </div>

      <div class="row">
        <select id="exerciseSelect" aria-label="Liike"></select>
        <button type="button" id="editExercisesBtn" class="primary" style="flex-shrink: 0;">+ Liikkeet</button>
      </div>

      <!-- Inline quick-add exercise bar (also accessible via + Liikkeet modal) -->
      <form id="inlineExerciseForm" class="row hidden" style="background: var(--bg); padding: 8px; border-radius: 10px; border: 1px solid var(--accent);">
        <input type="text" id="inlineExerciseInput" placeholder="Uuden liikkeen nimi..." enterkeyhint="done" autocomplete="off" style="flex: 1; min-width: 0;" />
        <button type="submit" class="success" style="flex-shrink: 0;">Tallenna</button>
        <button type="button" id="cancelInlineExBtn" style="flex-shrink: 0; padding: 7px 9px;">✕</button>
      </form>

      <div class="row">
        <label class="small" for="weightInput">Paino (kg)</label>
        <div class="stepper">
          <button type="button" data-weight-delta="-2.5">-2.5</button>
          <button type="button" data-weight-delta="-1">-1</button>
          <input type="number" id="weightInput" value="8" min="0" step="0.5" inputmode="decimal" />
          <button type="button" data-weight-delta="1">+1</button>
          <button type="button" data-weight-delta="2.5">+2.5</button>
        </div>
      </div>

      <div class="row">
        <label class="small" for="targetRepsInput">Tavoitetoistot</label>
        <div class="stepper">
          <button type="button" id="repMinusBtn">−</button>
          <input type="number" id="targetRepsInput" value="10" min="1" max="100" step="1" inputmode="numeric" />
          <button type="button" id="repPlusBtn">+</button>
        </div>
      </div>
    </div>

    <div class="card hero">
      <div class="row" style="justify-content: center; margin-bottom: 6px;">
        <span id="setNumberBadge" class="set-badge">Sarja #1</span>
      </div>
      <div class="small" style="color: var(--muted); font-size: 12px; font-weight: 600;">MOVEMENT POWER</div>
      <div id="liveVel" class="hero-vel">-- m/s</div>
      <div id="liveWatts" class="hero-watts">-- W</div>

      <div class="sub-metrics">
        <div>
          <div class="small" style="font-size: 11px; color: var(--muted);">LOWERING</div>
          <div id="liveLowering" class="sub-metric-val">-- m/s</div>
        </div>
        <div>
          <div class="small" style="font-size: 11px; color: var(--muted);">AVG ROM</div>
          <div id="liveRom" class="sub-metric-val">-- cm</div>
        </div>
        <div>
          <div class="small" style="font-size: 11px; color: var(--muted);">PUDOTUS 1.→VIIM.</div>
          <div id="liveVelDrop" class="sub-metric-val">-- %</div>
        </div>
      </div>
    </div>

    <div class="card progress-wrap">
      <div class="row">
        <span id="repProgressLabel" style="font-weight: 700;">Sarja #1 • Toistot: 0 / 10</span>
        <button type="button" id="clearRepsBtn" style="padding: 4px 8px; font-size: 12px;">Tyhjennä</button>
      </div>
      <div class="progress-bar">
        <div id="repProgressFill" class="progress-fill"></div>
      </div>
      <div id="velDropBanner" class="drop-banner hidden"></div>
      <div id="velBarChart" class="vel-chart hidden"></div>
      <div id="repList" class="rep-list"></div>
    </div>

    <div class="action-bar">
      <button type="button" id="startSetBtn" class="primary" disabled>▶ Aloita sarja #1</button>
      <button type="button" id="saveSetBtn" class="success" disabled>Seuraava sarja &rarr;</button>
    </div>

    <!-- Today's completed sets on the live training tab -->
    <div id="todaySetsCard" class="card hidden">
      <div class="row" style="margin-bottom: 4px;">
        <strong id="todaySetsTitle" style="font-size: 14px;">Tallennetut sarjat tänään</strong>
        <span id="todaySetsCount" style="font-size: 12px; color: var(--muted);"></span>
      </div>
      <div id="todaySetsList"></div>
    </div>
  </main>

  <!-- TAB 2: CALENDAR & CSV -->
  <main id="tabHistory" class="hidden">
    <div class="card">
      <div class="cal-header">
        <button type="button" id="calPrevBtn">&larr;</button>
        <span id="calMonthLabel"></span>
        <button type="button" id="calNextBtn">&rarr;</button>
      </div>
      <div class="cal-grid" id="calDow">
        <div class="cal-dow">Ma</div><div class="cal-dow">Ti</div><div class="cal-dow">Ke</div>
        <div class="cal-dow">To</div><div class="cal-dow">Pe</div><div class="cal-dow">La</div><div class="cal-dow">Su</div>
      </div>
      <div class="cal-grid" id="calDays"></div>

      <div class="row" style="margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);">
        <label style="display: flex; align-items: center; gap: 8px; font-size: 14px;">
          <input type="checkbox" id="filterDateChk" checked />
          Näytä vain valittu päivä
        </label>
        <div style="display: flex; gap: 6px;">
          <button type="button" id="exportCsvBtn" class="primary">Vie CSV</button>
        </div>
      </div>
    </div>

    <div id="historyContainer"></div>
  </main>

  <!-- EXERCISE MODAL -->
  <div id="exerciseModal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="row">
        <strong>Valitse tai lisää liike</strong>
        <button type="button" id="closeModalBtn">Sulje</button>
      </div>
      <form id="addExerciseForm" class="row">
        <input type="text" id="newExerciseInput" placeholder="Uusi liike, esim. Ristikkäistalja" enterkeyhint="done" autocomplete="off" style="flex: 1; min-width: 0;" />
        <button type="submit" id="addExerciseBtn" class="primary" style="flex-shrink: 0;">Lisää</button>
      </form>
      <div id="exerciseFeedback" class="hidden" style="font-size: 13px; color: var(--green); font-weight: 600;"></div>
      <div id="modalExerciseList" class="ex-list"></div>
    </div>
  </div>

  <nav class="tabs">
    <button type="button" id="navLiftBtn" class="active">🏋️ Treeni</button>
    <button type="button" id="navHistoryBtn">📅 Kalenteri &amp; CSV</button>
  </nav>

  <script>
    // --- Gpath Pin BLE Constants ---
    const SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
    const ADV_UUID     = '00008018-0000-1000-8000-00805f9b34fb';
    const CHAR_UUID    = 'beb5483e-36e1-4688-b7f5-ea07361b2688';
    const CMD_HELLO    = 0x06;
    const CMD_BATTERY  = 0x01;
    const CMD_START    = 0x03;
    const CMD_STOP     = 0x04;
    const CMD_END      = 0x05;

    // --- Storage Keys ---
    const KEY_EXERCISES = 'gpath_exercises_v1';
    const KEY_WORKOUTS  = 'gpath_workouts_v1';
    const ADD_NEW_EX_VALUE = '__add_new_exercise__';

    const DEFAULT_EXERCISES = [
      'Jalkakyykky',
      'Penkkipunnerrus',
      'Sotilaspenkkipunnerrus',
      'Maastaveto',
      'Ylätalja (Lat Pulldown)',
      'Alatalja (Seated Row)',
      'Rintaprässi (Chest Press)',
      'Pystypunnerrus (Shoulder Press)',
      'Ojentajat taljassa (Triceps Pushdown)',
      'Hauiskääntö taljassa (Cable Curl)',
      'Jalkaprässi (Leg Press)',
      'Reiden ojennus (Leg Extension)',
      'Reiden koukistus (Leg Curl)'
    ];

    // --- State ---
    let bleDevice = null;
    let dataChar = null;
    let manualDisconnect = false;
    let soundEnabled = true;
    let audioCtx = null;
    let audioUnlocked = false;
    let setActive = false;
    let zeroing = false;
    let activeSetToken = 0;

    let pendingRep = { propVel: null, propAcc: null, romCm: null };
    let currentReps = [];
    let currentSetSaved = false;
    let lastSavedSetRef = null;
    let lastSetStoppedAt = 0;

    const memoryStore = {};
    let exercises = loadJSON(KEY_EXERCISES, [...DEFAULT_EXERCISES]);
    if (!Array.isArray(exercises) || exercises.length === 0) {
      exercises = [...DEFAULT_EXERCISES];
    } else {
      const topDefaults = ['Jalkakyykky', 'Penkkipunnerrus', 'Sotilaspenkkipunnerrus', 'Maastaveto'];
      const missingTop = topDefaults.filter((ex) => !exercises.includes(ex));
      if (missingTop.length > 0) {
        exercises = [...missingTop, ...exercises];
        saveJSON(KEY_EXERCISES, exercises);
      }
    }
    let workouts = loadJSON(KEY_WORKOUTS, []); // [{ date: 'YYYY-MM-DD', sets: [...] }]
    if (!Array.isArray(workouts)) {
      workouts = [];
    }

    let calYear = new Date().getFullYear();
    let calMonth = new Date().getMonth();
    let selectedHistoryDate = todayISO();

    function todayISO() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function readWindowNameStore() {
      try {
        if (window.name && window.name.startsWith('{')) {
          return JSON.parse(window.name);
        }
      } catch {}
      return {};
    }

    function loadJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (raw) return JSON.parse(raw);
      } catch {}
      try {
        const wn = readWindowNameStore();
        if (wn && wn[key] !== undefined) return wn[key];
      } catch {}
      return memoryStore[key] !== undefined ? memoryStore[key] : fallback;
    }

    function saveJSON(key, val) {
      memoryStore[key] = val;
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (e) {
        console.warn('localStorage write fallback:', e);
      }
      try {
        const wn = readWindowNameStore();
        wn[key] = val;
        window.name = JSON.stringify(wn);
      } catch {}
    }

    // --- iOS + Android + Desktop Audio Engine (PCM WAV + Web Audio fallback) ---
    // Generates an in-memory 16-bit mono 22050 Hz WAV data URI so HTMLAudioElement
    // plays through the iOS Media channel even from async BLE notifications.
    function createWavDataUri(notes) {
      const sampleRate = 22050;
      let totalMs = 0;
      for (const n of notes) {
        totalMs = Math.max(totalMs, (n.delayMs || 0) + n.durationMs + 20);
      }
      const numSamples = Math.max(1, Math.ceil((totalMs / 1000) * sampleRate));
      const samples = new Float32Array(numSamples);

      for (const n of notes) {
        const startIdx = Math.floor(((n.delayMs || 0) / 1000) * sampleRate);
        const len = Math.floor((n.durationMs / 1000) * sampleRate);
        const freq = n.freq || 440;
        const amp = n.gain || 0.38;
        const wave = n.type || 'sine';

        for (let i = 0; i < len && (startIdx + i) < numSamples; i++) {
          const t = i / sampleRate;
          // Smooth attack (8 ms) and exponential decay envelope
          const attack = Math.min(1, i / (0.008 * sampleRate));
          const decay = Math.exp(-3.2 * (i / len));
          const phase = 2 * Math.PI * freq * t;
          let s = 0;
          if (wave === 'sawtooth') {
            s = 2 * ((t * freq) - Math.floor(0.5 + t * freq));
          } else if (wave === 'triangle') {
            s = (2 / Math.PI) * Math.asin(Math.sin(phase));
          } else {
            s = Math.sin(phase) + 0.25 * Math.sin(2 * phase);
          }
          samples[startIdx + i] += s * amp * attack * decay;
        }
      }

      const dataBytes = numSamples * 2;
      const buf = new ArrayBuffer(44 + dataBytes);
      const view = new DataView(buf);
      const writeStr = (offset, str) => {
        for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
      };

      writeStr(0, 'RIFF');
      view.setUint32(4, 36 + dataBytes, true);
      writeStr(8, 'WAVE');
      writeStr(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true); // PCM
      view.setUint16(22, 1, true); // Mono
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeStr(36, 'data');
      view.setUint32(40, dataBytes, true);

      for (let i = 0; i < numSamples; i++) {
        const clamped = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(44 + i * 2, clamped < 0 ? clamped * 0x8000 : clamped * 0x7FFF, true);
      }

      const bytes = new Uint8Array(buf);
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return 'data:audio/wav;base64,' + btoa(binary);
    }

    const SOUND_URIS = {
      silence: createWavDataUri([{ freq: 440, durationMs: 15, delayMs: 0, gain: 0.0001 }]),
      ready: createWavDataUri([
        { freq: 523.25, durationMs: 120, delayMs: 0, gain: 0.45 },
        { freq: 783.99, durationMs: 180, delayMs: 125, gain: 0.48 }
      ]),
      rep: createWavDataUri([
        { freq: 880, durationMs: 135, delayMs: 0, gain: 0.48 }
      ]),
      target: createWavDataUri([
        { freq: 587.33, durationMs: 115, delayMs: 0, gain: 0.45 },
        { freq: 783.99, durationMs: 115, delayMs: 120, gain: 0.45 },
        { freq: 1046.5, durationMs: 260, delayMs: 240, gain: 0.50 }
      ]),
      warn: createWavDataUri([
        { freq: 240, durationMs: 150, delayMs: 0, type: 'sawtooth', gain: 0.45 },
        { freq: 200, durationMs: 160, delayMs: 160, type: 'sawtooth', gain: 0.45 }
      ])
    };

    const audioPool = {};
    for (const [k, uri] of Object.entries(SOUND_URIS)) {
      try {
        const a = new Audio(uri);
        a.preload = 'auto';
        a.playsInline = true;
        audioPool[k] = a;
      } catch {}
    }

    function ensureAudio() {
      try {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) audioCtx = new Ctx();
        }
        if (audioCtx) {
          if (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted') {
            audioCtx.resume().catch(() => {});
          }
          if (!audioUnlocked) {
            // Play 1-sample silent buffer to unlock iOS WebKit AudioContext inside user gesture
            const buf = audioCtx.createBuffer(1, 1, 22050);
            const src = audioCtx.createBufferSource();
            src.buffer = buf;
            src.connect(audioCtx.destination);
            if (src.start) src.start(0);
          }
        }
      } catch {}

      if (!audioUnlocked && audioPool.silence) {
        try {
          const p = audioPool.silence.play();
          if (p && p.then) {
            p.then(() => { audioUnlocked = true; }).catch(() => {});
          } else {
            audioUnlocked = true;
          }
        } catch {}
      }
    }

    // Unlock audio on any first user touch/click on iOS
    ['touchstart', 'touchend', 'pointerdown', 'click'].forEach((evtName) => {
      document.addEventListener(evtName, ensureAudio, { passive: true });
    });

    function playOscillatorFallback(notes) {
      if (!audioCtx) return;
      try {
        if (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted') {
          audioCtx.resume().catch(() => {});
        }
        const baseNow = audioCtx.currentTime;
        for (const n of notes) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = n.type || 'sine';
          osc.frequency.value = n.freq;
          const startAt = baseNow + (n.delayMs || 0) / 1000;
          const stopAt = startAt + n.durationMs / 1000;
          gain.gain.setValueAtTime(0.28, startAt);
          gain.gain.exponentialRampToValueAtTime(0.001, stopAt);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(startAt);
          osc.stop(stopAt);
        }
      } catch {}
    }

    function playCue(name, fallbackNotes) {
      if (!soundEnabled) return;
      ensureAudio();
      const baseAudio = audioPool[name];
      if (baseAudio) {
        try {
          baseAudio.currentTime = 0;
          const playPromise = baseAudio.play();
          if (playPromise && playPromise.catch) {
            playPromise.catch(() => playOscillatorFallback(fallbackNotes));
          }
          return;
        } catch {}
      }
      playOscillatorFallback(fallbackNotes);
    }

    function soundReady() {
      playCue('ready', [
        { freq: 523.25, durationMs: 110, delayMs: 0 },
        { freq: 783.99, durationMs: 160, delayMs: 120 }
      ]);
    }
    function soundRep() {
      playCue('rep', [{ freq: 880, durationMs: 120, delayMs: 0 }]);
    }
    function soundTargetReached() {
      playCue('target', [
        { freq: 587.33, durationMs: 110, delayMs: 0 },
        { freq: 783.99, durationMs: 110, delayMs: 120 },
        { freq: 1046.5, durationMs: 240, delayMs: 240 }
      ]);
    }
    function soundLoweringWarn() {
      playCue('warn', [
        { freq: 240, durationMs: 150, delayMs: 0, type: 'sawtooth' },
        { freq: 200, durationMs: 160, delayMs: 160, type: 'sawtooth' }
      ]);
    }

    // --- BLE Communication ---
    function setStatus(text, mode) {
      document.getElementById('statusText').textContent = text;
      const dot = document.getElementById('statusDot');
      dot.className = 'dot' + (mode ? ' ' + mode : '');
    }

    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    let writeChain = Promise.resolve();
    let pinStarted = false;
    let zeroTimer = null;

    function writeByte(byte) {
      writeChain = writeChain.then(async () => {
        if (!dataChar) return;
        const arr = new Uint8Array([byte]);
        try {
          const op = dataChar.writeValue
            ? dataChar.writeValue(arr)
            : dataChar.writeValueWithResponse(arr);
          await Promise.race([op, sleep(450)]);
        } catch (e) {
          console.warn('BLE write warning:', e);
        }
      });
      return writeChain;
    }

    function clearZeroTimer() {
      if (zeroTimer) {
        clearTimeout(zeroTimer);
        zeroTimer = null;
      }
    }

    function getCompletedSetsForCurrentDate() {
      const dateEl = document.getElementById('workoutDate');
      const dateStr = (dateEl && dateEl.value) ? dateEl.value : todayISO();
      const workout = workouts.find((w) => w.date === dateStr);
      return workout ? workout.sets : [];
    }

    function getActiveSetDisplayNumber() {
      const completedCount = getCompletedSetsForCurrentDate().length;
      // If currentReps has already been saved into workouts (while resting after Lopeta sarja),
      // the displayed set is that just-saved set (#completedCount). Otherwise it is the next set (#completedCount + 1).
      if (currentSetSaved && currentReps.length > 0) {
        return Math.max(1, completedCount);
      }
      return completedCount + 1;
    }

    function activateSet(expectedToken) {
      if (expectedToken !== undefined && expectedToken !== activeSetToken) return;
      clearZeroTimer();
      // Only transition to active if we are actually zeroing a newly started set!
      if (!zeroing) return;
      pinStarted = true;
      zeroing = false;
      setActive = true;
      const setNum = getActiveSetDisplayNumber();
      updateSetButton();
      setStatus(`Sarja #${setNum} käynnissä – tee toistoja`, 'ready');
      soundReady();
    }

    async function disconnectPin() {
      manualDisconnect = true;
      activeSetToken++;
      clearZeroTimer();
      setActive = false;
      zeroing = false;
      pinStarted = false;
      try {
        if (dataChar) {
          await writeByte(CMD_STOP);
          await sleep(50);
          await writeByte(CMD_END);
        }
      } catch {}
      try {
        if (bleDevice && bleDevice.gatt && bleDevice.gatt.connected) {
          bleDevice.gatt.disconnect();
        }
      } catch {}
      dataChar = null;
      updateSetButton();
      document.getElementById('connectBtn').textContent = 'Yhdistä Pin';
      setStatus('Ei yhdistetty', '');
    }

    async function releaseStaleConnections() {
      try {
        if (bleDevice && bleDevice.gatt && bleDevice.gatt.connected) {
          bleDevice.gatt.disconnect();
          await sleep(300);
        }
        if (navigator.bluetooth && navigator.bluetooth.getDevices) {
          const devs = await navigator.bluetooth.getDevices();
          for (const d of devs) {
            if (d.gatt && d.gatt.connected) {
              d.gatt.disconnect();
            }
          }
        }
      } catch {}
    }

    async function connectPin() {
      ensureAudio();
      if (!navigator.bluetooth) {
        alert('Selaimesi ei tue Web Bluetoothia. Avaa tämä sivu iPhonessa ilmaisella Bluefy-selaimella (App Store) tai Android/Windows Chrome-selaimella.');
        return;
      }

      if (bleDevice && bleDevice.gatt && bleDevice.gatt.connected && dataChar) {
        await disconnectPin();
        return;
      }

      manualDisconnect = false;
      try {
        if (bleDevice) {
          try {
            await openGattSession();
            return;
          } catch {
            await releaseStaleConnections();
          }
        } else {
          await releaseStaleConnections();
        }

        setStatus('Etsitään Piniä...', 'busy');
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [
            { namePrefix: 'GPATH' },
            { namePrefix: 'Gpath' },
            { services: [ADV_UUID] },
            { services: [SERVICE_UUID] }
          ],
          optionalServices: [SERVICE_UUID, ADV_UUID]
        });
        bleDevice.removeEventListener('gattserverdisconnected', onDisconnected);
        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
        await openGattSession();
      } catch (err) {
        setStatus('Ei yhdistetty', '');
        console.error(err);
      }
    }

    function updateSetButton() {
      const btn = document.getElementById('startSetBtn');
      const saveBtn = document.getElementById('saveSetBtn');
      const completedCount = getCompletedSetsForCurrentDate().length;
      const nextSetNum = completedCount + 1;

      btn.disabled = !dataChar;
      if (zeroing) {
        btn.textContent = '⏳ Nollataan...';
        btn.className = '';
      } else if (setActive) {
        btn.textContent = `⏹ Lopeta sarja #${nextSetNum}`;
        btn.className = 'danger';
      } else {
        btn.textContent = `▶ Aloita sarja #${nextSetNum}`;
        btn.className = 'primary';
      }

      if (saveBtn) {
        if (currentReps.length === 0) {
          saveBtn.disabled = true;
          saveBtn.textContent = `Seuraava sarja →`;
        } else if (currentSetSaved) {
          saveBtn.disabled = false;
          saveBtn.textContent = `Tyhjennä sarjaan #${nextSetNum} →`;
        } else {
          saveBtn.disabled = false;
          saveBtn.textContent = `✓ Tallenna sarja #${nextSetNum}`;
        }
      }
    }

    async function openGattSession() {
      if (!bleDevice) return;
      setStatus('Yhdistetään...', 'busy');
      const server = await bleDevice.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);
      dataChar = await service.getCharacteristic(CHAR_UUID);

      // Mandatory 0x06 handshake before and after enabling notifications
      await writeByte(CMD_HELLO);
      await dataChar.startNotifications();
      dataChar.removeEventListener('characteristicvaluechanged', onNotification);
      dataChar.addEventListener('characteristicvaluechanged', onNotification);
      await sleep(60);
      await writeByte(CMD_HELLO);
      await sleep(60);
      await writeByte(CMD_BATTERY);

      pinStarted = false;
      setActive = false;
      zeroing = false;
      activeSetToken++;
      document.getElementById('connectBtn').textContent = 'Katkaise';
      setStatus('Yhdistetty – paina Aloita sarja', '');
      updateSetButton();
    }

    function commitCurrentSetToWorkouts() {
      if (currentReps.length === 0 || currentSetSaved) return false;
      const dateStr = document.getElementById('workoutDate').value || todayISO();
      const selVal = document.getElementById('exerciseSelect').value;
      const exercise = (selVal && selVal !== ADD_NEW_EX_VALUE) ? selVal : (exercises[0] || DEFAULT_EXERCISES[0]);
      const weightKg = parseFloat(document.getElementById('weightInput').value) || 0;
      const targetReps = parseInt(document.getElementById('targetRepsInput').value, 10) || 10;
      const nowTime = new Date().toTimeString().slice(0, 8);

      let workout = workouts.find((w) => w.date === dateStr);
      if (!workout) {
        workout = { date: dateStr, sets: [] };
        workouts.push(workout);
      }
      const setCopy = {
        time: nowTime,
        exercise,
        weightKg,
        targetReps,
        reps: currentReps.map((r) => ({ ...r }))
      };
      workout.sets.push(setCopy);
      lastSavedSetRef = setCopy;
      currentSetSaved = true;

      saveJSON(KEY_WORKOUTS, workouts);
      selectedHistoryDate = dateStr;
      renderCalendar();
      renderHistoryList();
      return true;
    }

    async function startSetOnPin() {
      if (!dataChar) return;
      ensureAudio();
      clearZeroTimer();

      // If previous set had reps, ensure it is saved before starting the new set, then clear currentReps!
      if (currentReps.length > 0) {
        if (!currentSetSaved) {
          commitCurrentSetToWorkouts();
        }
        currentReps = [];
        currentSetSaved = false;
        lastSavedSetRef = null;
      }

      pendingRep = { propVel: null, propAcc: null, romCm: null };
      const token = ++activeSetToken;
      zeroing = true;
      setActive = false;
      renderLiveSet();
      updateSetButton();

      if (!pinStarted) {
        setStatus('Pidä Pin paikallaan (3 s)...', 'busy');
        zeroTimer = setTimeout(() => activateSet(token), 3200);
        await writeByte(CMD_HELLO);
        await sleep(50);
        await writeByte(CMD_BATTERY);
        await sleep(50);
        await writeByte(CMD_START);
      } else {
        // Pin is already running its IMU session in 0x03 mode; activate new set immediately
        activateSet(token);
        writeByte(CMD_HELLO);
      }
    }

    async function stopSetOnPin(autoSave = true) {
      activeSetToken++;
      clearZeroTimer();
      setActive = false;
      zeroing = false;
      lastSetStoppedAt = Date.now();
      pendingRep = { propVel: null, propAcc: null, romCm: null };

      // Automatically save completed set when user ends the set so next set starts fresh
      if (autoSave && currentReps.length > 0 && !currentSetSaved) {
        commitCurrentSetToWorkouts();
      }

      renderLiveSet();
      updateSetButton();
      if (dataChar) {
        const nextNum = getCompletedSetsForCurrentDate().length + 1;
        if (currentSetSaved && currentReps.length > 0) {
          setStatus(`Sarja tallennettu – valmis sarjaan #${nextNum}`, '');
        } else {
          setStatus(`Sarja pysäytetty – valmis sarjaan #${nextNum}`, '');
        }
      }
    }

    async function toggleSetOnPin() {
      if (!dataChar) return;
      if (setActive || zeroing) {
        await stopSetOnPin(true);
      } else {
        await startSetOnPin();
      }
    }

    function onDisconnected() {
      activeSetToken++;
      clearZeroTimer();
      dataChar = null;
      pinStarted = false;
      setActive = false;
      zeroing = false;
      updateSetButton();
      document.getElementById('connectBtn').textContent = 'Yhdistä Pin';
      if (manualDisconnect) {
        setStatus('Ei yhdistetty', '');
        return;
      }
      setStatus('Yhteys katkesi – yhdistetään...', 'busy');
      setTimeout(async () => {
        if (bleDevice && !manualDisconnect) {
          try { await openGattSession(); } catch { setStatus('Ei yhdistetty', ''); }
        }
      }, 1200);
    }

    window.addEventListener('pagehide', () => {
      try {
        if (bleDevice && bleDevice.gatt && bleDevice.gatt.connected) {
          bleDevice.gatt.disconnect();
        }
      } catch {}
    });
    window.addEventListener('beforeunload', () => {
      try {
        if (bleDevice && bleDevice.gatt && bleDevice.gatt.connected) {
          bleDevice.gatt.disconnect();
        }
      } catch {}
    });

    function onNotification(event) {
      const dv = event.target.value;
      if (!dv || dv.byteLength === 0) return;
      const type = dv.getUint8(0);

      if (dv.byteLength === 1 && type >= 0x81 && type <= 0x86) {
        if (type === 0x83 && zeroing) {
          activateSet(activeSetToken);
        }
        return;
      }

      if (dv.byteLength !== 5) return;
      const val = dv.getFloat32(1, true); // little-endian Float32

      if (type === 0x81) {
        document.getElementById('batteryText').textContent = `• ${Math.round(val)}%`;
        return;
      }

      // Allow final rep's eccentric lowering packet (0x06) within 1.5s of stopping the set
      if (!setActive) {
        if (type === 0x06 && currentReps.length > 0 && (Date.now() - lastSetStoppedAt) < 1500) {
          const eccVel = val / 1000.0;
          const last = currentReps[currentReps.length - 1];
          if (last.loweringVelocity === null) {
            last.loweringVelocity = eccVel;
            if (lastSavedSetRef && lastSavedSetRef.reps && lastSavedSetRef.reps.length > 0) {
              lastSavedSetRef.reps[lastSavedSetRef.reps.length - 1].loweringVelocity = eccVel;
              saveJSON(KEY_WORKOUTS, workouts);
            }
            if (eccVel > 0.60) soundLoweringWarn();
            renderLiveSet();
          }
        }
        return;
      }

      if (type === 0x03) {
        pendingRep.propVel = val / 1000.0;
      } else if (type === 0x05) {
        pendingRep.romCm = val / 10.0;
      } else if (type === 0x04) {
        pendingRep.propAcc = val / 1000.0;
      } else if (type === 0x02) {
        const meanVel = val / 1000.0;
        const propVel = pendingRep.propVel ?? meanVel;
        const propAcc = pendingRep.propAcc ?? 0;
        const romCm   = pendingRep.romCm ?? 0;
        pendingRep = { propVel: null, propAcc: null, romCm: null };

        const weightKg = parseFloat(document.getElementById('weightInput').value) || 0;
        // Verified 8 kg power formula: P = m * (g + 0.58 * a_prop) * v
        const power = weightKg * (9.80665 + 0.58 * propAcc) * meanVel;

        currentReps.push({
          meanVelocity: meanVel,
          propulsiveVelocity: propVel,
          propulsiveAcceleration: propAcc,
          rangeOfMotionCm: romCm,
          loweringVelocity: null,
          power: power
        });

        const targetReps = parseInt(document.getElementById('targetRepsInput').value, 10) || 10;
        if (currentReps.length === targetReps) {
          soundTargetReached();
        } else {
          soundRep();
        }
        renderLiveSet();
        updateSetButton();
      } else if (type === 0x06) {
        const eccVel = val / 1000.0;
        if (currentReps.length > 0) {
          const last = currentReps[currentReps.length - 1];
          last.loweringVelocity = eccVel;
          if (eccVel > 0.60) {
            soundLoweringWarn();
          }
          renderLiveSet();
        }
      }
    }

    // --- UI Rendering (Live Set) ---
    function isControlled(v) {
      return v !== null && v !== undefined && v >= 0.20 && v <= 0.60;
    }

    function calcVelocityDropPct(reps) {
      if (!reps || reps.length < 2) return null;
      const first = reps[0].meanVelocity;
      const last = reps[reps.length - 1].meanVelocity;
      if (!first || first <= 0) return null;
      return ((first - last) / first) * 100;
    }

    function dropColorClass(dropPct) {
      if (dropPct === null || dropPct === undefined) return '';
      if (dropPct >= 25) return 'red';
      if (dropPct >= 15) return 'amber';
      return 'green';
    }

    function barZoneClass(dropPct) {
      if (dropPct >= 25) return 'high-drop';
      if (dropPct >= 15) return 'warn';
      return 'good';
    }

    function formatDropBadge(dropPct) {
      if (dropPct === null || dropPct === undefined) return '-- %';
      if (dropPct > 0.05) return `-${dropPct.toFixed(1)} %`;
      if (dropPct < -0.05) return `+${Math.abs(dropPct).toFixed(1)} %`;
      return '0.0 %';
    }

    function buildVelocityChartHTML(reps) {
      if (!reps || reps.length === 0) return '';
      const maxVel = Math.max(0.01, ...reps.map((r) => r.meanVelocity));
      const firstVel = reps[0].meanVelocity || maxVel;
      return reps.map((r, idx) => {
        const heightPct = Math.max(8, Math.round((r.meanVelocity / maxVel) * 100));
        const repDrop = firstVel > 0 ? ((firstVel - r.meanVelocity) / firstVel) * 100 : 0;
        const zone = idx === 0 ? '' : barZoneClass(repDrop);
        return `
          <div class="vel-col">
            <span class="vel-col-val">${r.meanVelocity.toFixed(2)}</span>
            <div class="vel-col-bar ${zone}" style="height: ${heightPct}%;"></div>
            <span class="vel-col-lbl">#${idx + 1}</span>
          </div>
        `;
      }).join('');
    }

    function renderTodaySetsOnLiftTab() {
      const card = document.getElementById('todaySetsCard');
      const listEl = document.getElementById('todaySetsList');
      const countEl = document.getElementById('todaySetsCount');
      const sets = getCompletedSetsForCurrentDate();

      if (!sets || sets.length === 0) {
        card.classList.add('hidden');
        listEl.innerHTML = '';
        return;
      }

      card.classList.remove('hidden');
      countEl.textContent = `${sets.length} sarjaa valmiina`;
      listEl.innerHTML = sets.map((s, idx) => {
        const bestVel = Math.max(0, ...s.reps.map((r) => r.meanVelocity));
        const dropPct = calcVelocityDropPct(s.reps);
        const dropText = dropPct !== null ? ` • Pudotus ${formatDropBadge(dropPct)}` : '';
        return `
          <div class="history-set" style="padding: 8px 10px; margin-top: 6px;">
            <div class="row">
              <strong style="font-size: 13px;">Sarja #${idx + 1}: ${s.exercise}</strong>
              <span style="color: var(--muted); font-size: 12px;">${s.weightKg} kg • ${s.reps.length}/${s.targetReps} toistoa</span>
            </div>
            <div style="font-size: 12px; color: var(--muted); margin-top: 2px;">
              Paras: ${bestVel.toFixed(2)} m/s${dropText}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderLiveSet() {
      const target = parseInt(document.getElementById('targetRepsInput').value, 10) || 10;
      const count = currentReps.length;
      const last = currentReps[count - 1];
      const displaySetNum = getActiveSetDisplayNumber();

      const badge = document.getElementById('setNumberBadge');
      if (currentSetSaved && count > 0) {
        const nextNum = getCompletedSetsForCurrentDate().length + 1;
        badge.textContent = `✓ Sarja #${displaySetNum} tallennettu (Seuraava: #${nextNum})`;
        badge.className = 'set-badge saved';
      } else {
        badge.textContent = setActive ? `● Sarja #${displaySetNum} käynnissä` : `Sarja #${displaySetNum}`;
        badge.className = 'set-badge';
      }

      document.getElementById('liveVel').textContent = last ? `${last.meanVelocity.toFixed(2)} m/s` : '-- m/s';
      document.getElementById('liveWatts').textContent = last ? `${last.power.toFixed(2)} W` : '-- W';

      const lowEl = document.getElementById('liveLowering');
      if (last && last.loweringVelocity !== null) {
        lowEl.textContent = `${last.loweringVelocity.toFixed(2)} m/s`;
        lowEl.className = 'sub-metric-val ' + (isControlled(last.loweringVelocity) ? 'green' : 'red');
      } else {
        lowEl.textContent = '-- m/s';
        lowEl.className = 'sub-metric-val';
      }

      const romEl = document.getElementById('liveRom');
      if (count > 0) {
        const avgRom = currentReps.reduce((acc, r) => acc + r.rangeOfMotionCm, 0) / count;
        romEl.textContent = `${avgRom.toFixed(0)} cm`;
      } else {
        romEl.textContent = '-- cm';
      }

      const dropPct = calcVelocityDropPct(currentReps);
      const dropEl = document.getElementById('liveVelDrop');
      dropEl.textContent = formatDropBadge(dropPct);
      dropEl.className = 'sub-metric-val ' + dropColorClass(dropPct);

      const bannerEl = document.getElementById('velDropBanner');
      if (count >= 2 && dropPct !== null) {
        const firstV = currentReps[0].meanVelocity.toFixed(2);
        const lastV = last.meanVelocity.toFixed(2);
        const label = dropPct >= 0
          ? `Nopeus tippui <strong>${dropPct.toFixed(1)} %</strong>`
          : `Nopeus nousi <strong>+${Math.abs(dropPct).toFixed(1)} %</strong>`;
        bannerEl.classList.remove('hidden');
        bannerEl.innerHTML = `
          <span>1. → viimeinen (${firstV} → ${lastV} m/s)</span>
          <span class="${dropColorClass(dropPct)}">${label}</span>
        `;
      } else {
        bannerEl.classList.add('hidden');
        bannerEl.innerHTML = '';
      }

      const chartEl = document.getElementById('velBarChart');
      if (count > 0) {
        chartEl.classList.remove('hidden');
        chartEl.innerHTML = buildVelocityChartHTML(currentReps);
      } else {
        chartEl.classList.add('hidden');
        chartEl.innerHTML = '';
      }

      document.getElementById('repProgressLabel').textContent = `Sarja #${displaySetNum} • Toistot: ${count} / ${target}`;
      const fill = document.getElementById('repProgressFill');
      const pct = Math.min(100, (count / Math.max(1, target)) * 100);
      fill.style.width = `${pct}%`;
      fill.className = 'progress-fill' + (count >= target ? ' done' : '');

      const listEl = document.getElementById('repList');
      listEl.innerHTML = '';
      const maxVel = Math.max(0.01, ...currentReps.map((r) => r.meanVelocity));
      const firstVel = count > 0 ? currentReps[0].meanVelocity : maxVel;

      currentReps.forEach((r, idx) => {
        const div = document.createElement('div');
        div.className = 'rep-item';
        const lowHtml = r.loweringVelocity !== null
          ? `<span class="${isControlled(r.loweringVelocity) ? 'green' : 'red'}">↓ ${r.loweringVelocity.toFixed(2)} m/s</span>`
          : `<span style="color:var(--muted)">↓ …</span>`;
        const repDrop = firstVel > 0 ? ((firstVel - r.meanVelocity) / firstVel) * 100 : 0;
        const zone = idx === 0 ? '' : barZoneClass(repDrop);
        const widthPct = Math.max(6, Math.round((r.meanVelocity / maxVel) * 100));
        const vsFirstHtml = idx === 0
          ? `<span style="color:var(--muted); font-size:12px;">1. toisto</span>`
          : `<span class="${dropColorClass(repDrop)}" style="font-size:12px; font-weight:600;">${formatDropBadge(repDrop)}</span>`;

        div.innerHTML = `
          <div class="rep-item-top">
            <span class="rep-num">#${idx + 1}</span>
            <span><strong>${r.meanVelocity.toFixed(2)} m/s</strong> (${r.power.toFixed(1)} W)</span>
            ${vsFirstHtml}
            ${lowHtml}
            <span style="color:var(--muted)">${r.rangeOfMotionCm.toFixed(0)} cm</span>
          </div>
          <div class="rep-bar-track">
            <div class="rep-bar-fill ${zone}" style="width: ${widthPct}%;"></div>
          </div>
        `;
        listEl.appendChild(div);
      });

      renderTodaySetsOnLiftTab();
      updateSetButton();
    }

    async function saveAndPrepareNextSet() {
      if (currentReps.length === 0) return;
      if (setActive || zeroing) {
        await stopSetOnPin(true);
      } else if (!currentSetSaved) {
        commitCurrentSetToWorkouts();
      }
      // Clear currentReps immediately so screen resets to 0 / target for the next set
      currentReps = [];
      currentSetSaved = false;
      lastSavedSetRef = null;
      renderLiveSet();
      updateSetButton();
    }

    // --- Exercises Management ---
    function renderExerciseSelect(selectedVal) {
      const sel = document.getElementById('exerciseSelect');
      const targetVal = selectedVal || sel.value || exercises[0];
      sel.innerHTML = '';
      exercises.forEach((ex) => {
        const opt = document.createElement('option');
        opt.value = ex;
        opt.textContent = ex;
        sel.appendChild(opt);
      });
      const addOpt = document.createElement('option');
      addOpt.value = ADD_NEW_EX_VALUE;
      addOpt.textContent = '➕ Lisää uusi liike...';
      sel.appendChild(addOpt);

      if (exercises.includes(targetVal)) {
        sel.value = targetVal;
      } else if (exercises.length > 0) {
        sel.value = exercises[0];
      }
    }

    function addNewExercise(rawName) {
      const val = (rawName || '').trim();
      if (!val) return false;
      if (!exercises.includes(val)) {
        exercises.unshift(val);
        saveJSON(KEY_EXERCISES, exercises);
      }
      renderExerciseSelect(val);
      renderExerciseModal();
      return true;
    }

    function renderExerciseModal() {
      const container = document.getElementById('modalExerciseList');
      const currentSelected = document.getElementById('exerciseSelect').value;
      container.innerHTML = '';
      exercises.forEach((ex, i) => {
        const row = document.createElement('div');
        row.className = 'ex-row' + (ex === currentSelected ? ' selected-ex' : '');
        row.innerHTML = `
          <span style="cursor:pointer; flex:1; padding: 4px 0; font-weight: ${ex === currentSelected ? '700' : '500'};">
            ${ex === currentSelected ? '✓ ' : ''}${ex}
          </span>
          <button type="button" class="danger" style="padding:5px 10px; font-size:12px; flex-shrink:0;">Poista</button>
        `;
        row.querySelector('span').addEventListener('click', () => {
          renderExerciseSelect(ex);
          document.getElementById('exerciseModal').classList.add('hidden');
        });
        row.querySelector('button').addEventListener('click', (e) => {
          e.stopPropagation();
          exercises.splice(i, 1);
          if (exercises.length === 0) exercises.push(...DEFAULT_EXERCISES);
          saveJSON(KEY_EXERCISES, exercises);
          renderExerciseSelect();
          renderExerciseModal();
        });
        container.appendChild(row);
      });
    }

    // --- Calendar & History ---
    function renderCalendar() {
      const monthNames = [
        'Tammikuu', 'Helmikuu', 'Maaliskuu', 'Huhtikuu', 'Toukokuu', 'Kesäkuu',
        'Heinäkuu', 'Elokuu', 'Syyskuu', 'Lokakuu', 'Marraskuu', 'Joulukuu'
      ];
      document.getElementById('calMonthLabel').textContent = `${monthNames[calMonth]} ${calYear}`;
      const grid = document.getElementById('calDays');
      grid.innerHTML = '';

      const firstDay = new Date(calYear, calMonth, 1);
      const startOffset = (firstDay.getDay() + 6) % 7; // Monday = 0
      const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
      const workoutDates = new Set(workouts.filter((w) => w.sets.length > 0).map((w) => w.date));

      for (let i = 0; i < startOffset; i++) {
        grid.appendChild(document.createElement('div'));
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const iso = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const cell = document.createElement('div');
        cell.className = 'cal-day'
          + (iso === selectedHistoryDate ? ' selected' : '')
          + (workoutDates.has(iso) ? ' has-workout' : '');
        cell.textContent = d;
        cell.addEventListener('click', () => {
          selectedHistoryDate = iso;
          document.getElementById('filterDateChk').checked = true;
          renderCalendar();
          renderHistoryList();
        });
        grid.appendChild(cell);
      }
    }

    function getFilteredWorkouts() {
      const onlyDate = document.getElementById('filterDateChk').checked;
      const sorted = [...workouts].sort((a, b) => b.date.localeCompare(a.date));
      return onlyDate ? sorted.filter((w) => w.date === selectedHistoryDate) : sorted;
    }

    function renderHistoryList() {
      const container = document.getElementById('historyContainer');
      const list = getFilteredWorkouts();
      if (list.length === 0) {
        container.innerHTML = `<div class="card" style="text-align:center; color:var(--muted);">Ei tallennettuja sarjoja valitulle päivälle.</div>`;
        return;
      }
      container.innerHTML = '';
      list.forEach((w) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.marginBottom = '10px';
        let html = `<div style="font-weight:700; margin-bottom:6px;">📅 ${w.date}</div>`;
        w.sets.forEach((s, sIdx) => {
          const bestVel = Math.max(0, ...s.reps.map((r) => r.meanVelocity));
          const bestWatt = Math.max(0, ...s.reps.map((r) => r.power));
          const avgRom = s.reps.length ? s.reps.reduce((a, r) => a + r.rangeOfMotionCm, 0) / s.reps.length : 0;
          const dropPct = calcVelocityDropPct(s.reps);
          const dropHtml = dropPct !== null
            ? ` • Pudotus 1.→viim.: <strong class="${dropColorClass(dropPct)}">${formatDropBadge(dropPct)}</strong>`
            : '';
          const chartHtml = s.reps.length > 0
            ? `<div class="vel-chart" style="height:88px; margin-top:8px;">${buildVelocityChartHTML(s.reps)}</div>`
            : '';
          html += `
            <div class="history-set">
              <div class="row">
                <strong>#${sIdx + 1} ${s.exercise}</strong>
                <span style="color:var(--muted); font-size:13px;">${s.weightKg} kg • ${s.reps.length}/${s.targetReps} toistoa</span>
              </div>
              <div style="font-size:13px; color:var(--muted); margin-top:4px;">
                Paras: ${bestVel.toFixed(2)} m/s (${bestWatt.toFixed(1)} W) • Avg ROM ${avgRom.toFixed(0)} cm${dropHtml}
              </div>
              ${chartHtml}
            </div>
          `;
        });
        card.innerHTML = html;
        container.appendChild(card);
      });
    }

    // --- CSV Export ---
    function buildCSV() {
      const list = getFilteredWorkouts();
      const source = list.length > 0 ? list : workouts;
      const rows = [
        'date,time,exercise,set_number,weight_kg,target_reps,rep_number,movement_power_m_s,movement_power_w,controlled_lowering_m_s,lowering_status,rom_cm,set_velocity_drop_1st_to_last_pct'
      ];
      source.forEach((w) => {
        w.sets.forEach((s, sIdx) => {
          const ex = `"${String(s.exercise).replace(/"/g, '""')}"`;
          const setDrop = calcVelocityDropPct(s.reps);
          const setDropStr = setDrop !== null ? setDrop.toFixed(1) : '';
          s.reps.forEach((r, rIdx) => {
            const low = r.loweringVelocity !== null && r.loweringVelocity !== undefined ? r.loweringVelocity.toFixed(3) : '';
            const status = r.loweringVelocity !== null && r.loweringVelocity !== undefined
              ? (isControlled(r.loweringVelocity) ? 'GREEN' : 'RED')
              : '';
            rows.push([
              w.date,
              s.time || '',
              ex,
              sIdx + 1,
              s.weightKg.toFixed(1),
              s.targetReps,
              rIdx + 1,
              r.meanVelocity.toFixed(3),
              r.power.toFixed(2),
              low,
              status,
              r.rangeOfMotionCm.toFixed(1),
              setDropStr
            ].join(','));
          });
        });
      });
      return rows.join('\n');
    }

    async function exportCSV() {
      const csv = buildCSV();
      const filename = document.getElementById('filterDateChk').checked
        ? `gpath_${selectedHistoryDate}.csv`
        : 'gpath_workouts.csv';

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const file = new File([blob], filename, { type: 'text/csv' });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: filename });
          return;
        } catch {}
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    // --- Event Listeners ---
    document.getElementById('workoutDate').value = todayISO();
    document.getElementById('workoutDate').addEventListener('change', () => {
      renderLiveSet();
    });

    renderExerciseSelect();
    renderLiveSet();
    renderCalendar();
    renderHistoryList();

    document.getElementById('connectBtn').addEventListener('click', connectPin);
    document.getElementById('startSetBtn').addEventListener('click', toggleSetOnPin);
    document.getElementById('saveSetBtn').addEventListener('click', saveAndPrepareNextSet);
    document.getElementById('clearRepsBtn').addEventListener('click', () => {
      currentReps = [];
      currentSetSaved = false;
      lastSavedSetRef = null;
      renderLiveSet();
    });

    document.getElementById('soundBtn').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').textContent = soundEnabled ? '🔊' : '🔇';
      if (soundEnabled) {
        ensureAudio();
        soundRep();
      }
    });

    document.querySelectorAll('[data-weight-delta]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const input = document.getElementById('weightInput');
        const delta = parseFloat(btn.getAttribute('data-weight-delta'));
        input.value = Math.max(0, (parseFloat(input.value) || 0) + delta);
      });
    });

    document.getElementById('repMinusBtn').addEventListener('click', () => {
      const input = document.getElementById('targetRepsInput');
      input.value = Math.max(1, (parseInt(input.value, 10) || 10) - 1);
      renderLiveSet();
    });
    document.getElementById('repPlusBtn').addEventListener('click', () => {
      const input = document.getElementById('targetRepsInput');
      input.value = (parseInt(input.value, 10) || 10) + 1;
      renderLiveSet();
    });
    document.getElementById('targetRepsInput').addEventListener('change', renderLiveSet);

    // Exercise selection & adding (both modal and inline on iOS)
    document.getElementById('exerciseSelect').addEventListener('change', (e) => {
      if (e.target.value === ADD_NEW_EX_VALUE) {
        const inlineForm = document.getElementById('inlineExerciseForm');
        inlineForm.classList.remove('hidden');
        renderExerciseSelect(exercises[0]);
        setTimeout(() => document.getElementById('inlineExerciseInput').focus(), 50);
      }
    });

    document.getElementById('inlineExerciseForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('inlineExerciseInput');
      if (addNewExercise(input.value)) {
        input.value = '';
        input.blur();
        document.getElementById('inlineExerciseForm').classList.add('hidden');
      }
    });

    document.getElementById('cancelInlineExBtn').addEventListener('click', () => {
      document.getElementById('inlineExerciseForm').classList.add('hidden');
    });

    document.getElementById('editExercisesBtn').addEventListener('click', () => {
      document.getElementById('exerciseFeedback').classList.add('hidden');
      renderExerciseModal();
      document.getElementById('exerciseModal').classList.remove('hidden');
    });

    document.getElementById('closeModalBtn').addEventListener('click', () => {
      document.getElementById('exerciseModal').classList.add('hidden');
    });

    document.getElementById('exerciseModal').addEventListener('click', (e) => {
      if (e.target.id === 'exerciseModal') {
        document.getElementById('exerciseModal').classList.add('hidden');
      }
    });

    function handleModalExerciseAdd(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('newExerciseInput');
      const val = input.value.trim();
      if (!val) return;
      addNewExercise(val);
      input.value = '';
      input.blur();
      const fb = document.getElementById('exerciseFeedback');
      fb.textContent = `✓ "${val}" lisätty ja valittu!`;
      fb.classList.remove('hidden');
    }

    document.getElementById('addExerciseForm').addEventListener('submit', handleModalExerciseAdd);
    document.getElementById('addExerciseBtn').addEventListener('click', handleModalExerciseAdd);

    document.getElementById('calPrevBtn').addEventListener('click', () => {
      calMonth--;
      if (calMonth < 0) { calMonth = 11; calYear--; }
      renderCalendar();
    });
    document.getElementById('calNextBtn').addEventListener('click', () => {
      calMonth++;
      if (calMonth > 11) { calMonth = 0; calYear++; }
      renderCalendar();
    });
    document.getElementById('filterDateChk').addEventListener('change', renderHistoryList);
    document.getElementById('exportCsvBtn').addEventListener('click', exportCSV);

    document.getElementById('navLiftBtn').addEventListener('click', () => {
      document.getElementById('tabLift').classList.remove('hidden');
      document.getElementById('tabHistory').classList.add('hidden');
      document.getElementById('navLiftBtn').classList.add('active');
      document.getElementById('navHistoryBtn').classList.remove('active');
    });
    document.getElementById('navHistoryBtn').addEventListener('click', () => {
      document.getElementById('tabLift').classList.add('hidden');
      document.getElementById('tabHistory').classList.remove('hidden');
      document.getElementById('navLiftBtn').classList.remove('active');
      document.getElementById('navHistoryBtn').classList.add('active');
      renderCalendar();
      renderHistoryList();
    });
  </script>
</body>
</html>
