      document.body.appendChild(a); a.click(); a.remove();
    }
    // =================== /RAAKADATA ===================

    // ---------- UI: Gpath Pin raw-trace section for a saved set ----------
    function repColor(i, n) {
      const t = n <= 1 ? 1 : i / (n - 1);
      const lerp = (a, b) => Math.round(a + (b - a) * t);
      return `rgb(${lerp(147, 239)},${lerp(197, 68)},${lerp(253, 68)})`;
    }
    function buildTraceCurvesSVG(reps, a) {
      const items = reps.map((r, i) => ({ r, i })).filter((x) => x.r.trace && x.r.trace.curve && !(a.perRep[x.i] && a.perRep[x.i].suspect));
      if (!items.length) return '';
      const W = 340, H = 180, padL = 34, padR = 10, padT = 10, padB = 24;
      const xMax = Math.max(10, ...items.map((x) => x.r.trace.curve[x.r.trace.curve.length - 1][0]));
      const yMax = Math.max(0.3, ...items.map((x) => Math.max(...x.r.trace.curve.map((c) => c[1] / 1000)))) * 1.1;
      const X = (cm) => padL + cm / xMax * (W - padL - padR);
      const Y = (v) => padT + (1 - Math.max(0, v) / yMax) * (H - padT - padB);
      let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;" role="img" aria-label="Nopeuskäyrät liikematkan funktiona">`;
      const step = yMax > 1.2 ? 0.5 : (yMax > 0.6 ? 0.2 : 0.1);
      for (let g = 0; g <= yMax + 1e-9; g += step) {
        s += `<line x1="${padL}" x2="${W - padR}" y1="${Y(g)}" y2="${Y(g)}" stroke="rgba(148,163,184,0.15)"/><text x="${padL - 4}" y="${Y(g) + 3}" fill="#94a3b8" font-size="9" text-anchor="end">${g.toFixed(1)}</text>`;
      }
      for (let c = 0; c <= xMax; c += xMax > 50 ? 20 : 10) s += `<text x="${X(c)}" y="${H - 8}" fill="#94a3b8" font-size="9" text-anchor="middle">${c}</text>`;
      s += `<text x="${W - padR}" y="${padT + 8}" fill="#64748b" font-size="9" text-anchor="end">x = cm pohjasta, y = m/s</text>`;
      if (a.mvt !== null) s += `<line x1="${padL}" x2="${W - padR}" y1="${Y(0.10)}" y2="${Y(0.10)}" stroke="#ec4899" stroke-dasharray="2 3"/><text x="${padL + 3}" y="${Y(0.10) - 3}" fill="#ec4899" font-size="9">0.10 m/s</text>`;
      items.forEach(({ r, i }, k) => {
        const col = i === a.vBestIdx ? '#3b82f6' : repColor(k, items.length);
        s += `<polyline points="${r.trace.curve.map((c) => `${X(c[0]).toFixed(1)},${Y(c[1] / 1000).toFixed(1)}`).join(' ')}" fill="none" stroke="${col}" stroke-width="${i === a.vBestIdx ? 2.4 : 1.6}" opacity="0.95"/>`;
        if (r.trace.stick) {
          s += `<circle cx="${X(r.trace.stick.h)}" cy="${Y(r.trace.stick.vmin)}" r="4" fill="#0f172a" stroke="#f9a8d4" stroke-width="2"/>`;
        }
        const last = r.trace.curve[r.trace.curve.length - 1];
        s += `<text x="${Math.min(W - padR - 2, X(last[0]) + 2)}" y="${Y(last[1] / 1000) - 2}" fill="${col}" font-size="9">T${i + 1}</text>`;
      });
      return s + '</svg>';
    }
    function buildBarPathSVG(reps, a, rules) {
      const items = reps.map((r, i) => ({ r, i })).filter((x) => x.r.trace && x.r.trace.path && !(a.perRep[x.i] && a.perRep[x.i].suspect));
      if (!items.length) return '';
      const W = 340, H = 230, padL = 34, padR = 10, padT = 10, padB = 24;
      const xs = items.flatMap((x) => x.r.trace.path.map((p) => p[0] - x.r.trace.path[0][0]));
      const lim = Math.max(8, (rules && rules.dxMax ? rules.dxMax * 1.4 : 0), ...xs.map(Math.abs)) * 1.1;
      const zMax = Math.max(20, ...items.map((x) => x.r.trace.path[x.r.trace.path.length - 1][1]));
      const X = (cm) => padL + (cm + lim) / (2 * lim) * (W - padL - padR);
      const Y = (cm) => padT + (1 - cm / zMax) * (H - padT - padB);
      let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;" role="img" aria-label="Tankoreitti sivulta">`;
      for (let c = 0; c <= zMax; c += zMax > 50 ? 20 : 10) s += `<line x1="${padL}" x2="${W - padR}" y1="${Y(c)}" y2="${Y(c)}" stroke="rgba(148,163,184,0.12)"/><text x="${padL - 4}" y="${Y(c) + 3}" fill="#94a3b8" font-size="9" text-anchor="end">${c}</text>`;
      const xStep = lim > 20 ? 10 : 5;
      for (let c = -Math.floor(lim / xStep) * xStep; c <= lim; c += xStep) s += `<text x="${X(c)}" y="${H - 8}" fill="#94a3b8" font-size="9" text-anchor="middle">${c > 0 ? '+' : ''}${c}</text>`;
      s += `<line x1="${X(0)}" x2="${X(0)}" y1="${padT}" y2="${H - padB}" stroke="rgba(148,163,184,0.35)"/>`;
      if (rules && rules.dxMax) {
        [-1, 1].forEach((sg) => { s += `<line x1="${X(sg * rules.dxMax)}" x2="${X(sg * rules.dxMax)}" y1="${padT}" y2="${H - padB}" stroke="#f59e0b" stroke-dasharray="5 4"/>`; });
        s += `<text x="${X(rules.dxMax) + 3}" y="${padT + 9}" fill="#f59e0b" font-size="9">±${rules.dxMax} cm</text>`;
      }
      items.forEach(({ r, i }, k) => {
        const col = i === a.vBestIdx ? '#3b82f6' : repColor(k, items.length);
        const x0 = r.trace.path[0][0];
        s += `<polyline points="${r.trace.path.map((p) => `${X(p[0] - x0).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ')}" fill="none" stroke="${col}" stroke-width="${i === a.vBestIdx ? 2.4 : 1.6}"/>`;
        const end = r.trace.path[r.trace.path.length - 1];
        s += `<text x="${X(end[0] - x0)}" y="${Y(end[1]) - 3}" fill="${col}" font-size="9" text-anchor="middle">T${i + 1}</text>`;
      });
      s += `<text x="${padL + 3}" y="${padT + 8}" fill="#64748b" font-size="9">y = korkeus cm, x = vaaka cm</text>`;
      return s + '</svg>';
    }
    function buildTraceSectionHTML(s, a) {
      const reps = s.reps || [];
      if (!reps.some((r) => r.trace)) {
        return `<div style="font-size:11px; color:var(--muted); margin-top:8px; line-height:1.4;">📡 Ei Gpath Pin -raakadataa tälle sarjalle. Pin lähettää 80 Hz aikasarjan automaattisesti ~5–10 s viimeisen toiston jälkeen – odota hetki ennen seuraavaa sarjaa, niin kuolokohta, tankoreitti ja kallistus analysoidaan.</div>`;
      }
      const rules = a.cfg ? TRACE_LIFT_RULES[a.cfg.id] : null;
      const meta = s.traceMeta || {};
      const hasPath = reps.some((r) => r.trace && r.trace.path);
      const flagTxt = { stick: 'kuolokohta < 0.10 m/s', tech: 'tankoreitti hajosi', dx: 'vaakasiirtymä', tilt: 'kallistus', drift: 'IMU-ajautuma', merged: 'yhdistetty' };
      const rows = reps.map((r, i) => {
        const p = a.perRep[i]; const t = r.trace;
        if (!t) return `<tr><td>${i + 1}</td><td colspan="6" style="color:var(--muted)">ei raakadataa</td><td>${p && p.rqi !== null ? Math.round(p.rqi) : '--'}</td></tr>`;
        const st = t.stick ? `${t.stick.h.toFixed(0)} cm<br><span class="${t.stick.vmin < 0.10 ? 'red' : t.stick.vmin < 0.2 ? 'amber' : ''}">${t.stick.vmin.toFixed(2)}</span>` : '–';
        const mid = t.midMin ? t.midMin.v.toFixed(2) : '--';
        const dx = t.dxMax !== null ? `<span class="${rules && rules.dxMax && Math.abs(t.dxMax) > rules.dxMax ? 'amber' : ''}">${t.dxMax > 0 ? '+' : ''}${t.dxMax.toFixed(1)}</span>` : '--';
        const dev = p && p.pathDev !== null && p.pathDev !== undefined ? `<span class="${rules && p.pathDev > rules.templMax ? 'amber' : ''}">${p.pathDev.toFixed(1)}</span>` : '--';
        const tl = t.tilt !== null ? `<span class="${t.tilt > TILT_WARN_DEG ? 'amber' : ''}">${t.tilt.toFixed(1)}°</span>` : '--';
        const rq = p && p.rqi !== null ? `<strong class="${p.rqi >= 70 ? 'green' : p.rqi >= 50 ? 'amber' : 'red'}">${Math.round(p.rqi)}</strong>` : '--';
        const fl = p && p.flags && p.flags.length ? `<div style="font-size:10px; color:#fcd34d;">${p.flags.map((f) => flagTxt[f]).join(', ')}</div>` : '';
        return `<tr><td>${i + 1}</td><td>${st}</td><td>${mid}</td><td>${dx}</td><td>${dev}</td><td>${tl}</td><td>${t.pauseMs !== null && t.pauseMs !== undefined ? (t.pauseMs / 1000).toFixed(1) + ' s' : '--'}</td><td>${rq}${fl}</td></tr>`;
      }).join('');
      return `
        <div style="margin-top:10px; padding-top:8px; border-top:1px dashed rgba(148,163,184,0.25);">
          <div class="row"><strong style="font-size:12px;">📡 Gpath Pin -raakadata (80 Hz)</strong>
            <span style="font-size:10px; color:var(--muted);">${meta.samples ? meta.samples + ' näytettä' : ''}${meta.barAxis ? ' · tangon akseli ' + meta.barAxis.toUpperCase() : ''}</span></div>
          <div style="font-size:11px; color:var(--muted); margin:4px 0 2px;">Nopeus liikematkan funktiona (Butterworth 8 Hz) · ◯ = kuolokohta (V<sub>min</sub>)</div>
          ${buildTraceCurvesSVG(reps, a)}
          ${hasPath ? `<div style="font-size:11px; color:var(--muted); margin:6px 0 2px;">Tankoreitti sivulta (kokeellinen: IMU-kaksoisintegrointi, suunta ±)</div>${buildBarPathSVG(reps, a, rules)}` : `<div style="font-size:11px; color:var(--muted); margin-top:4px;">Tankoreittiä ja kallistusta ei voitu laskea: tangon akselia ei tunnistettu anturin asennosta. Valitse akseli Analyysi → VBT-asetukset.</div>`}
          <div style="overflow-x:auto; margin-top:6px;"><table class="ana-table">
            <thead><tr><th>#</th><th>Kuolo&shy;kohta</th><th>V<sub>min</sub> 20–80 %</th><th>ΔX max</th><th>Poikk. parh.</th><th>Kallist.</th><th>Tauko</th><th>RQI</th></tr></thead>
            <tbody>${rows}</tbody></table></div>
          <div style="font-size:10px; color:var(--muted); margin-top:4px; line-height:1.4;">Kuolokohta = korkeus pohjasta ja miniminopeus V₁→V<sub>min</sub>→V₂-kuviossa. V<sub>min</sub> &lt; 0.10 m/s ⇒ RIR 0 vaikka keskinopeus näyttäisi hyvältä. ΔX = suurin vaakasiirtymä lähtölinjasta (cm), poikkeama = RMS-ero sarjan parhaan toiston reittiin. Kallistus = tangon akselin kulman muutos nousun aikana.</div>
        </div>`;
    }

    // =====================================================================
    // ===  SYVÄ VBT-ANALYYSI  (Velocity Loss, RIR, MVT, laatupisteet,   ===
    // ===  kuorma–nopeusprofiili, VBT-e1RM, valmius & trendit)         ===
    // =====================================================================
    // Perusteet: González-Badillo & Sánchez-Medina (2010, 2011), Pareja-Blanco ym. (2017, 2020),
    // Helms ym. (2017), Weakley ym. (2021), Morán-Navarro ym. (2021).
    // Kaikki raja-arvot ovat väestökeskiarvoja – sovellus oppii käyttäjän oman MVT:n ja
    // kuorma–nopeusprofiilin tallennetuista sarjoista.

    const KEY_VBT_SETTINGS = 'gpath_vbt_settings_v1';

    const VBT_GOALS = {
      peaking: {
        key: 'peaking', label: 'Piikkaus / hermostollinen maksimivoima', short: 'Piikkaus',
        pctRange: [85, 95], vl: { squat: 10, bench: 10, deadlift: 5, generic: 10 },
        why: 'Maksimoi tehon ja hermoston terävyyden, minimoi lihasvaurion.'
      },
      maxStrength: {
        key: 'maxStrength', label: 'Kehittävä maksimivoima (78–86 % 1RM)', short: 'Maksimivoima',
        pctRange: [78, 86], vl: { squat: 15, bench: 18, deadlift: 15, generic: 15 },
        why: 'Paras suhde voimankehityksen ja palautumisen välillä.'
      },
      baseStrength: {
        key: 'baseStrength', label: 'Perusvoima / voima-hypertrofia (70–80 % 1RM)', short: 'Perusvoima',
        pctRange: [70, 80], vl: { squat: 20, bench: 20, deadlift: 20, generic: 20 },
        why: 'Riittävä mekaaninen kuormitus ja volyymi ilman ylikuormitusta.'
      }
    };

    // lv = kalibroitu kuorma–nopeustaulukko [ %1RM, keskinopeus m/s ]
    const LIFT_ANALYSIS = {
      squat: {
        id: 'squat', name: 'Jalkakyykky', mvt: 0.25, mvtFloor: 0.15, repCost: 0.055, minRomCm: 35, redVl: 25, stickFail: 0.24, stickStep: 0.065,
        lv: [[50, 0.825], [60, 0.745], [70, 0.665], [75, 0.625], [80, 0.560], [85, 0.490], [90, 0.395], [95, 0.320], [100, 0.250]]
      },
      bench: {
        id: 'bench', name: 'Penkkipunnerrus', mvt: 0.20, mvtFloor: 0.14, repCost: 0.060, minRomCm: 20, redVl: 28, stickFail: 0.17, stickStep: 0.075,
        lv: [[50, 0.680], [60, 0.580], [70, 0.500], [75, 0.470], [80, 0.430], [85, 0.380], [90, 0.310], [95, 0.250], [100, 0.200]]
      },
      deadlift: {
        id: 'deadlift', name: 'Maastaveto', mvt: 0.155, mvtFloor: 0.08, repCost: 0.050, minRomCm: 25, redVl: 25, stickFail: 0.14, stickStep: 0.060,
        lv: [[60, 0.660], [70, 0.535], [75, 0.465], [80, 0.405], [85, 0.335], [90, 0.275], [95, 0.220], [100, 0.155]]
      }
    };
    const GENERIC_RED_VL = 30;
    const DEFAULT_REF_MAX = {
      squat: { weight: 140, reps: 5 },
      bench: { weight: 105, reps: 5 },
      deadlift: { weight: 170, reps: 1 }
    };

    let vbtSettings = Object.assign(
      {
        goal: 'maxStrength',
        velocityMetric: 'mv',
        autoStopOnCutoff: false,
        cutoffSound: true,
        voiceVelocity: false,
        restTargetSec: 180,
        restTimerSound: true,
        mvtOverride: {},
        refMax: {},
        barAxis: 'auto',
        mode: 'guided',
        cycle: null
      },
      loadJSON(KEY_VBT_SETTINGS, {}) || {}
    );
    if (!VBT_GOALS[vbtSettings.goal]) vbtSettings.goal = 'maxStrength';
    if (!vbtSettings.mvtOverride || typeof vbtSettings.mvtOverride !== 'object') vbtSettings.mvtOverride = {};
    if (!vbtSettings.refMax || typeof vbtSettings.refMax !== 'object') vbtSettings.refMax = {};
    Object.keys(DEFAULT_REF_MAX).forEach((k) => {
      if (!vbtSettings.refMax[k] || !(Number(vbtSettings.refMax[k].weight) > 0)) {
        vbtSettings.refMax[k] = { ...DEFAULT_REF_MAX[k] };
      }
    });
    function saveVbtSettings() { saveJSON(KEY_VBT_SETTINGS, vbtSettings); }

    // Epley + Brzycki blend for reference series (e.g. 5x140 kg -> 160.4 kg, 5x105 kg -> 120.3 kg)
    function calcRef1RM(weightKg, reps) {
      const w = Number(weightKg), r = Number(reps);
      if (!(w > 0) || !(r >= 1)) return null;
      if (r === 1) return w;
      const ep = w * (1 + r / 30);
      const br = w * (36 / (37 - Math.min(12, r)));
      return (ep + br) / 2;
    }
    function getRefMax(exerciseName) {
      const k = getLiftKey(exerciseName);
      if (!k || !vbtSettings.refMax || !vbtSettings.refMax[k]) return null;
      const rm = vbtSettings.refMax[k];
      const w = parseFloat(rm.weight), r = parseInt(rm.reps, 10) || 1;
      if (!(w > 0) || !(r >= 1)) return null;
      return { weight: w, reps: r, e1RM: calcRef1RM(w, r) };
    }
    function getAnchor1RM(exerciseName) {
      const rm = getRefMax(exerciseName);
      const baseAnchor = rm ? rm.e1RM : null;
      const cfg = getLiftCfg(exerciseName);
      if (!cfg) return baseAnchor;
      // Opi automaattisesti myös treenihistorian raskaista tehdyistä sarjoista (1–8 toistoa, ≥78 % ankkurista),
      // jolloin ankkuri nousee automaattisesti voimatasojen kehittyessä ilman että kevyet lämmittelyt vääristävät sitä
      const minHeavyKg = baseAnchor ? baseAnchor * 0.78 : (cfg.id === 'bench' ? 75 : 100);
      let bestProven = 0;
      workouts.forEach((w) => {
        (w.sets || []).forEach((s) => {
          if (getLiftKey(s.exercise) !== cfg.id || !(s.weightKg >= minHeavyKg) || !s.reps || !s.reps.length) return;
          const mInfo = detectMergedReps(s.reps, cfg, w.date);
          const flagged = flagSuspectReps(s.reps, cfg, mInfo, w.date);
          const validCount = Number(s.repCountOverride) > 0
            ? Math.round(Number(s.repCountOverride))
            : flagged.filter((x, idx) => !x || (mInfo[idx] && mInfo[idx].drift)).length;
          if (validCount >= 1 && validCount <= 8) {
            const est = calcRef1RM(s.weightKg, validCount);
            if (est && est > bestProven) bestProven = est;
          }
        });
      });
      if (baseAnchor && bestProven > baseAnchor) return bestProven;
      return baseAnchor || (bestProven > 0 ? bestProven : null);
    }
    function taperedMvtShift(cfg, mvt, v) {
      if (!cfg || mvt === null || mvt === undefined) return 0;
      const v60 = cfg.lv.find((row) => row[0] === 60) ? cfg.lv.find((row) => row[0] === 60)[1] : 0.70;
      const t = Math.max(0, Math.min(1, (v60 - v) / Math.max(0.1, v60 - cfg.mvt)));
      return (mvt - cfg.mvt) * t;
    }

    let vbtCutoffAlerted = false;
    let vbtFailureAlerted = false;

    function getLiftKey(exerciseName) {
      const p = getVbtProfileForExercise(exerciseName);
      return p ? p.id : null;
    }
    function getLiftCfg(exerciseName) {
      const k = getLiftKey(exerciseName);
      return k ? LIFT_ANALYSIS[k] : null;
    }
    function getGoal() {
      const ck = (typeof cycleGoalKey === 'function') ? cycleGoalKey() : null;
      return VBT_GOALS[ck || vbtSettings.goal] || VBT_GOALS.maxStrength;
    }
    function getCutoffPct(exerciseName) {
      const g = getGoal();
      const k = getLiftKey(exerciseName);
      return Math.max(5, g.vl[k || 'generic'] + cutoffWaveDelta());
    }
    function isFreeMode() { return vbtSettings.mode === 'free'; }
    function repV(r) {
      if (!r) return 0;
      if (vbtSettings.velocityMetric === 'mpv' && Number(r.propulsiveVelocity) > 0) return Number(r.propulsiveVelocity);
      return Number(r.meanVelocity) || 0;
    }
    function metricLabel() { return vbtSettings.velocityMetric === 'mpv' ? 'MPV' : 'MV'; }

    function vbtMedian(arr) {
      const a = arr.filter((x) => Number.isFinite(x)).sort((x, y) => x - y);
      if (!a.length) return null;
      const m = Math.floor(a.length / 2);
      return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
    }
    function vbtLinReg(xs, ys) {
      const n = xs.length;
      if (n < 2) return null;
      const mx = xs.reduce((a, b) => a + b, 0) / n;
      const my = ys.reduce((a, b) => a + b, 0) / n;
      let sxy = 0, sxx = 0, syy = 0;
      for (let i = 0; i < n; i++) {
        sxy += (xs[i] - mx) * (ys[i] - my);
        sxx += (xs[i] - mx) ** 2;
        syy += (ys[i] - my) ** 2;
      }
      if (sxx === 0) return null;
      const slope = sxy / sxx;
      const intercept = my - slope * mx;
      const r2 = syy === 0 ? 1 : (sxy * sxy) / (sxx * syy);
      return { slope, intercept, r2, n };
    }
    function fmtV(v) { return (v === null || v === undefined || !Number.isFinite(v)) ? '--' : v.toFixed(2); }
    function fmtDateFi(iso) {
      if (!iso) return '';
      const [y, m, d] = iso.split('-');
      return `${parseInt(d, 10)}.${parseInt(m, 10)}.${y}`;
    }

    // --- Velocity -> %1RM from the population table (linear interpolation / extrapolation) ---
    function pctFromVelocityTable(cfg, v) {
      if (!cfg || !(v > 0)) return null;
      const t = cfg.lv; // pct ascending, velocity descending
      let lo = t[0], hi = t[1];
      if (v <= t[t.length - 1][1]) { lo = t[t.length - 2]; hi = t[t.length - 1]; }
      else {
        for (let i = 0; i < t.length - 1; i++) {
          if (v <= t[i][1] && v >= t[i + 1][1]) { lo = t[i]; hi = t[i + 1]; break; }
        }
      }
      const pct = lo[0] + (v - lo[1]) * (hi[0] - lo[0]) / (hi[1] - lo[1]);
      return Math.max(30, Math.min(110, pct));
    }
    function velocityFromPctTable(cfg, pct) {
      if (!cfg) return null;
      const t = cfg.lv;
      let lo = t[0], hi = t[1];
      if (pct >= t[t.length - 1][0]) { lo = t[t.length - 2]; hi = t[t.length - 1]; }
      else {
        for (let i = 0; i < t.length - 1; i++) {
          if (pct >= t[i][0] && pct <= t[i + 1][0]) { lo = t[i]; hi = t[i + 1]; break; }
        }
      }
      return lo[1] + (pct - lo[0]) * (hi[1] - lo[1]) / (hi[0] - lo[0]);
    }

    // --- Suspect rep detection (unrack / positioning / partial ROM / bar-rack) ---
    // --- Yhdistyneet toistot: useita toistoja tallentunut yhdeksi (ROM >> tavallinen) ---
    const MERGED_ROM_FACTOR = 1.6;
    let _romHistCache = { sig: '', map: {} };
    // Liikkeen toistojen mediaani-ROM viimeiseltä 90 pv:ltä (vähintään 6 toistoa) päivään dateStr asti – käytetään kun sarjassa on < 3 toistoa tai liian vähän verrokkeja
    function historyMedianRom(liftKey, dateStr) {
      const sig = workoutsSignature();
      if (_romHistCache.sig !== sig) _romHistCache = { sig, map: {} };
      const endDate = dateStr || todayISO();
      const cacheKey = `${liftKey}|${endDate}`;
      if (_romHistCache.map[cacheKey] !== undefined) return _romHistCache.map[cacheKey];
      const from = addDaysIso(endDate, -90);
      const roms = [];
      workouts.forEach((w) => {
        if (w.date < from || w.date > endDate) return;
        (w.sets || []).forEach((s) => {
          if (getLiftKey(s.exercise) !== liftKey) return;
          (s.reps || []).forEach((r) => { const x = Number(r.rangeOfMotionCm); if (x > 0) roms.push(x); });
        });
      });
      let res = null;
      if (roms.length >= 6) {
        const med1 = vbtMedian(roms);
        const trimmed = roms.filter((x) => x <= MERGED_ROM_FACTOR * med1);
        res = vbtMedian(trimmed.length ? trimmed : roms);
      }
      _romHistCache.map[cacheKey] = res;
      return res;
    }
    // Jakaa yhden (yhdistyneen) 40 Hz nopeuskäyrän [[ROM cm, mm/s], ...] paikallisten nopeusminimien kohdalta.
    // Minimi lasketaan jakokohdaksi, jos se on <= 0,05 m/s tai < 25 % matalammasta vierekkäisestä huipusta.
    // Jokaisen osan huippu >= 0,08 m/s ja siirtymä >= 8 cm (sama kuin analyzeTrace-segmentoinnin kynnykset).
    function splitCurveReps(curve) {
      if (!Array.isArray(curve) || curve.length < 8) return null;
      const dt = 1 / 40;
      const n = curve.length;
      const v = curve.map((c) => Math.max(0, (Number(c[1]) || 0) / 1000));
      const sm = v.map((x, i) => (v[Math.max(0, i - 1)] + x + v[Math.min(n - 1, i + 1)]) / 3);
      const peaks = [];
      for (let i = 1; i < n - 1; i++) if (sm[i] >= 0.08 && sm[i] >= sm[i - 1] && sm[i] > sm[i + 1]) peaks.push(i);
      if (!peaks.length) return { count: 0, dips: [] };
      const groups = [peaks[0]];
      const dips = [];
      for (let k = 1; k < peaks.length; k++) {
        const a = groups[groups.length - 1], b = peaks[k];
        let m = a;
        for (let j = a; j <= b; j++) if (sm[j] < sm[m]) m = j;
        const low = Math.min(sm[a], sm[b]);
        if (sm[m] <= 0.05 || sm[m] < 0.25 * low) { groups.push(b); dips.push(m); }
        else if (sm[b] > sm[a]) groups[groups.length - 1] = b;
      }
      const bounds = [0, ...dips, n - 1];
      let count = 0;
      for (let i = 0; i < bounds.length - 1; i++) {
        let disp = 0, pk = 0;
        for (let j = bounds[i]; j <= bounds[i + 1]; j++) { disp += v[j] * dt; if (v[j] > pk) pk = v[j]; }
        if (disp >= 0.08 && pk >= 0.08) count++;
      }
      return { count, dips };
    }
    // Palauttaa taulukon (null | {idx, romCm, medRom, refSrc, est, lo, hi, estSrc}) – ei-null = toisto näyttää yhdistyneeltä.
    // Vertailu: sarjan muiden toistojen mediaani-ROM (>= 3 toistoa, vähintään 2 muuta), muuten liikkeen 90 pv historia,
    // muuten (n === 2) sarjan toinen toisto jos >= minRomCm; n === 1 ilman historiaa vain nopeuskäyrän (splitCurveReps) perusteella.
    function detectMergedReps(reps, cfg, dateStr) {
      const n = (reps || []).length;
      const out = new Array(n).fill(null);
      if (!n) return out;
      const roms = reps.map((r) => Number(r && r.rangeOfMotionCm) || 0);
      const minValid = cfg ? cfg.minRomCm : 15;
      let histMed = null, histLoaded = false;
      const getHistMed = () => {
        if (!histLoaded) {
          histLoaded = true;
          histMed = cfg ? historyMedianRom(cfg.id, dateStr) : null;
        }
        return histMed;
      };
      reps.forEach((r, i) => {
        const rom = roms[i];
        const sp = (r && r.trace && r.trace.curve) ? splitCurveReps(r.trace.curve) : null;
        const traceSplit = !!(sp && sp.count >= 2);
